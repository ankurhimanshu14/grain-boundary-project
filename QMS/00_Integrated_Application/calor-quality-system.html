 due soon / overdue / failed); due list |\n| Insertion depth of reused type K / E test thermocouples documented (P3.1.3.3) | WI-TC-02 §2.4; F-TC-02 | Depth required on the SAT record for a type K / E test TC; a reuse shallower than before is flagged |\n| SAT records meet P3.3.5 | WI-TC-02 §3; F-TC-02 | Record completeness gate, validity (test equipment in calibration), approval |\n| Protection tubes checked or replaced to a documented PM schedule | QP-TC-01 §6.3; WI-TC-03; F-TC-03 | Approved PM schedule (rev, date, approver), tube interval per thermocouple, check rounds, worn tubes open until replaced |\n\n### First-cycle implementation checklist\n\n- [ ] Confirm the settings against the controlled CQI-9 copy: SAT interval and tolerance, accuracy tables (field and test thermocouples, base and noble metal), test TC reuse rule, element life.\n- [ ] Register every thermocouple of F-01 … F-04 (TC-01 … TC-06 per chamber, odd = right wall, even = left wall) with its certificate (WI-TC-01); import the CALOR SAT register where it exists.\n- [ ] Register the test thermocouples and test instruments with their certificates and due dates.\n- [ ] Enter the protection tube material and intervals; approve the PM schedule (F-TC-03).\n- [ ] Bring every SAT and tube check up to date; close the reactions to failed SATs.\n- [ ] Check that the HTSA 3.3 panel reads Satisfactory; file the evidence print.\n- [ ] Approve QP-TC-01, the three WIs and the formats; train the maintenance technicians and the HT Engineer.\n", "TC/01_Procedure/MWSPL-QP-TC-01_Thermocouples_and_Protection_Tubes.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## THERMOCOUPLES AND PROTECTION TUBES\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Reviewed | Approved | Copy status |\n|---|---|---|---|---|---|---|---|\n| MWSPL-QP-TC-01 | 00 | — | Maintenance Head | | | | Uncontrolled until approved |\n\n### 1. Purpose\n\nTo make sure every furnace temperature is measured by a thermocouple that was calibrated before use, is checked by a system accuracy test (SAT) at the interval of the Process Table, and sits in a protection tube that is checked or replaced to a documented preventive maintenance schedule (CQI-9 HTSA 3.3).\n\n### 2. Scope\n\n- **Equipment:** furnaces F-01 to F-04, hardening and tempering chambers, three zones each; two thermocouples per zone (TC-01 / TC-02 = zone 1 …; odd numbers on the right wall, even on the left), type K, used for control and recording through the SCADA.\n- **Also covered:** test thermocouples and test instruments used for SATs; protection tubes of every thermocouple in use.\n- **Not covered:** TUS (temperature uniformity survey) and instrument calibration of controllers and recorders (CALOR TUS and Equipment pages).\n\n### 3. References\n\n- AIAG CQI-9 4th Edition: HTSA 3.3; Section P3.1 (thermocouples and their accuracy tables, P3.1.3.3 reuse of type K / E thermocouples); Section P3.3 (SAT, P3.3.5 records); Process Tables A and E (controlled copy).\n- MWSPL-WI-TC-01, -02, -03; MWSPL-F-TC-01, -02, -03.\n- CALOR → PYROMETRY → SAT, TUS, Equipment.\n\n### 4. Terms and definitions\n\n| Term | Meaning |\n|---|---|\n| Sensing element | The thermocouple wire in the furnace, identified by serial / batch no. and calibration certificate. A replacement is a new element in the same position. |\n| Range of use | The temperatures the element works at: hardening chamber 700–960 °C, tempering chamber 500–900 °C unless set otherwise. |\n| SAT | Comparison of the furnace reading (thermocouple + instrument) with a calibrated test thermocouple and test instrument placed next to its tip. SAT difference = furnace − (test + instrument correction + test TC correction). |\n| Test thermocouple | A calibrated thermocouple used only for SATs, with its own certificate, correction and number of uses. |\n| Protection tube | The sheath (metal or ceramic) around the element in the furnace. |\n| PM schedule | Tube material, check interval and replacement interval of every thermocouple in use, approved and reviewed. |\n\n### 5. Responsibility and authority\n\n| Role | Responsibility | Authority |\n|---|---|---|\n| Maintenance Head | Owns this procedure, the register and the PM schedule; approves the PM schedule | Remove a thermocouple from use |\n| Maintenance technician | Installs elements (WI-TC-01), runs SATs (WI-TC-02), checks tubes (WI-TC-03) | Stop a SAT when the furnace is not stable |\n| HT Engineer | Reviews and approves SAT records; decides product impact of a failed SAT | Hold product |\n| HT Manager | Approves the reaction to a failed SAT; reviews the HTSA 3.3 status monthly | Release held product |\n| Quality Manager | Verifies the test equipment calibration system; audits HTSA 3.3 | — |\n\n### 6. Procedure\n\n```\n   PLAN  register every element with its certificate, PM intervals, test equipment\n     |\n     v\n   DO    install (calibrated before use) --> SAT every Process Table interval --> tube checks\n     |\n     v\n   CHECK due list, SAT record completeness, insertion depth, HTSA 3.3 score\n     |\n     v\n   ACT   failed SAT: cause, action, product impact, re-SAT; replace worn tubes and old elements\n```\n\n#### 6.1 Calibration before first use (P3.1)\n\n1. Every element is bought with a calibration certificate covering at least its range of use, giving the largest error. The error must be within the accuracy of the P3.1 table for its type and use (application setting, confirm against the copy).\n2. The element is registered before it is installed (WI-TC-01); the certificate date must be on or before the installation date.\n3. An element without a valid certificate is not installed.\n\n#### 6.2 System accuracy test (P3.3, Process Tables)\n\n1. Control, monitoring and recording thermocouples get a SAT after installation and then at the Process Table interval (setting, default 90 days).\n2. The test thermocouple and the test instrument must be in calibration on the test day; a reused type K / E test thermocouple has its insertion depth recorded and is not used shallower than before (P3.1.3.3, site rule).\n3. Fail beyond the SAT tolerance (setting, default ±5.5 °C): the reaction plan of WI-TC-02 §4 applies.\n4. Every SAT record holds the P3.3.5 content and is approved (F-TC-02).\n\n#### 6.3 Protection tubes (PM schedule)\n\n1. Each thermocouple in use has a tube material, a check interval and, where set, a replacement interval (F-TC-03). The Maintenance Head approves the schedule and reviews it yearly; a change after approval needs re-approval.\n2. Tubes are checked on the interval (WI-TC-03); a worn or cracked tube is replaced before the next check, and the replacement is recorded.\n\n#### 6.4 Replacement of elements\n\nElements are replaced at the end of their service life (setting, default 365 days), after a failed SAT when adjustment is not enough, on damage or tube failure. The old element is kept in the register as removed with its reason; the new one needs its certificate and a SAT before use.\n\n### 7. Records\n\n| Record | Kept in | Retention |\n|---|---|---|\n| Thermocouple register with certificates (F-TC-01) | Application → Thermocouples | Life of the furnace + 1 year |\n| SAT records (F-TC-02) | Application → SAT records | 3 years minimum, or as the customer requires |\n| PM schedule and tube checks (F-TC-03) | Application → PM schedule, Tube checks | 3 years |\n| HTSA 3.3 evidence | Printed from the application, filed with the self-assessment | Until the next assessment |\n\n### 8. Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue | |\n", "TC/02_Work_Instructions/MWSPL-WI-TC-01_Receive_Calibrate_and_Install_a_Thermocouple.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## RECEIVE, CALIBRATE AND INSTALL A THERMOCOUPLE\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-TC-01 | 00 | — | Maintenance technician | | |\n\n### 1. Receiving\n\n| Step | Action | Who |\n|---|---|---|\n| 1.1 | Check the type (K), size and length against the order and the furnace position. | Store / maintenance |\n| 1.2 | Check the calibration certificate: serial or batch no., calibrated range covering the range of use (hardening 700–960 °C, tempering 500–900 °C), largest error within the accuracy shown in the application. | Maintenance technician |\n| 1.3 | No certificate, or a certificate that does not meet 1.2: do not issue the element; return it or have it calibrated. | Maintenance Head |\n\n### 2. Registering\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | Application → Thermocouples → open the position (furnace, chamber, TC-01 … TC-06) → \"Replace element…\" (or \"Register a thermocouple\" for a new position). | Maintenance technician |\n| 2.2 | Enter the serial, certificate no., calibration date, calibrated range and largest error. The calibration date must not be after the installation date. | Maintenance technician |\n| 2.3 | Tick \"The protection tube was replaced too\" when a new tube is fitted. | Maintenance technician |\n\n### 3. Installing\n\n| Step | Action | Who |\n|---|---|---|\n| 3.1 | Isolate per the furnace safety rules; remove the old element; inspect the tube (WI-TC-03). | Maintenance technician |\n| 3.2 | Fit the new element to the marked insertion depth; keep the polarity; tighten the head. | Maintenance technician |\n| 3.3 | Check the reading on the SCADA against the other thermocouple of the zone. | Maintenance technician |\n| 3.4 | Run the SAT (WI-TC-02) before the zone is used for product. Until then the application shows \"No SAT\". | Maintenance technician |\n", "TC/02_Work_Instructions/MWSPL-WI-TC-02_System_Accuracy_Test.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SYSTEM ACCURACY TEST (SAT)\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-TC-02 | 00 | — | Maintenance technician, HT Engineer | | |\n\n### 1. When\n\n- After every installation of an element, before product.\n- At the Process Table interval (application setting, default 90 days): see Application → Due list.\n- After a repair of the measuring loop (wiring, compensating cable, instrument).\n\n### 2. Preparation\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | Take a test instrument and a test thermocouple whose calibration is in date (Application → Test equipment). Note their corrections at the test temperature. | Technician |\n| 2.2 | The furnace runs at a normal set point and is stable (no set value change in the last 30 minutes). | Technician |\n| 2.3 | Insert the test thermocouple next to the tip of the thermocouple under test (CQI-9 P3.3; distance to confirm against the copy). | Technician |\n| 2.4 | **Type K or E test thermocouple:** measure and record the insertion depth in mm. When the test thermocouple was used before, insert it at least as deep as its deepest earlier use (P3.1.3.3, site rule); the application shows the earlier depth. | Technician |\n\n### 3. Test and record (F-TC-02, P3.3.5)\n\n| Step | Action | Who |\n|---|---|---|\n| 3.1 | Read the furnace instrument (SCADA) and the test instrument at the same moment. | Technician |\n| 3.2 | Application → SAT records → \"Record a SAT\": thermocouple, date, time, technician, set point, instrument, test TC, depth, both readings, both corrections (0 if none). | Technician |\n| 3.3 | The application calculates the SAT difference = furnace − (test + instrument correction + test TC correction) and the result. A record with test equipment out of calibration is invalid: repeat the test. | Application |\n| 3.4 | The HT Engineer reviews and approves the record (name and date). | HT Engineer |\n\n### 4. Failed SAT (beyond the tolerance)\n\n| Step | Action | Who |\n|---|---|---|\n| 4.1 | Inform the HT Engineer at once; hold the product of the zone back to the last passing SAT until assessed. | Technician |\n| 4.2 | Find the cause (element drift, wiring, instrument); correct (adjust offset, replace element per WI-TC-01). | Technician / Maintenance Head |\n| 4.3 | Record cause, action, product impact, owner and date on the SAT record. | HT Engineer |\n| 4.4 | Run a re-SAT; the failure stays open until a passing SAT (or the replacement's SAT) is recorded. | Technician |\n", "TC/02_Work_Instructions/MWSPL-WI-TC-03_Protection_Tube_Check_and_Replacement.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PROTECTION TUBE CHECK AND REPLACEMENT\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-TC-03 | 00 | — | Maintenance technician | | |\n\n### 1. When\n\nAt the check interval of each thermocouple in the approved PM schedule (Application → PM schedule; default every 30 days), at every element replacement and at every furnace shutdown that opens the chamber.\n\n### 2. Check\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | Application → Tube checks → \"Tube check round\"; enter the date and your name. | Technician |\n| 2.2 | For each tube due: look at the visible part and the head; at shutdown, the part inside the chamber. | Technician |\n| 2.3 | Result **OK**: no scaling beyond light oxide, no bending, no cracks, head tight. | Technician |\n| 2.4 | Result **Worn / scaled**: heavy scaling, wall loss, bending. Write what you see. Replace before the next check. | Technician |\n| 2.5 | Result **Cracked / burnt through**: replace at once; check the element (a SAT after the work, WI-TC-02). | Technician |\n\n### 3. Replacement\n\n| Step | Action | Who |\n|---|---|---|\n| 3.1 | Fit a new tube of the scheduled material (or the approved alternative); record the result **Replaced** with the material. This restarts the replacement interval. | Technician |\n| 3.2 | When the element was disturbed, run a SAT before product. | Technician |\n| 3.3 | A change of material or interval goes into the PM schedule; the Maintenance Head re-approves it. | Maintenance Head |\n", "TC/03_Formats/MWSPL-F-TC-01_Thermocouple_Register.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## THERMOCOUPLE REGISTER\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-TC-01 | 00 | Application → Thermocouples (CSV download \"Register CSV\") |\n\n| Furnace | Chamber | Tag | Zone | Wall | Use | Type | Serial | Installed | Certificate | Cal. date | Cal. range °C | Largest error ± °C | Tube | Status |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| | | | | | | | | | | | | | | |\n\nUse: control / monitoring / recording / load / over-temperature. Status: in use / spare / removed (with date and reason).\n", "TC/03_Formats/MWSPL-F-TC-02_SAT_Record.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SYSTEM ACCURACY TEST RECORD\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-TC-02 | 00 | Application → SAT records (\"Print record\" per SAT) |\n\n| Field (P3.3.5) | Entry |\n|---|---|\n| Record no. | |\n| Thermocouple tested (furnace, chamber, tag, use, type, serial) | |\n| Date and time | |\n| Set point °C | |\n| Test instrument (ident, certificate, calibration due) | |\n| Test thermocouple (ident, type, certificate, calibration due) | |\n| Insertion depth of the test TC (mm; required for type K / E) | |\n| Furnace reading °C | |\n| Test instrument reading °C | |\n| Instrument correction °C / test TC correction °C | |\n| SAT difference °C = furnace − (test + corrections) | |\n| Tolerance ± °C / result (pass / fail) | |\n| Technician | |\n| Approved by / date | |\n| Failed SAT: cause, action, product impact, owner, date, re-SAT record no. | |\n", "TC/03_Formats/MWSPL-F-TC-03_Protection_Tube_PM_Schedule_and_Check.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PROTECTION TUBE PM SCHEDULE AND CHECK RECORD\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-TC-03 | 00 | Application → PM schedule (\"Print schedule\") and Tube checks |\n\n### 1. Schedule (approved by the Maintenance Head, reviewed yearly)\n\n| Thermocouple | Tube material | Tube installed | Check every (days) | Replace after (days) | Next check | Replace by |\n|---|---|---|---|---|---|---|\n| | | | | | | |\n\nSchedule rev: ____ Approved by: __________ Date: ________\n\n### 2. Check record\n\n| Date | Thermocouple | Result (OK / worn / cracked / replaced) | New tube material | Note | Checked by |\n|---|---|---|---|---|---|\n| | | | | | |\n", "TC/04_Application/mwspl-tc-module.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## TC MODULE: APPLICATION DESCRIPTION\n\nThe module runs in the CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`, \"Thermocouples\"). Source: `QMS/TC/04_Application/mwspl-tc-module.js`; build `python QMS/00_Integrated_Application/build.py`. The documents of this module must match the rules below, which are taken from the code.\n\n| Item | Value in the code |\n|---|---|\n| Records | collections `tcs` (elements `TE-nnnn`), `eq` (test TCs / instruments `TT-nnnn`), `sats` (`SAT-nnnn`), `tubes` (checks `PT-nnnn`), `config/settings`, `config/pm`; shared record store (prefix `tc-`) or this browser (`mws-tc-local-v1`) |\n| Element | furnace, chamber, tag (TC-01 …; zone from the number, odd = right wall), use (control / monitoring / recording / load / over-temperature), type, serial, installed, calibration (certificate, date, range, largest error), range of use, protection tube (material, installed, check / replacement interval), status in use / spare / removed |\n| Calibration (P3.1) `calIssues` | certificate, date on or before installation, range covering the range of use (defaults hardening 700–960, tempering 500–900 °C), largest error within ± the greater of 2.2 °C or 0.75 % (base metal) / 1.5 °C or 0.25 % (noble) at the top of the range; test TCs 1.1 °C or 0.4 % / 0.6 °C or 0.1 % — settings to confirm |\n| SAT (P3.3) `satState` | control, monitoring, recording TCs: a valid passing SAT after installation, then every 90 days (setting); difference = furnace − (test + instrument correction + test TC correction); fail beyond ±5.5 °C (setting), warning beyond 70 %; a failure stays until a later pass |\n| Valid SAT `satEval` | instrument and test TC identified and in calibration on the test day; depth rules |\n| Insertion depth (P3.1.3.3) `depthIssues` | type K / E test TC: depth required; reused shallower than the deepest earlier use = issue (setting \"reuseDeeper\"); optional maximum uses |\n| SAT record (P3.3.5) `satMissing` | thermocouple, date, time, technician, set point, instrument, test TC, both readings, both corrections, depth (K / E), approval by and date |\n| Failed SAT | cause, action, product impact, owner, date; re-SAT shown on the Reactions view |\n| Protection tubes `tubeState` | not in the PM schedule (no material / interval), never checked, check overdue, replacement interval passed, last check worn / cracked (open until \"Replaced\"); PM schedule approved (rev, approver, date), changes after approval mark it changed, review every 365 days |\n| Element life `lifeOf` | 365 days after installation (setting, 0 = off) |\n| HTSA 3.3 `assess33` | the five bullets of the question plus element life; score needs immediate action (nothing registered, or a control TC failed / never SAT checked), not satisfactory (any item not met), satisfactory |\n| Data | export / import JSON, register and SAT CSV, import from the CALOR SAT register (`tsat-pdca`: thermocouples, SATs as the mean of their readings, test equipment), starter set-up, clear all |\n| API | `MWS.tc.stats()`, `summary()`, `closeModal()` (Overview) |\n| Test hook | `window.__TCM` |\n\n**Not in the application:** the calibration certificates themselves (kept in the maintenance file; the register holds their numbers); TUS and controller / recorder calibration (CALOR TUS and Equipment pages).\n"};</script>
<script>
/* ---------- module org ---------- */
(function(location){"use strict";
const ACTIVE=()=>MWS.app==="org";
const onDoc=(t,f)=>document.addEventListener(t,e=>{if(ACTIVE())return f(e);});
const onWin=(t,f)=>window.addEventListener(t,e=>{if(ACTIVE())return f(e);});
/* Module ORG: heat treat organization and the designated heat treat person (CQI-9 HTSA 1.1). Runs inside the shell: ACTIVE, onDoc, onWin,
   MWS and `location` come from the wrapper (build.py). The rules are those of the CALOR page Organization_Personnel.html (HTSA 1.1 part). */

/* 1. collection prefix (shared store only) */
const NS=c=>S.db&&S.db.local?c:"org-"+c;

/* 2. constants */
const ID_RE=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
const LKEY="mws-org-local-v1";
const EMP={full:"Full-time",part:"Part-time",contract:"Contract / consultant"};
const SITE={on:"On site",off:"Off site / other location"};
const DEF={plant:"Mass Wire and Steels Pvt. Ltd. · Bhiwadi",minYears:5,reviewDays:365};
const SETF=[["plant","Plant","text"],["minYears","HTSA 1.1 minimum heat treat experience (years; confirm against the controlled copy)","number"],["reviewDays","Review the organization chart and job descriptions every (days)","number"]];
const STRUCT={title:"title",reportsTo:"reporting line",holder:"holder",deputy:"deputy",ht:"heat treat position",fte:"full-time",site:"location",dedicated:"dedicated"};
const DOCS=[
  ["ORG/00_ORG_Master_List.md","Master list"],
  ["ORG/01_Procedure/MWSPL-QP-ORG-01_Heat_Treat_Organization_and_Qualification.md","MWSPL-QP-ORG-01 Heat treat organization"],
  ["ORG/02_Work_Instructions/MWSPL-WI-ORG-01_Appoint_and_Qualify_the_Heat_Treat_Person.md","MWSPL-WI-ORG-01 Appoint and qualify"],
  ["ORG/02_Work_Instructions/MWSPL-WI-ORG-02_Organization_Chart_and_Job_Descriptions.md","MWSPL-WI-ORG-02 Chart and job descriptions"],
  ["ORG/03_Formats/MWSPL-F-ORG-01_Job_Description.md","MWSPL-F-ORG-01 Job description"],
  ["ORG/03_Formats/MWSPL-F-ORG-02_Qualification_Record.md","MWSPL-F-ORG-02 Qualification record"],
  ["ORG/03_Formats/MWSPL-F-ORG-03_Organization_Chart_Approval.md","MWSPL-F-ORG-03 Organization chart approval"],
  ["ORG/04_Application/mwspl-org-module.md","Module description"]];

/* 3. helpers */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(",","."));return isFinite(n)?n:null;};
const txt=v=>String(v??"").trim();
const clone=o=>JSON.parse(JSON.stringify(o??null));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const thisMonth=()=>today().slice(0,7);
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||""));
const isMonth=s=>/^\d{4}-\d{2}$/.test(String(s||""));
const mnum=s=>isMonth(s)?+s.slice(0,4)*12+(+s.slice(5,7)-1):NaN;
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d);};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD=s=>isDate(s)?`${s.slice(8,10)}-${MON[+s.slice(5,7)-1]}-${s.slice(0,4)}`:"—";
const fmtM=s=>isMonth(s)?`${MON[+s.slice(5,7)-1]} ${s.slice(0,4)}`:"now";
const yrs=y=>`${(Math.round(y*10)/10).toString()} yr`;
const getp=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const setp=(o,p,v)=>{const k=p.split(".");let a=o;k.slice(0,-1).forEach(x=>{if(a[x]==null||typeof a[x]!=="object")a[x]={};a=a[x];});a[k.at(-1)]=v;};
const pill=(c,t)=>`<span class="pill ${c||""}">${esc(t)}</span>`;
const plural=(n,w,p)=>`${n} ${n===1?w:(p||w+"s")}`;
const maxNo=L=>Math.max(0,...L.map(x=>+(String(x.id).match(/(\d+)$/)||[0,0])[1]));

/* 4. state */
const S={view:"dash",db:null,dbState:"connecting",canWrite:true,dl:null,positions:[],people:[],cfg:{...DEF},chart:{rev:0,apprDate:"",appr:"",dirty:false,log:[]},
  docSel:DOCS[0][0],imp:null,modal:null,pending:false,unsub:[],q:{}};
const C=()=>S.cfg;
const MIN=()=>num(C().minYears)??5;

/* 5. domain logic (HTSA 1.1 rules of the CALOR HT organization page) */
const blankJd=()=>({rev:0,status:"draft",purpose:"",resp:"",auth:"",edu:"",knowledge:"",minYears:"",other:"",prep:"",appr:"",apprDate:"",change:"",revs:[]});
function fillPos(o){const p={id:"",title:"",dept:"",reportsTo:"",holder:"",deputy:"",ht:false,fte:"full",site:"on",dedicated:false,specAuth:false,log:[],...(o||{})};
  p.jd={...blankJd(),...((o&&o.jd)||{})};if(!Array.isArray(p.jd.revs))p.jd.revs=[];if(!Array.isArray(p.log))p.log=[];return p;}
function fillPer(o){const p={id:"",name:"",empNo:"",employment:"full",site:"on",joined:"",htHere:true,edu:[],exp:[],trn:[],notes:"",log:[],...(o||{})};
  ["edu","exp","trn","log"].forEach(k=>{if(!Array.isArray(p[k]))p[k]=[];});return p;}
const posById=id=>S.positions.find(p=>p.id===id)||null;
const perById=id=>S.people.find(p=>p.id===id)||null;
const pname=id=>{const p=perById(id);return p?p.name:"";};
const htPos=()=>S.positions.filter(p=>p.ht);
const heldBy=pid=>S.positions.filter(p=>p.holder===pid);
const roots=()=>S.positions.filter(p=>!p.reportsTo||!posById(p.reportsTo));
const kids=id=>S.positions.filter(p=>p.reportsTo===id);
function loops(){const bad=new Set();S.positions.forEach(p=>{let x=p,seen=new Set();while(x&&x.reportsTo){if(seen.has(x.id)){bad.add(p.id);break;}seen.add(x.id);x=posById(x.reportsTo);}});return bad;}
const chartDue=()=>isDate(S.chart.apprDate)?addDays(S.chart.apprDate,+C().reviewDays||365):null;
/* HTSA 1.6: who may approve process specifications (used by the Specifications module) */
function authorized(){const L=[],seen=new Set();
  S.positions.filter(p=>p.ht||p.specAuth).sort((a,b)=>b.ht-a.ht).forEach(p=>[[p.holder,p.title],[p.deputy,"deputy, "+p.title]].forEach(([id,pos])=>{const per=perById(id);if(per&&!seen.has(per.id)){seen.add(per.id);L.push({name:per.name,position:pos});}}));
  return L;}
/* qualification: heat treat experience (dated entries + service here since joining, overlaps once) and metallurgical education */
function mergedMonths(entries){
  const iv=entries.map(e=>[mnum(e.from),isMonth(e.to)?mnum(e.to):mnum(thisMonth())]).filter(([a,b])=>isFinite(a)&&isFinite(b)&&b>=a).map(([a,b])=>[a,b+1]).sort((x,y)=>x[0]-y[0]);
  let tot=0,cur=null;iv.forEach(([a,b])=>{if(!cur){cur=[a,b];return;}if(a<=cur[1])cur[1]=Math.max(cur[1],b);else{tot+=cur[1]-cur[0];cur=[a,b];}});if(cur)tot+=cur[1]-cur[0];return tot;}
const hereEntry=p=>p.htHere!==false&&isDate(p.joined)&&p.joined<=today()?{org:"this organization",from:p.joined.slice(0,7),to:"",ht:true}:null;
function qual(p,minY){
  const here=hereEntry(p),ht=mergedMonths([...p.exp.filter(e=>e.ht),...(here?[here]:[])])/12,hereY=here?mergedMonths([here])/12:0;
  const edu=p.edu.filter(e=>e.met).reduce((a,e)=>a+(num(e.years)||0),0),min=minY??MIN(),p1=ht>=min,p2=ht>0&&edu>0&&ht+edu>=min;
  const bad=p.exp.filter(e=>isMonth(e.from)&&isMonth(e.to)&&e.to<e.from).length;
  return {ht,edu,hereY,qualified:p1||p2,bad,
    path:p1?`${yrs(ht)} heat treat experience (minimum ${min})`:p2?`${yrs(edu)} metallurgical education + ${yrs(ht)} heat treat experience = ${yrs(edu+ht)} (minimum ${min})`:"",
    short:p1||p2?"":`${yrs(ht)} heat treat experience${edu?` + ${yrs(edu)} metallurgical education`:""}: below the minimum of ${min} years`};}
/* job descriptions: the revision in force and the approval gate */
const jdEff=p=>p.jd.status==="approved"?p.jd:(p.jd.revs||[]).filter(r=>r.status==="approved").at(-1)||null;
function jdMissing(p){const j=p.jd,m=[];
  if(!txt(j.purpose))m.push("purpose of the position");if(!txt(j.resp))m.push("responsibilities");if(!txt(j.edu))m.push("required education");
  if(p.ht&&!txt(j.knowledge))m.push("metallurgical and heat treat knowledge");
  if(num(j.minYears)==null)m.push("minimum years of experience");else if(p.ht&&num(j.minYears)<MIN())m.push(`minimum experience of at least ${MIN()} years (HTSA 1.1)`);
  if(!txt(j.prep))m.push("prepared by");if(!txt(j.appr))m.push("approved by");if(j.rev>0&&!txt(j.change))m.push("reason for the change");return m;}
const jdPill=p=>{const e=jdEff(p);return p.jd.status==="draft"&&e?pill("warn",`Rev ${p.jd.rev} draft · rev ${e.rev} in force`):p.jd.status==="approved"?pill("ok","Approved rev "+p.jd.rev):pill("warn","Draft");};
const jdDue=p=>{const e=jdEff(p);return e&&isDate(e.apprDate)?addDays(e.apprDate,+C().reviewDays||365):null;};

/* HTSA 1.1 */
const SCORE={s:["ok","Satisfactory","acc"],ns:["warn","Not satisfactory","cond"],nia:["bad","Needs immediate action","rej"]};
const LV={ok:["ok","Met"],warn:["warn","Attention"],crit:["bad","Not met"],info:["acc","Note"]};
function assess(){
  const I=[],add=(lvl,req,ev,act)=>I.push({lvl,req,ev,act}),H=htPos(),min=MIN();
  if(!H.length)add("crit","A heat treat position is defined","No position is marked as the heat treat position.","Mark the heat treat position (e.g. HT Manager) on the position record.");
  if(H.length>1)add("info","One designated heat treat position",`${H.length} positions are marked: ${H.map(p=>p.title).join(", ")}.`,"");
  const p=H[0]||null,per=p?perById(p.holder):null,q=per?qual(per):null;
  if(p){
    if(!per)add("crit","The heat treat position is filled",`${p.title} is vacant.`,"Appoint a qualified heat treat person.");
    else add("ok","The heat treat position is filled",`${p.title}: ${per.name}${per.empNo?" ("+per.empNo+")":""}.`,"");
    const other=per?heldBy(per.id).filter(x=>x.id!==p.id):[];
    add(p.dedicated&&!other.length?"ok":"crit","Dedicated to heat treatment",!p.dedicated?`${p.title}: heat treatment is not marked as the main duty of the position.`:other.length?`${per.name} also holds ${other.map(x=>x.title).join(", ")}.`:`Heat treatment is the main duty of ${p.title}.`,
      !p.dedicated?"Make heat treatment the main duty of the position (job description).":other.length?"Free the heat treat person from the other position(s).":"");
    if(per){
      const ft=p.fte==="full"&&per.employment==="full";
      add(ft?"ok":"crit","Full-time",ft?`Position full-time; ${per.name} employed full-time.`:`Position ${p.fte==="full"?"full-time":"part-time"}; ${per.name}: ${EMP[per.employment]||"employment not recorded"}.`,ft?"":"A full-time heat treat person is required.");
      const os=p.site==="on"&&per.site==="on";
      add(os?"ok":"crit","On site",os?`Position and ${per.name} on site (${C().plant}).`:`Position: ${SITE[p.site]||"?"}; ${per.name}: ${SITE[per.site]||"?"}.`,os?"":"The heat treat person must work on site.");
    }
    const inChart=!!(p.reportsTo&&posById(p.reportsTo))||(roots().length===1&&roots()[0].id===p.id),lp=loops().has(p.id),due=chartDue();
    if(!inChart||lp)add("crit","Shown in the organization chart",lp?"The reporting line of the position loops back on itself.":`${p.title} has no “reports to” position, so it hangs outside the chart.`,"Set the reporting line of the position.");
    else if(!isDate(S.chart.apprDate))add("crit","Shown in the organization chart",`${p.title} is in the chart, but the chart is not approved.`,"Approve the organization chart.");
    else if(S.chart.dirty)add("warn","Shown in the organization chart",`${p.title} is in the chart (rev ${S.chart.rev}, approved ${fmtD(S.chart.apprDate)}), but positions changed after the approval.`,"Approve the changed chart (new revision).");
    else if(due&&due<today())add("warn","Shown in the organization chart",`Chart rev ${S.chart.rev} approved ${fmtD(S.chart.apprDate)}: periodic review overdue since ${fmtD(due)}.`,"Review and re-approve the chart.");
    else add("ok","Shown in the organization chart",`${p.title} reports to ${posById(p.reportsTo)?posById(p.reportsTo).title:"—"}; chart rev ${S.chart.rev} approved ${fmtD(S.chart.apprDate)} by ${S.chart.appr}.`,"");
    const e=jdEff(p);
    if(!e)add("crit","Job description with the qualifications",`No approved job description for ${p.title}${p.jd.status==="draft"?" (draft rev "+p.jd.rev+")":""}.`,"Complete and approve the job description.");
    else{const gaps=[!txt(e.edu)&&"education",!txt(e.knowledge)&&"metallurgical and heat treat knowledge",(num(e.minYears)==null||num(e.minYears)<min)&&`minimum experience ≥ ${min} years`].filter(Boolean);
      add(gaps.length?"crit":"ok","Job description with the qualifications",gaps.length?`Job description rev ${e.rev} does not state: ${gaps.join(", ")}.`:`Job description rev ${e.rev} (approved ${fmtD(e.apprDate)}): education “${e.edu}”, knowledge stated, minimum ${e.minYears} years.`,gaps.length?"Revise the job description.":"");}
    if(per){
      if(q.qualified)add("ok",`Qualification of the heat treat person (≥ ${min} years)`,`${per.name}: ${q.path}.`,"");
      else add("crit",`Qualification of the heat treat person (≥ ${min} years)`,`${per.name}: ${q.short}.`,"Record the person's heat treat experience and metallurgical education, or appoint a person who meets the minimum.");
      if(q.bad)add("warn","Experience entries are consistent",`${plural(q.bad,"experience entry","experience entries")} ends before it starts.`,"Correct the dates.");
    }
    const dep=perById(p.deputy);
    if(!dep)add("info","Cover for absences","No deputy named for the heat treat position.","Name a deputy so the expertise is available during absences.");
    else{const dq=qual(dep);add(dq.qualified?"ok":"info","Cover for absences",`Deputy ${dep.name}: ${dq.qualified?dq.path:dq.short}.`,"");}
  }
  const crit=I.filter(i=>i.lvl==="crit").length,vacant=!H.length||!per;
  return {I,score:vacant||(q&&!q.qualified)?"nia":crit?"ns":"s",p,per,q,crit};
}

/* 6. db plumbing: shared store (claude.use("db")) or localStorage with the same calls */
function toast(t){MWS.toast(t);}
const needDb=()=>{if(!S.db){toast("The record store is not ready yet.");return false;}if(!S.canWrite){toast("View only: you cannot change records.");return false;}return true;};
function localDb(){
  let data={};try{data=JSON.parse(localStorage.getItem(LKEY)||"{}")||{};}catch(e){data={};}
  const subs={},emit=c=>(subs[c]||[]).forEach(f=>f(Object.entries(data[c]||{}).map(([id,v])=>({...v,id}))));
  const persist=()=>{try{localStorage.setItem(LKEY,JSON.stringify(data));return true;}catch(e){return false;}};
  onWin("storage",e=>{if(e.key!==LKEY)return;try{data=JSON.parse(e.newValue||"{}")||{};}catch(x){data={};}Object.keys(subs).forEach(emit);});
  return {local:true,
    sub(c,f){(subs[c]=subs[c]||[]).push(f);setTimeout(()=>f(Object.entries(data[c]||{}).map(([id,v])=>({...v,id}))),0);return ()=>{subs[c]=(subs[c]||[]).filter(x=>x!==f);};},
    set(c,id,v){(data[c]=data[c]||{})[id]=clone(v);if(!persist())return Promise.reject({code:"quota_exceeded",message:"The browser storage is full."});emit(c);return Promise.resolve();},
    del(c,id){if(data[c])delete data[c][id];persist();emit(c);return Promise.resolve();}};
}
function sharedDb(db){
  return {local:false,
    sub(c,f){return db.collection(NS(c)).onSnapshot(sn=>f(sn.docs.map(d=>({...d.data(),id:d.id}))),err=>{S.dbState="error";toast("Record store: "+errMsg(err));render();});},
    set(c,id,v){return db.collection(NS(c)).doc(id).set(v);},
    del(c,id){return db.collection(NS(c)).doc(id).delete();}};
}
const errMsg=e=>({invalid_argument:"not allowed (check your access level)",quota_exceeded:"the store is full",resource_exhausted:"too many changes at once, try again",revoked:"access was withdrawn",unavailable:"the store is not reachable, try again"}[e&&e.code]||(e&&e.message)||"failed");
function dbSet(c,id,v){if(!ID_RE.test(id))return Promise.reject({message:"invalid record id "+id});const k=c+"/"+id;
  const p=(S.q[k]||Promise.resolve()).catch(()=>{}).then(()=>S.db.set(c,id,JSON.parse(JSON.stringify(v))));S.q[k]=p;return p;}
function dbDel(c,id){const k=c+"/"+id;const p=(S.q[k]||Promise.resolve()).catch(()=>{}).then(()=>S.db.del(c,id));S.q[k]=p;return p;}
async function put(c,o,logText){if(!needDb())return false;if(logText){o.log=o.log||[];o.log.push({d:today(),t:logText});}
  try{await dbSet(c,o.id,o);return true;}catch(e){toast("Not saved: "+errMsg(e));return false;}}
async function saveChart(t){S.chart.log=S.chart.log||[];if(t)S.chart.log.push({d:today(),t});try{await dbSet("config","chart",S.chart);return true;}catch(e){toast("Not saved: "+errMsg(e));return false;}}
async function markChart(t){if(isDate(S.chart.apprDate)&&!S.chart.dirty){S.chart.dirty=true;await saveChart("Changed after approval: "+t);}}
async function saveCfg(){if(!needDb())return;try{await dbSet("config","settings",S.cfg);toast("Settings saved");}catch(e){toast("Not saved: "+errMsg(e));}}
async function batchPut(c,L){for(let i=0;i<L.length;i+=8)await Promise.all(L.slice(i,i+8).map(o=>dbSet(c,o.id,o)));}
function startStore(store,state){
  S.unsub.forEach(u=>{try{u();}catch(e){}});S.db=store;S.dbState=state;
  S.unsub=[store.sub("positions",L=>{S.positions=L.map(fillPos).sort((a,b)=>a.id<b.id?-1:1);safeRender();}),
    store.sub("people",L=>{S.people=L.map(fillPer).sort((a,b)=>a.name.localeCompare(b.name));safeRender();}),
    store.sub("config",L=>{const c=L.find(x=>x.id==="settings"),h=L.find(x=>x.id==="chart");S.cfg={...DEF,...(c||{})};delete S.cfg.id;
      S.chart={rev:0,apprDate:"",appr:"",dirty:false,log:[],...(h||{})};delete S.chart.id;safeRender();})];
  render();
}
function safeRender(){
  const a=document.activeElement;if(S.modal||(a&&$("#main")&&$("#main").contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))){S.pending=true;return;}
  render();
}
onDoc("focusout",()=>setTimeout(()=>{if(S.pending&&!S.modal){const a=document.activeElement;if(!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))){S.pending=false;render();}}},0));

const NAV=[["",[["dash","Dashboard"]]],["P",[["chart","Organization chart"],["pos","Positions & job descriptions"],["people","People & qualification"]]],
  ["C",[["review","HTSA 1.1"]]],["A",[["changes","Changes"]]],["",[["settings","Settings"],["rules","Rules"],["docs","Documentation"],["data","Data"]]]];
const navHtml=()=>`<div class="wrap">${NAV.map(([p,it])=>`<div class="grp">${p?`<span class="pd">${p}</span>`:""}${it.map(([k,l])=>`<a href="#${k}" ${S.view===k?'aria-current="page"':""}>${l}</a>`).join("")}</div>`).join("")}</div>`;
function route(){const v=(location.hash||"").slice(1);S.view=VIEWS[v]?v:"dash";}
const banner=()=>S.dbState==="local"?`<div class="banner warn">Local mode: records are kept in this browser only. Back up from the <a href="#data">Data</a> tab.</div>`
  :S.dbState==="connecting"?`<div class="banner">Connecting to the record store…</div>`:S.dbState==="error"?`<div class="banner bad">The record store reported an error; changes may not be saved.</div>`:"";
function render(){
  if(!ACTIVE()){MWS.bg();return;}
  $("#nav").innerHTML=navHtml();
  const ds=$("#dbstate");if(ds)ds.textContent=S.dbState==="on"?"Shared · live":S.dbState==="local"?"Local · this browser":S.dbState==="error"?"Store error":"Connecting…";
  document.body.classList.toggle("ro",!S.canWrite);
  $("#main").innerHTML=`<div class="stack">${banner()}${(VIEWS[S.view]||VIEWS.dash)()}</div>`;

function md(src){
  const inl=t=>esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,a,h)=>/\.md$/.test(h)?`<a href="#docs" data-docref="${esc(h)}">${a}</a>`:`<a href="${esc(h)}" target="_blank" rel="noopener">${a}</a>`);
  const L=String(src).replace(/\r/g,"").split("\n"),out=[];let i=0;
  while(i<L.length){const l=L[i];
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push(`<pre>${esc(b.join("\n"))}</pre>`);continue;}
    const h=l.match(/^(#{1,4})\s+(.*)$/);if(h){out.push(`<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`);i++;continue;}
    if(/^\|/.test(l)&&i+1<L.length&&/^\|\s*:?-{2,}/.test(L[i+1])){const row=x=>x.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());const hd=row(l);i+=2;const rs=[];
      while(i<L.length&&/^\|/.test(L[i]))rs.push(row(L[i++]));out.push(`<div class="tw"><table><thead><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue;}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ol=/^\s*\d+\./.test(l),it=[];while(i<L.length&&/^\s*([-*]|\d+\.)\s+/.test(L[i])){it.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/,"").replace(/^\[ \]\s*/,"☐ ").replace(/^\[x\]\s*/i,"☑ "));i++;}
      out.push(`<${ol?"ol":"ul"}>${it.map(x=>`<li>${inl(x)}</li>`).join("")}</${ol?"ol":"ul"}>`);continue;}
    if(/^>\s?/.test(l)){const b=[];while(i<L.length&&/^>\s?/.test(L[i]))b.push(L[i++].replace(/^>\s?/,""));out.push(`<div class="banner">${inl(b.join(" "))}</div>`);continue;}
    if(/^---+\s*$/.test(l)){out.push("<hr>");i++;continue;}
    if(!l.trim()){i++;continue;}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|```|\||\s*([-*]|\d+\.)\s|>)/.test(L[i]))p.push(L[i++]);out.push(`<p>${inl(p.join(" "))}</p>`);}
  return out.join("\n");
}

/* documentation: the markdown files embedded by the build (MWS.docs), else fetched from docs/ next to the HTML */
function md(src){
  const inl=t=>esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,a,h)=>/\.md$/.test(h)?`<a href="#docs" data-docref="${esc(h)}">${a}</a>`:`<a href="${esc(h)}" target="_blank" rel="noopener">${a}</a>`);
  const L=String(src).replace(/\r/g,"").split("\n"),out=[];let i=0;
  while(i<L.length){const l=L[i];
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push(`<pre>${esc(b.join("\n"))}</pre>`);continue;}
    const h=l.match(/^(#{1,4})\s+(.*)$/);if(h){out.push(`<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`);i++;continue;}
    if(/^\|/.test(l)&&i+1<L.length&&/^\|\s*:?-{2,}/.test(L[i+1])){const row=x=>x.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());const hd=row(l);i+=2;const rs=[];
      while(i<L.length&&/^\|/.test(L[i]))rs.push(row(L[i++]));out.push(`<div class="tw"><table><thead><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue;}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ol=/^\s*\d+\./.test(l),it=[];while(i<L.length&&/^\s*([-*]|\d+\.)\s+/.test(L[i])){it.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/,"").replace(/^\[ \]\s*/,"☐ ").replace(/^\[x\]\s*/i,"☑ "));i++;}
      out.push(`<${ol?"ol":"ul"}>${it.map(x=>`<li>${inl(x)}</li>`).join("")}</${ol?"ol":"ul"}>`);continue;}
    if(/^>\s?/.test(l)){const b=[];while(i<L.length&&/^>\s?/.test(L[i]))b.push(L[i++].replace(/^>\s?/,""));out.push(`<div class="banner">${inl(b.join(" "))}</div>`);continue;}
    if(/^---+\s*$/.test(l)){out.push("<hr>");i++;continue;}
    if(!l.trim()){i++;continue;}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|```|\||\s*([-*]|\d+\.)\s|>)/.test(L[i]))p.push(L[i++]);out.push(`<p>${inl(p.join(" "))}</p>`);}
  return out.join("\n");
}

/* sketch of temperature vs time through the line (set values per zone, ± tolerance band; schematic, not a measured curve) */
function profileSvg(e,c){
  if(!c)return `<p class="small muted">Enter the push time to draw the temperature–time sketch.</p>`;
  const AMB=30,R=ROLE[e.proc],H=[0,1,2].map(i=>num(e.h[i])),T=[0,1,2].map(i=>num(e.t[i]));
  if(H.some(v=>v==null)||T.some(v=>v==null))return `<p class="small muted">Enter every zone set value to draw the temperature–time sketch.</p>`;
  const HT=[0,1,2].map(i=>num(e.htol[i])||0),TT=[0,1,2].map(i=>num(e.ttol[i])||0);
  const P=[],band=[],segs=[];let t=0;
  const zones=(set,tol,dur,pre,from)=>{set.forEach((v,i)=>{const d=dur[i],r=Math.min(d*.35,i?d*.15:d*.6);
    P.push([t+r,v]);band.push([t,t+d,v-tol[i],v+tol[i]]);segs.push([t,t+d,pre+(i+1),v]);t+=d;P.push([t,v]);});};
  P.push([0,AMB]);zones(H,HT,c.zh,"H",AMB);const tH=t;
  let mid,midLbl;
  if(e.proc==="HT"){const q=num(e.q.tHi)!=null&&num(e.q.tLo)!=null?(num(e.q.tLo)+num(e.q.tHi))/2:(e.q.medium==="water"?30:60),
      dl=(num(e.q.delay)||30)/60,dp=num(e.q.dip)||8.5;
    P.push([t+dl,H[2]]);P.push([t+dl+.3,q]);P.push([t+dl+dp,q]);P.push([t+c.gap,Math.max(q,AMB)]);midLbl=`Quench · dip ${fx(dp,1)} min`;}
  else if(e.proc==="IA"){const tg=num(e.cc.target),cool=c.cool||0;P.push([t+cool,tg!=null?tg:T[0]]);P.push([t+c.gap,tg!=null?tg:T[0]]);midLbl=`Controlled cooling ${fx(cool,0)} min`;
    if(tg!=null)band.push([t,t+cool,tg-(num(e.cc.targetTol)||0),tg+(num(e.cc.targetTol)||0)]);}
  else{P.push([t+c.gap,H[2]-30]);midLbl=`Transfer ${fx(c.gap,0)} min`;}
  segs.push([t,t+c.gap,"mid",null]);t+=c.gap;const tT=t;
  zones(T,TT,c.zt,"T");const tE=t;
  const after=e.proc==="NORM"&&e.nm.fan==="required"?(num(e.nm.fanTime)||20):Math.max(20,c.total*.08);
  P.push([t+after,AMB+20]);t+=after;
  const W=760,Hh=270,L=46,Rr=12,Tp=26,B=50,xs=v=>L+v/t*(W-L-Rr),Ymax=Math.ceil((Math.max(...H,...T)+60)/100)*100,ys=v=>Tp+(1-v/Ymax)*(Hh-Tp-B);
  const step=t>600?120:t>300?60:30,ticks=[];for(let v=0;v<=t;v+=step)ticks.push(v);
  const yt=[];for(let v=0;v<=Ymax;v+=Ymax>800?200:100)yt.push(v);
  const g=[];
  yt.forEach(v=>g.push(`<line x1="${L}" x2="${W-Rr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end" class="ax">${v}</text>`));
  ticks.forEach(v=>g.push(`<text x="${xs(v)}" y="${Hh-B+14}" text-anchor="middle" class="ax">${v}</text>`));
  band.forEach(b=>g.push(`<rect x="${xs(b[0])}" y="${ys(b[3])}" width="${Math.max(0,xs(b[1])-xs(b[0]))}" height="${Math.max(1,ys(b[2])-ys(b[3]))}" fill="var(--accent-2)"/>`));
  [[0,tH,`Hardening chamber · ${pos(C().posH).reduce((a,b)=>a+b,0)} trays`],[tH,tT,R.mid],[tT,tE,`Tempering chamber · ${pos(C().posT).reduce((a,b)=>a+b,0)} trays`],[tE,t,e.proc!=="NORM"?"Air cooling":e.nm.fan==="required"?"Fan cooling":"Still air"]].forEach(([a,b,lb],i)=>{
    if(i)g.push(`<line x1="${xs(a)}" x2="${xs(a)}" y1="${Tp-8}" y2="${Hh-B}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>`);
    g.push(`<text x="${i===3?W-Rr:(xs(a)+xs(b))/2}" y="${Hh-B+30}" text-anchor="${i===3?"end":"middle"}" class="lb">${esc(i===1?midLbl:lb)}</text>`);});
  segs.filter(s=>s[2]!=="mid").forEach(s=>g.push(`<text x="${(xs(s[0])+xs(s[1]))/2}" y="${ys(s[3])-7}" text-anchor="middle" class="vl">${s[3]}</text><text x="${(xs(s[0])+xs(s[1]))/2}" y="${Hh-B-5}" text-anchor="middle" class="zl">${s[2]}</text>`));
  const pts=P.map(p=>`${xs(p[0]).toFixed(1)},${ys(p[1]).toFixed(1)}`).join(" ");
  return `<figure class="prof"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Temperature against time through the line: ${esc(R.h)} ${H.join(" / ")} °C, ${esc(midLbl)}, ${esc(R.t)} ${T.join(" / ")} °C, ${fx(c.total,0)} min through the line">
  <style>.prof .ax{font:11px var(--f-mono,monospace);fill:var(--muted)}.prof .lb{font:600 11.5px var(--f-body,sans-serif);fill:var(--ink)}.prof .vl{font:600 11px var(--f-mono,monospace);fill:var(--ink)}.prof .zl{font:10.5px var(--f-mono,monospace);fill:var(--muted)}</style>
  ${g.join("")}<line x1="${L}" x2="${W-Rr}" y1="${Hh-B}" y2="${Hh-B}" stroke="var(--muted)" stroke-width="1"/>
  <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="${L}" y="12" class="ax">°C</text><text x="${L}" y="${Hh-4}" class="ax">time from loading into the hardening chamber, min</text></svg>
  <figcaption class="small muted">Sketch: set value per zone with its tolerance band (shaded), push ${esc(e.push)} min, ${fx(c.total,0)} min through the line. Ramps, the quench / cooling curve and the cooling after exit are schematic, not measured.</figcaption></figure>`;
}

function DRAW_H16(){const A=assess16(),sc=SCORE[A.score];return sheet("HTSA 1.6 evidence",`<div id="jobcard"><p class="small muted">${esc(C().plant)} · CQI-9 HTSA 1.6 self-assessment · ${fmtD(today())}</p>

  <h3 style="margin-top:12px">Specifications in force</h3><div class="tw"><table><thead><tr><th>Spec</th><th>Part</th><th>Furnaces</th><th>Approved</th><th>Implemented</th><th>Review due</th></tr></thead><tbody>${S.specs.filter(s=>eff(s)).map(s=>{const e=eff(s);return `<tr><td>${esc(docNo(e))}</td><td>${esc(e.part)}</td><td>${esc(e.furnaces.join(", "))}</td><td>${fmtD(e.apprDate)} ${esc(e.appr)}</td><td>${fmtD(e.implDate)}</td><td>${fmtD(review(s).due)}</td></tr>`;}).join("")}</tbody></table></div></div>`,
  `<button class="pri" data-print>Print</button><button data-close>Close</button>`);}
const DRAW={spec:DRAW_SPEC,impl:DRAW_IMPL,rev:DRAW_REV,obs:DRAW_OBS,job:DRAW_JOB,h16:DRAW_H16};
const msg=(t,ok)=>{if(!S.modal)return;S.modal.msg=t?`<span style="color:var(--${ok?"ok":"bad"})">${esc(t)}</span>`:"";const el=$("#mmsg");if(el)el.innerHTML=S.modal.msg;};

/* actions on a specification */
async function saveSpec(){const e=S.modal.ed;if(!String(e.part).trim()){msg("Enter the part no. first.");return;}
  const isNew=!e.id;if(isNew){e.id=nextCode("PS",S.specs);}
  if(await save(e,isNew?"Specification created (draft)":"Draft saved")){S.modal.ed=fill(S.specs.find(x=>x.id===e.id)||e);msg("Saved.",1);redraw();}else if(isNew)e.id="";}
async function approve(){const e=S.modal.ed,m=missing(e),crit=advice(e).filter(a=>a[0]==="crit");
  if(m.length||crit.length){msg("Not approved. Missing: "+[...m,...crit.map(a=>a[1])].join(" · "));return;}
  if(!e.id)e.id=nextCode("PS",S.specs);e.status="approved";
  if(await save(e,`Revision ${e.rev} approved by ${e.appr}`)){toast(`${docNo(e)} approved`);closeModal();}else e.status="draft";}
async function revise(){const e=S.modal.ed,snap=clone(e);delete snap.revs;delete snap.log;delete snap.reviews;
  e.revs.push(snap);e.rev+=1;e.status="draft";Object.assign(e,{appr:"",apprDate:"",change:"",implDate:"",implBy:"",chg:{cust:"",notify:"",notifyRef:"",cp:false,valid:""}});
  if(await save(e,`New revision ${e.rev} started (rev ${e.rev-1} stays in force)`)){S.modal.ed=fill(S.specs.find(x=>x.id===e.id));msg("Revision "+e.rev+" started; rev "+(e.rev-1)+" stays in force until it is approved.",1);redraw();}}
async function discard(){const e=S.modal.ed,last=e.revs.at(-1);if(!last)return;const o={...clone(last),revs:e.revs.slice(0,-1),log:e.log,reviews:e.reviews};
  if(await save(o,`Revision ${e.rev} discarded; rev ${last.rev} in force`)){toast("Revision discarded");closeModal();}}
function armedDelete(b,fn){if(b.classList.contains("armed")){fn();return;}b.classList.add("armed");const t=b.textContent;b.textContent="Confirm delete";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent=t;}},4000);}
async function stdOps(){if(!needDb())return;const d=today(),who={prep:"A. Verma (example)",revBy:"S. Gupta (example)",appr:"R. Sharma (example)"};
  S.cfg={...S.cfg,auth:"R. Sharma (example)\nS. Gupta (example)"};await dbSet("config","settings",S.cfg);
  const L=[fill({id:"PS-0001",part:"EX-1001",name:"Example shaft",customer:"Example customer",grade:"42CrMo4",proc:"HT",furnaces:["F-02"],pcs:"60",wt:"1.8",h:["840","870","870"],t:["560","580","580"],push:"12",
      q:{medium:"oil",tLo:"50",tHi:"80",delay:"30",dip:"8.5",dipTol:"0.5",transfer:"5",agit:"Required"},form:"job",formRef:"Job card",req:{hMin:"28",hMax:"32",scale:"HRC",micro:"Tempered martensite",decarb:"≤ 0.10 mm total",sample:"2 pcs per batch (first and last tray)",method:"WI hardness testing"},
      ...who,status:"approved",apprDate:addDays(d,-200),implDate:addDays(d,-198),implBy:"Shift supervisor (example)",log:[{d:addDays(d,-200),t:"Example created"}]}),
    fill({id:"PS-0002",part:"EX-2001",name:"Example gear blank",grade:"20MnCr5",proc:"IA",furnaces:["F-03"],pcs:"24",wt:"3.5",h:["880","930","930"],t:["650","650","650"],push:"18",
      cc:{time:"12",timeTol:"1",method:"Forced-air cooling",target:"650",targetTol:"20"},form:"recipe",formRef:"SCADA recipe R-2001",req:{hMin:"156",hMax:"207",scale:"HB",micro:"Ferrite and pearlite, no bainite",decarb:"≤ 0.15 mm total",grain:"ASTM 5–8",sample:"1 pc per batch"},
      ...who,status:"approved",apprDate:addDays(d,-30),log:[{d:addDays(d,-30),t:"Example created"}]}),
    fill({id:"PS-0003",part:"EX-3001",name:"Example flange",grade:"C45",proc:"NORM",furnaces:["F-04"],pcs:"30",wt:"2.2",h:["720","740","750"],t:["860","880","880"],push:"10",nm:{transfer:"20",fan:"none"},
      req:{hMin:"170",hMax:"220",scale:"HB",decarb:"≤ 0.2 mm",sample:"1 pc per batch"},prep:"A. Verma (example)",log:[{d,t:"Example created (draft)"}]})];
  for(const s of L)await dbSet("specs",s.id,s);toast("Starter set-up loaded");}

/* 9. data: export / import / CSV / clear */
async function download(name,text,type){
  if(S.dl){try{await S.dl.save({filename:name,data:new Blob([text],{type})});return;}catch(e){if(e&&e.code==="declined")return;}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
const exportJson=()=>download(`mws-spec-${today()}.json`,JSON.stringify({app:"mws-spec-manager",v:1,saved:new Date().toISOString(),specs:S.specs,config:S.cfg},null,1),"application/json");
function csv(){const q=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const H=["Spec","Rev","Status","Part","Name","Customer","Grade","Process","Furnaces","Push","Hardness","Approved","Approved by","Implemented","Review due"];
  const R=S.specs.map(s=>{const e=eff(s)||s;return [s.id,s.rev,STATUS[s.status][1],s.part,s.name,s.customer,s.grade,PROC[s.proc],s.furnaces.join(" "),e.push,hardTxt(e),e.apprDate,e.appr,e.implDate,review(s).due||""];});
  download(`mws-spec-register-${today()}.csv`,"﻿"+[H,...R].map(r=>r.map(q).join(",")).join("\r\n"),"text/csv");}
function readImport(f){f.text().then(t=>{let o;try{o=JSON.parse(t);}catch(e){toast("Not a JSON file");return;}
  const specs=Array.isArray(o&&o.specs)?o.specs.filter(s=>s&&ID_RE.test(String(s.id||""))):null;
  if(!specs){toast("No specifications in this file");return;}
  S.imp={specs:specs.map(fill),config:o.config&&typeof o.config==="object"?o.config:null,msg:`${f.name}: ${plural(specs.length,"specification")}${o.config?" and settings":""}.`};render();});}
async function doImport(mode){if(!S.imp||!needDb())return;const I=S.imp;S.imp=null;
  if(mode==="replace")for(const s of S.specs)if(!I.specs.some(x=>x.id===s.id))await dbDel("specs",s.id);
  for(const s of I.specs)await dbSet("specs",s.id,s);if(I.config){const c={...DEF,...I.config};delete c.id;await dbSet("config","settings",c);}
  toast(`${plural(I.specs.length,"specification")} imported (${mode})`);render();}
async function importCalor(){if(!needDb())return;let o=null;try{o=JSON.parse(localStorage.getItem("psr-reg")||"null");}catch(e){}
  if(!o||!Array.isArray(o.specs)){toast("No CALOR specifications in this browser");return;}
  const L=o.specs.filter(s=>s&&ID_RE.test(String(s.id||""))).map(fill);for(const s of L)await dbSet("specs",s.id,s);
  if(o.settings){const keep={};Object.keys(DEF).forEach(k=>{if(o.settings[k]!=null)keep[k]=o.settings[k];});S.cfg={...S.cfg,...keep};await dbSet("config","settings",S.cfg);}
  toast(`${plural(L.length,"specification")} imported from CALOR`);}
async function clearAll(){if(($("#clrtxt")||{}).value!=="CLEAR ALL"){toast("Type CLEAR ALL to clear");return;}if(!needDb())return;
  for(const s of S.specs)await dbDel("specs",s.id);await dbDel("config","settings");toast("All specification data cleared");}

/* 10. wiring */
onDoc("click",e=>{
  const b=e.target.closest("button,tr.click,a[data-docref]");if(!b)return;const d=b.dataset;
  if(b.closest("#modal")||d.close!==undefined){
    if(d.close!==undefined){closeModal();return;}
    if(d.saveSpec!==undefined){saveSpec();return;}if(d.approve!==undefined){approve();return;}if(d.revise!==undefined){revise();return;}if(d.discard!==undefined){discard();return;}
    if(d.obs!==undefined){openModal({kind:"obs",id:S.modal.ed.id,why:""});return;}
    if(d.delSpec!==undefined){armedDelete(b,async()=>{const id=S.modal.ed.id;try{await dbDel("specs",id);toast(id+" deleted");closeModal();}catch(x){msg("Not deleted: "+errMsg(x));}});return;}
    if(d.saveImpl!==undefined){const m=S.modal,dt=$("#im-date").value,by=$("#im-by").value.trim(),s=clone(S.specs.find(x=>x.id===m.id));
      if(!isDate(dt)||!by){msg("Enter the date and who implemented it.");return;}if(dt<s.apprDate){msg("Not before the approval date ("+fmtD(s.apprDate)+").");return;}if(dt>today()){msg("Not in the future.");return;}
      s.implDate=dt;s.implBy=by;save(s,`Implemented at the line on ${dt} by ${by}`).then(ok=>{if(ok){toast("Implementation recorded");closeModal();}});return;}
    if(d.saveRev!==undefined){const m=S.modal,dt=$("#rv-date").value,by=$("#rv-by").value.trim(),s=clone(S.specs.find(x=>x.id===m.id)),ef=eff(s);
      if(!isDate(dt)||!by){msg("Enter the date and the reviewer.");return;}if(dt>today()||dt<ef.apprDate){msg("Between the approval of the revision in force and today.");return;}
      s.reviews.push({date:dt,by,rev:ef.rev,note:$("#rv-note").value.trim(),res:"nc"});save(s,`Periodic review without change by ${by}`).then(ok=>{if(ok){toast("Review recorded");closeModal();}});return;}
    if(d.saveObs!==undefined){const why=$("#ob-why").value.trim(),s=clone(S.specs.find(x=>x.id===S.modal.id));if(!why){msg("Give the reason.");return;}
      s.status="obsolete";s.obsReason=why;s.obsDate=today();save(s,"Made obsolete: "+why).then(ok=>{if(ok){toast(s.id+" made obsolete");closeModal();}});return;}
    if(d.print!==undefined){document.body.classList.add("pm");window.print();setTimeout(()=>document.body.classList.remove("pm"),500);return;}
  }
  if(d.impl){const s=S.specs.find(x=>x.id===d.impl);openModal({kind:"impl",id:d.impl,date:today(),by:"",msg:""});return;}
  if(d.job){const s=S.specs.find(x=>x.id===d.job);if(s&&eff(s))openModal({kind:"job",s});return;}
  if(d.review){openModal({kind:"rev",id:d.review,date:today(),by:"",note:"",msg:""});return;}
  if(d.h16!==undefined){openModal({kind:"h16"});return;}
  if(d.spec){specModal(d.spec);return;}
  if(d.newSpec!==undefined){if(needDb())specModal(null);return;}
  if(d.std!==undefined){stdOps();return;}
  if(d.saveCfg!==undefined){document.querySelectorAll("[data-cfg]").forEach(i=>{const k=i.dataset.cfg,t=(SETF.find(x=>x[0]===k)||[])[2];S.cfg[k]=t==="number"?(num(i.value)??DEF[k]):i.value;});saveCfg();return;}
  if(d.fy){S.fy+=+d.fy;render();return;}
  if(d.doc){S.docSel=d.doc;render();return;}
  if(d.docref){e.preventDefault();const p=DOCS.find(x=>x[0].endsWith(d.docref.replace(/^(\.\.\/)+/,"").replace(/^\.\//,"")));if(p){S.docSel=p[0];render();}return;}
  if(d.export!==undefined){exportJson();return;}if(d.csv!==undefined){csv();return;}
  if(d.imp){if(d.imp==="cancel"){S.imp=null;render();}else doImport(d.imp);return;}
  if(d.calor!==undefined){importCalor();return;}
  if(d.clear!==undefined){armedDelete(b,clearAll);return;}
});
onDoc("input",e=>{const el=e.target;
  if(el.dataset.p&&S.modal&&S.modal.ed&&el.tagName!=="SELECT"){setp(S.modal.ed,el.dataset.p,el.value);return;}
  if(el.dataset.filt==="q"){S.filt.q=el.value;clearTimeout(S._ft);S._ft=setTimeout(()=>{render();const i=$("[data-filt=q]");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250);}
});
onDoc("change",e=>{const el=e.target;
  if(el.dataset.p&&S.modal&&S.modal.ed&&el.tagName==="SELECT"){setp(S.modal.ed,el.dataset.p,el.value);redraw();return;}
  if(el.dataset.pc&&S.modal){setp(S.modal.ed,el.dataset.pc,el.checked);return;}
  if(el.dataset.fur&&S.modal){const f=el.dataset.fur,L=S.modal.ed.furnaces;S.modal.ed.furnaces=el.checked?[...new Set([...L,f])].sort():L.filter(x=>x!==f);redraw();return;}
  if(el.dataset.filt&&el.dataset.filt!=="q"){S.filt[el.dataset.filt]=el.value;render();return;}
  if(el.id==="impfile"&&el.files[0]){readImport(el.files[0]);el.value="";}
});
onDoc("keydown",e=>{if(e.key==="Escape"&&S.modal)closeModal();});
onWin("hashchange",()=>{route();S.pending=false;render();window.scrollTo(0,0);});

/* 11. integration API */
MWS.spec={closeModal,
  stats:()=>{const k=kp();return {db:S.dbState,n:S.specs.length,inForce:k.inForce,drafts:k.drafts,over:k.over,soon:k.soon,implLate:k.implLate,noSpec:k.noSpec,score:k.score,label:SCORE[k.score][1],cls:SCORE[k.score][0]};},
  summary:()=>{const k=kp();return `${plural(k.inForce,"process specification")} in force (${plural(k.parts,"part")}), HTSA 1.6 ${SCORE[k.score][1].toLowerCase()}${k.over?`, ${k.over} review(s) overdue`:""}.`;},
  inForce:()=>S.specs.map(s=>eff(s)).filter(Boolean).map(e=>({id:e.id,rev:e.rev,part:e.part,name:e.name,proc:e.proc,furnaces:e.furnaces,push:e.push,h:e.h,t:e.t,htol:e.htol,ttol:e.ttol,req:e.req}))};

window.__SPECM={S,eff,calc,missing,assess16,review,kp,profileSvg};

/* 12. boot */
async function boot(){
  route();render();
  const [dl,user,db]=await Promise.all([useCap("downloads"),useCap("user"),useCap("db")]);
  S.dl=dl;
  if(user){try{const c=await user.can("data.write");S.canWrite=c!==false;}catch(e){}}
  if(db)startStore(sharedDb(db),"on");else startStore(localDb(),"local");
}
boot();

})(MWS.loc("spec"));
</script>
<script>
/* ---------- module tc ---------- */
(function(location){"use strict";
const ACTIVE=()=>MWS.app==="tc";
const onDoc=(t,f)=>document.addEventListener(t,e=>{if(ACTIVE())return f(e);});
const onWin=(t,f)=>window.addEventListener(t,e=>{if(ACTIVE())return f(e);});
/* Module TC: thermocouples and protection tubes (CQI-9 HTSA 3.3). Runs inside the shell: ACTIVE, onDoc, onWin, MWS and `location` come from the
   wrapper (build.py). Same pattern as the SPEC module (UI/UX Reuse Handover §5). The accuracy, SAT and interval figures are settings
   flagged to confirm against the controlled CQI-9 copy (Section P3.1 tables, P3.3 and the Process Tables). */

/* 1. collection prefix (shared store only) */
const NS=c=>S.db&&S.db.local?c:"tc-"+c;

/* 2. constants */
const COLS=["tcs","eq","sats","tubes","config"];
const ID_RE=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
const LKEY="mws-tc-local-v1";
const CH=["Hardening","Tempering"];
const USE={control:"Control",monitor:"Monitoring",record:"Recording",load:"Load (expendable)",otp:"Over-temperature"};
const SATUSE=["control","monitor","record"];
const TYPES=["K","N","J","E","T","R","S","B"];
const BASE=["K","N","J","E","T"];
const DEPTHTYPES=["K","E"];
const TSTAT={inuse:["ok","In use"],spare:["","Spare"],removed:["","Removed"]};
const TRES={ok:["ok","OK"],worn:["warn","Worn / scaled: replace"],cracked:["bad","Cracked / burnt through: replace"],replaced:["acc","Replaced"]};
const REASONS=["SAT failure","Service life reached","Drift","Damage / open circuit","Protection tube failure","Relocation","Other"];
const DEF={plant:"Mass Wire and Steels Pvt. Ltd. · Bhiwadi",furnaces:"F-01, F-02, F-03, F-04",rangeH:"700-960",rangeT:"500-900",
  satDays:90,satTol:5.5,warnPct:70,soonDays:14,lifeDays:365,
  accFieldBase:"2.2|0.75",accFieldNoble:"1.5|0.25",accTestBase:"1.1|0.4",accTestNoble:"0.6|0.1",
  reuseDeeper:"yes",maxUses:0,tubeCheckDays:30,tubeReplDays:365,pmReviewDays:365};
const SETF=[["plant","Plant","text"],["furnaces","Furnaces (comma separated)","text"],["rangeH","Range of use, hardening chamber (°C, lo-hi)","text"],["rangeT","Range of use, tempering chamber (°C, lo-hi)","text"],
  ["satDays","SAT interval for control / monitoring / recording TCs (days, Process Table)","number"],["satTol","SAT tolerance ± °C (P3.3)","number"],["warnPct","SAT warning at % of the tolerance","number"],
  ["soonDays","Show as due this many days before","number"],["lifeDays","Replace sensing elements after (days, 0 = off)","number"],
  ["accFieldBase","Calibration accuracy, base-metal control / monitoring / recording TCs (± °C | % of reading, the greater)","text"],["accFieldNoble","Same, noble-metal (R / S / B)","text"],
  ["accTestBase","Calibration accuracy, base-metal test TCs","text"],["accTestNoble","Same, noble-metal test TCs","text"],
  ["reuseDeeper","Reused type K / E test TC: insertion depth at least the deepest earlier use (yes / no)","text"],["maxUses","Test TC: maximum number of uses (0 = no limit)","number"],
  ["tubeCheckDays","Default protection tube check interval (days)","number"],["tubeReplDays","Default protection tube replacement interval (days, 0 = on condition only)","number"],
  ["pmReviewDays","Review the PM schedule every (days)","number"]];
const DOCS=[
  ["TC/00_TC_Master_List.md","Master list"],
  ["TC/01_Procedure/MWSPL-QP-TC-01_Thermocouples_and_Protection_Tubes.md","MWSPL-QP-TC-01 Thermocouples and protection tubes"],
  ["TC/02_Work_Instructions/MWSPL-WI-TC-01_Receive_Calibrate_and_Install_a_Thermocouple.md","MWSPL-WI-TC-01 Receive and install"],
  ["TC/02_Work_Instructions/MWSPL-WI-TC-02_System_Accuracy_Test.md","MWSPL-WI-TC-02 System accuracy test"],
  ["TC/02_Work_Instructions/MWSPL-WI-TC-03_Protection_Tube_Check_and_Replacement.md","MWSPL-WI-TC-03 Protection tubes"],
  ["TC/03_Formats/MWSPL-F-TC-01_Thermocouple_Register.md","MWSPL-F-TC-01 Thermocouple register"],
  ["TC/03_Formats/MWSPL-F-TC-02_SAT_Record.md","MWSPL-F-TC-02 SAT record"],
  ["TC/03_Formats/MWSPL-F-TC-03_Protection_Tube_PM_Schedule_and_Check.md","MWSPL-F-TC-03 Tube PM schedule and check"],
  ["TC/04_Application/mwspl-tc-module.md","Module description"]];

/* 3. helpers */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(",","."));return isFinite(n)?n:null;};
const fx=(v,d=1)=>v==null||!isFinite(v)?"—":(Math.round(v*10**d)/10**d).toString();
const clone=o=>JSON.parse(JSON.stringify(o??null));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||""));
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d);};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD=s=>isDate(s)?`${s.slice(8,10)}-${MON[+s.slice(5,7)-1]}-${s.slice(0,4)}`:"—";
const getp=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const setp=(o,p,v)=>{const k=p.split(".");let a=o;k.slice(0,-1).forEach(x=>{if(a[x]==null||typeof a[x]!=="object")a[x]={};a=a[x];});a[k.at(-1)]=v;};
const pill=(c,t)=>`<span class="pill ${c||""}">${esc(t)}</span>`;
const plural=(n,w,p)=>`${n} ${n===1?w:(p||w+"s")}`;
const isNA=v=>/^(n\/?a|not available)$/i.test(String(v||"").trim());
const nextCode=(p,list)=>p+"-"+String(Math.max(0,...list.map(x=>+(String(x.id).match(/(\d+)$/)||[0,0])[1]))+1).padStart(4,"0");
const rng=s=>{const m=String(s||"").match(/(-?\d+(?:\.\d+)?)\s*[-–]\s*(-?\d+(?:\.\d+)?)/);return m?[+m[1],+m[2]]:[null,null];};
const acc=s=>{const [a,p]=String(s||"").split("|").map(num);return {a:a||0,p:p||0};};

/* 4. state */
const S={view:"dash",db:null,dbState:"connecting",canWrite:true,dl:null,tcs:[],eq:[],sats:[],tubes:[],cfg:{...DEF},pm:{rev:0,appr:"",apprDate:"",ref:"",dirty:false,log:[]},
  docSel:DOCS[0][0],imp:null,modal:null,pending:false,filt:{f:"",ch:"",st:"inuse",q:""},unsub:[],q:{}};
const C=()=>S.cfg;

/* 5. domain logic */

/* 6. db plumbing: shared store (claude.use("db")) or localStorage with the same calls */
function toast(t){MWS.toast(t);}
const needDb=()=>{if(!S.db){toast("The record store is not ready yet.");return false;}if(!S.canWrite){toast("View only: you cannot change records.");return false;}return true;};
function localDb(){

  onWin("storage",e=>{if(e.key!==LKEY)return;try{data=JSON.parse(e.newValue||"{}")||{};}catch(x){data={};}Object.keys(subs).forEach(emit);});
  return {local:true,
    sub(c,f){(subs[c]=subs[c]||[]).push(f);setTimeout(()=>f(Object.entries(data[c]||{}).map(([id,v])=>({...v,id}))),0);return ()=>{subs[c]=(subs[c]||[]).filter(x=>x!==f);};},
    set(c,id,v){(data[c]=data[c]||{})[id]=clone(v);if(!persist())return Promise.reject({code:"quota_exceeded",message:"The browser storage is full."});emit(c);return Promise.resolve();},

    sub(c,f){return db.collection(NS(c)).onSnapshot(sn=>f(sn.docs.map(d=>({...d.data(),id:d.id}))),err=>{S.dbState="error";toast("Record store: "+errMsg(err));render();});},

function attention(){

async function saveTc(){const e=fillTc(S.modal.ed),known=S.tcs.find(x=>x.id===e.id);

    fillEq({id:"TT-0003",kind:"testtc",ident:"TTC-N-201"+ex,type:"N",cert:"CC/2318",calDate:D(-400),calDue:D(-35),corr:"0.3",maxErr:"0.9",uses0:"4"})];
  const furn=["F-01","F-02","F-03","F-04"];
  furn.forEach((f,fi)=>CH.forEach((ch,ci)=>{for(let k=1;k<=6;k++){const id="TE-"+String(++te).padStart(4,"0"),inst=D(-300+fi*20+k*3),tubeInst=D(-300+fi*20);
    const e=fillTc({id,tag:"TC-"+pad(k),furnace:f,chamber:ch,use:"control",type:"K",serial:`K-${f.slice(2)}${ci?"T":"H"}${k}-${2400+te}`,sheath:"6 mm MI, Inconel 600",installed:inst,
      cal:{cert:"CC/"+(2100+te),lab:"Example calibration lab",date:addDays(inst,-10),lo:ch==="Hardening"?"600":"400",hi:ch==="Hardening"?"1000":"950",maxErr:"1.6"},
      tube:{mat:ch==="Hardening"?"Inconel 600":"AISI 310",installed:tubeInst,checkDays:"30",replDays:"365"},notes:"Example",log:[{d,t:"Example"}]});
    if(f==="F-03"&&ch==="Tempering"&&k===2)e.cal.cert="";                          /* a missing certificate */

      const tR=sp+((k*7+fi*3+j)%5-2)*0.4;
      SA.push(fillSat({id:"SAT-"+String(++sa).padStart(4,"0"),tc:id,date:D(o),time:"10:"+pad(10+k*5),by:"S. Patil"+ex,sp:String(sp),instr:"TT-0001",testTc:"TT-0002",depth:String(150+j*10),
        fRdg:String(Math.round((tR+(fail?7.2:((k+fi)%3-1)*0.8)+0.2-0.4)*10)/10),tRdg:String(Math.round(tR*10)/10),instrCorr:"0.2",tcCorr:"-0.4",
        appr:fail?{by:"",date:""}:{by:"R. Sharma"+ex,date:D(o+1)},act:fail?{cause:"Element drift suspected",action:"",impact:"",by:"",date:""}:{},log:[{d,t:"Example"}]}));});
    const chk=f==="F-04"&&ch==="Hardening"&&k===3?-45:-10-k;                      /* F-04 hardening TC-03: tube check overdue */
    TB.push(fillTube({id:"PT-"+String(++pt).padStart(4,"0"),tc:id,date:D(chk),by:"Maintenance"+ex,res:f==="F-01"&&ch==="Hardening"&&k===6?"worn":"ok",note:f==="F-01"&&ch==="Hardening"&&k===6?"Heavy scaling at the tip":""}));}}));
  /* the depth rule: the last SAT with the reused K test TC is shallower on one record */

  await batchPut("eq",EQ);await batchPut("tcs",T);await batchPut("sats",SA);await batchPut("tubes",TB);

  if(d.saveCfg!==undefined){document.querySelectorAll("[data-cfg]").forEach(i=>{const k=i.dataset.cfg,t=(SETF.find(x=>x[0]===k)||[])[2];S.cfg[k]=t==="number"?(num(i.value)??DEF[k]):i.value;});saveCfg();return;}
  if(d.doc){S.docSel=d.doc;render();return;}
  if(d.docref){e.preventDefault();const p=DOCS.find(x=>x[0].endsWith(d.docref.replace(/^(\.\.\/)+/,"").replace(/^\.\//,"")));if(p){S.docSel=p[0];render();}return;}
  if(d.export!==undefined){exportJson();return;}if(d.csv!==undefined){csv();return;}if(d.satcsv!==undefined){satCsv();return;}
  if(d.imp){if(d.imp==="cancel"){S.imp=null;render();}else doImport(d.imp);return;}
  if(d.calor!==undefined){importCalor();return;}
  if(d.clear!==undefined){armedDelete(b,clearAll);return;}
});
onDoc("input",e=>{const el=e.target;
  if(el.dataset.p&&S.modal&&S.modal.ed&&el.tagName!=="SELECT"){setp(S.modal.ed,el.dataset.p,el.value);
    if(S.modal.kind==="sat"&&/^(fRdg|tRdg|instrCorr|tcCorr|depth|date|time)$/.test(el.dataset.p)){clearTimeout(S._rd);S._rd=setTimeout(()=>{const a=document.activeElement,id=a&&a.id;redraw();const n=id&&document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length);}catch(x){}}},500);}
    return;}
  if(el.dataset.rl&&S.modal){const [i,k]=el.dataset.rl.split(".");S.modal.lines[+i][k]=el.value;return;}
  if(S.modal&&/^(rd|pa)-(by|date)$/.test(el.id)){S.modal[el.id.slice(3)]=el.value;return;}
  if(el.dataset.filt==="q"){S.filt.q=el.value;clearTimeout(S._ft);S._ft=setTimeout(()=>{render();const i=$("[data-filt=q]");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250);}
});
onDoc("change",e=>{const el=e.target;
  if(el.dataset.p&&S.modal&&S.modal.ed&&el.tagName==="SELECT"){setp(S.modal.ed,el.dataset.p,el.value);
    if(S.modal.kind==="sat"&&el.dataset.p==="testTc"){const q=eqById(el.value);if(q&&q.corr!==""&&S.modal.ed.tcCorr==="")S.modal.ed.tcCorr=q.corr;}
    if(S.modal.kind==="sat"&&el.dataset.p==="instr"){const q=eqById(el.value);if(q&&q.corr!==""&&S.modal.ed.instrCorr==="")S.modal.ed.instrCorr=q.corr;}
    if(S.modal.kind==="sat"&&el.dataset.p==="tc"){const t=tcById(el.value),l=t&&satsOf(t.id)[0];if(l&&!S.modal.ed.sp)S.modal.ed.sp=l.sp;}
    redraw();return;}
  if(el.dataset.pc&&S.modal){setp(S.modal.ed,el.dataset.pc,el.checked);return;}
  if(el.dataset.rl&&S.modal){const [i,k]=el.dataset.rl.split(".");S.modal.lines[+i][k]=el.value;if(k==="res")redraw();return;}
  if(el.dataset.filt&&el.dataset.filt!=="q"){S.filt[el.dataset.filt]=el.value;render();return;}
  if(el.id==="impfile"&&el.files[0]){readImport(el.files[0]);el.value="";}
});
onDoc("keydown",e=>{if(e.key==="Escape"&&S.modal)closeModal();});
onWin("hashchange",()=>{route();S.pending=false;render();window.scrollTo(0,0);});

/* 12. integration API */
MWS.tc={closeModal,
  stats:()=>{const k=kp();return {db:S.dbState,...k,label:SCORE[k.score][1],cls:SCORE[k.score][0]};},
  summary:()=>{const k=kp();return `${plural(k.inUse,"thermocouple")} in use, ${k.satOk} of ${k.satNeed} with a SAT in date, HTSA 3.3 ${SCORE[k.score][1].toLowerCase()}.`;}};
window.__TCM={S,calIssues,satEval,satMissing,depthIssues,satState,tubeState,lifeOf,assess33,kp,eqIssues};

/* 13. boot */
async function boot(){
  route();render();
  const [dl,user,db]=await Promise.all([useCap("downloads"),useCap("user"),useCap("db")]);
  S.dl=dl;
  if(user){try{const c=await user.can("data.write");S.canWrite=c!==false;}catch(e){}}
  if(db)startStore(sharedDb(db),"on");else startStore(localDb(),"local");
}
boot();

})(MWS.loc("tc"));
</script>
<script>
/* ---------- shell: Overview page (after every module) ---------- */
function renderHome(){
  if(MWS.app!=="home")return;
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
  const sp=MWS.spec?MWS.spec.stats():null;
  const dbs={on:"Shared · live",local:"Local · this browser",error:"Store error"};
  const tc=MWS.tc?MWS.tc.stats():null,og=MWS.org?MWS.org.stats():null,st=document.getElementById("dbstate"),any=og||sp||tc;if(st)st.textContent=any?(dbs[any.db]||"Connecting…"):"—";
  const tile=(k,v,c,h)=>`<a class="tile" href="${h}"><div class="k">${esc(k)}</div><div class="v ${c||""}">${esc(v)}</div></a>`;
  const specCard=sp?`<section class="panel"><div class="row between"><h2>Process specifications</h2><a class="pill ${sp.cls}" href="#spec/review">HTSA 1.6 · ${esc(sp.label)}</a></div>
    <p class="muted">${esc(MWS.spec.summary())}</p>
    <div class="tiles">${tile("In force",sp.inForce,"","#spec/specs")}${tile("Drafts awaiting approval",sp.drafts,sp.drafts?"warn":"ok","#spec/specs")}${tile("Reviews overdue",sp.over,sp.over?"bad":"ok","#spec/review")}${tile("Reviews due soon",sp.soon,sp.soon?"warn":"ok","#spec/review")}${tile("Implementation late",sp.implLate,sp.implLate?"bad":"ok","#spec/line")}${tile("Active parts without a spec",sp.noSpec??"—",sp.noSpec?"bad":"ok","#spec/review")}</div>
    <p class="row"><a class="btn pri" href="#spec/dash">Open Process specifications</a><a class="btn" href="#spec/specs">Register</a><a class="btn" href="#spec/line">At the line</a></p></section>`:"";
  const orgCard=og?`<section class="panel"><div class="row between"><h2>Heat treat organization</h2><a class="pill ${og.cls}" href="#org/review">HTSA 1.1 · ${esc(og.label)}</a></div>
    <p class="muted">${esc(MWS.org.summary())}</p>
    <div class="tiles">${tile("Heat treat person",og.person||"Vacant",og.person?(og.qualified?"ok":"bad"):"bad","#org/review")}${tile("Heat treat experience",og.person?(Math.round(og.ht*10)/10)+" yr":"—","","#org/people")}${tile("Deputy",og.deputy||"None",og.deputy?"ok":"warn","#org/chart")}${tile("Organization chart",og.chart?"Rev "+og.chart:"Not approved",og.chartOk?"ok":"warn","#org/chart")}${tile("HTSA 1.1 items not met",og.crit,og.crit?"bad":"ok","#org/review")}</div>
    <p class="row"><a class="btn pri" href="#org/dash">Open HT organization</a><a class="btn" href="#org/chart">Organization chart</a><a class="btn" href="#org/people">People</a></p></section>`:"";
  const tcCard=tc?`<section class="panel"><div class="row between"><h2>Thermocouples &amp; protection tubes</h2><a class="pill ${tc.cls}" href="#tc/review">HTSA 3.3 · ${esc(tc.label)}</a></div>
    <p class="muted">${esc(MWS.tc.summary())}</p>
    <div class="tiles">${tile("In use",tc.inUse,"","#tc/tcs")}${tile("SAT overdue / none",tc.satOver,tc.satOver?"bad":"ok","#tc/review")}${tile("SAT failed",tc.satFail,tc.satFail?"bad":"ok","#tc/act")}${tile("SAT due soon",tc.satSoon,tc.satSoon?"warn":"ok","#tc/review")}${tile("Calibration issues",tc.calBad,tc.calBad?"bad":"ok","#tc/tcs")}${tile("Tubes overdue / to replace",tc.tubeBad,tc.tubeBad?"bad":"ok","#tc/tube")}</div>
    <p class="row"><a class="btn pri" href="#tc/dash">Open Thermocouples</a><a class="btn" href="#tc/sat">SAT records</a><a class="btn" href="#tc/tube">Tube checks</a></p></section>`:"";
  document.getElementById("main").innerHTML=`
  <section class="panel"><h2>Heat treat quality system</h2>
    <p class="muted">One application for the CQI-9 heat treat system of the plant. Each module keeps its own records and follows its procedure; the Overview collects their status. This build holds Heat treat organization (HTSA 1.1, MWSPL-QP-ORG-01), Process specifications (HTSA 1.6, MWSPL-QP-SPEC-01) and Thermocouples &amp; protection tubes (HTSA 3.3, MWSPL-QP-TC-01); the other modules of the CALOR register follow in the same form.</p>
    <div class="grid3">
      <div><b>Furnaces</b><p class="small">F-01 … F-04, continuous gas-fired pushers, identical; hardening chamber 13 trays (5/4/4), controlled cooling chamber, tempering chamber 12 trays (4/4/4).</p></div>
      <div><b>Processes</b><p class="small">F-01 isothermal annealing, hardening &amp; tempering (water quench) · F-02 isothermal annealing, normalizing, hardening &amp; tempering (oil quench) · F-03, F-04 isothermal annealing, normalizing.</p></div>
      <div><b>Line</b><p class="small">Time through the line = 13 × push + 18 min transfer + 12 × push · HK trays max. 200 kg · every lot shot blasted.</p></div>
    </div></section>
  ${orgCard}
  ${specCard}
  ${tcCard}
  <section class="panel"><h2>How the modules connect</h2>
    <p class="small muted">Process specifications are the controlled recipes. Production, load build, the SCADA review, hardness testing and the control plan read the revision in force; the HT organization module names who may approve them (holder and deputy of the heat treat position and of positions marked authorized), and the Specifications approval gate uses that list. Until the other modules join this application, the Specifications module reads their CALOR records in this browser (authorized names, parts produced in the last 90 days) when they exist. The Thermocouples module holds the elements behind every SCADA zone reading (TC-01 … TC-06 per chamber, odd = right wall, even = left wall): their calibration, SAT and protection tubes; it can take over the CALOR SAT register of this browser.</p></section>`;

shellRoute();
