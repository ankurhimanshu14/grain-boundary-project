<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CALOR Quality System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* CALOR Quality System: design system (tokens and components of the MWSPL Integrated Quality System, UI/UX Reuse Handover §4).
   Rebrand by changing the tokens only; keep the three :root blocks (light, media-query dark, forced dark) in sync. */
:root{
  --bg:#f1f3f1;--panel:#ffffff;--sunk:#e7eae7;--ink:#1a2026;--muted:#5a6570;--line:#d3d8d5;
  --accent:#1d5b78;--accent-2:#e1edf2;--on-accent:#ffffff;
  --ok:#1f7a45;--ok-bg:#dff1e5;--warn:#8a5a00;--warn-bg:#fbefd5;--bad:#b02a2a;--bad-bg:#f8dede;
  --f-display:"Barlow Semi Condensed",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111518;--panel:#191f23;--sunk:#222a2f;--ink:#e2e7ea;--muted:#96a2aa;--line:#2c353b;
  --accent:#74b5d2;--accent-2:#1b2f39;--on-accent:#0d1a20;
  --ok:#6fcf97;--ok-bg:#16301f;--warn:#e8b45a;--warn-bg:#33270f;--bad:#f08a8a;--bad-bg:#3a1a1a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111518;--panel:#191f23;--sunk:#222a2f;--ink:#e2e7ea;--muted:#96a2aa;--line:#2c353b;
  --accent:#74b5d2;--accent-2:#1b2f39;--on-accent:#0d1a20;
  --ok:#6fcf97;--ok-bg:#16301f;--warn:#e8b45a;--warn-bg:#33270f;--bad:#f08a8a;--bad-bg:#3a1a1a;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0}
h2{font-size:20px}h3{font-size:16px}
a{color:var(--accent)}
.mono,code{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}.small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* page */
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
.brand .co{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-size:26px;line-height:1.1}
.ctrl{display:grid;grid-template-columns:repeat(4,auto);border:1px solid var(--line);font-size:12px;background:var(--panel)}
.ctrl>div{padding:4px 10px;border-right:1px solid var(--line)}.ctrl>div:last-child{border-right:0}
.ctrl b{display:block;font-weight:500;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.hdr-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* navigation */
nav.sys{background:var(--bg);border-bottom:1px solid var(--line)}
nav.sys .wrap{display:flex;gap:4px;flex-wrap:wrap;padding-top:8px}
nav.sys a{font-family:var(--f-display);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);padding:7px 14px;border:1px solid var(--line);border-top:3px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:var(--panel)}
nav.sys a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav#nav{background:var(--panel);border-top:3px solid var(--accent);border-bottom:1px solid var(--line)}
nav#nav .wrap{display:flex;gap:6px 18px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pd{font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--on-accent);background:var(--accent);border-radius:3px;padding:1px 6px;margin-right:2px}
.grp a{font-family:var(--f-display);font-weight:600;font-size:14.5px;text-decoration:none;color:var(--ink);padding:4px 9px;border-radius:4px}
.grp a:hover{background:var(--sunk)}
.grp a[aria-current="page"]{background:var(--accent-2);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

/* layout helpers */
main.wrap{padding-top:18px;padding-bottom:40px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}.between{justify-content:space-between}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.row>h2,.row>h3{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.panel>h3{margin-bottom:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.fields .wide{grid-column:1/-1}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--ink)}
a.tile:hover{border-color:var(--accent)}
.tile .k{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1}
.tile.ok .v{color:var(--ok)}.tile.warn .v{color:var(--warn)}.tile.bad .v{color:var(--bad)}

/* status */
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.acc{background:var(--accent-2);color:var(--accent)}
.banner{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel);border-radius:4px;padding:8px 12px}
.banner.warn{border-left-color:var(--warn);background:var(--warn-bg)}.banner.bad{border-left-color:var(--bad);background:var(--bad-bg)}.banner.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.verdict{font-family:var(--f-display);font-weight:700;font-size:22px}
.verdict.acc{color:var(--ok)}.verdict.cond{color:var(--warn)}.verdict.rej{color:var(--bad)}
ul.issues{margin:6px 0 0;padding-left:18px}ul.issues li{margin:2px 0}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.c,th.c{text-align:center}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0}

/* forms */
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px}
label.f>span{font-size:12px;color:var(--muted)}
label.f.req>span::after{content:" *";color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk);color:var(--muted)}
textarea{min-height:60px;resize:vertical}
.chk{display:inline-flex;gap:6px;align-items:center;margin-right:14px;font-size:13.5px}.chk input{width:auto}
.grid-in{display:grid;grid-template-columns:150px repeat(3,minmax(70px,1fr));gap:6px 10px;align-items:center}
.grid-in .h{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* buttons */
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--ink)}
button.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{color:var(--bad);border-color:var(--bad)}button.danger.armed{background:var(--bad);color:#fff}
button.link{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
button:disabled{opacity:.5;cursor:not-allowed}
body.ro .w{display:none!important}

/* charts */
.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:160px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:10px;background:var(--accent);border-radius:2px}

/* PDCA strip */
.pdca{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pdca>div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.pdca .ph{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent)}

/* overlay */
#modal{position:fixed;inset:0;background:rgba(10,14,16,.5);z-index:50;overflow:auto;padding:24px 12px}
#modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:980px;margin:0 auto;padding:16px 18px}
.sheet h2{margin-bottom:6px}
fieldset{border:1px solid var(--line);border-radius:6px;margin:12px 0 0;padding:10px 12px}
legend{font-family:var(--f-display);font-weight:600;font-size:15px;padding:0 6px}
.sticky-foot{position:sticky;bottom:-16px;background:var(--panel);border-top:1px solid var(--line);margin:14px -18px -16px;padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.sticky-foot .msg{margin-right:auto;font-size:13px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}

/* documentation viewer */
.docs{display:grid;grid-template-columns:280px 1fr;gap:16px}
.doclist{display:flex;flex-direction:column;gap:2px}
.doclist button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:4px;font-size:13px}
.doclist button[aria-current="true"]{background:var(--accent-2);color:var(--accent);font-weight:600}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;overflow-x:auto}
.doc h1{font-size:15px;color:var(--muted);letter-spacing:.08em}.doc h2{font-size:21px;margin:6px 0 10px}.doc h3{font-size:17px;margin:16px 0 6px}.doc h4{font-size:15px;margin:12px 0 4px}
.doc table{margin:8px 0;font-size:13px}.doc th{position:static}
.doc pre{background:var(--sunk);padding:10px;border-radius:4px;overflow-x:auto;font-size:12px;line-height:1.35}
.doc ul{padding-left:20px}

/* empty state */
.empty{text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:32px 16px}
.empty p{color:var(--muted)}

/* responsive */
@media (max-width:860px){.grid3{grid-template-columns:1fr 1fr}.docs{grid-template-columns:1fr}}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.pdca{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.ctrl{grid-template-columns:repeat(2,auto)}.ctrl>div:nth-child(2){border-right:0}.grid3{grid-template-columns:1fr}.grid-in{grid-template-columns:110px repeat(3,minmax(60px,1fr))}}
@media (max-width:520px){.brand h1{font-size:21px}.tile .v{font-size:26px}.bar{grid-template-columns:110px 1fr 34px}}
@media print{nav.sys,nav#nav,.w,#toast,button{display:none!important}body{background:#fff}.panel,.tw{border-color:#999}}
/* printing a record sheet (job card, evidence): only the sheet's #jobcard */
@media print{body.pm>*:not(#modal){display:none!important}body.pm #modal{position:static;background:none;padding:0;overflow:visible}
  body.pm .sheet{border:0;max-width:none;padding:0}body.pm .sheet>*:not(#jobcard):not(:first-child){display:none!important}body.pm #jobcard{display:block!important}}
/* temperature–time sketch on the job card */
figure.prof{margin:6px 0 10px}figure.prof svg{width:100%;height:auto;display:block;max-width:900px}
@media print{figure.prof{break-inside:avoid}}
/* organization chart: nested lists with connectors */
.orgtree{padding:12px;min-width:max-content}
.orgtree ul{display:flex;justify-content:center;gap:0;padding-top:16px;position:relative;margin:0;padding-left:0;list-style:none}
.orgtree>ul{padding-top:0}
.orgtree li{position:relative;padding:16px 6px 0;text-align:center;list-style:none}
.orgtree li::before,.orgtree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:16px;border-top:1px solid var(--line)}
.orgtree li::after{right:auto;left:50%;border-left:1px solid var(--line)}
.orgtree li:only-child::before,.orgtree li:only-child::after{display:none}.orgtree li:only-child{padding-top:0}
.orgtree li:first-child::before,.orgtree li:last-child::after{border:0}
.orgtree li:last-child::before{border-right:1px solid var(--line);border-radius:0 4px 0 0}.orgtree li:first-child::after{border-radius:4px 0 0 0}
.orgtree ul ul::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:1px solid var(--line)}
.orgtree>ul>li{padding-top:0}.orgtree>ul>li::before,.orgtree>ul>li::after{display:none}
.orgtree .node{display:inline-flex;flex-direction:column;gap:2px;align-items:center;min-width:130px;max-width:190px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;white-space:normal}
.orgtree .node:hover{border-color:var(--accent)}
.orgtree .node.ht{border:2px solid var(--accent);background:var(--accent-2)}
.orgtree .node.vac{border-style:dashed;color:var(--muted)}
@media print{.orgtree .node{break-inside:avoid}}

</style></head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="co">Mass Wire and Steels Pvt. Ltd. · Bhiwadi</div><h1 id="apptitle">CALOR</h1></div>
  <div class="hdr-r"><div class="ctrl" id="ctrl" aria-label="Document control"></div><button id="themeBtn" type="button" aria-label="Toggle colour theme">Theme</button></div>
</div></header>
<nav class="sys" aria-label="Modules"><div class="wrap">
  <a href="#home" data-sys="home">Overview</a>
  <a href="#org/dash" data-sys="org">HT organization</a>
  <a href="#spec/dash" data-sys="spec">Specifications</a>
  <a href="#tc/dash" data-sys="tc">Thermocouples</a>
</div></nav>
<nav id="nav" aria-label="Module views" hidden></nav>
<main id="main" class="wrap"></main>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ---------- shell: module table, routing, theme ---------- */
const MODS=["org","spec","tc"];                           /* every module code; add new modules here (and in nav.sys, SYS, build.py) */
const today0=()=>{const d=new Date();return `${String(d.getDate()).padStart(2,"0")}-${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}-${d.getFullYear()}`;};
const SYS={
  home:{t:"CALOR · Heat treat quality system",ctrl:()=>`<div><b>Standard</b>AIAG CQI-9 4th Ed.</div><div><b>Scope</b>Pusher furnaces F-01 … F-04</div><div><b>Records</b><span id="dbstate">—</span></div><div><b>Date</b>${today0()}</div>`},
  org:{t:"Heat treat organization",ctrl:()=>`<div><b>Procedure</b>MWSPL-QP-ORG-01</div><div><b>Standard</b>CQI-9 · HTSA 1.1</div><div><b>Records</b><span id="dbstate">Connecting…</span></div><div><b>Date</b>${today0()}</div>`},
  spec:{t:"Process specifications",ctrl:()=>`<div><b>Procedure</b>MWSPL-QP-SPEC-01</div><div><b>Standard</b>CQI-9 · HTSA 1.6</div><div><b>Records</b><span id="dbstate">Connecting…</span></div><div><b>Date</b>${today0()}</div>`},
  tc:{t:"Thermocouples & protection tubes",ctrl:()=>`<div><b>Procedure</b>MWSPL-QP-TC-01</div><div><b>Standard</b>CQI-9 · HTSA 3.3</div><div><b>Records</b><span id="dbstate">Connecting…</span></div><div><b>Date</b>${today0()}</div>`}
};
const appOf=h=>{const m=String(h||"").match(/^#([a-z]+)(?:\/|$)/);return m&&MODS.includes(m[1])?m[1]:"home";};
const MWS={
  app:appOf(location.hash),docs:{},
  /* the location a module sees: only its own part of the hash (#view); setting it writes #<mod>/view */
  loc(mod){return {
    get hash(){const m=location.hash.match(new RegExp("^#"+mod+"/?(.*)$"));return m&&m[1]?"#"+m[1]:"";},
    set hash(v){location.hash="#"+mod+"/"+String(v||"").replace(/^#/,"");},
    get href(){return location.href;},reload(){location.reload();}};},
  /* a module's data changed while another page is shown: refresh the Overview */
  bg(){if(MWS.app==="home"&&typeof renderHome==="function"){clearTimeout(MWS._bg);MWS._bg=setTimeout(renderHome,120);}},
  toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(MWS._t);MWS._t=setTimeout(()=>el.classList.remove("on"),2600);}
};
function shellRoute(){
  const prev=MWS.app;MWS.app=appOf(location.hash);
  if(prev!==MWS.app&&MWS[prev]&&MWS[prev].closeModal){try{MWS[prev].closeModal();}catch(e){}}
  const S=SYS[MWS.app];document.getElementById("apptitle").textContent=S.t;document.getElementById("ctrl").innerHTML=S.ctrl();
  document.title=(MWS.app==="home"?"":S.t+" · ")+"CALOR Quality System";
  document.querySelectorAll("nav.sys a").forEach(a=>{if(a.dataset.sys===MWS.app)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  document.getElementById("nav").hidden=MWS.app==="home";
  if(MWS.app==="home"){document.getElementById("nav").innerHTML="";if(typeof renderHome==="function")renderHome();}
}
addEventListener("hashchange",shellRoute,true);
/* inside a module, links are written #view: rewrite them to #<mod>/view (capture phase, before the module sees the click) */
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href^='#']");if(!a||MWS.app==="home")return;
  const h=a.getAttribute("href");if(h==="#home"||/^#[a-z]+\//.test(h)||a.closest("nav.sys"))return;
  e.preventDefault();location.hash="#"+MWS.app+"/"+h.slice(1);},true);
/* theme: automatic, with a manual override kept per browser */
(function(){let t=null;try{t=localStorage.getItem("mws-theme");}catch(e){}if(t)document.documentElement.dataset.theme=t;
  document.getElementById("themeBtn").addEventListener("click",()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("mws-theme",r.dataset.theme);}catch(e){}});})();
const useCap=n=>{try{return window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);}catch(e){return Promise.resolve(null);}};
</script>
<script>MWS.docs={"ORG/00_ORG_Master_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## ORG MODULE: HEAT TREAT ORGANIZATION — MASTER LIST\n\n**Basis:** AIAG CQI-9 4th Edition, HTSA question 1.1 (\"Is there a dedicated and qualified heat treat person on-site?\"): the heat treat person is dedicated, qualified, full-time and on site; the position is shown in the organization chart; a job description identifies the qualifications for the position, including metallurgical and heat treat knowledge; the person has evidence of at least 5 years of heat treat experience or a combination of formal metallurgical education and heat treat experience (minimum to confirm against the controlled copy). IATF 16949 §5.3 (roles and authorities) and §7.2 (competence) as context. PDCA: **Plan** (the organization that runs every other module).\n\n**Application:** CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`) → HT organization. Positions, job descriptions, the organization chart and its approval, people with their qualification and the HTSA 1.1 self-assessment are held there. CALOR's HT organization page (`Organization_Personnel.html`) can be imported into it.\n\n### Documents\n\n| PDCA | Doc. No. | Title | Rev. | Date | File link |\n|---|---|---|---|---|---|\n| P | MWSPL-QP-ORG-01 | Heat treat organization and qualification of the heat treat person | 00 | — | [01_Procedure/MWSPL-QP-ORG-01_Heat_Treat_Organization_and_Qualification.md](01_Procedure/MWSPL-QP-ORG-01_Heat_Treat_Organization_and_Qualification.md) |\n| D | MWSPL-WI-ORG-01 | Appoint and qualify the heat treat person | 00 | — | [02_Work_Instructions/MWSPL-WI-ORG-01_Appoint_and_Qualify_the_Heat_Treat_Person.md](02_Work_Instructions/MWSPL-WI-ORG-01_Appoint_and_Qualify_the_Heat_Treat_Person.md) |\n| P / A | MWSPL-WI-ORG-02 | Organization chart and job descriptions | 00 | — | [02_Work_Instructions/MWSPL-WI-ORG-02_Organization_Chart_and_Job_Descriptions.md](02_Work_Instructions/MWSPL-WI-ORG-02_Organization_Chart_and_Job_Descriptions.md) |\n| P | MWSPL-F-ORG-01 | Job description | 00 | — | [03_Formats/MWSPL-F-ORG-01_Job_Description.md](03_Formats/MWSPL-F-ORG-01_Job_Description.md) |\n| D | MWSPL-F-ORG-02 | Qualification record | 00 | — | [03_Formats/MWSPL-F-ORG-02_Qualification_Record.md](03_Formats/MWSPL-F-ORG-02_Qualification_Record.md) |\n| P | MWSPL-F-ORG-03 | Organization chart approval | 00 | — | [03_Formats/MWSPL-F-ORG-03_Organization_Chart_Approval.md](03_Formats/MWSPL-F-ORG-03_Organization_Chart_Approval.md) |\n| — | — | Module description (application) | — | — | [04_Application/mwspl-org-module.md](04_Application/mwspl-org-module.md) |\n\n### Where each requirement is met\n\n| Requirement (HTSA 1.1) | Met by | Evidence in the application |\n|---|---|---|\n| A heat treat position exists and is filled | QP-ORG-01 §6.1; WI-ORG-01 | One position marked \"heat treat position\"; holder named |\n| Dedicated | QP-ORG-01 §6.1 | Position marked dedicated; the holder holds no other position |\n| Full-time and on site | QP-ORG-01 §6.1 | Position and person full-time and on site |\n| Shown in the organization chart | WI-ORG-02 §1; F-ORG-03 | Reporting line to the chart; chart approved, not changed since, review in date |\n| Job description with the qualifications incl. metallurgical and heat treat knowledge | WI-ORG-02 §2; F-ORG-01 | Approved job description stating education, knowledge, minimum years ≥ 5 |\n| Evidence of ≥ 5 years heat treat experience, or metallurgical education + experience | WI-ORG-01 §2; F-ORG-02 | Qualification record: dated experience entries, service here, metallurgical education |\n\n### First-cycle implementation checklist\n\n- [ ] Confirm the HTSA 1.1 minimum (5 years) against the controlled CQI-9 copy (Settings).\n- [ ] Enter (or import from CALOR) every position with its reporting line; mark the heat treat position, dedicated, and the positions authorized to approve process specifications.\n- [ ] Enter the people with their education, experience and training; appoint the holders and deputies.\n- [ ] Write and approve the job descriptions, starting with the heat treat position (F-ORG-01).\n- [ ] Approve the organization chart (F-ORG-03); post it.\n- [ ] Check that the HTSA 1.1 panel reads Satisfactory; file the evidence pack.\n- [ ] Approve QP-ORG-01, the two WIs and the formats.\n", "ORG/01_Procedure/MWSPL-QP-ORG-01_Heat_Treat_Organization_and_Qualification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## HEAT TREAT ORGANIZATION AND QUALIFICATION OF THE HEAT TREAT PERSON\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Reviewed | Approved | Copy status |\n|---|---|---|---|---|---|---|---|\n| MWSPL-QP-ORG-01 | 00 | — | Director | | | | Uncontrolled until approved |\n\n### 1. Purpose\n\nTo make sure the heat treatment of the plant is in the charge of a dedicated, qualified, full-time heat treat person on site, shown in the organization chart, with a job description that states the qualifications for the position (CQI-9 HTSA 1.1).\n\n### 2. Scope\n\nThe heat treat organization of the Bhiwadi plant: furnaces F-01 to F-04 and the functions around them (production, quality, maintenance, laboratory). The positions of other departments are recorded as far as they appear in the reporting lines.\n\n### 3. References\n\n- AIAG CQI-9 4th Edition, HTSA 1.1 (controlled copy); HTSA 1.6 (authorization to approve process specifications).\n- IATF 16949:2016 §5.3, §7.2.\n- MWSPL-WI-ORG-01, -02; MWSPL-F-ORG-01, -02, -03; MWSPL-QP-SPEC-01.\n\n### 4. Terms and definitions\n\n| Term | Meaning |\n|---|---|\n| Heat treat person | The holder of the one position marked \"heat treat position\" (HT Manager): responsible for the heat treat process and its metallurgical results. |\n| Dedicated | Heat treatment is the main duty of the position, and its holder holds no other position. |\n| Heat treat experience | Months of heat treat work from dated experience entries plus the service in this organization since joining, when that is heat treat work; overlapping periods count once. |\n| Metallurgical education | The years of education in metallurgy (degree or diploma courses marked metallurgical). |\n| Qualified (HTSA 1.1) | Heat treat experience ≥ 5 years, or heat treat experience and metallurgical education together ≥ 5 years, both above zero. |\n\n### 5. Responsibility and authority\n\n| Role | Responsibility | Authority |\n|---|---|---|\n| Director | Appoints the heat treat person and the deputy; approves the organization chart; owns this procedure | Appoint, approve |\n| HR executive | Keeps the qualification records and job descriptions; prepares job descriptions | — |\n| HT Manager (heat treat person) | Runs the heat treat process; approves process specifications (HTSA 1.6); keeps the qualification record up to date | Stop the line, hold and release product, approve specifications |\n| Deputy | Covers absences of the heat treat person | As delegated |\n\n### 6. Procedure\n\n#### 6.1 The heat treat position\n\n1. One position is marked as the heat treat position. It is dedicated, full-time and on site, and it reports to a position in the organization chart.\n2. Its holder meets the qualification of §4 and the job description; a deputy is named to cover absences.\n3. A vacancy or a holder below the minimum is a \"needs immediate action\" finding: the Director appoints a qualified person (WI-ORG-01).\n\n#### 6.2 Organization chart and job descriptions\n\n1. The chart is drawn from the reporting lines of the positions and approved by the Director (F-ORG-03). A change of a title, reporting line, holder, deputy, heat treat flag, full-time, location or dedication, or a position added or removed, needs a new approval. The chart is reviewed every 365 days.\n2. Every position has a job description (F-ORG-01) under document control: approved = locked; a change is a new revision, the approved one stays in force until the new one is approved. The job description of the heat treat position states the metallurgical and heat treat knowledge and at least 5 years of experience.\n\n#### 6.3 Authorization to approve process specifications\n\nThe holder and deputy of the heat treat position, and of positions marked \"authorized to approve process specifications\", may approve process specifications (MWSPL-QP-SPEC-01). The application gives this list to the Specifications module's approval gate.\n\n### 7. Records\n\n| Record | Kept in | Retention |\n|---|---|---|\n| Positions and job descriptions with revisions | Application → Positions | While the position exists + 3 years |\n| Organization chart approvals | Application → Organization chart / Changes | 3 years |\n| Qualification records | Application → People; certificates in the HR file | Employment + 3 years |\n| HTSA 1.1 evidence pack | Printed from the application | Until the next assessment |\n\n### 8. Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue | |\n", "ORG/02_Work_Instructions/MWSPL-WI-ORG-01_Appoint_and_Qualify_the_Heat_Treat_Person.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## APPOINT AND QUALIFY THE HEAT TREAT PERSON\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-ORG-01 | 00 | — | Director, HR executive | | |\n\n### 1. Record the person\n\n| Step | Action | Who |\n|---|---|---|\n| 1.1 | Application → HT organization → People → \"Add a person\": name, employee no., full-time, on site, joining date. Tick \"Work here since joining is heat treat work\" when the job here is heat treatment. | HR executive |\n| 1.2 | Education: one line per qualification; tick \"Metallurgical\" for metallurgy degrees / diplomas and give the duration in years. | HR executive |\n| 1.3 | Experience: one line per earlier job with start and end month; tick \"Heat treat work\" for heat treatment jobs. The certificate or letter number is optional. | HR executive |\n| 1.4 | Training: CQI-9, pyrometry, metallurgy courses. | HR executive |\n\n### 2. Check the qualification\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | The record shows the heat treat experience, the metallurgical education and whether the HTSA 1.1 minimum is met. | Application |\n| 2.2 | Below the minimum: the person cannot be the heat treat person; choose another person or record missing experience with evidence. | Director |\n\n### 3. Appoint\n\n| Step | Action | Who |\n|---|---|---|\n| 3.1 | Open the heat treat position (HT Manager); choose the holder and a deputy; check full-time, on site, dedicated. | Director |\n| 3.2 | The holder must not hold another position. | Director |\n| 3.3 | Save: the chart is marked changed; approve the new chart revision (WI-ORG-02 §1). | Director |\n| 3.4 | Print the HTSA 1.1 evidence pack and file it. | HR executive |\n", "ORG/02_Work_Instructions/MWSPL-WI-ORG-02_Organization_Chart_and_Job_Descriptions.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## ORGANIZATION CHART AND JOB DESCRIPTIONS\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-ORG-02 | 00 | — | Director, HR executive | | |\n\n### 1. Organization chart\n\n| Step | Action | Who |\n|---|---|---|\n| 1.1 | Each position has its \"Reports to\"; the chart is drawn from these lines (Application → Organization chart). | HR executive |\n| 1.2 | Check the chart: the heat treat position outlined, no vacant position that should be filled. | Director |\n| 1.3 | \"Approve the chart\": name and date. The revision number goes up by one (F-ORG-03). | Director |\n| 1.4 | After any change shown as \"changed since approval\", and at least every 365 days, approve again. | Director |\n\n### 2. Job descriptions\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | Open the position; fill purpose, responsibilities, authority, required education, knowledge, minimum years, other requirements, prepared and approved by. For the heat treat position: metallurgical and heat treat knowledge and at least 5 years. | HR executive |\n| 2.2 | \"Approve job description\": the application refuses while anything required is missing. Approved = locked. | Director |\n| 2.3 | To change it: \"New JD revision\", give the reason for the change, edit, approve. The earlier revision stays in force until then; \"Discard JD revision\" drops the draft. | HR executive / Director |\n| 2.4 | Print the job description (F-ORG-01) for the person's file. | HR executive |\n", "ORG/03_Formats/MWSPL-F-ORG-01_Job_Description.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## JOB DESCRIPTION\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-ORG-01 | 00 | Application → Positions (\"Print JD\") |\n\n| Field | Entry |\n|---|---|\n| Position / department / reports to | |\n| Holder / deputy | |\n| Full-time / on site / dedicated / heat treat position | |\n| Purpose | |\n| Responsibilities | |\n| Authority | |\n| Required education | |\n| Metallurgical and heat treat knowledge | |\n| Minimum heat treat experience (years) | |\n| Other requirements | |\n| Revision / reason for the change | |\n| Prepared by / approved by / date | |\n", "ORG/03_Formats/MWSPL-F-ORG-02_Qualification_Record.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## QUALIFICATION RECORD\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-ORG-02 | 00 | Application → People (\"Print qualification record\") |\n\n**Person:** ____________ **Employee no.:** ______ **Joined:** ________ **Full-time / on site:** ______\n\n| Education | Field | Institute | Year | Years | Metallurgical | Reference |\n|---|---|---|---|---|---|---|\n| | | | | | | |\n\n| Experience: organization | Role | From | To | Heat treat work | Reference |\n|---|---|---|---|---|---|\n| | | | | | |\n\n| Training / certificate | Date | Provider | Reference |\n|---|---|---|---|\n| | | | |\n\nHeat treat experience: ____ yr · Metallurgical education: ____ yr · HTSA 1.1 minimum (5 yr): met / not met\n", "ORG/03_Formats/MWSPL-F-ORG-03_Organization_Chart_Approval.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## ORGANIZATION CHART APPROVAL\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-ORG-03 | 00 | Application → Organization chart (evidence print) and Changes (approval history) |\n\n| Chart revision | Date approved | Approved by | Reason (change / periodic review) |\n|---|---|---|---|\n| | | | |\n\nThe chart itself is the printed tree of positions, holders and deputies with the heat treat position marked.\n", "ORG/04_Application/mwspl-org-module.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## ORG MODULE: APPLICATION DESCRIPTION\n\nThe module runs in the CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`, \"HT organization\"). Source: `QMS/ORG/04_Application/mwspl-org-module.js`; build `python QMS/00_Integrated_Application/build.py`. The rules are copied from the CALOR page `Organization_Personnel.html` (its HTSA 1.1 part); the documents of this module must match them.\n\n| Item | Value in the code |\n|---|---|\n| Records | collections `positions` (`POS-nn`), `people` (`P-nnn`), `config/settings` (plant, minYears 5, reviewDays 365), `config/chart` (rev, apprDate, appr, dirty, log); shared record store (prefix `org-`) or this browser (`mws-org-local-v1`) |\n| Position | title, department, reports to, holder, deputy, full-time / part-time, on / off site, heat treat position (one only), dedicated, authorized to approve process specifications, job description `jd` with revisions |\n| Job description gate `jdMissing` | purpose, responsibilities, education, minimum years, prepared / approved by, reason for a change after rev 0; heat treat position also knowledge and minimum ≥ 5 years |\n| Organization chart | from the reporting lines (loops refused); approval with revision; structural change after approval marks it changed; review after 365 days |\n| Qualification `qual` | heat treat experience = dated heat treat entries + service here since joining (when ticked), overlaps once; metallurgical education = years of entries marked metallurgical; met when ≥ 5 years or both together ≥ 5 with both > 0 |\n| HTSA 1.1 `assess` | heat treat position defined and filled, dedicated, full-time, on site, in the approved chart, approved job description with education / knowledge / minimum years, holder qualified, deputy as a note; score needs immediate action (no position, vacant, holder below the minimum), not satisfactory, satisfactory |\n| Link to SPEC | `MWS.org.authorized()` (holder and deputy of the heat treat position and of authorized positions) is the Specifications module's list of approvers |\n| Data | export / import JSON, people CSV, import from CALOR (`org-reg`), starter set-up, clear all |\n| Not here (CALOR only) | HTSA 1.17 key functions (primary / backup, key function list) |\n", "SPEC/00_SPEC_Master_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPEC MODULE: PROCESS SPECIFICATIONS — MASTER LIST\n\n**Basis:** AIAG CQI-9 4th Edition, HTSA question 1.6 (\"a documented system to create process specifications for all active processes\") and the Process Tables (Table A hardening & tempering, Table E annealing / normalizing; table letters to be confirmed against the controlled copy). IATF 16949 §8.5.1 (control plan, work instructions at the line) and §8.5.6 (control of changes) as context. PDCA: **Plan** (the specification is the plan for every heat treatment).\n\n**Application:** CALOR → PROCESS → Specifications (`Process_Specifications.html`). The register, approvals, revisions, job cards and the HTSA 1.6 self-assessment are held there. Pilot of the integrated application: the same module in `QMS/00_Integrated_Application/calor-quality-system.html` (see the module description).\n\n### Documents\n\n| PDCA | Doc. No. | Title | Rev. | Date | File link |\n|---|---|---|---|---|---|\n| P | MWSPL-QP-SPEC-01 | Process specifications | 00 | — | [01_Procedure/MWSPL-QP-SPEC-01_Process_Specifications.md](01_Procedure/MWSPL-QP-SPEC-01_Process_Specifications.md) |\n| P / D | MWSPL-WI-SPEC-01 | Write and approve a process specification | 00 | — | [02_Work_Instructions/MWSPL-WI-SPEC-01_Write_and_Approve_a_Specification.md](02_Work_Instructions/MWSPL-WI-SPEC-01_Write_and_Approve_a_Specification.md) |\n| A | MWSPL-WI-SPEC-02 | Change a specification: new revision, implementation, obsolete | 00 | — | [02_Work_Instructions/MWSPL-WI-SPEC-02_Change_a_Specification.md](02_Work_Instructions/MWSPL-WI-SPEC-02_Change_a_Specification.md) |\n| C | MWSPL-WI-SPEC-03 | Periodic review and HTSA 1.6 self-assessment | 00 | — | [02_Work_Instructions/MWSPL-WI-SPEC-03_Periodic_Review_and_Self-Assessment.md](02_Work_Instructions/MWSPL-WI-SPEC-03_Periodic_Review_and_Self-Assessment.md) |\n| P | MWSPL-F-SPEC-01 | Process specification (content and layout) | 00 | — | [03_Formats/MWSPL-F-SPEC-01_Process_Specification.md](03_Formats/MWSPL-F-SPEC-01_Process_Specification.md) |\n| A | MWSPL-F-SPEC-02 | Specification change review | 00 | — | [03_Formats/MWSPL-F-SPEC-02_Change_Review.md](03_Formats/MWSPL-F-SPEC-02_Change_Review.md) |\n| P | MWSPL-F-SPEC-03 | Authorization to approve process specifications | 00 | — | [03_Formats/MWSPL-F-SPEC-03_Authorization_List.md](03_Formats/MWSPL-F-SPEC-03_Authorization_List.md) |\n| C | MWSPL-F-SPEC-04 | Specification register and periodic review record | 00 | — | [03_Formats/MWSPL-F-SPEC-04_Register_and_Review.md](03_Formats/MWSPL-F-SPEC-04_Register_and_Review.md) |\n| C / A | MWSPL-F-SPEC-05 | SPEC KPIs | 00 | — | [03_Formats/MWSPL-F-SPEC-05_KPI.md](03_Formats/MWSPL-F-SPEC-05_KPI.md) |\n| — | — | Module description (application) | — | — | [04_Application/mwspl-spec-module.md](04_Application/mwspl-spec-module.md) |\n\n### Where each requirement is met\n\n| Requirement (HTSA 1.6, as checked by CALOR `assess16`) | Met by | Evidence in CALOR |\n|---|---|---|\n| Authorization to establish process specifications is defined | QP-SPEC-01 §5, §6.1; F-SPEC-03 | HT organization page: HT position and positions marked \"authorized to approve process specifications\" |\n| The responsible heat treat person (HTSA 1.1) is authorized | QP-SPEC-01 §5 | HTSA 1.6 panel item (warning if not) |\n| Specifications approved by an authorized person | WI-SPEC-01 step 4.3; F-SPEC-01 §9 | Approval gate refuses a non-authorized approver |\n| Written process specifications for all active processes | QP-SPEC-01 §6.1, §6.3; WI-SPEC-03 §2 | Parts produced on the Daily production page in the last 90 days checked per furnace |\n| All steps with their parameters and operating tolerances | F-SPEC-01 §4–§7; WI-SPEC-01 §3 | Steps table of each specification; approval gate |\n| Available as work instruction, job card or recipe | QP-SPEC-01 §6.2; WI-SPEC-01 §5 | \"Form at the line\" field; job card printed from the register |\n| Changes reviewed for continued conformity with customer requirements | WI-SPEC-02 §2; F-SPEC-02 | Change review fields, required for every revision after rev 0 |\n| Changes documented with the date implemented and the approver | WI-SPEC-02 §3 | \"Record implementation\"; not recorded within 7 days of approval = not met |\n| Periodic review | WI-SPEC-03 §1; F-SPEC-04 | Review due 365 days after the approval of the revision in force |\n\n### First-cycle implementation checklist\n\n- [ ] Mark the authorized positions on the HT organization page (holder and deputy of the HT position count automatically); print F-SPEC-03.\n- [ ] Confirm Settings → Processes per furnace (F-01: IA, HT · F-02: IA, NORM, HT · F-03 / F-04: IA, NORM) and the defaults (tolerances, quench delay 30 s, dip 8.5 ± 0.5 min, transfer 18 min).\n- [ ] Clear the example data; write a specification for every part produced in the last 90 days, per furnace (WI-SPEC-01).\n- [ ] Approve them; record the implementation date within 7 days; print the job cards for the control panels.\n- [ ] Check the HTSA 1.6 panel reads Satisfactory; file the HTSA 1.6 evidence PDF.\n- [ ] Approve QP-SPEC-01, the three WIs and the formats; train the HT Engineer, HT Manager and shift supervisors (Procedures & WIs page).\n- [ ] Start the KPI format F-SPEC-05 for the financial year.\n", "SPEC/01_Procedure/MWSPL-QP-SPEC-01_Process_Specifications.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PROCESS SPECIFICATIONS\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Reviewed | Approved | Copy status |\n|---|---|---|---|---|---|---|---|\n| MWSPL-QP-SPEC-01 | 00 | — | HT Manager | | | | Uncontrolled until approved |\n\n### 1. Purpose\n\nTo establish, approve, make available, change and review a written process specification for every part and process heat treated, so that every tray is processed to defined parameters with operating tolerances (CQI-9 HTSA 1.6).\n\n### 2. Scope\n\n- **Site:** Bhiwadi, heat treatment shop (the only site in scope).\n- **Equipment:** continuous gas-fired pusher furnaces F-01 to F-04 (hardening chamber 3 zones / 13 tray positions; controlled cooling chamber; tempering chamber 3 zones / 12 tray positions).\n- **Processes:** hardening & tempering (HT: F-01 water quench, F-02 oil quench), isothermal annealing (IA: all furnaces), normalizing (NORM: F-02, F-03, F-04). Full annealing is not yet covered by a specification.\n- **Not in scope:** the steel supplier's and the customer's own specifications (they are inputs).\n\n### 3. References\n\n- AIAG CQI-9 4th Edition, HTSA 1.6 and Process Tables A / E (controlled copy).\n- IATF 16949:2016 §8.5.1, §8.5.6; customer-specific requirements.\n- MWSPL-WI-SPEC-01, -02, -03; MWSPL-F-SPEC-01 to -05.\n- WI-HT-01 General operating procedure; Control plans and PFMEAs (CALOR → CP & PFMEA); SOP-QA-12 Rework.\n\n### 4. Terms and definitions\n\n| Term | Meaning |\n|---|---|\n| Process specification (spec) | The controlled record of how one part is heat treated by one process: part data, approved furnaces, loading, zone set values with tolerances, push time, quench / controlled cooling / transfer, after-exit cooling and the product requirements and testing. Number PS-nnnn, revision 0, 1, 2 … |\n| Revision in force | The last approved revision. A new revision in draft does not replace it until approved. |\n| Job card | The one-page print of the revision in force for the line (part, set values, push, quench / cooling, requirements). |\n| Active process | A part produced on a furnace in the last 90 days (Daily production page). |\n| Authorized person | A person allowed to approve specifications: the holder and deputy of the heat treat position (HTSA 1.1) and of the positions marked as authorized on the HT organization page. |\n| Operating tolerance | ± value, maximum or range within which a parameter must be held at the line. |\n\n### 5. Responsibility and authority\n\n| Role | Responsibility | Authority |\n|---|---|---|\n| HT Engineer | Prepares specifications and revisions; gathers customer requirements; validation trial | Prepare, propose changes |\n| HT Manager (heat treat person, HTSA 1.1) and deputy | Reviews and approves; decides on changes; owns this procedure | Approve, make obsolete |\n| Other authorized positions (marked on the HT organization page) | Approve within their authorization | Approve |\n| Quality Manager | Reviews product requirements, sampling and customer notification; control plan / PFMEA alignment | Customer notification |\n| Shift supervisor | Uses only the job card of the revision in force; records the implementation | Stop the line if no valid job card |\n| Director | Provides the authorization structure (HT organization) | — |\n\n### 6. Procedure\n\n```\n        +-------------------------------+\n        |  PLAN  6.1                    |\n        |  authorization, processes per |\n        |  furnace, write the spec      |\n        +---------------+---------------+\n                        |\n                        v\n+-------------------+   approve    +-------------------------------+\n|  ACT  6.4         |<-------------|  DO  6.2                      |\n|  new revision,    |              |  job card at the line,        |\n|  change review,   |              |  implementation recorded      |\n|  obsolete         |              +---------------+---------------+\n+---------+---------+                              |\n          ^                                        v\n          |                        +-------------------------------+\n          +------------------------|  CHECK  6.3                   |\n                                   |  periodic review, active parts|\n                                   |  vs specs, HTSA 1.6 score     |\n                                   +-------------------------------+\n```\n\n#### 6.1 PLAN\n\n1. The authorized persons are defined on the HT organization page (F-SPEC-03 is its printout). The heat treat person (HTSA 1.1) must be among them.\n2. The processes each furnace runs are kept in the Specifications page settings (\"Processes per furnace\"). A specification cannot be approved for a furnace that does not run its process.\n3. The HT Engineer writes the specification (MWSPL-WI-SPEC-01) with every step and its operating tolerance (F-SPEC-01): loading (pieces per tray, loading pattern), push time ± tolerance, the set value ± tolerance of each zone of both chambers, quench (medium, temperature range, delay maximum, dip time ±, agitation, transfer maximum) or controlled cooling (time ±, method, target ±) or transfer, after-exit cooling, and the product requirements (hardness range and scale, core, microstructure, decarburization limit, grain size, sampling, method).\n4. The page calculates the time per zone, the time between the chambers and the time through the line from the line layout (5 / 4 / 4 and 4 / 4 / 4 positions; transfer 18 min measured; controlled cooling cycle for isothermal annealing, which must end before the next push) and gives line-practice advice; any critical advice blocks the approval.\n\n#### 6.2 DO\n\n1. An authorized person approves the specification after the approval gate shows nothing missing (part data, furnaces, all steps with tolerances, hardness scale, decarburization limit, where it is available at the line, prepared / reviewed / approved by, approval date; for a revision also the reason and the change review). Approved = locked.\n2. The specification is made available at the line as a work instruction, a job card (printed from the register) or a computer-based recipe (SCADA / PLC), as stated in the specification.\n3. The date it was implemented at the line and by whom are recorded (\"Record implementation\") within 7 days of the approval.\n4. Production, hardness testing, load build and control plans use only the revision in force (they read it from the register).\n\n#### 6.3 CHECK\n\n1. **Periodic review:** every specification is reviewed 365 days after the approval of its revision in force (due shown 30 days before) — MWSPL-WI-SPEC-03.\n2. **Active processes:** the parts produced on each furnace in the last 90 days must each have a specification in force approved for that furnace; a part without one is a critical finding.\n3. **HTSA 1.6 self-assessment:** the panel on the Specifications page scores the system Satisfactory / Not satisfactory / Needs immediate action (no specification in force, or an active part without one); it is reviewed monthly with the KPIs (F-SPEC-05).\n\n#### 6.4 ACT\n\n1. Any change (set value, tolerance, push time, quench / cooling, furnace, loading, requirement) is made only by a new revision (MWSPL-WI-SPEC-02). The revision in force stays in use until the new one is approved.\n2. Every revision after rev 0 needs a change review (F-SPEC-02): customer requirements checked, customer notification decision (not required / notified / approved, with the reference), control plan and PFMEA reviewed, validation (trial or first-off result).\n3. A specification no longer used is made obsolete with a reason; only never-approved drafts may be deleted.\n4. Findings of the review and the self-assessment are acted on by the HT Manager; actions are tracked in the KPI format.\n\n### 7. Records\n\n| Record | Format | Retention | Owner |\n|---|---|---|---|\n| Process specification with all revisions | F-SPEC-01 (CALOR register; PDF / Excel per specification) | Life of the part + 1 year (to confirm with the record retention rule) | HT Manager |\n| Change review | F-SPEC-02 (in the revision) | As the specification | HT Manager |\n| Authorization list | F-SPEC-03 (HT organization page) | Current + superseded 3 years | HT Manager |\n| Register and periodic review | F-SPEC-04 (register Excel) | 3 years | HT Engineer |\n| HTSA 1.6 evidence | PDF from the panel | 3 years | Quality Manager |\n| KPIs | F-SPEC-05 | 3 years | HT Manager |\n\n**Application:** CALOR holds the specifications, their revisions (a snapshot of every earlier revision), the approval, change review and implementation data and a dated log of every action in its register (`psr-reg`). The register is kept in the browser and, when linked, as `psr-reg.json` in the Google Drive folder with daily backups. PDF and Excel outputs are made from the page (specification, job card, register, HTSA 1.6 evidence). Paper job cards are uncontrolled copies of the revision in force.\n\n### 8. Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/02_Work_Instructions/MWSPL-WI-SPEC-01_Write_and_Approve_a_Specification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## WRITE AND APPROVE A PROCESS SPECIFICATION\n\n| Doc No. | Rev | Issue date | Parent procedure sections | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SPEC-01 | 00 | — | MWSPL-QP-SPEC-01 §6.1, §6.2 | | |\n\n**Records:** process specification F-SPEC-01 in the CALOR register (PS-nnnn), its log, the job card.\n\n### 1. Before you start\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 1.1 | Collect the inputs: customer drawing and specification (hardness, core, microstructure, decarburization, grain size, sampling), steel grade, part weight, the customer-specific requirements. | HT Engineer |\n| 1.2 | Check that a specification for this part and process does not already exist: CALOR → PROCESS → Specifications, search the register by part no. (a duplicate part + process is flagged). | HT Engineer |\n| 1.3 | Check which furnaces run the process (Settings → Processes per furnace): HT on F-01 (water) / F-02 (oil); IA on all; NORM on F-02, F-03, F-04. | HT Engineer |\n\n### 2. Part data\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 2.1 | Click **New specification**. Enter part no., part name, customer, drawing no., steel grade and process (HT / IA / NORM). | HT Engineer |\n| 2.2 | Tick the approved furnaces. A furnace marked \"(does not run this process)\" cannot be approved. | HT Engineer |\n| 2.3 | Enter the pieces per tray, the part weight (kg) and the tray / fixture. Check the load per tray against the tray maximum (HK trays 200 kg). | HT Engineer |\n\n### 3. Thermal cycle with operating tolerances\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 3.1 | Hardening chamber: set value and ± tolerance of zones 1, 2, 3 (zone 1 preheats; zones 2–3 austenitize above 800 °C for HT / IA; 700–750 °C preheat for NORM). | HT Engineer |\n| 3.2 | Tempering chamber: set value and ± tolerance of zones 1, 2, 3 (tempering / isothermal hold; austenitizing for NORM). | HT Engineer |\n| 3.3 | Push time (min) and its ± tolerance. Read the calculated time per zone, time between the chambers and time through the line shown by the page. | HT Engineer |\n| 3.4 | HT: quench medium (must match the furnace's tank: F-01 water, F-02 oil), quenchant temperature range (both limits), quench delay maximum (default 30 s), dip time and ± tolerance (default 8.5 ± 0.5 min), agitation, transfer maximum. | HT Engineer |\n| 3.5 | IA: controlled cooling time ± tolerance, method, target temperature ± tolerance. The page shows whether the cooling cycle (cooling + transfers) fits in the push time; a cycle that does not fit blocks the approval. | HT Engineer |\n| 3.6 | NORM: transfer time and fan cooling after exit (required / not, time ± tolerance). | HT Engineer |\n| 3.7 | Read the **Steps and parameters** box: every step must show its value with a tolerance, maximum or range. Fill anything listed as missing. | HT Engineer |\n\n### 4. Requirements, review and approval\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 4.1 | Product requirements: hardness min / max and scale, core, microstructure, decarburization limit (required), grain size, other, sampling (quantity and frequency, required), test method. | HT Engineer / Quality Manager |\n| 4.2 | Enter \"prepared by\" and \"reviewed by\"; click **Save draft**. Read the advice (TUS range, quench tank, line practice) and correct where needed. | HT Engineer |\n| 4.3 | The approver opens the draft, checks it against the inputs of step 1.1, enters \"approved by\" (only an authorized person is accepted) and the approval date, and clicks **Approve**. The page lists anything still missing; approval is refused until the list is empty and no critical advice remains. | HT Manager (authorized person) |\n\n### 5. Make it available at the line\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 5.1 | \"Form at the line\": state where it is available (work instruction / job card / SCADA-PLC recipe / other) and its reference. | HT Engineer |\n| 5.2 | Print the **Job card** of the revision in force; put it at the control panel of each approved furnace; remove any older card. For a recipe, load the values into SCADA / PLC and check them against the job card. | Shift supervisor |\n| 5.3 | Click **Record implementation**: date implemented (not before the approval, not in the future) and by whom. Do this within 7 days of the approval. | Shift supervisor / HT Engineer |\n\n### Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/02_Work_Instructions/MWSPL-WI-SPEC-02_Change_a_Specification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## CHANGE A SPECIFICATION: NEW REVISION, IMPLEMENTATION, OBSOLETE\n\n| Doc No. | Rev | Issue date | Parent procedure sections | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SPEC-02 | 00 | — | MWSPL-QP-SPEC-01 §6.2, §6.4 | | |\n\n**Records:** the new revision with its reason and change review (F-SPEC-02), the snapshot of the earlier revision, the implementation date, the log.\n\n### 1. Start a new revision\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 1.1 | Any change to a set value, tolerance, push time, quench / cooling parameter, furnace, loading or requirement needs a new revision. A temporary change at the line is a parameter change on the Daily production page, not a revision; a permanent change is a revision. | HT Manager |\n| 1.2 | Open the approved specification and click **New revision**. The page keeps the approved revision in force and starts a draft rev + 1; the change review and implementation fields are cleared. | HT Engineer |\n| 1.3 | Make the change; enter the **reason for the change**. | HT Engineer |\n| 1.4 | To abandon the change, click **Discard revision**: the revision in force is restored unchanged. | HT Engineer |\n\n### 2. Change review (F-SPEC-02)\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 2.1 | Customer requirements checked: state what was checked (drawing, customer specification, PPAP values) and the result. | HT Engineer |\n| 2.2 | Customer notification decision: not required / customer notified / customer approval obtained (e.g. PPAP); give the reference when notified or approved. | Quality Manager |\n| 2.3 | Tick \"control plan and PFMEA reviewed\" after checking the CP & PFMEA page (regenerate the control plan rows from the new revision if needed). | Quality Manager |\n| 2.4 | Validation: record the trial or first-off result that shows the change works (e.g. trial batch no., hardness range, microstructure). | HT Engineer |\n\n### 3. Approve and implement\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 3.1 | Approve the revision as WI-SPEC-01 step 4.3; the gate also requires the reason and the complete change review. | HT Manager (authorized person) |\n| 3.2 | Replace the job card / recipe at every approved furnace; withdraw the old card. | Shift supervisor |\n| 3.3 | **Record implementation** within 7 days of the approval. After 7 days without it the HTSA 1.6 item \"Changes documented with the date implemented and the approver\" is not met. | Shift supervisor / HT Engineer |\n\n### 4. Make obsolete\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 4.1 | When a part is no longer heat treated (or is replaced by another specification), click **Make obsolete** and give the reason. | HT Manager |\n| 4.2 | Remove its job cards and recipes from the line. | Shift supervisor |\n| 4.3 | Only a draft that was never approved can be deleted (**Delete**); approved and obsolete specifications stay in the register. | HT Engineer |\n\n### Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/02_Work_Instructions/MWSPL-WI-SPEC-03_Periodic_Review_and_Self-Assessment.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PERIODIC REVIEW AND HTSA 1.6 SELF-ASSESSMENT\n\n| Doc No. | Rev | Issue date | Parent procedure sections | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SPEC-03 | 00 | — | MWSPL-QP-SPEC-01 §6.3, §6.4 | | |\n\n**Records:** register Excel with the review dates (F-SPEC-04), HTSA 1.6 evidence PDF, KPI format F-SPEC-05.\n\n### 1. Periodic review of each specification (yearly)\n\n| Step | Activity | Responsibility | Time |\n|---|---|---|---|\n| 1.1 | Open CALOR → PROCESS → Specifications. The tiles show the reviews due (within 30 days) and overdue (365 days after the approval of the revision in force). | HT Engineer | First working day of the month |\n| 1.2 | For each specification due: compare it with the current customer drawing / specification, the hardness and SCADA results of the last year (Hardness, Trend analysis, SCADA review pages) and any customer complaint. | HT Engineer | Before the due date |\n| 1.3 | No change needed: the HT Manager confirms it; record the review on F-SPEC-04 (date, by, result). Change needed: start a new revision (WI-SPEC-02); its approval resets the review date. Note: CALOR has no \"reviewed, no change\" entry for specifications — the register keeps showing the review as overdue until a new revision is approved, so F-SPEC-04 is the record of a review without change (application change requested in the handover note). In the integrated application (pilot) use **Review & HTSA 1.6 → Record review**; it restarts the review date. | HT Manager | Before the due date |\n\n### 2. Active parts without a specification\n\n| Step | Activity | Responsibility | Time |\n|---|---|---|---|\n| 2.1 | Read the HTSA 1.6 panel item \"Written process specifications for all active processes\": it lists every part produced on a furnace in the last 90 days without a specification in force for that furnace. | HT Engineer | Weekly |\n| 2.2 | For each one: write and approve the specification (WI-SPEC-01), or add the furnace to the existing one by a new revision (WI-SPEC-02). Until then the part runs only on the HT Manager's written instruction. | HT Manager | Within 7 days |\n\n### 3. HTSA 1.6 self-assessment\n\n| Step | Activity | Responsibility | Time |\n|---|---|---|---|\n| 3.1 | Read the HTSA 1.6 panel score: Satisfactory / Not satisfactory / Needs immediate action, and each item (authorization, approval by an authorized person, all active processes, steps with tolerances, available at the line, change review, implementation recorded, periodic review). | HT Manager | Monthly |\n| 3.2 | For each item not met, agree the action, owner and date; enter it on F-SPEC-05 (quarterly review). | HT Manager | Monthly |\n| 3.3 | Download **HTSA 1.6 evidence (PDF)** and file it with the month's KPIs; it is the evidence for an internal or customer assessment. | Quality Manager | Monthly |\n\n### Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-01_Process_Specification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PROCESS SPECIFICATION\n\n| Format No. | Rev. | Specification no. | Revision | Status |\n|---|---|---|---|---|\n| MWSPL-F-SPEC-01 | 00 | PS-____ | ___ | Draft / Approved / Obsolete |\n\nThis format is the content of a specification as held in CALOR (Specifications page); the page prints it as the specification PDF and the job card. Use the paper form only when CALOR is not available, then enter it in CALOR.\n\n**Legend:** ± = operating tolerance · max = maximum · range = lower–upper limit · **bold** fields are required for approval.\n\n### 1. Part\n\n| Field | Entry |\n|---|---|\n| **Part no.** / **part name** | |\n| Customer / drawing no. | |\n| **Steel grade** | |\n| **Process** | HT hardening & tempering (CQI-9 Table A) / IA isothermal annealing (Table E) / NORM normalizing (Table E) |\n| **Approved furnaces** | F-01 ☐ F-02 ☐ F-03 ☐ F-04 ☐ (only furnaces that run the process) |\n| **Part weight (kg)** / pieces per tray (max) / tray or fixture | |\n\n### 2. Loading and push\n\n| Step | Parameter | Value | Tolerance |\n|---|---|---|---|\n| Loading | **Pieces per tray** | | max |\n| Loading | Loading pattern / fixture | | set text |\n| Pusher | **Push time (min)** | | ± |\n\n### 3. Hardening chamber (positions 5 / 4 / 4)\n\n| Zone | **Set value (°C)** | **Tolerance (± °C)** |\n|---|---|---|\n| 1 | | |\n| 2 | | |\n| 3 | | |\n\n### 4. Between the chambers (one of)\n\n| Process | Parameter | Value | Tolerance |\n|---|---|---|---|\n| HT | **Quench medium** (F-01 water, F-02 oil) | | set text |\n| HT | **Quenchant temperature (°C)** | | range (both limits) |\n| HT | **Quench delay (s)** | | max |\n| HT | **Dip time (min)** | | ± |\n| HT | Agitation | | set text |\n| HT | **Transfer to the tempering chamber (min)** | | max |\n| IA | **Cooling (air blowing) time (min)** | | ± (cooling + transfers must end before the next push) |\n| IA | Method | | set text |\n| IA | **Target temperature before the tempering chamber (°C)** | | ± |\n| NORM | **Transfer between the chambers (min)** | | max |\n\n### 5. Tempering chamber (positions 4 / 4 / 4)\n\n| Zone | **Set value (°C)** | **Tolerance (± °C)** |\n|---|---|---|\n| 1 | | |\n| 2 | | |\n| 3 | | |\n\n### 6. After exit\n\n| Parameter | Value | Tolerance |\n|---|---|---|\n| Cooling (still air / fan) | | set text |\n| Fan cooling time (min), if required | | ± |\n\n### 7. Product requirements and testing\n\n| Field | Entry |\n|---|---|\n| **Hardness** min – max, **scale** | |\n| Core hardness / microstructure / grain size | |\n| **Decarburization limit** | |\n| **Sampling (quantity and frequency)** / test method | |\n\n### 8. At the line and change control\n\n| Field | Entry |\n|---|---|\n| **Available at the line as** | Work instruction ☐ Job card ☐ SCADA / PLC recipe ☐ Other ☐ · reference: |\n| **Reason for the change** (rev > 0) | |\n| Change review (rev > 0) | F-SPEC-02 |\n| Implemented on / by | |\n\n### 9. Sign-off\n\n| Prepared by | Reviewed by | Approved by (authorized, F-SPEC-03) | Approval date |\n|---|---|---|---|\n| | | | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-02_Change_Review.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPECIFICATION CHANGE REVIEW\n\n| Format No. | Rev. | Specification no. / new revision |\n|---|---|---|\n| MWSPL-F-SPEC-02 | 00 | PS-____ rev ___ |\n\nRequired for every revision after rev 0 before it can be approved (CALOR checks each line). **Legend:** ☐ tick · all lines required.\n\n| No. | Review item | Entry |\n|---|---|---|\n| 1 | Reason for the change | |\n| 2 | What changed (parameter: old → new) | |\n| 3 | Customer requirements checked (drawing, customer specification, PPAP values) and result | |\n| 4 | Customer notification | ☐ Not required: customer requirements not affected ☐ Customer notified ☐ Customer approval obtained (e.g. PPAP) |\n| 5 | Notification / approval reference (when notified or approved) | |\n| 6 | Control plan and PFMEA reviewed (regenerated if needed) | ☐ Yes — control plan no.: ______ PFMEA no.: ______ |\n| 7 | Validation (trial or first-off result) | Batch: ______ Result: ______ |\n\n| Prepared by (HT Engineer) | Notification decision (Quality Manager) | Approved by (authorized) | Date |\n|---|---|---|---|\n| | | | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-03_Authorization_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## AUTHORIZATION TO APPROVE PROCESS SPECIFICATIONS\n\n| Format No. | Rev. | List date |\n|---|---|---|\n| MWSPL-F-SPEC-03 | 00 | |\n\nCopied from the HT organization page (the same names are shown under \"Approved by\" on the Specifications page; there is no separate printout): the holder and deputy of the heat treat position (HTSA 1.1) and of every position marked \"authorized to approve process specifications\". CALOR accepts only these names as \"approved by\". **Legend:** HT = heat treat position · A = marked authorized position.\n\n| No. | Name | Position | Basis (HT / A) | Holder / deputy | Authorized from |\n|---|---|---|---|---|---|\n| 1 | | | HT | Holder | |\n| 2 | | | HT | Deputy | |\n| 3 | | | A | | |\n| 4 | | | A | | |\n| 5 | | | | | |\n\n| Issued by (Director / HT Manager) | Date | Next review |\n|---|---|---|\n| | | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-04_Register_and_Review.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPECIFICATION REGISTER AND PERIODIC REVIEW RECORD\n\n| Format No. | Rev. | Period |\n|---|---|---|\n| MWSPL-F-SPEC-04 | 00 | FY ______ |\n\nThe register itself is the CALOR Specifications register (Excel download: \"Download register (Excel)\"). This sheet records the yearly review of each specification in force, including reviews without a change (MWSPL-WI-SPEC-03 §1). **Legend:** Result NC = no change needed · RV = new revision started (number) · OB = made obsolete.\n\n| PS no. | Rev in force | Part no. | Process | Furnaces | Approved on | Review due | Reviewed on | By | Result (NC / RV / OB) | Remarks |\n|---|---|---|---|---|---|---|---|---|---|---|\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n\n| Reviewed by (HT Manager) | Date |\n|---|---|\n| | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-05_KPI.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPEC KPIs\n\n| Format No. | Rev. | Financial year |\n|---|---|---|\n| MWSPL-F-SPEC-05 | 00 | FY ______ (April–March assumed, to confirm) |\n\n**Source:** CALOR → Specifications (tiles and HTSA 1.6 panel), read on the first working day of each month. **Targets are provisional** (Section 3 of the handover note) until the HT Manager sets them.\n\n### 1. Monthly grid\n\n| Code | KPI | Target | Apr | May | Jun | Jul | Aug | Sep | Oct | Nov | Dec | Jan | Feb | Mar | YTD |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| SPEC-1 | Active part / furnace combinations without a specification in force | 0 | | | | | | | | | | | | | |\n| SPEC-2 | Specifications with the periodic review overdue | 0 | | | | | | | | | | | | | |\n| SPEC-3 | Revisions approved in the month | — (record) | | | | | | | | | | | | | |\n| SPEC-4 | Revisions without the implementation recorded within 7 days | 0 | | | | | | | | | | | | | |\n| SPEC-5 | Revisions in force with an incomplete change review | 0 | | | | | | | | | | | | | |\n| SPEC-6 | Drafts waiting for approval longer than 30 days | 0 | | | | | | | | | | | | | |\n| SPEC-7 | HTSA 1.6 score (S / NS / NIA) | S | | | | | | | | | | | | | |\n\nYTD: SPEC-3 = sum; the others = the last month's value.\n\n### 2. Current position (at the date of the review)\n\n| Specifications in force | Parts covered | Drafts | Reviews due within 30 days | Reviews overdue | HTSA 1.6 items not met |\n|---|---|---|---|---|---|\n| | | | | | |\n\n### 3. Quarterly review\n\n| Quarter | Findings (items not met, trends) | Action | Owner | Due | Closed |\n|---|---|---|---|---|---|\n| Q1 (Apr–Jun) | | | | | |\n| Q2 (Jul–Sep) | | | | | |\n| Q3 (Oct–Dec) | | | | | |\n| Q4 (Jan–Mar) | | | | | |\n\n### 4. Management review input summary\n\n| Input | Status | Comment |\n|---|---|---|\n| HTSA 1.6 self-assessment score and items not met | | |\n| Coverage of active processes by specifications in force | | |\n| Changes made in the period and their validation | | |\n| Overdue reviews and implementations | | |\n| Resources / authorization changes needed | | |\n\n| Prepared by (HT Engineer) | Reviewed by (HT Manager) | Date |\n|---|---|---|\n| | | |\n", "SPEC/04_Application/mwspl-spec-module.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPEC MODULE: APPLICATION DESCRIPTION\n\nThe application of this module is the CALOR page **`Process_Specifications.html`** in the repository root (tab PROCESS → Specifications in `CALOR.html`). It is not copied here: the build (`python suite/build.py`) reads it from the root, and a copy would drift. This file is the specification of the module for the QMS documents: the rules below are taken from the page's code, and the documents of this module must match them.\n\n| Item | Value in the code |\n|---|---|\n| Storage key | `psr-reg` (data), `psr-view` (filter, local only); Google Drive file `psr-reg.json` when linked |\n| Record | Specification `PS-nnnn`, `rev` 0…n, `status` draft / approved / obsolete, `revs[]` (snapshots of earlier revisions), `log[]` |\n| Processes | `PROC`: HT hardening & tempering (Table A), IA isothermal annealing (Table E), NORM normalizing (Table E) |\n| Processes per furnace | Setting `runs`: F-01: IA, HT · F-02: IA, NORM, HT · F-03: IA, NORM · F-04: IA, NORM; a furnace that does not run the process blocks the approval |\n| Line layout | `posH` 5,4,4 · `posT` 4,4,4 · `xfer` 18 min (measured) · `ccXfer` 2 min (IA transfers) |\n| Defaults for new specifications | tolerance ±10 °C, push ±0.5 min, quench delay 30 s, dip 8.5 ± 0.5 min, controlled cooling ±1 min, fan ±5 min |\n| Forms at the line | `FORMS`: work instruction, job card, computer-based recipe (SCADA / PLC), other |\n| Customer notification | `NOTIFY`: not required, notified, approval obtained (e.g. PPAP) |\n| Approval gate (`missing`) | part no., name, steel grade, approved furnaces, part weight, every step with its tolerance (`paramMiss`), hardness scale, decarburization limit, form at the line, prepared / reviewed / approved by, approver authorized (`isAuth`), approval date; rev > 0: reason + change review (`chgMissing`); plus no critical advice |\n| Authorization (`authList`) | In CALOR: HT organization API `authorized()` (holder and deputy of the HT position and of positions marked `specAuth`); standalone: Settings `auth` |\n| Implementation | `implDate`, `implBy` (not before the approval, not in the future); HTSA 1.6 \"not met\" when missing more than `implDays` (7) days after the approval |\n| Periodic review | `reviewDays` 365 after the approval of the revision in force; \"due\" `reviewSoon` 30 days before |\n| Active processes | parts produced on the Daily production page in the last `activeDays` (90) per furnace |\n| HTSA 1.6 score | `nia` no specification in force or an active part without one · `ns` any critical item · `s` otherwise |\n| Outputs | specification PDF / Excel, job card, register Excel (incl. sheet \"HTSA 1.6\"), HTSA 1.6 evidence PDF |\n| Used by | Hardness (requirements), Daily production (spec of each batch), Load build, CP & PFMEA (control plan rows), Equipment (class required), SCADA review (set values vs spec), Home |\n\n**Not in the CALOR page (handled by the documents):** a \"reviewed, no change\" entry for the periodic review (F-SPEC-04); a printout of the authorization list (F-SPEC-03); the rule that an active part without a specification runs only on the HT Manager's written instruction (WI-SPEC-03 §2.2).\n\n## Native module in the integrated application (pilot, 22-Oct-2026)\n\nThe same module is also built natively in the form of the MWSPL Integrated Application (the IATF 16949 application's UI/UX): **`QMS/00_Integrated_Application/calor-quality-system.html`**, one self-contained file with an Overview and the module \"Process specifications\". It is the pilot for moving CALOR into that form; until the user decides, the CALOR page above stays the application in use.\n\n| Item | Native module |\n|---|---|\n| Source | `QMS/SPEC/04_Application/mwspl-spec-module.js` (module), `QMS/00_Integrated_Application/src/` (shell head, CSS, Overview); build `python QMS/00_Integrated_Application/build.py` (never edit the built file) |\n| Views (PDCA) | Dashboard · **P** Register, Authorization & settings · **D** At the line (job cards, implementation) · **C** Review & HTSA 1.6, KPIs (financial year) · **A** Revisions · Rules, Documentation (this module's documents, embedded), Data |\n| Records | collections `specs` (one document per specification `PS-nnnn`, same fields as `psr-reg`) and `config/settings`; shared record store when published with the `db` capability (collection prefix `spec-`), else this browser only (`localStorage` `mws-spec-local-v1`, banner \"Local mode\") |\n| Rules | the same approval gate, change review, authorization, implementation and HTSA 1.6 rules as the CALOR page (copied from its code) |\n| Added | **Record review (no change)** on the Review view: date, reviewer, note; it restarts the periodic review of the revision in force (the gap of WI-SPEC-03 §1.3 / F-SPEC-04 is closed in this module) |\n| Job card | the revision in force with a **temperature–time sketch** below the specification (`profileSvg`): set value per zone with its tolerance band over the time in each zone (positions × push), the quench (dip) / controlled cooling / transfer between the chambers, and the cooling after exit; time axis from loading, total = time through the line. Ramps and cooling curves are schematic, not measured |\n| Delete | armed button (second click confirms), never a browser dialog; only never-approved drafts |\n| Data | export / import JSON (merge or replace), CSV of the register, **Import from CALOR** (reads `psr-reg` in the same browser), starter set-up (three example specifications), clear all (type CLEAR ALL) |\n| Links | reads CALOR's `org-reg` (authorized names) and `prod-reg` (active parts) in the same browser when present |\n| API | `MWS.spec.stats()`, `summary()`, `inForce()`, `closeModal()` (used by the Overview) |\n| Test hook | `window.__SPECM` (`S`, `eff`, `calc`, `missing`, `assess16`, `review`, `kp`) |\n", "TC/00_TC_Master_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## TC MODULE: THERMOCOUPLES AND PROTECTION TUBES — MASTER LIST\n\n**Basis:** AIAG CQI-9 4th Edition, HTSA question 3.3 (\"Are thermocouples and protection tubes checked or replaced per Process Tables?\"), Section P3.1 (thermocouples, accuracy tables, P3.1.3.3 reuse of type K / E test thermocouples), Section P3.3 (system accuracy test, P3.3.5 SAT records) and the Process Tables A and E (SAT interval). Section and table numbers and the figures used in the application are to be confirmed against the controlled copy. PDCA: **Do / Check** (the measuring system behind every furnace temperature).\n\n**Application:** CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`) → Thermocouples. The register of thermocouples, test equipment, SAT records, protection tube checks, the PM schedule and the HTSA 3.3 self-assessment are held there. CALOR's SAT page (`Thermocouple_SAT_PDCA.html`) can be imported into it.\n\n### Documents\n\n| PDCA | Doc. No. | Title | Rev. | Date | File link |\n|---|---|---|---|---|---|\n| P | MWSPL-QP-TC-01 | Thermocouples and protection tubes | 00 | — | [01_Procedure/MWSPL-QP-TC-01_Thermocouples_and_Protection_Tubes.md](01_Procedure/MWSPL-QP-TC-01_Thermocouples_and_Protection_Tubes.md) |\n| P / D | MWSPL-WI-TC-01 | Receive, calibrate and install a thermocouple | 00 | — | [02_Work_Instructions/MWSPL-WI-TC-01_Receive_Calibrate_and_Install_a_Thermocouple.md](02_Work_Instructions/MWSPL-WI-TC-01_Receive_Calibrate_and_Install_a_Thermocouple.md) |\n| D / C | MWSPL-WI-TC-02 | System accuracy test (SAT) | 00 | — | [02_Work_Instructions/MWSPL-WI-TC-02_System_Accuracy_Test.md](02_Work_Instructions/MWSPL-WI-TC-02_System_Accuracy_Test.md) |\n| D / A | MWSPL-WI-TC-03 | Protection tube check and replacement | 00 | — | [02_Work_Instructions/MWSPL-WI-TC-03_Protection_Tube_Check_and_Replacement.md](02_Work_Instructions/MWSPL-WI-TC-03_Protection_Tube_Check_and_Replacement.md) |\n| P | MWSPL-F-TC-01 | Thermocouple register | 00 | — | [03_Formats/MWSPL-F-TC-01_Thermocouple_Register.md](03_Formats/MWSPL-F-TC-01_Thermocouple_Register.md) |\n| C | MWSPL-F-TC-02 | SAT record | 00 | — | [03_Formats/MWSPL-F-TC-02_SAT_Record.md](03_Formats/MWSPL-F-TC-02_SAT_Record.md) |\n| P / D | MWSPL-F-TC-03 | Protection tube PM schedule and check record | 00 | — | [03_Formats/MWSPL-F-TC-03_Protection_Tube_PM_Schedule_and_Check.md](03_Formats/MWSPL-F-TC-03_Protection_Tube_PM_Schedule_and_Check.md) |\n| — | — | Module description (application) | — | — | [04_Application/mwspl-tc-module.md](04_Application/mwspl-tc-module.md) |\n\n### Where each requirement is met\n\n| Requirement (HTSA 3.3) | Met by | Evidence in the application |\n|---|---|---|\n| Thermocouples calibrated before first use, within the range of use, meeting the P3.1 accuracy | QP-TC-01 §6.1; WI-TC-01 §2–§3; F-TC-01 | Calibration fields of each thermocouple; issue shown when the certificate is missing, dated after installation, does not cover the range of use or exceeds the accuracy |\n| Control, monitoring and recording thermocouples SAT checked per the Process Table and P3.3 | QP-TC-01 §6.2; WI-TC-02 | SAT state per thermocouple (none / ok /
