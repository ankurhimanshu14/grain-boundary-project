<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CALOR Quality System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* CALOR Quality System: design system (tokens and components of the MWSPL Integrated Quality System, UI/UX Reuse Handover §4).
   Rebrand by changing the tokens only; keep the three :root blocks (light, media-query dark, forced dark) in sync. */
:root{
  --bg:#f1f3f1;--panel:#ffffff;--sunk:#e7eae7;--ink:#1a2026;--muted:#5a6570;--line:#d3d8d5;
  --accent:#1d5b78;--accent-2:#e1edf2;--on-accent:#ffffff;
  --ok:#1f7a45;--ok-bg:#dff1e5;--warn:#8a5a00;--warn-bg:#fbefd5;--bad:#b02a2a;--bad-bg:#f8dede;
  --f-display:"Barlow Semi Condensed",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111518;--panel:#191f23;--sunk:#222a2f;--ink:#e2e7ea;--muted:#96a2aa;--line:#2c353b;
  --accent:#74b5d2;--accent-2:#1b2f39;--on-accent:#0d1a20;
  --ok:#6fcf97;--ok-bg:#16301f;--warn:#e8b45a;--warn-bg:#33270f;--bad:#f08a8a;--bad-bg:#3a1a1a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111518;--panel:#191f23;--sunk:#222a2f;--ink:#e2e7ea;--muted:#96a2aa;--line:#2c353b;
  --accent:#74b5d2;--accent-2:#1b2f39;--on-accent:#0d1a20;
  --ok:#6fcf97;--ok-bg:#16301f;--warn:#e8b45a;--warn-bg:#33270f;--bad:#f08a8a;--bad-bg:#3a1a1a;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0}
h2{font-size:20px}h3{font-size:16px}
a{color:var(--accent)}
.mono,code{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}.small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* page */
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
.brand .co{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-size:26px;line-height:1.1}
.ctrl{display:grid;grid-template-columns:repeat(4,auto);border:1px solid var(--line);font-size:12px;background:var(--panel)}
.ctrl>div{padding:4px 10px;border-right:1px solid var(--line)}.ctrl>div:last-child{border-right:0}
.ctrl b{display:block;font-weight:500;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.hdr-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* navigation */
nav.sys{background:var(--bg);border-bottom:1px solid var(--line)}
nav.sys .wrap{display:flex;gap:4px;flex-wrap:wrap;padding-top:8px}
nav.sys a{font-family:var(--f-display);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);padding:7px 14px;border:1px solid var(--line);border-top:3px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:var(--panel)}
nav.sys a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav#nav{background:var(--panel);border-top:3px solid var(--accent);border-bottom:1px solid var(--line)}
nav#nav .wrap{display:flex;gap:6px 18px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pd{font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--on-accent);background:var(--accent);border-radius:3px;padding:1px 6px;margin-right:2px}
.grp a{font-family:var(--f-display);font-weight:600;font-size:14.5px;text-decoration:none;color:var(--ink);padding:4px 9px;border-radius:4px}
.grp a:hover{background:var(--sunk)}
.grp a[aria-current="page"]{background:var(--accent-2);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

/* layout helpers */
main.wrap{padding-top:18px;padding-bottom:40px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}.between{justify-content:space-between}
.stack{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.panel>h3{margin-bottom:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.fields .wide{grid-column:1/-1}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--ink)}
a.tile:hover{border-color:var(--accent)}
.tile .k{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1}
.tile.ok .v{color:var(--ok)}.tile.warn .v{color:var(--warn)}.tile.bad .v{color:var(--bad)}

/* status */
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.acc{background:var(--accent-2);color:var(--accent)}
.banner{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel);border-radius:4px;padding:8px 12px}
.banner.warn{border-left-color:var(--warn);background:var(--warn-bg)}.banner.bad{border-left-color:var(--bad);background:var(--bad-bg)}.banner.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.verdict{font-family:var(--f-display);font-weight:700;font-size:22px}
.verdict.acc{color:var(--ok)}.verdict.cond{color:var(--warn)}.verdict.rej{color:var(--bad)}
ul.issues{margin:6px 0 0;padding-left:18px}ul.issues li{margin:2px 0}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.c,th.c{text-align:center}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0}

/* forms */
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px}
label.f>span{font-size:12px;color:var(--muted)}
label.f.req>span::after{content:" *";color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk);color:var(--muted)}
textarea{min-height:60px;resize:vertical}
.chk{display:inline-flex;gap:6px;align-items:center;margin-right:14px;font-size:13.5px}.chk input{width:auto}
.grid-in{display:grid;grid-template-columns:150px repeat(3,minmax(70px,1fr));gap:6px 10px;align-items:center}
.grid-in .h{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* buttons */
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--ink)}
button.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{color:var(--bad);border-color:var(--bad)}button.danger.armed{background:var(--bad);color:#fff}
button.link{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
button:disabled{opacity:.5;cursor:not-allowed}
body.ro .w{display:none!important}

/* charts */
.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:160px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:10px;background:var(--accent);border-radius:2px}

/* PDCA strip */
.pdca{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pdca>div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.pdca .ph{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent)}

/* overlay */
#modal{position:fixed;inset:0;background:rgba(10,14,16,.5);z-index:50;overflow:auto;padding:24px 12px}
#modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:980px;margin:0 auto;padding:16px 18px}
.sheet h2{margin-bottom:6px}
fieldset{border:1px solid var(--line);border-radius:6px;margin:12px 0 0;padding:10px 12px}
legend{font-family:var(--f-display);font-weight:600;font-size:15px;padding:0 6px}
.sticky-foot{position:sticky;bottom:-16px;background:var(--panel);border-top:1px solid var(--line);margin:14px -18px -16px;padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.sticky-foot .msg{margin-right:auto;font-size:13px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}

/* documentation viewer */
.docs{display:grid;grid-template-columns:280px 1fr;gap:16px}
.doclist{display:flex;flex-direction:column;gap:2px}
.doclist button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:4px;font-size:13px}
.doclist button[aria-current="true"]{background:var(--accent-2);color:var(--accent);font-weight:600}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;overflow-x:auto}
.doc h1{font-size:15px;color:var(--muted);letter-spacing:.08em}.doc h2{font-size:21px;margin:6px 0 10px}.doc h3{font-size:17px;margin:16px 0 6px}.doc h4{font-size:15px;margin:12px 0 4px}
.doc table{margin:8px 0;font-size:13px}.doc th{position:static}
.doc pre{background:var(--sunk);padding:10px;border-radius:4px;overflow-x:auto;font-size:12px;line-height:1.35}
.doc ul{padding-left:20px}

/* empty state */
.empty{text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:32px 16px}
.empty p{color:var(--muted)}

/* responsive */
@media (max-width:860px){.grid3{grid-template-columns:1fr 1fr}.docs{grid-template-columns:1fr}}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.pdca{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.ctrl{grid-template-columns:repeat(2,auto)}.ctrl>div:nth-child(2){border-right:0}.grid3{grid-template-columns:1fr}.grid-in{grid-template-columns:110px repeat(3,minmax(60px,1fr))}}
@media (max-width:520px){.brand h1{font-size:21px}.tile .v{font-size:26px}.bar{grid-template-columns:110px 1fr 34px}}
@media print{nav.sys,nav#nav,.w,#toast,button{display:none!important}body{background:#fff}.panel,.tw{border-color:#999}}
/* printing a record sheet (job card, evidence): only the sheet's #jobcard */
@media print{body.pm>*:not(#modal){display:none!important}body.pm #modal{position:static;background:none;padding:0;overflow:visible}
  body.pm .sheet{border:0;max-width:none;padding:0}body.pm .sheet>*:not(#jobcard):not(:first-child){display:none!important}body.pm #jobcard{display:block!important}}
/* temperature–time sketch on the job card */
figure.prof{margin:6px 0 10px}figure.prof svg{width:100%;height:auto;display:block;max-width:900px}
@media print{figure.prof{break-inside:avoid}}

</style></head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="co">Mass Wire and Steels Pvt. Ltd. · Bhiwadi</div><h1 id="apptitle">CALOR</h1></div>
  <div class="hdr-r"><div class="ctrl" id="ctrl" aria-label="Document control"></div><button id="themeBtn" type="button" aria-label="Toggle colour theme">Theme</button></div>
</div></header>
<nav class="sys" aria-label="Modules"><div class="wrap">
  <a href="#home" data-sys="home">Overview</a>
  <a href="#spec/dash" data-sys="spec">Specifications</a>
</div></nav>
<nav id="nav" aria-label="Module views" hidden></nav>
<main id="main" class="wrap"></main>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ---------- shell: module table, routing, theme ---------- */
const MODS=["spec"];                           /* every module code; add new modules here (and in nav.sys, SYS, build.py) */
const today0=()=>{const d=new Date();return `${String(d.getDate()).padStart(2,"0")}-${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}-${d.getFullYear()}`;};
const SYS={
  home:{t:"CALOR · Heat treat quality system",ctrl:()=>`<div><b>Standard</b>AIAG CQI-9 4th Ed.</div><div><b>Scope</b>Pusher furnaces F-01 … F-04</div><div><b>Records</b><span id="dbstate">—</span></div><div><b>Date</b>${today0()}</div>`},
  spec:{t:"Process specifications",ctrl:()=>`<div><b>Procedure</b>MWSPL-QP-SPEC-01</div><div><b>Standard</b>CQI-9 · HTSA 1.6</div><div><b>Records</b><span id="dbstate">Connecting…</span></div><div><b>Date</b>${today0()}</div>`}
};
const appOf=h=>{const m=String(h||"").match(/^#([a-z]+)(?:\/|$)/);return m&&MODS.includes(m[1])?m[1]:"home";};
const MWS={
  app:appOf(location.hash),docs:{},
  /* the location a module sees: only its own part of the hash (#view); setting it writes #<mod>/view */
  loc(mod){return {
    get hash(){const m=location.hash.match(new RegExp("^#"+mod+"/?(.*)$"));return m&&m[1]?"#"+m[1]:"";},
    set hash(v){location.hash="#"+mod+"/"+String(v||"").replace(/^#/,"");},
    get href(){return location.href;},reload(){location.reload();}};},
  /* a module's data changed while another page is shown: refresh the Overview */
  bg(){if(MWS.app==="home"&&typeof renderHome==="function"){clearTimeout(MWS._bg);MWS._bg=setTimeout(renderHome,120);}},
  toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(MWS._t);MWS._t=setTimeout(()=>el.classList.remove("on"),2600);}
};
function shellRoute(){
  const prev=MWS.app;MWS.app=appOf(location.hash);
  if(prev!==MWS.app&&MWS[prev]&&MWS[prev].closeModal){try{MWS[prev].closeModal();}catch(e){}}
  const S=SYS[MWS.app];document.getElementById("apptitle").textContent=S.t;document.getElementById("ctrl").innerHTML=S.ctrl();
  document.title=(MWS.app==="home"?"":S.t+" · ")+"CALOR Quality System";
  document.querySelectorAll("nav.sys a").forEach(a=>{if(a.dataset.sys===MWS.app)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  document.getElementById("nav").hidden=MWS.app==="home";
  if(MWS.app==="home"){document.getElementById("nav").innerHTML="";if(typeof renderHome==="function")renderHome();}
}
addEventListener("hashchange",shellRoute,true);
/* inside a module, links are written #view: rewrite them to #<mod>/view (capture phase, before the module sees the click) */
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href^='#']");if(!a||MWS.app==="home")return;
  const h=a.getAttribute("href");if(h==="#home"||/^#[a-z]+\//.test(h)||a.closest("nav.sys"))return;
  e.preventDefault();location.hash="#"+MWS.app+"/"+h.slice(1);},true);
/* theme: automatic, with a manual override kept per browser */
(function(){let t=null;try{t=localStorage.getItem("mws-theme");}catch(e){}if(t)document.documentElement.dataset.theme=t;
  document.getElementById("themeBtn").addEventListener("click",()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("mws-theme",r.dataset.theme);}catch(e){}});})();
const useCap=n=>{try{return window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);}catch(e){return Promise.resolve(null);}};
</script>
<script>MWS.docs={"SPEC/00_SPEC_Master_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPEC MODULE: PROCESS SPECIFICATIONS — MASTER LIST\n\n**Basis:** AIAG CQI-9 4th Edition, HTSA question 1.6 (\"a documented system to create process specifications for all active processes\") and the Process Tables (Table A hardening & tempering, Table E annealing / normalizing; table letters to be confirmed against the controlled copy). IATF 16949 §8.5.1 (control plan, work instructions at the line) and §8.5.6 (control of changes) as context. PDCA: **Plan** (the specification is the plan for every heat treatment).\n\n**Application:** CALOR → PROCESS → Specifications (`Process_Specifications.html`). The register, approvals, revisions, job cards and the HTSA 1.6 self-assessment are held there. Pilot of the integrated application: the same module in `QMS/00_Integrated_Application/calor-quality-system.html` (see the module description).\n\n### Documents\n\n| PDCA | Doc. No. | Title | Rev. | Date | File link |\n|---|---|---|---|---|---|\n| P | MWSPL-QP-SPEC-01 | Process specifications | 00 | — | [01_Procedure/MWSPL-QP-SPEC-01_Process_Specifications.md](01_Procedure/MWSPL-QP-SPEC-01_Process_Specifications.md) |\n| P / D | MWSPL-WI-SPEC-01 | Write and approve a process specification | 00 | — | [02_Work_Instructions/MWSPL-WI-SPEC-01_Write_and_Approve_a_Specification.md](02_Work_Instructions/MWSPL-WI-SPEC-01_Write_and_Approve_a_Specification.md) |\n| A | MWSPL-WI-SPEC-02 | Change a specification: new revision, implementation, obsolete | 00 | — | [02_Work_Instructions/MWSPL-WI-SPEC-02_Change_a_Specification.md](02_Work_Instructions/MWSPL-WI-SPEC-02_Change_a_Specification.md) |\n| C | MWSPL-WI-SPEC-03 | Periodic review and HTSA 1.6 self-assessment | 00 | — | [02_Work_Instructions/MWSPL-WI-SPEC-03_Periodic_Review_and_Self-Assessment.md](02_Work_Instructions/MWSPL-WI-SPEC-03_Periodic_Review_and_Self-Assessment.md) |\n| P | MWSPL-F-SPEC-01 | Process specification (content and layout) | 00 | — | [03_Formats/MWSPL-F-SPEC-01_Process_Specification.md](03_Formats/MWSPL-F-SPEC-01_Process_Specification.md) |\n| A | MWSPL-F-SPEC-02 | Specification change review | 00 | — | [03_Formats/MWSPL-F-SPEC-02_Change_Review.md](03_Formats/MWSPL-F-SPEC-02_Change_Review.md) |\n| P | MWSPL-F-SPEC-03 | Authorization to approve process specifications | 00 | — | [03_Formats/MWSPL-F-SPEC-03_Authorization_List.md](03_Formats/MWSPL-F-SPEC-03_Authorization_List.md) |\n| C | MWSPL-F-SPEC-04 | Specification register and periodic review record | 00 | — | [03_Formats/MWSPL-F-SPEC-04_Register_and_Review.md](03_Formats/MWSPL-F-SPEC-04_Register_and_Review.md) |\n| C / A | MWSPL-F-SPEC-05 | SPEC KPIs | 00 | — | [03_Formats/MWSPL-F-SPEC-05_KPI.md](03_Formats/MWSPL-F-SPEC-05_KPI.md) |\n| — | — | Module description (application) | — | — | [04_Application/mwspl-spec-module.md](04_Application/mwspl-spec-module.md) |\n\n### Where each requirement is met\n\n| Requirement (HTSA 1.6, as checked by CALOR `assess16`) | Met by | Evidence in CALOR |\n|---|---|---|\n| Authorization to establish process specifications is defined | QP-SPEC-01 §5, §6.1; F-SPEC-03 | HT organization page: HT position and positions marked \"authorized to approve process specifications\" |\n| The responsible heat treat person (HTSA 1.1) is authorized | QP-SPEC-01 §5 | HTSA 1.6 panel item (warning if not) |\n| Specifications approved by an authorized person | WI-SPEC-01 step 4.3; F-SPEC-01 §9 | Approval gate refuses a non-authorized approver |\n| Written process specifications for all active processes | QP-SPEC-01 §6.1, §6.3; WI-SPEC-03 §2 | Parts produced on the Daily production page in the last 90 days checked per furnace |\n| All steps with their parameters and operating tolerances | F-SPEC-01 §4–§7; WI-SPEC-01 §3 | Steps table of each specification; approval gate |\n| Available as work instruction, job card or recipe | QP-SPEC-01 §6.2; WI-SPEC-01 §5 | \"Form at the line\" field; job card printed from the register |\n| Changes reviewed for continued conformity with customer requirements | WI-SPEC-02 §2; F-SPEC-02 | Change review fields, required for every revision after rev 0 |\n| Changes documented with the date implemented and the approver | WI-SPEC-02 §3 | \"Record implementation\"; not recorded within 7 days of approval = not met |\n| Periodic review | WI-SPEC-03 §1; F-SPEC-04 | Review due 365 days after the approval of the revision in force |\n\n### First-cycle implementation checklist\n\n- [ ] Mark the authorized positions on the HT organization page (holder and deputy of the HT position count automatically); print F-SPEC-03.\n- [ ] Confirm Settings → Processes per furnace (F-01: IA, HT · F-02: IA, NORM, HT · F-03 / F-04: IA, NORM) and the defaults (tolerances, quench delay 30 s, dip 8.5 ± 0.5 min, transfer 18 min).\n- [ ] Clear the example data; write a specification for every part produced in the last 90 days, per furnace (WI-SPEC-01).\n- [ ] Approve them; record the implementation date within 7 days; print the job cards for the control panels.\n- [ ] Check the HTSA 1.6 panel reads Satisfactory; file the HTSA 1.6 evidence PDF.\n- [ ] Approve QP-SPEC-01, the three WIs and the formats; train the HT Engineer, HT Manager and shift supervisors (Procedures & WIs page).\n- [ ] Start the KPI format F-SPEC-05 for the financial year.\n", "SPEC/01_Procedure/MWSPL-QP-SPEC-01_Process_Specifications.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PROCESS SPECIFICATIONS\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Reviewed | Approved | Copy status |\n|---|---|---|---|---|---|---|---|\n| MWSPL-QP-SPEC-01 | 00 | — | HT Manager | | | | Uncontrolled until approved |\n\n### 1. Purpose\n\nTo establish, approve, make available, change and review a written process specification for every part and process heat treated, so that every tray is processed to defined parameters with operating tolerances (CQI-9 HTSA 1.6).\n\n### 2. Scope\n\n- **Site:** Bhiwadi, heat treatment shop (the only site in scope).\n- **Equipment:** continuous gas-fired pusher furnaces F-01 to F-04 (hardening chamber 3 zones / 13 tray positions; controlled cooling chamber; tempering chamber 3 zones / 12 tray positions).\n- **Processes:** hardening & tempering (HT: F-01 water quench, F-02 oil quench), isothermal annealing (IA: all furnaces), normalizing (NORM: F-02, F-03, F-04). Full annealing is not yet covered by a specification.\n- **Not in scope:** the steel supplier's and the customer's own specifications (they are inputs).\n\n### 3. References\n\n- AIAG CQI-9 4th Edition, HTSA 1.6 and Process Tables A / E (controlled copy).\n- IATF 16949:2016 §8.5.1, §8.5.6; customer-specific requirements.\n- MWSPL-WI-SPEC-01, -02, -03; MWSPL-F-SPEC-01 to -05.\n- WI-HT-01 General operating procedure; Control plans and PFMEAs (CALOR → CP & PFMEA); SOP-QA-12 Rework.\n\n### 4. Terms and definitions\n\n| Term | Meaning |\n|---|---|\n| Process specification (spec) | The controlled record of how one part is heat treated by one process: part data, approved furnaces, loading, zone set values with tolerances, push time, quench / controlled cooling / transfer, after-exit cooling and the product requirements and testing. Number PS-nnnn, revision 0, 1, 2 … |\n| Revision in force | The last approved revision. A new revision in draft does not replace it until approved. |\n| Job card | The one-page print of the revision in force for the line (part, set values, push, quench / cooling, requirements). |\n| Active process | A part produced on a furnace in the last 90 days (Daily production page). |\n| Authorized person | A person allowed to approve specifications: the holder and deputy of the heat treat position (HTSA 1.1) and of the positions marked as authorized on the HT organization page. |\n| Operating tolerance | ± value, maximum or range within which a parameter must be held at the line. |\n\n### 5. Responsibility and authority\n\n| Role | Responsibility | Authority |\n|---|---|---|\n| HT Engineer | Prepares specifications and revisions; gathers customer requirements; validation trial | Prepare, propose changes |\n| HT Manager (heat treat person, HTSA 1.1) and deputy | Reviews and approves; decides on changes; owns this procedure | Approve, make obsolete |\n| Other authorized positions (marked on the HT organization page) | Approve within their authorization | Approve |\n| Quality Manager | Reviews product requirements, sampling and customer notification; control plan / PFMEA alignment | Customer notification |\n| Shift supervisor | Uses only the job card of the revision in force; records the implementation | Stop the line if no valid job card |\n| Director | Provides the authorization structure (HT organization) | — |\n\n### 6. Procedure\n\n```\n        +-------------------------------+\n        |  PLAN  6.1                    |\n        |  authorization, processes per |\n        |  furnace, write the spec      |\n        +---------------+---------------+\n                        |\n                        v\n+-------------------+   approve    +-------------------------------+\n|  ACT  6.4         |<-------------|  DO  6.2                      |\n|  new revision,    |              |  job card at the line,        |\n|  change review,   |              |  implementation recorded      |\n|  obsolete         |              +---------------+---------------+\n+---------+---------+                              |\n          ^                                        v\n          |                        +-------------------------------+\n          +------------------------|  CHECK  6.3                   |\n                                   |  periodic review, active parts|\n                                   |  vs specs, HTSA 1.6 score     |\n                                   +-------------------------------+\n```\n\n#### 6.1 PLAN\n\n1. The authorized persons are defined on the HT organization page (F-SPEC-03 is its printout). The heat treat person (HTSA 1.1) must be among them.\n2. The processes each furnace runs are kept in the Specifications page settings (\"Processes per furnace\"). A specification cannot be approved for a furnace that does not run its process.\n3. The HT Engineer writes the specification (MWSPL-WI-SPEC-01) with every step and its operating tolerance (F-SPEC-01): loading (pieces per tray, loading pattern), push time ± tolerance, the set value ± tolerance of each zone of both chambers, quench (medium, temperature range, delay maximum, dip time ±, agitation, transfer maximum) or controlled cooling (time ±, method, target ±) or transfer, after-exit cooling, and the product requirements (hardness range and scale, core, microstructure, decarburization limit, grain size, sampling, method).\n4. The page calculates the time per zone, the time between the chambers and the time through the line from the line layout (5 / 4 / 4 and 4 / 4 / 4 positions; transfer 18 min measured; controlled cooling cycle for isothermal annealing, which must end before the next push) and gives line-practice advice; any critical advice blocks the approval.\n\n#### 6.2 DO\n\n1. An authorized person approves the specification after the approval gate shows nothing missing (part data, furnaces, all steps with tolerances, hardness scale, decarburization limit, where it is available at the line, prepared / reviewed / approved by, approval date; for a revision also the reason and the change review). Approved = locked.\n2. The specification is made available at the line as a work instruction, a job card (printed from the register) or a computer-based recipe (SCADA / PLC), as stated in the specification.\n3. The date it was implemented at the line and by whom are recorded (\"Record implementation\") within 7 days of the approval.\n4. Production, hardness testing, load build and control plans use only the revision in force (they read it from the register).\n\n#### 6.3 CHECK\n\n1. **Periodic review:** every specification is reviewed 365 days after the approval of its revision in force (due shown 30 days before) — MWSPL-WI-SPEC-03.\n2. **Active processes:** the parts produced on each furnace in the last 90 days must each have a specification in force approved for that furnace; a part without one is a critical finding.\n3. **HTSA 1.6 self-assessment:** the panel on the Specifications page scores the system Satisfactory / Not satisfactory / Needs immediate action (no specification in force, or an active part without one); it is reviewed monthly with the KPIs (F-SPEC-05).\n\n#### 6.4 ACT\n\n1. Any change (set value, tolerance, push time, quench / cooling, furnace, loading, requirement) is made only by a new revision (MWSPL-WI-SPEC-02). The revision in force stays in use until the new one is approved.\n2. Every revision after rev 0 needs a change review (F-SPEC-02): customer requirements checked, customer notification decision (not required / notified / approved, with the reference), control plan and PFMEA reviewed, validation (trial or first-off result).\n3. A specification no longer used is made obsolete with a reason; only never-approved drafts may be deleted.\n4. Findings of the review and the self-assessment are acted on by the HT Manager; actions are tracked in the KPI format.\n\n### 7. Records\n\n| Record | Format | Retention | Owner |\n|---|---|---|---|\n| Process specification with all revisions | F-SPEC-01 (CALOR register; PDF / Excel per specification) | Life of the part + 1 year (to confirm with the record retention rule) | HT Manager |\n| Change review | F-SPEC-02 (in the revision) | As the specification | HT Manager |\n| Authorization list | F-SPEC-03 (HT organization page) | Current + superseded 3 years | HT Manager |\n| Register and periodic review | F-SPEC-04 (register Excel) | 3 years | HT Engineer |\n| HTSA 1.6 evidence | PDF from the panel | 3 years | Quality Manager |\n| KPIs | F-SPEC-05 | 3 years | HT Manager |\n\n**Application:** CALOR holds the specifications, their revisions (a snapshot of every earlier revision), the approval, change review and implementation data and a dated log of every action in its register (`psr-reg`). The register is kept in the browser and, when linked, as `psr-reg.json` in the Google Drive folder with daily backups. PDF and Excel outputs are made from the page (specification, job card, register, HTSA 1.6 evidence). Paper job cards are uncontrolled copies of the revision in force.\n\n### 8. Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/02_Work_Instructions/MWSPL-WI-SPEC-01_Write_and_Approve_a_Specification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## WRITE AND APPROVE A PROCESS SPECIFICATION\n\n| Doc No. | Rev | Issue date | Parent procedure sections | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SPEC-01 | 00 | — | MWSPL-QP-SPEC-01 §6.1, §6.2 | | |\n\n**Records:** process specification F-SPEC-01 in the CALOR register (PS-nnnn), its log, the job card.\n\n### 1. Before you start\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 1.1 | Collect the inputs: customer drawing and specification (hardness, core, microstructure, decarburization, grain size, sampling), steel grade, part weight, the customer-specific requirements. | HT Engineer |\n| 1.2 | Check that a specification for this part and process does not already exist: CALOR → PROCESS → Specifications, search the register by part no. (a duplicate part + process is flagged). | HT Engineer |\n| 1.3 | Check which furnaces run the process (Settings → Processes per furnace): HT on F-01 (water) / F-02 (oil); IA on all; NORM on F-02, F-03, F-04. | HT Engineer |\n\n### 2. Part data\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 2.1 | Click **New specification**. Enter part no., part name, customer, drawing no., steel grade and process (HT / IA / NORM). | HT Engineer |\n| 2.2 | Tick the approved furnaces. A furnace marked \"(does not run this process)\" cannot be approved. | HT Engineer |\n| 2.3 | Enter the pieces per tray, the part weight (kg) and the tray / fixture. Check the load per tray against the tray maximum (HK trays 200 kg). | HT Engineer |\n\n### 3. Thermal cycle with operating tolerances\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 3.1 | Hardening chamber: set value and ± tolerance of zones 1, 2, 3 (zone 1 preheats; zones 2–3 austenitize above 800 °C for HT / IA; 700–750 °C preheat for NORM). | HT Engineer |\n| 3.2 | Tempering chamber: set value and ± tolerance of zones 1, 2, 3 (tempering / isothermal hold; austenitizing for NORM). | HT Engineer |\n| 3.3 | Push time (min) and its ± tolerance. Read the calculated time per zone, time between the chambers and time through the line shown by the page. | HT Engineer |\n| 3.4 | HT: quench medium (must match the furnace's tank: F-01 water, F-02 oil), quenchant temperature range (both limits), quench delay maximum (default 30 s), dip time and ± tolerance (default 8.5 ± 0.5 min), agitation, transfer maximum. | HT Engineer |\n| 3.5 | IA: controlled cooling time ± tolerance, method, target temperature ± tolerance. The page shows whether the cooling cycle (cooling + transfers) fits in the push time; a cycle that does not fit blocks the approval. | HT Engineer |\n| 3.6 | NORM: transfer time and fan cooling after exit (required / not, time ± tolerance). | HT Engineer |\n| 3.7 | Read the **Steps and parameters** box: every step must show its value with a tolerance, maximum or range. Fill anything listed as missing. | HT Engineer |\n\n### 4. Requirements, review and approval\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 4.1 | Product requirements: hardness min / max and scale, core, microstructure, decarburization limit (required), grain size, other, sampling (quantity and frequency, required), test method. | HT Engineer / Quality Manager |\n| 4.2 | Enter \"prepared by\" and \"reviewed by\"; click **Save draft**. Read the advice (TUS range, quench tank, line practice) and correct where needed. | HT Engineer |\n| 4.3 | The approver opens the draft, checks it against the inputs of step 1.1, enters \"approved by\" (only an authorized person is accepted) and the approval date, and clicks **Approve**. The page lists anything still missing; approval is refused until the list is empty and no critical advice remains. | HT Manager (authorized person) |\n\n### 5. Make it available at the line\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 5.1 | \"Form at the line\": state where it is available (work instruction / job card / SCADA-PLC recipe / other) and its reference. | HT Engineer |\n| 5.2 | Print the **Job card** of the revision in force; put it at the control panel of each approved furnace; remove any older card. For a recipe, load the values into SCADA / PLC and check them against the job card. | Shift supervisor |\n| 5.3 | Click **Record implementation**: date implemented (not before the approval, not in the future) and by whom. Do this within 7 days of the approval. | Shift supervisor / HT Engineer |\n\n### Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/02_Work_Instructions/MWSPL-WI-SPEC-02_Change_a_Specification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## CHANGE A SPECIFICATION: NEW REVISION, IMPLEMENTATION, OBSOLETE\n\n| Doc No. | Rev | Issue date | Parent procedure sections | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SPEC-02 | 00 | — | MWSPL-QP-SPEC-01 §6.2, §6.4 | | |\n\n**Records:** the new revision with its reason and change review (F-SPEC-02), the snapshot of the earlier revision, the implementation date, the log.\n\n### 1. Start a new revision\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 1.1 | Any change to a set value, tolerance, push time, quench / cooling parameter, furnace, loading or requirement needs a new revision. A temporary change at the line is a parameter change on the Daily production page, not a revision; a permanent change is a revision. | HT Manager |\n| 1.2 | Open the approved specification and click **New revision**. The page keeps the approved revision in force and starts a draft rev + 1; the change review and implementation fields are cleared. | HT Engineer |\n| 1.3 | Make the change; enter the **reason for the change**. | HT Engineer |\n| 1.4 | To abandon the change, click **Discard revision**: the revision in force is restored unchanged. | HT Engineer |\n\n### 2. Change review (F-SPEC-02)\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 2.1 | Customer requirements checked: state what was checked (drawing, customer specification, PPAP values) and the result. | HT Engineer |\n| 2.2 | Customer notification decision: not required / customer notified / customer approval obtained (e.g. PPAP); give the reference when notified or approved. | Quality Manager |\n| 2.3 | Tick \"control plan and PFMEA reviewed\" after checking the CP & PFMEA page (regenerate the control plan rows from the new revision if needed). | Quality Manager |\n| 2.4 | Validation: record the trial or first-off result that shows the change works (e.g. trial batch no., hardness range, microstructure). | HT Engineer |\n\n### 3. Approve and implement\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 3.1 | Approve the revision as WI-SPEC-01 step 4.3; the gate also requires the reason and the complete change review. | HT Manager (authorized person) |\n| 3.2 | Replace the job card / recipe at every approved furnace; withdraw the old card. | Shift supervisor |\n| 3.3 | **Record implementation** within 7 days of the approval. After 7 days without it the HTSA 1.6 item \"Changes documented with the date implemented and the approver\" is not met. | Shift supervisor / HT Engineer |\n\n### 4. Make obsolete\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 4.1 | When a part is no longer heat treated (or is replaced by another specification), click **Make obsolete** and give the reason. | HT Manager |\n| 4.2 | Remove its job cards and recipes from the line. | Shift supervisor |\n| 4.3 | Only a draft that was never approved can be deleted (**Delete**); approved and obsolete specifications stay in the register. | HT Engineer |\n\n### Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/02_Work_Instructions/MWSPL-WI-SPEC-03_Periodic_Review_and_Self-Assessment.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PERIODIC REVIEW AND HTSA 1.6 SELF-ASSESSMENT\n\n| Doc No. | Rev | Issue date | Parent procedure sections | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SPEC-03 | 00 | — | MWSPL-QP-SPEC-01 §6.3, §6.4 | | |\n\n**Records:** register Excel with the review dates (F-SPEC-04), HTSA 1.6 evidence PDF, KPI format F-SPEC-05.\n\n### 1. Periodic review of each specification (yearly)\n\n| Step | Activity | Responsibility | Time |\n|---|---|---|---|\n| 1.1 | Open CALOR → PROCESS → Specifications. The tiles show the reviews due (within 30 days) and overdue (365 days after the approval of the revision in force). | HT Engineer | First working day of the month |\n| 1.2 | For each specification due: compare it with the current customer drawing / specification, the hardness and SCADA results of the last year (Hardness, Trend analysis, SCADA review pages) and any customer complaint. | HT Engineer | Before the due date |\n| 1.3 | No change needed: the HT Manager confirms it; record the review on F-SPEC-04 (date, by, result). Change needed: start a new revision (WI-SPEC-02); its approval resets the review date. Note: CALOR has no \"reviewed, no change\" entry for specifications — the register keeps showing the review as overdue until a new revision is approved, so F-SPEC-04 is the record of a review without change (application change requested in the handover note). In the integrated application (pilot) use **Review & HTSA 1.6 → Record review**; it restarts the review date. | HT Manager | Before the due date |\n\n### 2. Active parts without a specification\n\n| Step | Activity | Responsibility | Time |\n|---|---|---|---|\n| 2.1 | Read the HTSA 1.6 panel item \"Written process specifications for all active processes\": it lists every part produced on a furnace in the last 90 days without a specification in force for that furnace. | HT Engineer | Weekly |\n| 2.2 | For each one: write and approve the specification (WI-SPEC-01), or add the furnace to the existing one by a new revision (WI-SPEC-02). Until then the part runs only on the HT Manager's written instruction. | HT Manager | Within 7 days |\n\n### 3. HTSA 1.6 self-assessment\n\n| Step | Activity | Responsibility | Time |\n|---|---|---|---|\n| 3.1 | Read the HTSA 1.6 panel score: Satisfactory / Not satisfactory / Needs immediate action, and each item (authorization, approval by an authorized person, all active processes, steps with tolerances, available at the line, change review, implementation recorded, periodic review). | HT Manager | Monthly |\n| 3.2 | For each item not met, agree the action, owner and date; enter it on F-SPEC-05 (quarterly review). | HT Manager | Monthly |\n| 3.3 | Download **HTSA 1.6 evidence (PDF)** and file it with the month's KPIs; it is the evidence for an internal or customer assessment. | Quality Manager | Monthly |\n\n### Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-01_Process_Specification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PROCESS SPECIFICATION\n\n| Format No. | Rev. | Specification no. | Revision | Status |\n|---|---|---|---|---|\n| MWSPL-F-SPEC-01 | 00 | PS-____ | ___ | Draft / Approved / Obsolete |\n\nThis format is the content of a specification as held in CALOR (Specifications page); the page prints it as the specification PDF and the job card. Use the paper form only when CALOR is not available, then enter it in CALOR.\n\n**Legend:** ± = operating tolerance · max = maximum · range = lower–upper limit · **bold** fields are required for approval.\n\n### 1. Part\n\n| Field | Entry |\n|---|---|\n| **Part no.** / **part name** | |\n| Customer / drawing no. | |\n| **Steel grade** | |\n| **Process** | HT hardening & tempering (CQI-9 Table A) / IA isothermal annealing (Table E) / NORM normalizing (Table E) |\n| **Approved furnaces** | F-01 ☐ F-02 ☐ F-03 ☐ F-04 ☐ (only furnaces that run the process) |\n| **Part weight (kg)** / pieces per tray (max) / tray or fixture | |\n\n### 2. Loading and push\n\n| Step | Parameter | Value | Tolerance |\n|---|---|---|---|\n| Loading | **Pieces per tray** | | max |\n| Loading | Loading pattern / fixture | | set text |\n| Pusher | **Push time (min)** | | ± |\n\n### 3. Hardening chamber (positions 5 / 4 / 4)\n\n| Zone | **Set value (°C)** | **Tolerance (± °C)** |\n|---|---|---|\n| 1 | | |\n| 2 | | |\n| 3 | | |\n\n### 4. Between the chambers (one of)\n\n| Process | Parameter | Value | Tolerance |\n|---|---|---|---|\n| HT | **Quench medium** (F-01 water, F-02 oil) | | set text |\n| HT | **Quenchant temperature (°C)** | | range (both limits) |\n| HT | **Quench delay (s)** | | max |\n| HT | **Dip time (min)** | | ± |\n| HT | Agitation | | set text |\n| HT | **Transfer to the tempering chamber (min)** | | max |\n| IA | **Cooling (air blowing) time (min)** | | ± (cooling + transfers must end before the next push) |\n| IA | Method | | set text |\n| IA | **Target temperature before the tempering chamber (°C)** | | ± |\n| NORM | **Transfer between the chambers (min)** | | max |\n\n### 5. Tempering chamber (positions 4 / 4 / 4)\n\n| Zone | **Set value (°C)** | **Tolerance (± °C)** |\n|---|---|---|\n| 1 | | |\n| 2 | | |\n| 3 | | |\n\n### 6. After exit\n\n| Parameter | Value | Tolerance |\n|---|---|---|\n| Cooling (still air / fan) | | set text |\n| Fan cooling time (min), if required | | ± |\n\n### 7. Product requirements and testing\n\n| Field | Entry |\n|---|---|\n| **Hardness** min – max, **scale** | |\n| Core hardness / microstructure / grain size | |\n| **Decarburization limit** | |\n| **Sampling (quantity and frequency)** / test method | |\n\n### 8. At the line and change control\n\n| Field | Entry |\n|---|---|\n| **Available at the line as** | Work instruction ☐ Job card ☐ SCADA / PLC recipe ☐ Other ☐ · reference: |\n| **Reason for the change** (rev > 0) | |\n| Change review (rev > 0) | F-SPEC-02 |\n| Implemented on / by | |\n\n### 9. Sign-off\n\n| Prepared by | Reviewed by | Approved by (authorized, F-SPEC-03) | Approval date |\n|---|---|---|---|\n| | | | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-02_Change_Review.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPECIFICATION CHANGE REVIEW\n\n| Format No. | Rev. | Specification no. / new revision |\n|---|---|---|\n| MWSPL-F-SPEC-02 | 00 | PS-____ rev ___ |\n\nRequired for every revision after rev 0 before it can be approved (CALOR checks each line). **Legend:** ☐ tick · all lines required.\n\n| No. | Review item | Entry |\n|---|---|---|\n| 1 | Reason for the change | |\n| 2 | What changed (parameter: old → new) | |\n| 3 | Customer requirements checked (drawing, customer specification, PPAP values) and result | |\n| 4 | Customer notification | ☐ Not required: customer requirements not affected ☐ Customer notified ☐ Customer approval obtained (e.g. PPAP) |\n| 5 | Notification / approval reference (when notified or approved) | |\n| 6 | Control plan and PFMEA reviewed (regenerated if needed) | ☐ Yes — control plan no.: ______ PFMEA no.: ______ |\n| 7 | Validation (trial or first-off result) | Batch: ______ Result: ______ |\n\n| Prepared by (HT Engineer) | Notification decision (Quality Manager) | Approved by (authorized) | Date |\n|---|---|---|---|\n| | | | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-03_Authorization_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## AUTHORIZATION TO APPROVE PROCESS SPECIFICATIONS\n\n| Format No. | Rev. | List date |\n|---|---|---|\n| MWSPL-F-SPEC-03 | 00 | |\n\nCopied from the HT organization page (the same names are shown under \"Approved by\" on the Specifications page; there is no separate printout): the holder and deputy of the heat treat position (HTSA 1.1) and of every position marked \"authorized to approve process specifications\". CALOR accepts only these names as \"approved by\". **Legend:** HT = heat treat position · A = marked authorized position.\n\n| No. | Name | Position | Basis (HT / A) | Holder / deputy | Authorized from |\n|---|---|---|---|---|---|\n| 1 | | | HT | Holder | |\n| 2 | | | HT | Deputy | |\n| 3 | | | A | | |\n| 4 | | | A | | |\n| 5 | | | | | |\n\n| Issued by (Director / HT Manager) | Date | Next review |\n|---|---|---|\n| | | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-04_Register_and_Review.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPECIFICATION REGISTER AND PERIODIC REVIEW RECORD\n\n| Format No. | Rev. | Period |\n|---|---|---|\n| MWSPL-F-SPEC-04 | 00 | FY ______ |\n\nThe register itself is the CALOR Specifications register (Excel download: \"Download register (Excel)\"). This sheet records the yearly review of each specification in force, including reviews without a change (MWSPL-WI-SPEC-03 §1). **Legend:** Result NC = no change needed · RV = new revision started (number) · OB = made obsolete.\n\n| PS no. | Rev in force | Part no. | Process | Furnaces | Approved on | Review due | Reviewed on | By | Result (NC / RV / OB) | Remarks |\n|---|---|---|---|---|---|---|---|---|---|---|\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n\n| Reviewed by (HT Manager) | Date |\n|---|---|\n| | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-05_KPI.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPEC KPIs\n\n| Format No. | Rev. | Financial year |\n|---|---|---|\n| MWSPL-F-SPEC-05 | 00 | FY ______ (April–March assumed, to confirm) |\n\n**Source:** CALOR → Specifications (tiles and HTSA 1.6 panel), read on the first working day of each month. **Targets are provisional** (Section 3 of the handover note) until the HT Manager sets them.\n\n### 1. Monthly grid\n\n| Code | KPI | Target | Apr | May | Jun | Jul | Aug | Sep | Oct | Nov | Dec | Jan | Feb | Mar | YTD |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| SPEC-1 | Active part / furnace combinations without a specification in force | 0 | | | | | | | | | | | | | |\n| SPEC-2 | Specifications with the periodic review overdue | 0 | | | | | | | | | | | | | |\n| SPEC-3 | Revisions approved in the month | — (record) | | | | | | | | | | | | | |\n| SPEC-4 | Revisions without the implementation recorded within 7 days | 0 | | | | | | | | | | | | | |\n| SPEC-5 | Revisions in force with an incomplete change review | 0 | | | | | | | | | | | | | |\n| SPEC-6 | Drafts waiting for approval longer than 30 days | 0 | | | | | | | | | | | | | |\n| SPEC-7 | HTSA 1.6 score (S / NS / NIA) | S | | | | | | | | | | | | | |\n\nYTD: SPEC-3 = sum; the others = the last month's value.\n\n### 2. Current position (at the date of the review)\n\n| Specifications in force | Parts covered | Drafts | Reviews due within 30 days | Reviews overdue | HTSA 1.6 items not met |\n|---|---|---|---|---|---|\n| | | | | | |\n\n### 3. Quarterly review\n\n| Quarter | Findings (items not met, trends) | Action | Owner | Due | Closed |\n|---|---|---|---|---|---|\n| Q1 (Apr–Jun) | | | | | |\n| Q2 (Jul–Sep) | | | | | |\n| Q3 (Oct–Dec) | | | | | |\n| Q4 (Jan–Mar) | | | | | |\n\n### 4. Management review input summary\n\n| Input | Status | Comment |\n|---|---|---|\n| HTSA 1.6 self-assessment score and items not met | | |\n| Coverage of active processes by specifications in force | | |\n| Changes made in the period and their validation | | |\n| Overdue reviews and implementations | | |\n| Resources / authorization changes needed | | |\n\n| Prepared by (HT Engineer) | Reviewed by (HT Manager) | Date |\n|---|---|---|\n| | | |\n", "SPEC/04_Application/mwspl-spec-module.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPEC MODULE: APPLICATION DESCRIPTION\n\nThe application of this module is the CALOR page **`Process_Specifications.html`** in the repository root (tab PROCESS → Specifications in `CALOR.html`). It is not copied here: the build (`python suite/build.py`) reads it from the root, and a copy would drift. This file is the specification of the module for the QMS documents: the rules below are taken from the page's code, and the documents of this module must match them.\n\n| Item | Value in the code |\n|---|---|\n| Storage key | `psr-reg` (data), `psr-view` (filter, local only); Google Drive file `psr-reg.json` when linked |\n| Record | Specification `PS-nnnn`, `rev` 0…n, `status` draft / approved / obsolete, `revs[]` (snapshots of earlier revisions), `log[]` |\n| Processes | `PROC`: HT hardening & tempering (Table A), IA isothermal annealing (Table E), NORM normalizing (Table E) |\n| Processes per furnace | Setting `runs`: F-01: IA, HT · F-02: IA, NORM, HT · F-03: IA, NORM · F-04: IA, NORM; a furnace that does not run the process blocks the approval |\n| Line layout | `posH` 5,4,4 · `posT` 4,4,4 · `xfer` 18 min (measured) · `ccXfer` 2 min (IA transfers) |\n| Defaults for new specifications | tolerance ±10 °C, push ±0.5 min, quench delay 30 s, dip 8.5 ± 0.5 min, controlled cooling ±1 min, fan ±5 min |\n| Forms at the line | `FORMS`: work instruction, job card, computer-based recipe (SCADA / PLC), other |\n| Customer notification | `NOTIFY`: not required, notified, approval obtained (e.g. PPAP) |\n| Approval gate (`missing`) | part no., name, steel grade, approved furnaces, part weight, every step with its tolerance (`paramMiss`), hardness scale, decarburization limit, form at the line, prepared / reviewed / approved by, approver authorized (`isAuth`), approval date; rev > 0: reason + change review (`chgMissing`); plus no critical advice |\n| Authorization (`authList`) | In CALOR: HT organization API `authorized()` (holder and deputy of the HT position and of positions marked `specAuth`); standalone: Settings `auth` |\n| Implementation | `implDate`, `implBy` (not before the approval, not in the future); HTSA 1.6 \"not met\" when missing more than `implDays` (7) days after the approval |\n| Periodic review | `reviewDays` 365 after the approval of the revision in force; \"due\" `reviewSoon` 30 days before |\n| Active processes | parts produced on the Daily production page in the last `activeDays` (90) per furnace |\n| HTSA 1.6 score | `nia` no specification in force or an active part without one · `ns` any critical item · `s` otherwise |\n| Outputs | specification PDF / Excel, job card, register Excel (incl. sheet \"HTSA 1.6\"), HTSA 1.6 evidence PDF |\n| Used by | Hardness (requirements), Daily production (spec of each batch), Load build, CP & PFMEA (control plan rows), Equipment (class required), SCADA review (set values vs spec), Home |\n\n**Not in the CALOR page (handled by the documents):** a \"reviewed, no change\" entry for the periodic review (F-SPEC-04); a printout of the authorization list (F-SPEC-03); the rule that an active part without a specification runs only on the HT Manager's written instruction (WI-SPEC-03 §2.2).\n\n## Native module in the integrated application (pilot, 22-Oct-2026)\n\nThe same module is also built natively in the form of the MWSPL Integrated Application (the IATF 16949 application's UI/UX): **`QMS/00_Integrated_Application/calor-quality-system.html`**, one self-contained file with an Overview and the module \"Process specifications\". It is the pilot for moving CALOR into that form; until the user decides, the CALOR page above stays the application in use.\n\n| Item | Native module |\n|---|---|\n| Source | `QMS/SPEC/04_Application/mwspl-spec-module.js` (module), `QMS/00_Integrated_Application/src/` (shell head, CSS, Overview); build `python QMS/00_Integrated_Application/build.py` (never edit the built file) |\n| Views (PDCA) | Dashboard · **P** Register, Authorization & settings · **D** At the line (job cards, implementation) · **C** Review & HTSA 1.6, KPIs (financial year) · **A** Revisions · Rules, Documentation (this module's documents, embedded), Data |\n| Records | collections `specs` (one document per specification `PS-nnnn`, same fields as `psr-reg`) and `config/settings`; shared record store when published with the `db` capability (collection prefix `spec-`), else this browser only (`localStorage` `mws-spec-local-v1`, banner \"Local mode\") |\n| Rules | the same approval gate, change review, authorization, implementation and HTSA 1.6 rules as the CALOR page (copied from its code) |\n| Added | **Record review (no change)** on the Review view: date, reviewer, note; it restarts the periodic review of the revision in force (the gap of WI-SPEC-03 §1.3 / F-SPEC-04 is closed in this module) |\n| Delete | armed button (second click confirms), never a browser dialog; only never-approved drafts |\n| Data | export / import JSON (merge or replace), CSV of the register, **Import from CALOR** (reads `psr-reg` in the same browser), starter set-up (three example specifications), clear all (type CLEAR ALL) |\n| Links | reads CALOR's `org-reg` (authorized names) and `prod-reg` (active parts) in the same browser when present |\n| API | `MWS.spec.stats()`, `summary()`, `inForce()`, `closeModal()` (used by the Overview) |\n| Test hook | `window.__SPECM` (`S`, `eff`, `calc`, `missing`, `assess16`, `review`, `kp`) |\n"};</script>

/* documentation: the markdown files embedded by the build (MWS.docs), else fetched from docs/ next to the HTML */
function md(src){
  const inl=t=>esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,a,h)=>/\.md$/.test(h)?`<a href="#docs" data-docref="${esc(h)}">${a}</a>`:`<a href="${esc(h)}" target="_blank" rel="noopener">${a}</a>`);
  const L=String(src).replace(/\r/g,"").split("\n"),out=[];let i=0;
  while(i<L.length){const l=L[i];
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push(`<pre>${esc(b.join("\n"))}</pre>`);continue;}
    const h=l.match(/^(#{1,4})\s+(.*)$/);if(h){out.push(`<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`);i++;continue;}
    if(/^\|/.test(l)&&i+1<L.length&&/^\|\s*:?-{2,}/.test(L[i+1])){const row=x=>x.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());const hd=row(l);i+=2;const rs=[];
      while(i<L.length&&/^\|/.test(L[i]))rs.push(row(L[i++]));out.push(`<div class="tw"><table><thead><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue;}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ol=/^\s*\d+\./.test(l),it=[];while(i<L.length&&/^\s*([-*]|\d+\.)\s+/.test(L[i])){it.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/,"").replace(/^\[ \]\s*/,"☐ ").replace(/^\[x\]\s*/i,"☑ "));i++;}
      out.push(`<${ol?"ol":"ul"}>${it.map(x=>`<li>${inl(x)}</li>`).join("")}</${ol?"ol":"ul"}>`);continue;}
    if(/^>\s?/.test(l)){const b=[];while(i<L.length&&/^>\s?/.test(L[i]))b.push(L[i++].replace(/^>\s?/,""));out.push(`<div class="banner">${inl(b.join(" "))}</div>`);continue;}
    if(/^---+\s*$/.test(l)){out.push("<hr>");i++;continue;}
    if(!l.trim()){i++;continue;}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|```|\||\s*([-*]|\d+\.)\s|>)/.test(L[i]))p.push(L[i++]);out.push(`<p>${inl(p.join(" "))}</p>`);}
  return out.join("\n");
}

    <label class="chk wide"><input type="checkbox" data-pc="chg.cp" ${e.chg.cp?"checked":""} ${locked?"disabled":""}>Control plan and PFMEA reviewed</label>${mf("chg.valid","Validation (trial or first-off result)",{area:2,wide:1,req:1})}</div></fieldset>`:""}

/* sketch of temperature vs time through the line (set values per zone, ± tolerance band; schematic, not a measured curve) */
function profileSvg(e,c){
  if(!c)return `<p class="small muted">Enter the push time to draw the temperature–time sketch.</p>`;
  const AMB=30,R=ROLE[e.proc],H=[0,1,2].map(i=>num(e.h[i])),T=[0,1,2].map(i=>num(e.t[i]));
  if(H.some(v=>v==null)||T.some(v=>v==null))return `<p class="small muted">Enter every zone set value to draw the temperature–time sketch.</p>`;
  const HT=[0,1,2].map(i=>num(e.htol[i])||0),TT=[0,1,2].map(i=>num(e.ttol[i])||0);
  const P=[],band=[],segs=[];let t=0;
  const zones=(set,tol,dur,pre,from)=>{set.forEach((v,i)=>{const d=dur[i],r=Math.min(d*.35,i?d*.15:d*.6);
    P.push([t+r,v]);band.push([t,t+d,v-tol[i],v+tol[i]]);segs.push([t,t+d,pre+(i+1),v]);t+=d;P.push([t,v]);});};
  P.push([0,AMB]);zones(H,HT,c.zh,"H",AMB);const tH=t;
  let mid,midLbl;
  if(e.proc==="HT"){const q=num(e.q.tHi)!=null&&num(e.q.tLo)!=null?(num(e.q.tLo)+num(e.q.tHi))/2:(e.q.medium==="water"?30:60),
      dl=(num(e.q.delay)||30)/60,dp=num(e.q.dip)||8.5;
    P.push([t+dl,H[2]]);P.push([t+dl+.3,q]);P.push([t+dl+dp,q]);P.push([t+c.gap,Math.max(q,AMB)]);midLbl=`Quench · dip ${fx(dp,1)} min`;}
  else if(e.proc==="IA"){const tg=num(e.cc.target),cool=c.cool||0;P.push([t+cool,tg!=null?tg:T[0]]);P.push([t+c.gap,tg!=null?tg:T[0]]);midLbl=`Controlled cooling ${fx(cool,0)} min`;
    if(tg!=null)band.push([t,t+cool,tg-(num(e.cc.targetTol)||0),tg+(num(e.cc.targetTol)||0)]);}
  else{P.push([t+c.gap,H[2]-30]);midLbl=`Transfer ${fx(c.gap,0)} min`;}
  segs.push([t,t+c.gap,"mid",null]);t+=c.gap;const tT=t;
  zones(T,TT,c.zt,"T");const tE=t;
  const after=e.proc==="NORM"&&e.nm.fan==="required"?(num(e.nm.fanTime)||20):Math.max(20,c.total*.08);
  P.push([t+after,AMB+20]);t+=after;
  const W=760,Hh=270,L=46,Rr=12,Tp=26,B=50,xs=v=>L+v/t*(W-L-Rr),Ymax=Math.ceil((Math.max(...H,...T)+60)/100)*100,ys=v=>Tp+(1-v/Ymax)*(Hh-Tp-B);
  const step=t>600?120:t>300?60:30,ticks=[];for(let v=0;v<=t;v+=step)ticks.push(v);
  const yt=[];for(let v=0;v<=Ymax;v+=Ymax>800?200:100)yt.push(v);
  const g=[];
  yt.forEach(v=>g.push(`<line x1="${L}" x2="${W-Rr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end" class="ax">${v}</text>`));
  ticks.forEach(v=>g.push(`<text x="${xs(v)}" y="${Hh-B+14}" text-anchor="middle" class="ax">${v}</text>`));
  band.forEach(b=>g.push(`<rect x="${xs(b[0])}" y="${ys(b[3])}" width="${Math.max(0,xs(b[1])-xs(b[0]))}" height="${Math.max(1,ys(b[2])-ys(b[3]))}" fill="var(--accent-2)"/>`));
  [[0,tH,`Hardening chamber · ${pos(C().posH).reduce((a,b)=>a+b,0)} trays`],[tH,tT,R.mid],[tT,tE,`Tempering chamber · ${pos(C().posT).reduce((a,b)=>a+b,0)} trays`],[tE,t,e.proc!=="NORM"?"Air cooling":e.nm.fan==="required"?"Fan cooling":"Still air"]].forEach(([a,b,lb],i)=>{
    if(i)g.push(`<line x1="${xs(a)}" x2="${xs(a)}" y1="${Tp-8}" y2="${Hh-B}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>`);
    g.push(`<text x="${i===3?W-Rr:(xs(a)+xs(b))/2}" y="${Hh-B+30}" text-anchor="${i===3?"end":"middle"}" class="lb">${esc(i===1?midLbl:lb)}</text>`);});
  segs.filter(s=>s[2]!=="mid").forEach(s=>g.push(`<text x="${(xs(s[0])+xs(s[1]))/2}" y="${ys(s[3])-7}" text-anchor="middle" class="vl">${s[3]}</text><text x="${(xs(s[0])+xs(s[1]))/2}" y="${Hh-B-5}" text-anchor="middle" class="zl">${s[2]}</text>`));
  const pts=P.map(p=>`${xs(p[0]).toFixed(1)},${ys(p[1]).toFixed(1)}`).join(" ");
  return `<figure class="prof"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Temperature against time through the line: ${esc(R.h)} ${H.join(" / ")} °C, ${esc(midLbl)}, ${esc(R.t)} ${T.join(" / ")} °C, ${fx(c.total,0)} min through the line">
  <style>.prof .ax{font:11px var(--f-mono,monospace);fill:var(--muted)}.prof .lb{font:600 11.5px var(--f-body,sans-serif);fill:var(--ink)}.prof .vl{font:600 11px var(--f-mono,monospace);fill:var(--ink)}.prof .zl{font:10.5px var(--f-mono,monospace);fill:var(--muted)}</style>
  ${g.join("")}<line x1="${L}" x2="${W-Rr}" y1="${Hh-B}" y2="${Hh-B}" stroke="var(--muted)" stroke-width="1"/>
  <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="${L}" y="12" class="ax">°C</text><text x="${L}" y="${Hh-4}" class="ax">time from loading into the hardening chamber, min</text></svg>
  <figcaption class="small muted">Sketch: set value per zone with its tolerance band (shaded), push ${esc(e.push)} min, ${fx(c.total,0)} min through the line. Ramps, the quench / cooling curve and the cooling after exit are schematic, not measured.</figcaption></figure>`;
}

    :e.proc==="IA"?`Controlled cooling ${e.cc.time} ± ${e.cc.timeTol||"?"} min · ${e.cc.method}${e.cc.target?` · target ${e.cc.target} ± ${e.cc.targetTol||"?"} °C`:""}`:`Transfer ≤ ${e.nm.transfer} min · fan cooling ${e.nm.fan==="required"?e.nm.fanTime+" ± "+(e.nm.fanTol||"?")+" min":"not required"}`;

  <div class="tw"><table><thead><tr><th></th><th class="n">Zone 1</th><th class="n">Zone 2</th><th class="n">Zone 3</th></tr></thead><tbody>
  <tr><td><b>Hardening · ${R.h}</b></td>${[0,1,2].map(i=>`<td class="n">${esc(e.h[i])} ± ${esc(e.htol[i])} °C</td>`).join("")}</tr>
  <tr><td><b>Tempering · ${R.t}</b></td>${[0,1,2].map(i=>`<td class="n">${esc(e.t[i])} ± ${esc(e.ttol[i])} °C</td>`).join("")}</tr></tbody></table></div>
  <p><b>Push</b> ${esc(e.push)} ± ${esc(e.pushTol)} min${c?` · through the line ${fx(c.total,0)} min`:""}<br><b>${R.mid}</b> ${esc(mid)}<br><b>Requirements</b> ${esc(hardTxt(e))}${e.req.core?" · core "+esc(e.req.core):""}${e.req.micro?" · "+esc(e.req.micro):""} · decarburization ${esc(e.req.decarb)} · sampling ${esc(e.req.sample)}</p>
  <h3>Temperature – time</h3>${profileSvg(e,c)}
  <p class="small">Approved ${fmtD(e.apprDate)} by ${esc(e.appr)}</p></div>`,`<button class="pri" data-print>Print</button><button data-close>Close</button>`);}

const msg=(t,ok)=>{if(!S.modal)return;S.modal.msg=t?`<span style="color:var(--${ok?"ok":"bad"})">${esc(t)}</span>`:"";const el=$("#mmsg");if(el)el.innerHTML=S.modal.msg;};

/* actions on a specification */
async function saveSpec(){const e=S.modal.ed;if(!String(e.part).trim()){msg("Enter the part no. first.");return;}
  const isNew=!e.id;if(isNew){e.id=nextCode("PS",S.specs);}
  if(await save(e,isNew?"Specification created (draft)":"Draft saved")){S.modal.ed=fill(S.specs.find(x=>x.id===e.id)||e);msg("Saved.",1);redraw();}else if(isNew)e.id="";}
async function approve(){const e=S.modal.ed,m=missing(e),crit=advice(e).filter(a=>a[0]==="crit");
  if(m.length||crit.length){msg("Not approved. Missing: "+[...m,...crit.map(a=>a[1])].join(" · "));return;}
  if(!e.id)e.id=nextCode("PS",S.specs);e.status="approved";
  if(await save(e,`Revision ${e.rev} approved by ${e.appr}`)){toast(`${docNo(e)} approved`);closeModal();}else e.status="draft";}
async function revise(){const e=S.modal.ed,snap=clone(e);delete snap.revs;delete snap.log;delete snap.reviews;
  e.revs.push(snap);e.rev+=1;e.status="draft";Object.assign(e,{appr:"",apprDate:"",change:"",implDate:"",implBy:"",chg:{cust:"",notify:"",notifyRef:"",cp:false,valid:""}});
  if(await save(e,`New revision ${e.rev} started (rev ${e.rev-1} stays in force)`)){S.modal.ed=fill(S.specs.find(x=>x.id===e.id));msg("Revision "+e.rev+" started; rev "+(e.rev-1)+" stays in force until it is approved.",1);redraw();}}
async function discard(){const e=S.modal.ed,last=e.revs.at(-1);if(!last)return;const o={...clone(last),revs:e.revs.slice(0,-1),log:e.log,reviews:e.reviews};
  if(await save(o,`Revision ${e.rev} discarded; rev ${last.rev} in force`)){toast("Revision discarded");closeModal();}}
function armedDelete(b,fn){if(b.classList.contains("armed")){fn();return;}b.classList.add("armed");const t=b.textContent;b.textContent="Confirm delete";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent=t;}},4000);}
async function stdOps(){if(!needDb())return;const d=today(),who={prep:"A. Verma (example)",revBy:"S. Gupta (example)",appr:"R. Sharma (example)"};
  S.cfg={...S.cfg,auth:"R. Sharma (example)\nS. Gupta (example)"};await dbSet("config","settings",S.cfg);
  const L=[fill({id:"PS-0001",part:"EX-1001",name:"Example shaft",customer:"Example customer",grade:"42CrMo4",proc:"HT",furnaces:["F-02"],pcs:"60",wt:"1.8",h:["840","870","870"],t:["560","580","580"],push:"12",
      q:{medium:"oil",tLo:"50",tHi:"80",delay:"30",dip:"8.5",dipTol:"0.5",transfer:"5",agit:"Required"},form:"job",formRef:"Job card",req:{hMin:"28",hMax:"32",scale:"HRC",micro:"Tempered martensite",decarb:"≤ 0.10 mm total",sample:"2 pcs per batch (first and last tray)",method:"WI hardness testing"},
      ...who,status:"approved",apprDate:addDays(d,-200),implDate:addDays(d,-198),implBy:"Shift supervisor (example)",log:[{d:addDays(d,-200),t:"Example created"}]}),
    fill({id:"PS-0002",part:"EX-2001",name:"Example gear blank",grade:"20MnCr5",proc:"IA",furnaces:["F-03"],pcs:"24",wt:"3.5",h:["880","930","930"],t:["650","650","650"],push:"18",
      cc:{time:"12",timeTol:"1",method:"Forced-air cooling",target:"650",targetTol:"20"},form:"recipe",formRef:"SCADA recipe R-2001",req:{hMin:"156",hMax:"207",scale:"HB",micro:"Ferrite and pearlite, no bainite",decarb:"≤ 0.15 mm total",grain:"ASTM 5–8",sample:"1 pc per batch"},
      ...who,status:"approved",apprDate:addDays(d,-30),log:[{d:addDays(d,-30),t:"Example created"}]}),
    fill({id:"PS-0003",part:"EX-3001",name:"Example flange",grade:"C45",proc:"NORM",furnaces:["F-04"],pcs:"30",wt:"2.2",h:["720","740","750"],t:["860","880","880"],push:"10",nm:{transfer:"20",fan:"none"},
      req:{hMin:"170",hMax:"220",scale:"HB",decarb:"≤ 0.2 mm",sample:"1 pc per batch"},prep:"A. Verma (example)",log:[{d,t:"Example created (draft)"}]})];
  for(const s of L)await dbSet("specs",s.id,s);toast("Starter set-up loaded");}

/* 9. data: export / import / CSV / clear */
async function download(name,text,type){
  if(S.dl){try{await S.dl.save({filename:name,data:new Blob([text],{type})});return;}catch(e){if(e&&e.code==="declined")return;}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
const exportJson=()=>download(`mws-spec-${today()}.json`,JSON.stringify({app:"mws-spec-manager",v:1,saved:new Date().toISOString(),specs:S.specs,config:S.cfg},null,1),"application/json");
function csv(){const q=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const H=["Spec","Rev","Status","Part","Name","Customer","Grade","Process","Furnaces","Push","Hardness","Approved","Approved by","Implemented","Review due"];
  const R=S.specs.map(s=>{const e=eff(s)||s;return [s.id,s.rev,STATUS[s.status][1],s.part,s.name,s.customer,s.grade,PROC[s.proc],s.furnaces.join(" "),e.push,hardTxt(e),e.apprDate,e.appr,e.implDate,review(s).due||""];});
  download(`mws-spec-register-${today()}.csv`,"﻿"+[H,...R].map(r=>r.map(q).join(",")).join("\r\n"),"text/csv");}
function readImport(f){f.text().then(t=>{let o;try{o=JSON.parse(t);}catch(e){toast("Not a JSON file");return;}
  const specs=Array.isArray(o&&o.specs)?o.specs.filter(s=>s&&ID_RE.test(String(s.id||""))):null;
  if(!specs){toast("No specifications in this file");return;}
  S.imp={specs:specs.map(fill),config:o.config&&typeof o.config==="object"?o.config:null,msg:`${f.name}: ${plural(specs.length,"specification")}${o.config?" and settings":""}.`};render();});}
async function doImport(mode){if(!S.imp||!needDb())return;const I=S.imp;S.imp=null;
  if(mode==="replace")for(const s of S.specs)if(!I.specs.some(x=>x.id===s.id))await dbDel("specs",s.id);
  for(const s of I.specs)await dbSet("specs",s.id,s);if(I.config){const c={...DEF,...I.config};delete c.id;await dbSet("config","settings",c);}
  toast(`${plural(I.specs.length,"specification")} imported (${mode})`);render();}
async function importCalor(){if(!needDb())return;let o=null;try{o=JSON.parse(localStorage.getItem("psr-reg")||"null");}catch(e){}
  if(!o||!Array.isArray(o.specs)){toast("No CALOR specifications in this browser");return;}
  const L=o.specs.filter(s=>s&&ID_RE.test(String(s.id||""))).map(fill);for(const s of L)await dbSet("specs",s.id,s);
  if(o.settings){const keep={};Object.keys(DEF).forEach(k=>{if(o.settings[k]!=null)keep[k]=o.settings[k];});S.cfg={...S.cfg,...keep};await dbSet("config","settings",S.cfg);}
  toast(`${plural(L.length,"specification")} imported from CALOR`);}
async function clearAll(){if(($("#clrtxt")||{}).value!=="CLEAR ALL"){toast("Type CLEAR ALL to clear");return;}if(!needDb())return;
  for(const s of S.specs)await dbDel("specs",s.id);await dbDel("config","settings");toast("All specification data cleared");}

/* 10. wiring */
onDoc("click",e=>{
  const b=e.target.closest("button,tr.click,a[data-docref]");if(!b)return;const d=b.dataset;
  if(b.closest("#modal")||d.close!==undefined){
    if(d.close!==undefined){closeModal();return;}
    if(d.saveSpec!==undefined){saveSpec();return;}if(d.approve!==undefined){approve();return;}if(d.revise!==undefined){revise();return;}if(d.discard!==undefined){discard();return;}
    if(d.obs!==undefined){openModal({kind:"obs",id:S.modal.ed.id,why:""});return;}
    if(d.delSpec!==undefined){armedDelete(b,async()=>{const id=S.modal.ed.id;try{await dbDel("specs",id);toast(id+" deleted");closeModal();}catch(x){msg("Not deleted: "+errMsg(x));}});return;}
    if(d.saveImpl!==undefined){const m=S.modal,dt=$("#im-date").value,by=$("#im-by").value.trim(),s=clone(S.specs.find(x=>x.id===m.id));
      if(!isDate(dt)||!by){msg("Enter the date and who implemented it.");return;}if(dt<s.apprDate){msg("Not before the approval date ("+fmtD(s.apprDate)+").");return;}if(dt>today()){msg("Not in the future.");return;}
      s.implDate=dt;s.implBy=by;save(s,`Implemented at the line on ${dt} by ${by}`).then(ok=>{if(ok){toast("Implementation recorded");closeModal();}});return;}
    if(d.saveRev!==undefined){const m=S.modal,dt=$("#rv-date").value,by=$("#rv-by").value.trim(),s=clone(S.specs.find(x=>x.id===m.id)),ef=eff(s);
      if(!isDate(dt)||!by){msg("Enter the date and the reviewer.");return;}if(dt>today()||dt<ef.apprDate){msg("Between the approval of the revision in force and today.");return;}
      s.reviews.push({date:dt,by,rev:ef.rev,note:$("#rv-note").value.trim(),res:"nc"});save(s,`Periodic review without change by ${by}`).then(ok=>{if(ok){toast("Review recorded");closeModal();}});return;}
    if(d.saveObs!==undefined){const why=$("#ob-why").value.trim(),s=clone(S.specs.find(x=>x.id===S.modal.id));if(!why){msg("Give the reason.");return;}
      s.status="obsolete";s.obsReason=why;s.obsDate=today();save(s,"Made obsolete: "+why).then(ok=>{if(ok){toast(s.id+" made obsolete");closeModal();}});return;}
    if(d.print!==undefined){document.body.classList.add("pm");window.print();setTimeout(()=>document.body.classList.remove("pm"),500);return;}
  }
  if(d.impl){const s=S.specs.find(x=>x.id===d.impl);openModal({kind:"impl",id:d.impl,date:today(),by:"",msg:""});return;}
  if(d.job){const s=S.specs.find(x=>x.id===d.job);if(s&&eff(s))openModal({kind:"job",s});return;}
  if(d.review){openModal({kind:"rev",id:d.review,date:today(),by:"",note:"",msg:""});return;}
  if(d.h16!==undefined){openModal({kind:"h16"});return;}
  if(d.spec){specModal(d.spec);return;}
  if(d.newSpec!==undefined){if(needDb())specModal(null);return;}
  if(d.std!==undefined){stdOps();return;}
  if(d.saveCfg!==undefined){document.querySelectorAll("[data-cfg]").forEach(i=>{const k=i.dataset.cfg,t=(SETF.find(x=>x[0]===k)||[])[2];S.cfg[k]=t==="number"?(num(i.value)??DEF[k]):i.value;});saveCfg();return;}
  if(d.fy){S.fy+=+d.fy;render();return;}
  if(d.doc){S.docSel=d.doc;render();return;}
  if(d.docref){e.preventDefault();const p=DOCS.find(x=>x[0].endsWith(d.docref.replace(/^(\.\.\/)+/,"").replace(/^\.\//,"")));if(p){S.docSel=p[0];render();}return;}
  if(d.export!==undefined){exportJson();return;}if(d.csv!==undefined){csv();return;}
  if(d.imp){if(d.imp==="cancel"){S.imp=null;render();}else doImport(d.imp);return;}
  if(d.calor!==undefined){importCalor();return;}
  if(d.clear!==undefined){armedDelete(b,clearAll);return;}
});
onDoc("input",e=>{const el=e.target;
  if(el.dataset.p&&S.modal&&S.modal.ed&&el.tagName!=="SELECT"){setp(S.modal.ed,el.dataset.p,el.value);return;}
  if(el.dataset.filt==="q"){S.filt.q=el.value;clearTimeout(S._ft);S._ft=setTimeout(()=>{render();const i=$("[data-filt=q]");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250);}
});
onDoc("change",e=>{const el=e.target;
  if(el.dataset.p&&S.modal&&S.modal.ed&&el.tagName==="SELECT"){setp(S.modal.ed,el.dataset.p,el.value);redraw();return;}
  if(el.dataset.pc&&S.modal){setp(S.modal.ed,el.dataset.pc,el.checked);return;}
  if(el.dataset.fur&&S.modal){const f=el.dataset.fur,L=S.modal.ed.furnaces;S.modal.ed.furnaces=el.checked?[...new Set([...L,f])].sort():L.filter(x=>x!==f);redraw();return;}
  if(el.dataset.filt&&el.dataset.filt!=="q"){S.filt[el.dataset.filt]=el.value;render();return;}
  if(el.id==="impfile"&&el.files[0]){readImport(el.files[0]);el.value="";}
});
onDoc("keydown",e=>{if(e.key==="Escape"&&S.modal)closeModal();});
onWin("hashchange",()=>{route();S.pending=false;render();window.scrollTo(0,0);});

/* 11. integration API */
MWS.spec={closeModal,
  stats:()=>{const k=kp();return {db:S.dbState,n:S.specs.length,inForce:k.inForce,drafts:k.drafts,over:k.over,soon:k.soon,implLate:k.implLate,noSpec:k.noSpec,score:k.score,label:SCORE[k.score][1],cls:SCORE[k.score][0]};},
  summary:()=>{const k=kp();return `${plural(k.inForce,"process specification")} in force (${plural(k.parts,"part")}), HTSA 1.6 ${SCORE[k.score][1].toLowerCase()}${k.over?`, ${k.over} review(s) overdue`:""}.`;},
  inForce:()=>S.specs.map(s=>eff(s)).filter(Boolean).map(e=>({id:e.id,rev:e.rev,part:e.part,name:e.name,proc:e.proc,furnaces:e.furnaces,push:e.push,h:e.h,t:e.t,htol:e.htol,ttol:e.ttol,req:e.req}))};

window.__SPECM={S,eff,calc,missing,assess16,review,kp,profileSvg};

/* 12. boot */
async function boot(){
  route();render();
  const [dl,user,db]=await Promise.all([useCap("downloads"),useCap("user"),useCap("db")]);
  S.dl=dl;
  if(user){try{const c=await user.can("data.write");S.canWrite=c!==false;}catch(e){}}
  if(db)startStore(sharedDb(db),"on");else startStore(localDb(),"local");
}
boot();

})(MWS.loc("spec"));
</script>
<script>
/* ---------- shell: Overview page (after every module) ---------- */
function renderHome(){
  if(MWS.app!=="home")return;
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
  const sp=MWS.spec?MWS.spec.stats():null;

  const st=document.getElementById("dbstate");if(st)st.textContent=sp?(dbs[sp.db]||"Connecting…"):"—";

  const specCard=sp?`<section class="panel"><div class="row between"><h2>Process specifications</h2><a class="pill ${sp.cls}" href="#spec/review">HTSA 1.6 · ${esc(sp.label)}</a></div>
    <p class="muted">${esc(MWS.spec.summary())}</p>
    <div class="tiles">${tile("In force",sp.inForce,"","#spec/specs")}${tile("Drafts awaiting approval",sp.drafts,sp.drafts?"warn":"ok","#spec/specs")}${tile("Reviews overdue",sp.over,sp.over?"bad":"ok","#spec/review")}${tile("Reviews due soon",sp.soon,sp.soon?"warn":"ok","#spec/review")}${tile("Implementation late",sp.implLate,sp.implLate?"bad":"ok","#spec/line")}${tile("Active parts without a spec",sp.noSpec,sp.noSpec?"bad":"ok","#spec/review")}</div>
    <p class="row"><a class="btn pri" href="#spec/dash">Open Process specifications</a><a class="btn" href="#spec/specs">Register</a><a class="btn" href="#spec/line">At the line</a></p></section>`:"";
  document.getElementById("main").innerHTML=`
  <section class="panel"><h2>Heat treat quality system</h2>
    <p class="muted">One application for the CQI-9 heat treat system of the plant. Each module keeps its own records and follows its procedure; the Overview collects their status. This build holds the pilot module, Process specifications (MWSPL-QP-SPEC-01); the other modules of the CALOR register follow in the same form.</p>
    <div class="grid3">
      <div><b>Furnaces</b><p class="small">F-01 … F-04, continuous gas-fired pushers, identical; hardening chamber 13 trays (5/4/4), controlled cooling chamber, tempering chamber 12 trays (4/4/4).</p></div>
      <div><b>Processes</b><p class="small">F-01 isothermal annealing, hardening &amp; tempering (water quench) · F-02 isothermal annealing, normalizing, hardening &amp; tempering (oil quench) · F-03, F-04 isothermal annealing, normalizing.</p></div>
      <div><b>Line</b><p class="small">Time through the line = 13 × push + 18 min transfer + 12 × push · HK trays max. 200 kg · every lot shot blasted.</p></div>
    </div></section>
  ${specCard}
  <section class="panel"><h2>How the modules connect</h2>
    <p class="small muted">Process specifications are the controlled recipes. Production, load build, the SCADA review, hardness testing and the control plan read the revision in force; the HT organization names who may approve them. Until those modules join this application, the Specifications module reads their CALOR records in this browser (authorized names, parts produced in the last 90 days) when they exist.</p></section>`;
}
shellRoute();
