<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CALOR Quality System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* CALOR Quality System: design system (tokens and components of the MWSPL Integrated Quality System, UI/UX Reuse Handover §4).
   Rebrand by changing the tokens only; keep the three :root blocks (light, media-query dark, forced dark) in sync. */
:root{
  --bg:#f1f3f1;--panel:#ffffff;--sunk:#e7eae7;--ink:#1a2026;--muted:#5a6570;--line:#d3d8d5;
  --accent:#1d5b78;--accent-2:#e1edf2;--on-accent:#ffffff;
  --ok:#1f7a45;--ok-bg:#dff1e5;--warn:#8a5a00;--warn-bg:#fbefd5;--bad:#b02a2a;--bad-bg:#f8dede;
  --s1:#2a78d6;--s2:#eb6834;--band:rgba(42,120,214,.10);--settle:rgba(90,101,112,.14);
  --f-display:"Barlow Semi Condensed",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111518;--panel:#191f23;--sunk:#222a2f;--ink:#e2e7ea;--muted:#96a2aa;--line:#2c353b;
  --accent:#74b5d2;--accent-2:#1b2f39;--on-accent:#0d1a20;
  --ok:#6fcf97;--ok-bg:#16301f;--warn:#e8b45a;--warn-bg:#33270f;--bad:#f08a8a;--bad-bg:#3a1a1a;--s1:#3987e5;--s2:#d95926;--band:rgba(57,135,229,.16);--settle:rgba(150,162,170,.16);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111518;--panel:#191f23;--sunk:#222a2f;--ink:#e2e7ea;--muted:#96a2aa;--line:#2c353b;
  --accent:#74b5d2;--accent-2:#1b2f39;--on-accent:#0d1a20;
  --ok:#6fcf97;--ok-bg:#16301f;--warn:#e8b45a;--warn-bg:#33270f;--bad:#f08a8a;--bad-bg:#3a1a1a;--s1:#3987e5;--s2:#d95926;--band:rgba(57,135,229,.16);--settle:rgba(150,162,170,.16);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0}
h2{font-size:20px}h3{font-size:16px}
a{color:var(--accent)}
.mono,code{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}.small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* page */
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
.brand .co{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-size:26px;line-height:1.1}
.ctrl{display:grid;grid-template-columns:repeat(4,auto);border:1px solid var(--line);font-size:12px;background:var(--panel)}
.ctrl>div{padding:4px 10px;border-right:1px solid var(--line)}.ctrl>div:last-child{border-right:0}
.ctrl b{display:block;font-weight:500;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.hdr-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* navigation */
nav.sys{background:var(--bg);border-bottom:1px solid var(--line)}
nav.sys .wrap{display:flex;gap:4px;flex-wrap:wrap;padding-top:8px}
nav.sys a{font-family:var(--f-display);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);padding:7px 14px;border:1px solid var(--line);border-top:3px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:var(--panel)}
nav.sys a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav#nav{background:var(--panel);border-top:3px solid var(--accent);border-bottom:1px solid var(--line)}
nav#nav .wrap{display:flex;gap:6px 18px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pd{font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--on-accent);background:var(--accent);border-radius:3px;padding:1px 6px;margin-right:2px}
.grp a{font-family:var(--f-display);font-weight:600;font-size:14.5px;text-decoration:none;color:var(--ink);padding:4px 9px;border-radius:4px}
.grp a:hover{background:var(--sunk)}
.grp a[aria-current="page"]{background:var(--accent-2);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

/* layout helpers */
main.wrap{padding-top:18px;padding-bottom:40px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}.between{justify-content:space-between}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.row>h2,.row>h3{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.panel>h3{margin-bottom:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.fields .wide{grid-column:1/-1}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--ink)}
a.tile:hover{border-color:var(--accent)}
.tile .k{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1}
.tile.ok .v{color:var(--ok)}.tile.warn .v{color:var(--warn)}.tile.bad .v{color:var(--bad)}

/* status */
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.acc{background:var(--accent-2);color:var(--accent)}
.banner{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel);border-radius:4px;padding:8px 12px}
.banner.warn{border-left-color:var(--warn);background:var(--warn-bg)}.banner.bad{border-left-color:var(--bad);background:var(--bad-bg)}.banner.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.verdict{font-family:var(--f-display);font-weight:700;font-size:22px}
.verdict.acc{color:var(--ok)}.verdict.cond{color:var(--warn)}.verdict.rej{color:var(--bad)}
ul.issues{margin:6px 0 0;padding-left:18px}ul.issues li{margin:2px 0}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.c,th.c{text-align:center}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0}

/* forms */
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px}
label.f>span{font-size:12px;color:var(--muted)}
label.f.req>span::after{content:" *";color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk);color:var(--muted)}
textarea{min-height:60px;resize:vertical}
.chk{display:inline-flex;gap:6px;align-items:center;margin-right:14px;font-size:13.5px}.chk input{width:auto}
.grid-in{display:grid;grid-template-columns:150px repeat(3,minmax(70px,1fr));gap:6px 10px;align-items:center}
.grid-in .h{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* buttons */
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--ink)}
button.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{color:var(--bad);border-color:var(--bad)}button.danger.armed{background:var(--bad);color:#fff}
button.link{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
button:disabled{opacity:.5;cursor:not-allowed}
body.ro .w{display:none!important}

/* charts */
.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:160px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:10px;background:var(--accent);border-radius:2px}

/* PDCA strip */
.pdca{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pdca>div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.pdca .ph{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent)}

/* overlay */
#modal{position:fixed;inset:0;background:rgba(10,14,16,.5);z-index:50;overflow:auto;padding:24px 12px}
#modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:980px;margin:0 auto;padding:16px 18px}
.sheet h2{margin-bottom:6px}
fieldset{border:1px solid var(--line);border-radius:6px;margin:12px 0 0;padding:10px 12px;min-width:0}
table.obs input{width:100%;min-width:70px}table.obs td{vertical-align:middle}
legend{font-family:var(--f-display);font-weight:600;font-size:15px;padding:0 6px}
.sticky-foot{position:sticky;bottom:-16px;background:var(--panel);border-top:1px solid var(--line);margin:14px -18px -16px;padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.sticky-foot .msg{margin-right:auto;font-size:13px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}

/* documentation viewer */
.docs{display:grid;grid-template-columns:280px 1fr;gap:16px}
.doclist{display:flex;flex-direction:column;gap:2px}
.doclist button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:4px;font-size:13px}
.doclist button[aria-current="true"]{background:var(--accent-2);color:var(--accent);font-weight:600}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;overflow-x:auto}
.doc h1{font-size:15px;color:var(--muted);letter-spacing:.08em}.doc h2{font-size:21px;margin:6px 0 10px}.doc h3{font-size:17px;margin:16px 0 6px}.doc h4{font-size:15px;margin:12px 0 4px}
.doc table{margin:8px 0;font-size:13px}.doc th{position:static}
.doc pre{background:var(--sunk);padding:10px;border-radius:4px;overflow-x:auto;font-size:12px;line-height:1.35}
.doc ul{padding-left:20px}

/* empty state */
.empty{text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:32px 16px}
.empty p{color:var(--muted)}

/* responsive */
@media (max-width:860px){.grid3{grid-template-columns:1fr 1fr}.docs{grid-template-columns:1fr}}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.pdca{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.ctrl{grid-template-columns:repeat(2,auto)}.ctrl>div:nth-child(2){border-right:0}.grid3{grid-template-columns:1fr}.grid-in{grid-template-columns:110px repeat(3,minmax(60px,1fr))}}
@media (max-width:520px){.brand h1{font-size:21px}.tile .v{font-size:26px}.bar{grid-template-columns:110px 1fr 34px}}
@media print{nav.sys,nav#nav,.w,#toast,button{display:none!important}body{background:#fff}.panel,.tw{border-color:#999}}
/* printing a record sheet (job card, evidence): only the sheet's #jobcard */
@media print{body.pm>*:not(#modal){display:none!important}body.pm #modal{position:static;background:none;padding:0;overflow:visible}
  body.pm .sheet{border:0;max-width:none;padding:0}body.pm .sheet>*:not(#jobcard):not(:first-child){display:none!important}body.pm #jobcard{display:block!important}}
/* temperature–time sketch on the job card */
figure.prof{margin:6px 0 10px}figure.prof svg{width:100%;height:auto;display:block;max-width:900px}
@media print{figure.prof{break-inside:avoid}}
/* organization chart: nested lists with connectors */
.orgtree{padding:12px;min-width:max-content}
.orgtree ul{display:flex;justify-content:center;gap:0;padding-top:16px;position:relative;margin:0;padding-left:0;list-style:none}
.orgtree>ul{padding-top:0}
.orgtree li{position:relative;padding:16px 6px 0;text-align:center;list-style:none}
.orgtree li::before,.orgtree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:16px;border-top:1px solid var(--line)}
.orgtree li::after{right:auto;left:50%;border-left:1px solid var(--line)}
.orgtree li:only-child::before,.orgtree li:only-child::after{display:none}.orgtree li:only-child{padding-top:0}
.orgtree li:first-child::before,.orgtree li:last-child::after{border:0}
.orgtree li:last-child::before{border-right:1px solid var(--line);border-radius:0 4px 0 0}.orgtree li:first-child::after{border-radius:4px 0 0 0}
.orgtree ul ul::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:1px solid var(--line)}
.orgtree>ul>li{padding-top:0}.orgtree>ul>li::before,.orgtree>ul>li::after{display:none}
.orgtree .node{display:inline-flex;flex-direction:column;gap:2px;align-items:center;min-width:130px;max-width:190px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;white-space:normal}
.orgtree .node:hover{border-color:var(--accent)}
.orgtree .node.ht{border:2px solid var(--accent);background:var(--accent-2)}
.orgtree .node.vac{border-style:dashed;color:var(--muted)}
@media print{.orgtree .node{break-inside:avoid}}
/* SCADA review: zone charts (left wall --s1, right wall --s2), legend, crosshair tooltip, conditions */
.zcs{display:grid;gap:14px}
.zc{margin:0}.zc figcaption{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;margin-bottom:4px}
.zc .lg{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}.zc .lg i,.ztip i{display:inline-block;width:14px;height:3px;border-radius:2px}
.zc .lg i.dash{height:0;border-top:2px dashed var(--muted)}
.zcw{position:relative}.zcw svg{width:100%;height:auto;display:block}
.zcw svg .ax{font:11px var(--f-mono);fill:var(--muted)}
.ztip{position:absolute;top:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.12);min-width:140px}
.ztip i{margin-right:4px;vertical-align:middle}
.cond{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:8px 10px;margin:8px 0;background:var(--panel)}
.cond.crit{border-left-color:var(--bad)}.cond p{margin:0 0 6px}
@media print{.zc{break-inside:avoid}.ztip{display:none}}
/* SCADA review report (the layout of CALOR's SCADA review) */
:root{--hot:#e34948}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hot:#e66767}}:root[data-theme="dark"]{--hot:#e66767}
.rp-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rt{font-family:var(--f-display);font-size:28px;font-weight:700;margin:2px 0 4px;text-wrap:balance}
.upl{position:relative;overflow:hidden;cursor:pointer}.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.hero{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;padding:14px 18px}
.hero.bad{border-left-color:var(--bad)}.hero.warn{border-left-color:var(--warn)}
.hero .hi{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--ok)}.hero.bad .hi{background:var(--bad)}.hero.warn .hi{background:var(--warn)}
.hero h2{font-size:20px;margin:2px 0 4px}.hero p{margin:0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font:500 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 24px var(--f-mono);font-variant-numeric:tabular-nums}.kpi .v small{font-size:13px;color:var(--muted)}.kpi .s{font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}
.rp .sec-head{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.rp .sec-head h3{margin:0}.rp .sec-head p{margin:0;flex:1 1 420px;color:var(--muted);font-size:13px;text-align:left}
.rp.bare{background:none;border:0;padding:0}
svg.lay,svg.spr{width:100%;height:auto;display:block;max-width:1000px;margin:0 auto}
svg.lay .lb,.zcw svg .lb{font:600 12.5px var(--f-body);fill:var(--ink)}svg.lay .ax,svg.spr .ax{font:11px var(--f-mono);fill:var(--muted)}svg.lay .vl,svg.spr .vl{font:600 12px var(--f-mono);fill:var(--ink)}
.zcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.zcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.zcard p{margin:6px 0}.zt{width:100%;border-collapse:collapse;font-size:13px}.zt td,.zt th{padding:4px 2px;border-bottom:1px solid var(--line)}.zt td.n,.zt th.n{text-align:right;font-family:var(--f-mono)}
.zt th{font-size:12px;color:var(--muted);font-weight:500}.zt .lg{display:inline-flex;gap:5px;align-items:center}.zt .lg i{display:inline-block;width:10px;height:10px;border-radius:2px}
.zc .lg i.dot{width:7px;height:7px;border-radius:50%;background:var(--bad)}.zc .lg i.sq{width:14px;height:10px;background:var(--settle);border-radius:2px}
.hmt{border-collapse:separate;border-spacing:3px;font:12px var(--f-mono)}.hmt th{font-weight:500;color:var(--muted);padding:0 4px;text-align:center}.hmt tbody th{text-align:left}
.hmt td.hm{min-width:34px;text-align:center;padding:4px 2px;border-radius:3px;border:2px solid transparent}.hmt td.hm.oot{border-color:var(--ink)}.hmt td.na{background:none}
.ramp{display:inline-block;width:120px;height:8px;border-radius:4px;vertical-align:middle;background:linear-gradient(90deg,var(--s1),var(--sunk),var(--hot))}
@media print{.rp-head .row,.upl{display:none}.hero,.kpi,.zcard{break-inside:avoid}}
/* TC module: SAT readings series */
.rdw{max-height:380px;overflow:auto}
.rdt td{padding:3px 6px}.rdt input{width:100%;min-width:72px;font-family:var(--f-mono)}
.rdt td.mono{white-space:nowrap}
svg.satc{width:100%;height:auto;display:block;max-width:720px;margin:8px 0}
svg.satc text{font:11px var(--f-mono);fill:var(--muted)}
.rdp td,.rdp th{padding:2px 6px;font-size:11px}
/* APQP module: feasibility questions */
table.fq td{vertical-align:top}table.fq select{min-width:120px}table.fq input{width:100%;min-width:160px}
.issues button.link{text-align:left}
/* Google Drive folder: header chip and dialog */

<body>

<script>
"use strict";
/* ---------- shell: module table, routing, theme ---------- */
const MODS=["org","apqp","spec","scada","tc"];                           /* every module code; add new modules here (and in nav.sys, SYS, build.py) */
const today0=()=>{const d=new Date();return `${String(d.getDate()).padStart(2,"0")}-${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}-${d.getFullYear()}`;};
const SYS={
  home:{t:"CALOR · Heat treat quality system",ctrl:()=>`<div><b>Standard</b>AIAG CQI-9 4th Ed.</div><div><b>Scope</b>Pusher furnaces F-01 … F-04</div><div><b>Records</b><span id="dbstate">—</span></div><div><b>Date</b>${today0()}</div>`},
  org:{t:"Heat treat organization",ctrl:()=>`<div><b>Procedure</b>MWSPL-QP-ORG-01</div><div><b>Standard</b>CQI-9 · HTSA 1.1</div><div><b>Records</b><span id="dbstate">Connecting…</span></div><div><b>Date</b>${today0()}</div>`},
  apqp:{t:"Advanced quality planning",ctrl:()=>`<div><b>Procedure</b>MWSPL-QP-APQP-01</div><div><b>Standard</b>CQI-9 · HTSA 1.2</div><div><b>Records</b><span id="dbstate">Connecting…</span></div><div><b>Date</b>${today0()}</div>`},
  spec:{t:"Process specifications",ctrl:()=>`<div><b>Procedure</b>MWSPL-QP-SPEC-01</div><div><b>Standard</b>CQI-9 · HTSA 1.6</div><div><b>Records</b><span id="dbstate">Connecting…</span></div><div><b>Date</b>${today0()}</div>`},
  scada:{t:"SCADA temperature review",ctrl:()=>`<div><b>Procedure</b>MWSPL-QP-SCADA-01</div><div><b>Standard</b>CQI-9 · HTSA 1.9</div><div><b>Records</b><span id="dbstate">Connecting…</span></div><div><b>Date</b>${today0()}</div>`},
  tc:{t:"Thermocouples & protection tubes",ctrl:()=>`<div><b>Procedure</b>MWSPL-QP-TC-01</div><div><b>Standard</b>CQI-9 · HTSA 3.3</div><div><b>Records</b><span id="dbstate">Connecting…</span></div><div><b>Date</b>${today0()}</div>`}
};
const appOf=h=>{const m=String(h||"").match(/^#([a-z]+)(?:\/|$)/);return m&&MODS.includes(m[1])?m[1]:"home";};
const MWS={
  app:appOf(location.hash),docs:{},
  /* the location a module sees: only its own part of the hash (#view); setting it writes #<mod>/view */
  loc(mod){return {
    get hash(){const m=location.hash.match(new RegExp("^#"+mod+"/?(.*)$"));return m&&m[1]?"#"+m[1]:"";},
    set hash(v){location.hash="#"+mod+"/"+String(v||"").replace(/^#/,"");},
    get href(){return location.href;},reload(){location.reload();}};},
  /* a module's data changed while another page is shown: refresh the Overview */
  bg(){if(MWS.app==="home"&&typeof renderHome==="function"){clearTimeout(MWS._bg);MWS._bg=setTimeout(renderHome,120);}
    else{const m=MWS[MWS.app];if(m&&m.refresh){clearTimeout(MWS._bg);MWS._bg=setTimeout(m.refresh,150);}}},
  toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(MWS._t);MWS._t=setTimeout(()=>el.classList.remove("on"),2600);}
};
function shellRoute(){
  const prev=MWS.app;MWS.app=appOf(location.hash);
  if(prev!==MWS.app&&MWS[prev]&&MWS[prev].closeModal){try{MWS[prev].closeModal();}catch(e){}}
  const S=SYS[MWS.app];document.getElementById("apptitle").textContent=S.t;document.getElementById("ctrl").innerHTML=S.ctrl();
  document.title=(MWS.app==="home"?"":S.t+" · ")+"CALOR Quality System";
  document.querySelectorAll("nav.sys a").forEach(a=>{if(a.dataset.sys===MWS.app)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  document.getElementById("nav").hidden=MWS.app==="home";
  if(MWS.app==="home"){document.getElementById("nav").innerHTML="";if(typeof renderHome==="function")renderHome();}
}
addEventListener("hashchange",shellRoute,true);
/* inside a module, links are written #view: rewrite them to #<mod>/view (capture phase, before the module sees the click) */
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href^='#']");if(!a||MWS.app==="home")return;
  const h=a.getAttribute("href");if(h==="#home"||/^#[a-z]+\//.test(h)||a.closest("nav.sys"))return;
  e.preventDefault();location.hash="#"+MWS.app+"/"+h.slice(1);},true);
/* theme: automatic, with a manual override kept per browser */
(function(){let t=null;try{t=localStorage.getItem("mws-theme");}catch(e){}if(t)document.documentElement.dataset.theme=t;
  document.getElementById("themeBtn").addEventListener("click",()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("mws-theme",r.dataset.theme);}catch(e){}});})();
/* ---------- shell: CALOR data for the "Import from CALOR" buttons ----------
   CALOR keeps its registers in the browser (localStorage) and, when linked, as one JSON file per register in a Google Drive folder
   (<key>.json = {format "CALOR data", key, deleted, raw, data}) with a daily full backup in backup/ (calor-backup-<day>.json = {suite "CALOR", data{key: text}}).
   This application can read that folder (Chrome / Edge), files picked from it or downloaded from Google Drive, a CALOR backup, the SAT page's own export,
   or the CALOR registers of this browser. What was read is kept under its own key (mws-calor-src); CALOR's own keys are never written. */
(function(){
  const LK="mws-calor-src",NEED={"org-reg":"HT organization","psr-reg":"Process specifications","prod-reg":"Daily production","tsat-pdca":"SAT register"};
  let SRC=null;try{SRC=JSON.parse(localStorage.getItem(LK)||"null");}catch(e){SRC=null;}
  const parse=v=>{if(v==null)return null;if(typeof v!=="string")return v;try{return JSON.parse(v);}catch(e){return null;}};
  const fromLocal=k=>{try{return parse(localStorage.getItem(k));}catch(e){return null;}};
  /* the registers in one JSON file: a per-register file, a full backup, or the SAT page's export */
  function readObj(o,name){const out={};if(!o||typeof o!=="object")return out;
    if(o.format==="CALOR data"&&o.key){if(!o.deleted&&o.data!=null)out[o.key]=o.raw?parse(String(o.data)):o.data;return out;}
    if(o.data&&typeof o.data==="object"&&(o.suite==="CALOR"||/backup/i.test(name||""))){Object.entries(o.data).forEach(([k,v])=>{const x=parse(v);if(x!=null)out[k]=x;});return out;}
    if(Array.isArray(o.sensors)&&Array.isArray(o.cycles))out["tsat-pdca"]=o;
    return out;}
  function keep(keys,from){SRC={at:new Date().toISOString(),from,keys};
    try{localStorage.setItem(LK,JSON.stringify(SRC));SRC.saved=true;}catch(e){SRC.saved=false;}
    if(typeof MWS!=="undefined")MWS.toast(`CALOR data read: ${Object.keys(keys).length} register${Object.keys(keys).length===1?"":"s"} from ${from}`);
    window.dispatchEvent(new HashChangeEvent("hashchange"));}
  async function readFiles(files){const keys={};let n=0;
    for(const f of files){if(!/\.json$/i.test(f.name))continue;try{Object.assign(keys,readObj(JSON.parse(await f.text()),f.name));n++;}catch(e){}}
    if(!Object.keys(keys).length){MWS.toast("No CALOR register found in the file(s) chosen.");return;}
    keep({...(SRC&&SRC.keys||{}),...keys},`${n} file${n===1?"":"s"}`);}
  /* the Drive folder: <key>.json files; without them the latest backup in backup/ */
  async function readFolder(){if(!window.showDirectoryPicker){MWS.toast("This browser cannot open a folder: choose the files instead (Chrome or Edge can open the folder).");return;}
    let dir;try{dir=await window.showDirectoryPicker({mode:"read"});}catch(e){return;}
    const keys={};const files=[];
    try{for await(const [n,h] of dir.entries())if(h.kind==="file"&&/\.json$/i.test(n))files.push([n,h]);
      for(const [n,h] of files){try{const o=JSON.parse(await (await h.getFile()).text());if(o&&o.format==="CALOR data")Object.assign(keys,readObj(o,n));}catch(e){}}
      if(!Object.keys(keys).length){let bd=null;try{bd=await dir.getDirectoryHandle("backup");}catch(e){}
        const pool=bd?[]:files;if(bd)for await(const [n,h] of bd.entries())if(h.kind==="file")pool.push([n,h]);
        const b=pool.filter(([n])=>/^calor-backup-\d{4}-\d{2}-\d{2}\.json$/i.test(n)).sort((x,y)=>x[0]<y[0]?1:-1)[0];
        if(b)Object.assign(keys,readObj(JSON.parse(await (await b[1].getFile()).text()),b[0]));}}
    catch(e){MWS.toast("The folder could not be read: "+(e.message||e));return;}
    if(!Object.keys(keys).length){MWS.toast(`No CALOR data in the folder "${dir.name}": choose the CALOR Drive folder (the one with calor-manifest.json).`);return;}
    keep(keys,`the folder "${dir.name}"`);}
  window.MWS_CALOR={
    /* a CALOR register: from the data read (folder / files), else from this browser */
    get:k=>SRC&&SRC.keys&&SRC.keys[k]!=null?SRC.keys[k]:fromLocal(k),
    where:k=>SRC&&SRC.keys&&SRC.keys[k]!=null?SRC.from:fromLocal(k)!=null?"this browser":"",
    /* the panel every module shows on its Data view; `keys` = the registers that module imports */
    panel:(keys,note)=>{const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
      const rows=(keys||Object.keys(NEED)).map(k=>{const w=MWS_CALOR.where(k);return `<li>${esc(NEED[k]||k)}: ${w?`<b>found</b> <span class="muted">(${esc(w)})</span>`:`<span class="muted">not found</span>`}</li>`;}).join("");
      return `<div class="panel"><h3>CALOR data</h3><p class="small muted">CALOR's registers are read from its Google Drive folder (the one with <code>calor-manifest.json</code>; Chrome or Edge, with Google Drive for Desktop), from JSON files picked from that folder or downloaded from drive.google.com (the register files such as <code>org-reg.json</code>, or a <code>calor-backup-….json</code>), or from CALOR in this browser.${note?" "+esc(note):""}</p>
        <ul class="small">${rows}</ul>
        <div class="row"><button class="w" data-calor-folder>Choose the CALOR Drive folder</button><label class="btn w" style="cursor:pointer">Choose CALOR file(s)<input type="file" id="calorfiles" accept=".json,application/json" multiple hidden></label>${SRC?`<button data-calor-forget>Forget the data read</button>`:""}</div>
        ${SRC?`<p class="small muted" style="margin-top:6px">Read ${esc(new Date(SRC.at).toLocaleString())} from ${esc(SRC.from)}${SRC.saved===false?" (too large to keep: read again after reloading)":""}.</p>`:""}</div>`;},
    readFiles,readFolder,
    forget:()=>{SRC=null;try{localStorage.removeItem(LK);}catch(e){}window.dispatchEvent(new HashChangeEvent("hashchange"));}};
  document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-calor-folder],[data-calor-forget]");if(!b)return;
    if(b.hasAttribute("data-calor-folder"))readFolder();else MWS_CALOR.forget();});
  document.addEventListener("change",e=>{if(e.target&&e.target.id==="calorfiles"&&e.target.files.length){const f=[...e.target.files];e.target.value="";readFiles(f);}});
})();
MWS.calor=window.MWS_CALOR;
const useCap=n=>{try{return window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);}catch(e){return Promise.resolve(null);}};
</script>
<script>
/* ---------- shell: Google Drive folder (the records saved as JSON files) ----------
   Google Drive for Desktop syncs a Drive folder with the PC; this application writes one JSON file per module into it through the
   File System Access API (Chrome / Edge; the folder handle is kept in IndexedDB "mws-drive"). The modules keep working on their
   localStorage key (mws-<module>-local-v1); every change of such a key is marked and written 1.5 s later. A file changed on another
   computer (another stamp) is read on start, every 60 s and when the window gets the focus, and the page reloads with it; when this
   browser had unsaved changes of the same module, its version is kept in conflicts/ and the other one is used (no merge).
   Files: <key>.json = {format "CALOR Quality System data", version, key, module, saved, by, stamp, data}; mws-manifest.json;
   backup/mws-backup-<day>.json once a day (30 kept) and backup/before-link_<time>.json; conflicts/<key>_<time>_<computer>.json. */
(function(){
  const KEYS={"mws-org-local-v1":"HT organization","mws-apqp-local-v1":"Quality planning","mws-spec-local-v1":"Process specifications","mws-scada-local-v1":"SCADA review","mws-tc-local-v1":"Thermocouples"};
  const FORMAT="CALOR Quality System data",SK="mws-sync",DB_NAME="mws-drive",MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const pad=n=>String(n).padStart(2,"0"),day=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
  const ftime=()=>{const d=new Date();return `${day()}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;};
  const hm=iso=>{if(!iso)return "";const d=new Date(iso);const t=`${pad(d.getHours())}:${pad(d.getMinutes())}`;return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`===day()?t:`${t} on ${d.getDate()} ${MON[d.getMonth()]}`;};
  const safe=s=>String(s||"PC").replace(/[^A-Za-z0-9_-]+/g,"-").slice(0,40);
  const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
  /* raw access that does not mark anything */
  const P=Storage.prototype,rawSet=P.setItem,rawDel=P.removeItem;
  const rget=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
  const rset=(k,v)=>{try{v==null?rawDel.call(localStorage,k):rawSet.call(localStorage,k,v);}catch(e){}};
  let SY={pc:"",base:{},dirty:{},last:"",conflicts:[]};try{SY={...SY,...(JSON.parse(rget(SK)||"null")||{})};}catch(e){}
  if(!SY.pc)SY.pc="PC-"+Math.random().toString(36).slice(2,6).toUpperCase();
  const keep=()=>rset(SK,JSON.stringify(SY));keep();
  let DIR=null,ACC="none",BUSY=false,ERR="",T=0;
  const newStamp=()=>`${new Date().toISOString()}|${SY.pc}|${Math.random().toString(36).slice(2,8)}`;
  /* every change of a module key is marked dirty and written shortly after */
  P.setItem=function(k,v){const o=this===localStorage&&k in KEYS?rget(k):null;rawSet.call(this,k,v);if(this===localStorage&&k in KEYS&&o!==String(v))touch(k);};
  P.removeItem=function(k){const had=this===localStorage&&k in KEYS&&rget(k)!=null;rawDel.call(this,k);if(had)touch(k);};
  function touch(k){SY.dirty[k]=1;keep();show();clearTimeout(T);T=setTimeout(flush,1500);}
  /* IndexedDB: the folder handle */
  const idb=(mode,fn)=>new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore("h");
    r.onerror=()=>rej(r.error);r.onsuccess=()=>{const tx=r.result.transaction("h",mode),st=tx.objectStore("h"),q=fn(st);tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);};});
  const saveH=h=>idb("readwrite",st=>h?st.put(h,"dir"):st.delete("dir")),loadH=()=>idb("readonly",st=>st.get("dir")).catch(()=>null);
  async function perm(h,ask){if(!h)return "none";if(!h.queryPermission)return "granted";const o={mode:"readwrite"};
    let p=await h.queryPermission(o);if(p!=="granted"&&ask)p=await h.requestPermission(o);return p;}
  /* files */
  async function readJSON(dir,name){try{const f=await (await dir.getFileHandle(name)).getFile();return {o:JSON.parse(await f.text()),mod:f.lastModified};}catch(e){return null;}}
  async function writeJSON(dir,name,o){const fh=await dir.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(JSON.stringify(o,null,1));await w.close();}
  const env=(k,raw,st)=>{let data=null;try{data=raw==null?null:JSON.parse(raw);}catch(e){data=null;}
    return {format:FORMAT,version:1,key:k,module:KEYS[k],saved:new Date().toISOString(),by:SY.pc,stamp:st,deleted:raw==null,data};};
  const fromEnv=e=>e.deleted||e.data==null?null:JSON.stringify(e.data);
  const hasLocal=()=>Object.keys(KEYS).filter(k=>{const v=rget(k);if(!v)return false;try{const o=JSON.parse(v);return Object.values(o).some(c=>c&&Object.keys(c).length);}catch(e){return false;}});
  async function remoteKeys(){const out={};for(const k of Object.keys(KEYS)){const r=await readJSON(DIR,k+".json");if(r&&r.o&&r.o.format===FORMAT)out[k]=r;}return out;}
  async function backup(name){const data={};Object.keys(KEYS).forEach(k=>{const v=rget(k);if(v!=null)data[k]=v;});
    const bd=await DIR.getDirectoryHandle("backup",{create:true});await writeJSON(bd,name,{app:"CALOR Quality System",saved:new Date().toISOString(),by:SY.pc,data});return bd;}
  async function daily(){try{const name=`mws-backup-${day()}.json`,bd=await DIR.getDirectoryHandle("backup",{create:true});
      try{await bd.getFileHandle(name);return;}catch(e){}await backup(name);
      const L=[];for await(const [n] of bd.entries())if(/^mws-backup-\d{4}-\d{2}-\d{2}\.json$/.test(n))L.push(n);L.sort().reverse().slice(30).forEach(n=>bd.removeEntry(n).catch(()=>{}));}catch(e){}}
  async function manifest(){await writeJSON(DIR,"mws-manifest.json",{format:"CALOR Quality System data folder",version:1,updated:new Date().toISOString(),by:SY.pc,
    note:"One file per module of the CALOR Quality System; the records are in its 'data' field. backup/ = one full backup per day, conflicts/ = changes kept when two computers changed the same module.",modules:KEYS});}
  /* write the dirty keys; a file changed elsewhere since it was last read here is a conflict */
  async function flush(){if(!DIR||ACC!=="granted"||BUSY)return show();BUSY=true;let reload=false;
    try{for(const k of Object.keys(SY.dirty)){const r=await readJSON(DIR,k+".json"),b=SY.base[k];
        if(r&&r.o&&r.o.format===FORMAT&&r.o.stamp&&(!b||r.o.stamp!==b.st)){await conflict(k,r);reload=true;continue;}
        const st=newStamp();await writeJSON(DIR,k+".json",env(k,rget(k),st));SY.base[k]={st};delete SY.dirty[k];}
      SY.last=new Date().toISOString();ERR="";keep();await manifest();await daily();}
    catch(e){ERR=e.message||String(e);}
    BUSY=false;show();if(reload)reloadSoon();}
  async function conflict(k,r){const cd=await DIR.getDirectoryHandle("conflicts",{create:true}),name=`${k}_${ftime()}_${safe(SY.pc)}.json`;
    await writeJSON(cd,name,env(k,rget(k),newStamp()));rset(k,fromEnv(r.o));SY.base[k]={st:r.o.stamp};delete SY.dirty[k];
    SY.conflicts.push({k,file:"conflicts/"+name,at:new Date().toISOString(),by:r.o.by||"another computer"});keep();}
  /* read the files changed on another computer */
  async function pull(){if(!DIR||ACC!=="granted"||BUSY)return false;BUSY=true;let changed=false;
    try{for(const k of Object.keys(KEYS)){const r=await readJSON(DIR,k+".json");if(!r||!r.o||r.o.format!==FORMAT||!r.o.stamp)continue;const b=SY.base[k];if(b&&b.st===r.o.stamp)continue;
        if(SY.dirty[k])await conflict(k,r);else{rset(k,fromEnv(r.o));SY.base[k]={st:r.o.stamp};}changed=true;}
      keep();ERR="";}catch(e){ERR=e.message||String(e);}
    BUSY=false;show();return changed;}
  const busyUI=()=>{const m=document.getElementById("modal");return m&&!m.hidden||document.getElementById("syncDlg").open;};
  function reloadSoon(){if(busyUI()){setTimeout(reloadSoon,3000);return;}MWS.toast("Changes from the Google Drive folder: reloading…");setTimeout(()=>location.reload(),600);}
  async function poll(){if(!DIR)return;ACC=await perm(DIR,false);if(ACC!=="granted")return show();if(await pull())reloadSoon();if(Object.keys(SY.dirty).length)flush();}
  /* link a folder: empty folder ← this browser; folder with data and an empty browser ← the folder; both → the user chooses */
  async function link(){if(!window.showDirectoryPicker){alert("This browser cannot write to a folder. Use Chrome or Edge on the computer where Google Drive for Desktop runs.");return;}
    let h;try{h=await window.showDirectoryPicker({mode:"readwrite",id:"mws-drive"});}catch(e){return;}
    DIR=h;ACC=await perm(h,true);if(ACC!=="granted"){DIR=null;alert("Access to the folder was not allowed.");return;}
    const R=await remoteKeys(),loc=hasLocal();let fromFolder=false;
    if(Object.keys(R).length&&loc.length){
      const use=await choose(`<p><b>Both have records.</b> The folder <b>${esc(h.name)}</b> holds ${Object.keys(R).map(k=>esc(KEYS[k])+" ("+esc(hm(R[k].o.saved))+", "+esc(R[k].o.by||"?")+")").join(", ")}; this browser holds ${loc.map(k=>esc(KEYS[k])).join(", ")}.</p><p>Which should be used? The other side is first saved as a full backup in <code>backup/</code>.</p>`,
        [["folder","Use the folder's records"],["browser","Use this browser's records"],["cancel","Cancel"]]);
      if(use==="cancel"||!use){DIR=null;return;}
      if(use==="folder"){fromFolder=true;await backup(`before-link_${ftime()}_${safe(SY.pc)}.json`);Object.entries(R).forEach(([k,r])=>{rset(k,fromEnv(r.o));SY.base[k]={st:r.o.stamp};});SY.dirty={};}
      else{const bd=await DIR.getDirectoryHandle("backup",{create:true});await writeJSON(bd,`before-link_${ftime()}_folder.json`,{app:"CALOR Quality System",saved:new Date().toISOString(),data:Object.fromEntries(Object.entries(R).map(([k,r])=>[k,fromEnv(r.o)]))});
        SY.base={};Object.entries(R).forEach(([k,r])=>SY.base[k]={st:r.o.stamp});Object.keys(KEYS).forEach(k=>{if(rget(k)!=null)SY.dirty[k]=1;});}}
    else if(Object.keys(R).length){fromFolder=true;Object.entries(R).forEach(([k,r])=>{rset(k,fromEnv(r.o));SY.base[k]={st:r.o.stamp};});SY.dirty={};}
    else{SY.base={};Object.keys(KEYS).forEach(k=>{if(rget(k)!=null)SY.dirty[k]=1;});}
    keep();await saveH(h);await flush();
    if(fromFolder){MWS.toast("Folder linked: loading its records…");setTimeout(()=>location.reload(),700);}
    else{MWS.toast("Folder linked: the records are saved to "+h.name);window.dispatchEvent(new HashChangeEvent("hashchange"));dlg();}}
  async function unlink(){if(!confirm("Stop saving to the Google Drive folder? The records stay in this browser and in the folder."))return;DIR=null;ACC="none";await saveH(null).catch(()=>{});SY.base={};SY.dirty={};keep();show();window.dispatchEvent(new HashChangeEvent("hashchange"));dlg();}
  function choose(html,opts){return new Promise(res=>{const d=document.getElementById("syncDlg");
    d.innerHTML=`<div class="sheet"><h2>Link the Google Drive folder</h2>${html}<div class="row">${opts.map(([k,t],i)=>`<button class="${i?"":"pri"} w" data-ch="${k}">${esc(t)}</button>`).join("")}</div></div>`;
    d.onclick=e=>{const b=e.target.closest("[data-ch]");if(b){d.close();d.onclick=null;res(b.dataset.ch);}};if(!d.open)d.showModal();});}
  /* the header chip and the dialog */
  function status(){const n=Object.keys(SY.dirty).length;
    if(!DIR)return ["","This browser only"];if(ACC!=="granted")return ["warn","Drive: allow access"];if(ERR)return ["bad","Drive: problem"];
    if(SY.conflicts.length)return ["warn","Drive: "+SY.conflicts.length+" conflict"+(SY.conflicts.length>1?"s":"")];
    if(BUSY)return ["","Drive: saving…"];if(n)return ["warn","Drive: "+n+" waiting"];return ["ok","Drive: saved "+hm(SY.last)];}
  function show(){const b=document.getElementById("syncBtn");if(!b)return;const [c,t]=status();b.textContent=t;b.className="sync "+c;
    const d=document.getElementById("syncDlg");if(d&&d.open&&!d.onclick)dlg();}
  function dlg(){const d=document.getElementById("syncDlg"),[c,t]=status();d.onclick=null;
    d.innerHTML=`<div class="sheet"><div class="row between"><h2>Google Drive folder</h2><button data-sy="close" aria-label="Close">✕</button></div>
      <p>${esc(t)}${DIR?` · folder <b>${esc(DIR.name)}</b> · this computer: <b>${esc(SY.pc)}</b>`:""}</p>
      <p class="small muted">The records of every module are saved as JSON files (one per module) into a folder that Google Drive for Desktop syncs, so they are in your Google Drive and on every computer that links the same folder. Use Chrome or Edge. Choose a folder of its own (for example "CALOR Quality System" in My Drive), not CALOR's folder. Changes are saved 1.5 s after you make them; changes from another computer are read every minute and when you come back to the window. Keep the folder available offline in Google Drive for Desktop.</p>
      ${ERR?`<p class="banner bad">${esc(ERR)}</p>`:""}
      ${DIR?`<ul class="small">${Object.keys(KEYS).map(k=>`<li>${esc(KEYS[k])}: ${SY.dirty[k]?"waiting to be saved":SY.base[k]?"saved":rget(k)==null?"no records":"not saved yet"}</li>`).join("")}</ul>`:""}
      ${SY.conflicts.length?`<p><b>Conflicts</b> (both computers changed the same module; the other computer's records are used, this browser's are kept in the folder):</p><ul class="small">${SY.conflicts.slice(-10).reverse().map(x=>`<li>${esc(KEYS[x.k]||x.k)} · ${esc(hm(x.at))} · ${esc(x.file)} (other: ${esc(x.by)})</li>`).join("")}</ul>`:""}
      <div class="row">${!DIR?`<button class="pri w" data-sy="link">Link a Google Drive folder…</button>`:`${ACC!=="granted"?`<button class="pri w" data-sy="allow">Allow access</button>`:`<button class="pri w" data-sy="now">Save and read now</button>`}<button class="w" data-sy="link">Link another folder…</button><button data-sy="unlink">Unlink</button>`}
        <button data-sy="pc">Rename this computer</button>${SY.conflicts.length?`<button data-sy="clr">Clear the conflict list</button>`:""}</div></div>`;
    if(!d.open)d.showModal();}
  document.addEventListener("click",async e=>{
    if(e.target.closest&&e.target.closest("#syncBtn")){dlg();return;}
    const b=e.target.closest&&e.target.closest("[data-sy]");if(!b)return;const a=b.dataset.sy,d=document.getElementById("syncDlg");
    if(a==="close")d.close();
    if(a==="link")link();
    if(a==="unlink")unlink();
    if(a==="allow"){ACC=await perm(DIR,true);show();if(ACC==="granted")await poll();dlg();}
    if(a==="now"){await poll();await flush();dlg();}
    if(a==="pc"){const n=prompt("Name of this computer (shown in the files and conflicts):",SY.pc);if(n&&n.trim()){SY.pc=n.trim().slice(0,40);keep();dlg();}}
    if(a==="clr"){SY.conflicts=[];keep();show();dlg();}});
  window.addEventListener("focus",()=>{poll();});
  setInterval(poll,60000);
  window.addEventListener("beforeunload",e=>{if(DIR&&ACC==="granted"&&Object.keys(SY.dirty).length){flush();e.preventDefault();e.returnValue="";}});
  /* start: the linked folder from IndexedDB; without permission the chip asks for a click */
  (async()=>{try{const h=await loadH();if(h){DIR=h;ACC=await perm(h,false);if(ACC==="granted"){if(await pull())reloadSoon();else if(Object.keys(SY.dirty).length)flush();}}}catch(e){ERR=e.message||String(e);}show();})();
  window.MWS_SYNC={status:()=>({text:status()[1],linked:!!DIR,folder:DIR?DIR.name:"",access:ACC,dirty:Object.keys(SY.dirty),conflicts:SY.conflicts.length}),
    linked:()=>!!DIR&&ACC==="granted",folder:()=>DIR?DIR.name:"",flush,pull,poll,dlg,_sy:()=>SY};
})();
MWS.sync=window.MWS_SYNC;
</script>
<script>MWS.docs={"ORG/00_ORG_Master_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## ORG MODULE: HEAT TREAT ORGANIZATION — MASTER LIST\n\n**Basis:** AIAG CQI-9 4th Edition, HTSA question 1.1 (\"Is there a dedicated and qualified heat treat person on-site?\"): the heat treat person is dedicated, qualified, full-time and on site; the position is shown in the organization chart; a job description identifies the qualifications for the position, including metallurgical and heat treat knowledge; the person has evidence of at least 5 years of heat treat experience or a combination of formal metallurgical education and heat treat experience (minimum to confirm against the controlled copy). IATF 16949 §5.3 (roles and authorities) and §7.2 (competence) as context. PDCA: **Plan** (the organization that runs every other module).\n\n**Application:** CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`) → HT organization. Positions, job descriptions, the organization chart and its approval, people with their qualification and the HTSA 1.1 self-assessment are held there. CALOR's HT organization page (`Organization_Personnel.html`) can be imported into it.\n\n### Documents\n\n| PDCA | Doc. No. | Title | Rev. | Date | File link |\n|---|---|---|---|---|---|\n| P | MWSPL-QP-ORG-01 | Heat treat organization and qualification of the heat treat person | 00 | — | [01_Procedure/MWSPL-QP-ORG-01_Heat_Treat_Organization_and_Qualification.md](01_Procedure/MWSPL-QP-ORG-01_Heat_Treat_Organization_and_Qualification.md) |\n| D | MWSPL-WI-ORG-01 | Appoint and qualify the heat treat person | 00 | — | [02_Work_Instructions/MWSPL-WI-ORG-01_Appoint_and_Qualify_the_Heat_Treat_Person.md](02_Work_Instructions/MWSPL-WI-ORG-01_Appoint_and_Qualify_the_Heat_Treat_Person.md) |\n| P / A | MWSPL-WI-ORG-02 | Organization chart and job descriptions | 00 | — | [02_Work_Instructions/MWSPL-WI-ORG-02_Organization_Chart_and_Job_Descriptions.md](02_Work_Instructions/MWSPL-WI-ORG-02_Organization_Chart_and_Job_Descriptions.md) |\n| P | MWSPL-F-ORG-01 | Job description | 00 | — | [03_Formats/MWSPL-F-ORG-01_Job_Description.md](03_Formats/MWSPL-F-ORG-01_Job_Description.md) |\n| D | MWSPL-F-ORG-02 | Qualification record | 00 | — | [03_Formats/MWSPL-F-ORG-02_Qualification_Record.md](03_Formats/MWSPL-F-ORG-02_Qualification_Record.md) |\n| P | MWSPL-F-ORG-03 | Organization chart approval | 00 | — | [03_Formats/MWSPL-F-ORG-03_Organization_Chart_Approval.md](03_Formats/MWSPL-F-ORG-03_Organization_Chart_Approval.md) |\n| — | — | Module description (application) | — | — | [04_Application/mwspl-org-module.md](04_Application/mwspl-org-module.md) |\n\n### Where each requirement is met\n\n| Requirement (HTSA 1.1) | Met by | Evidence in the application |\n|---|---|---|\n| A heat treat position exists and is filled | QP-ORG-01 §6.1; WI-ORG-01 | One position marked \"heat treat position\"; holder named |\n| Dedicated | QP-ORG-01 §6.1 | Position marked dedicated; the holder holds no other position |\n| Full-time and on site | QP-ORG-01 §6.1 | Position and person full-time and on site |\n| Shown in the organization chart | WI-ORG-02 §1; F-ORG-03 | Reporting line to the chart; chart approved, not changed since, review in date |\n| Job description with the qualifications incl. metallurgical and heat treat knowledge | WI-ORG-02 §2; F-ORG-01 | Approved job description stating education, knowledge, minimum years ≥ 5 |\n| Evidence of ≥ 5 years heat treat experience, or metallurgical education + experience | WI-ORG-01 §2; F-ORG-02 | Qualification record: dated experience entries, service here, metallurgical education |\n\n### First-cycle implementation checklist\n\n- [ ] Confirm the HTSA 1.1 minimum (5 years) against the controlled CQI-9 copy (Settings).\n- [ ] Enter (or import from CALOR) every position with its reporting line; mark the heat treat position, dedicated, and the positions authorized to approve process specifications.\n- [ ] Enter the people with their education, experience and training; appoint the holders and deputies.\n- [ ] Write and approve the job descriptions, starting with the heat treat position (F-ORG-01).\n- [ ] Approve the organization chart (F-ORG-03); post it.\n- [ ] Check that the HTSA 1.1 panel reads Satisfactory; file the evidence pack.\n- [ ] Approve QP-ORG-01, the two WIs and the formats.\n", "ORG/01_Procedure/MWSPL-QP-ORG-01_Heat_Treat_Organization_and_Qualification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## HEAT TREAT ORGANIZATION AND QUALIFICATION OF THE HEAT TREAT PERSON\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Reviewed | Approved | Copy status |\n|---|---|---|---|---|---|---|---|\n| MWSPL-QP-ORG-01 | 00 | — | Director | | | | Uncontrolled until approved |\n\n### 1. Purpose\n\nTo make sure the heat treatment of the plant is in the charge of a dedicated, qualified, full-time heat treat person on site, shown in the organization chart, with a job description that states the qualifications for the position (CQI-9 HTSA 1.1).\n\n### 2. Scope\n\nThe heat treat organization of the Bhiwadi plant: furnaces F-01 to F-04 and the functions around them (production, quality, maintenance, laboratory). The positions of other departments are recorded as far as they appear in the reporting lines.\n\n### 3. References\n\n- AIAG CQI-9 4th Edition, HTSA 1.1 (controlled copy); HTSA 1.6 (authorization to approve process specifications).\n- IATF 16949:2016 §5.3, §7.2.\n- MWSPL-WI-ORG-01, -02; MWSPL-F-ORG-01, -02, -03; MWSPL-QP-SPEC-01.\n\n### 4. Terms and definitions\n\n| Term | Meaning |\n|---|---|\n| Heat treat person | The holder of the one position marked \"heat treat position\" (HT Manager): responsible for the heat treat process and its metallurgical results. |\n| Dedicated | Heat treatment is the main duty of the position, and its holder holds no other position. |\n| Heat treat experience | Months of heat treat work from dated experience entries plus the service in this organization since joining, when that is heat treat work; overlapping periods count once. |\n| Metallurgical education | The years of education in metallurgy (degree or diploma courses marked metallurgical). |\n| Qualified (HTSA 1.1) | Heat treat experience ≥ 5 years, or heat treat experience and metallurgical education together ≥ 5 years, both above zero. |\n\n### 5. Responsibility and authority\n\n| Role | Responsibility | Authority |\n|---|---|---|\n| Director | Appoints the heat treat person and the deputy; approves the organization chart; owns this procedure | Appoint, approve |\n| HR executive | Keeps the qualification records and job descriptions; prepares job descriptions | — |\n| HT Manager (heat treat person) | Runs the heat treat process; approves process specifications (HTSA 1.6); keeps the qualification record up to date | Stop the line, hold and release product, approve specifications |\n| Deputy | Covers absences of the heat treat person | As delegated |\n\n### 6. Procedure\n\n#### 6.1 The heat treat position\n\n1. One position is marked as the heat treat position. It is dedicated, full-time and on site, and it reports to a position in the organization chart.\n2. Its holder meets the qualification of §4 and the job description; a deputy is named to cover absences.\n3. A vacancy or a holder below the minimum is a \"needs immediate action\" finding: the Director appoints a qualified person (WI-ORG-01).\n\n#### 6.2 Organization chart and job descriptions\n\n1. The chart is drawn from the reporting lines of the positions and approved by the Director (F-ORG-03). A change of a title, reporting line, holder, deputy, heat treat flag, full-time, location or dedication, or a position added or removed, needs a new approval. The chart is reviewed every 365 days.\n2. Every position has a job description (F-ORG-01) under document control: approved = locked; a change is a new revision, the approved one stays in force until the new one is approved. The job description of the heat treat position states the metallurgical and heat treat knowledge and at least 5 years of experience.\n\n#### 6.3 Authorization to approve process specifications\n\nThe holder and deputy of the heat treat position, and of positions marked \"authorized to approve process specifications\", may approve process specifications (MWSPL-QP-SPEC-01). The application gives this list to the Specifications module's approval gate.\n\n### 7. Records\n\n| Record | Kept in | Retention |\n|---|---|---|\n| Positions and job descriptions with revisions | Application → Positions | While the position exists + 3 years |\n| Organization chart approvals | Application → Organization chart / Changes | 3 years |\n| Qualification records | Application → People; certificates in the HR file | Employment + 3 years |\n| HTSA 1.1 evidence pack | Printed from the application | Until the next assessment |\n\n### 8. Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue | |\n", "ORG/02_Work_Instructions/MWSPL-WI-ORG-01_Appoint_and_Qualify_the_Heat_Treat_Person.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## APPOINT AND QUALIFY THE HEAT TREAT PERSON\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-ORG-01 | 00 | — | Director, HR executive | | |\n\n### 1. Record the person\n\n| Step | Action | Who |\n|---|---|---|\n| 1.1 | Application → HT organization → People → \"Add a person\": name, employee no., full-time, on site, joining date. Tick \"Work here since joining is heat treat work\" when the job here is heat treatment. | HR executive |\n| 1.2 | Education: one line per qualification; tick \"Metallurgical\" for metallurgy degrees / diplomas and give the duration in years. | HR executive |\n| 1.3 | Experience: one line per earlier job with start and end month; tick \"Heat treat work\" for heat treatment jobs. The certificate or letter number is optional. | HR executive |\n| 1.4 | Training: CQI-9, pyrometry, metallurgy courses. | HR executive |\n\n### 2. Check the qualification\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | The record shows the heat treat experience, the metallurgical education and whether the HTSA 1.1 minimum is met. | Application |\n| 2.2 | Below the minimum: the person cannot be the heat treat person; choose another person or record missing experience with evidence. | Director |\n\n### 3. Appoint\n\n| Step | Action | Who |\n|---|---|---|\n| 3.1 | Open the heat treat position (HT Manager); choose the holder and a deputy; check full-time, on site, dedicated. | Director |\n| 3.2 | The holder must not hold another position. | Director |\n| 3.3 | Save: the chart is marked changed; approve the new chart revision (WI-ORG-02 §1). | Director |\n| 3.4 | Print the HTSA 1.1 evidence pack and file it. | HR executive |\n", "ORG/02_Work_Instructions/MWSPL-WI-ORG-02_Organization_Chart_and_Job_Descriptions.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## ORGANIZATION CHART AND JOB DESCRIPTIONS\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-ORG-02 | 00 | — | Director, HR executive | | |\n\n### 1. Organization chart\n\n| Step | Action | Who |\n|---|---|---|\n| 1.1 | Each position has its \"Reports to\"; the chart is drawn from these lines (Application → Organization chart). | HR executive |\n| 1.2 | Check the chart: the heat treat position outlined, no vacant position that should be filled. | Director |\n| 1.3 | \"Approve the chart\": name and date. The revision number goes up by one (F-ORG-03). | Director |\n| 1.4 | After any change shown as \"changed since approval\", and at least every 365 days, approve again. | Director |\n\n### 2. Job descriptions\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | Open the position; fill purpose, responsibilities, authority, required education, knowledge, minimum years, other requirements, prepared and approved by. For the heat treat position: metallurgical and heat treat knowledge and at least 5 years. | HR executive |\n| 2.2 | \"Approve job description\": the application refuses while anything required is missing. Approved = locked. | Director |\n| 2.3 | To change it: \"New JD revision\", give the reason for the change, edit, approve. The earlier revision stays in force until then; \"Discard JD revision\" drops the draft. | HR executive / Director |\n| 2.4 | Print the job description (F-ORG-01) for the person's file. | HR executive |\n", "ORG/03_Formats/MWSPL-F-ORG-01_Job_Description.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## JOB DESCRIPTION\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-ORG-01 | 00 | Application → Positions (\"Print JD\") |\n\n| Field | Entry |\n|---|---|\n| Position / department / reports to | |\n| Holder / deputy | |\n| Full-time / on site / dedicated / heat treat position | |\n| Purpose | |\n| Responsibilities | |\n| Authority | |\n| Required education | |\n| Metallurgical and heat treat knowledge | |\n| Minimum heat treat experience (years) | |\n| Other requirements | |\n| Revision / reason for the change | |\n| Prepared by / approved by / date | |\n", "ORG/03_Formats/MWSPL-F-ORG-02_Qualification_Record.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## QUALIFICATION RECORD\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-ORG-02 | 00 | Application → People (\"Print qualification record\") |\n\n**Person:** ____________ **Employee no.:** ______ **Joined:** ________ **Full-time / on site:** ______\n\n| Education | Field | Institute | Year | Years | Metallurgical | Reference |\n|---|---|---|---|---|---|---|\n| | | | | | | |\n\n| Experience: organization | Role | From | To | Heat treat work | Reference |\n|---|---|---|---|---|---|\n| | | | | | |\n\n| Training / certificate | Date | Provider | Reference |\n|---|---|---|---|\n| | | | |\n\nHeat treat experience: ____ yr · Metallurgical education: ____ yr · HTSA 1.1 minimum (5 yr): met / not met\n", "ORG/03_Formats/MWSPL-F-ORG-03_Organization_Chart_Approval.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## ORGANIZATION CHART APPROVAL\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-ORG-03 | 00 | Application → Organization chart (evidence print) and Changes (approval history) |\n\n| Chart revision | Date approved | Approved by | Reason (change / periodic review) |\n|---|---|---|---|\n| | | | |\n\nThe chart itself is the printed tree of positions, holders and deputies with the heat treat position marked.\n", "ORG/04_Application/mwspl-org-module.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## ORG MODULE: APPLICATION DESCRIPTION\n\nThe module runs in the CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`, \"HT organization\"). Source: `QMS/ORG/04_Application/mwspl-org-module.js`; build `python QMS/00_Integrated_Application/build.py`. The rules are copied from the CALOR page `Organization_Personnel.html` (its HTSA 1.1 part); the documents of this module must match them.\n\n| Item | Value in the code |\n|---|---|\n| Records | collections `positions` (`POS-nn`), `people` (`P-nnn`), `config/settings` (plant, minYears 5, reviewDays 365), `config/chart` (rev, apprDate, appr, dirty, log); shared record store (prefix `org-`) or this browser (`mws-org-local-v1`) |\n| Position | title, department, reports to, holder, deputy, full-time / part-time, on / off site, heat treat position (one only), dedicated, authorized to approve process specifications, job description `jd` with revisions |\n| Job description gate `jdMissing` | purpose, responsibilities, education, minimum years, prepared / approved by, reason for a change after rev 0; heat treat position also knowledge and minimum ≥ 5 years |\n| Organization chart | from the reporting lines (loops refused); approval with revision; structural change after approval marks it changed; review after 365 days |\n| Qualification `qual` | heat treat experience = dated heat treat entries + service here since joining (when ticked), overlaps once; metallurgical education = years of entries marked metallurgical; met when ≥ 5 years or both together ≥ 5 with both > 0 |\n| HTSA 1.1 `assess` | heat treat position defined and filled, dedicated, full-time, on site, in the approved chart, approved job description with education / knowledge / minimum years, holder qualified, deputy as a note; score needs immediate action (no position, vacant, holder below the minimum), not satisfactory, satisfactory |\n| Link to SPEC | `MWS.org.authorized()` (holder and deputy of the heat treat position and of authorized positions) is the Specifications module's list of approvers |\n| Data | export / import JSON, people CSV, import from CALOR (`org-reg`, read from the CALOR Drive folder, files picked or downloaded from Google Drive, or this browser: `MWS.calor`), starter set-up, clear all |\n| Not here (CALOR only) | HTSA 1.17 key functions (primary / backup, key function list) |\n", "APQP/00_APQP_Master_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## APQP MODULE: ADVANCED QUALITY PLANNING — MASTER LIST\n\n**Basis:** AIAG CQI-9 4th Edition, HTSA question 1.2 (\"Does the heat treater perform advanced quality planning?\"): the heat treater has a documented advanced quality planning procedure; a feasibility study is performed and internally approved for each part; similar parts can be grouped into part families for this effort, as defined by the heat treater (wording to confirm against the controlled copy). IATF 16949 §8.2.3 (review of the requirements, feasibility) and §8.3 (product and process design, APQP) as context. PDCA: **Plan** (before a part is run).\n\n**Application:** CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`) → Quality planning. The approval of the procedure, the feasibility studies (single parts and part families), the planning outputs, the release for production, the parts coverage and the HTSA 1.2 self-assessment are held there.\n\n### Documents\n\n| PDCA | Doc. No. | Title | Rev. | Date | File link |\n|---|---|---|---|---|---|\n| P | MWSPL-QP-APQP-01 | Advanced quality planning | 00 | — | [01_Procedure/MWSPL-QP-APQP-01_Advanced_Quality_Planning.md](01_Procedure/MWSPL-QP-APQP-01_Advanced_Quality_Planning.md) |\n| P / D | MWSPL-WI-APQP-01 | Feasibility study of a part | 00 | — | [02_Work_Instructions/MWSPL-WI-APQP-01_Feasibility_Study.md](02_Work_Instructions/MWSPL-WI-APQP-01_Feasibility_Study.md) |\n| P | MWSPL-WI-APQP-02 | Part families | 00 | — | [02_Work_Instructions/MWSPL-WI-APQP-02_Part_Families.md](02_Work_Instructions/MWSPL-WI-APQP-02_Part_Families.md) |\n| P | MWSPL-F-APQP-01 | Team feasibility commitment | 00 | — | [03_Formats/MWSPL-F-APQP-01_Team_Feasibility_Commitment.md](03_Formats/MWSPL-F-APQP-01_Team_Feasibility_Commitment.md) |\n| D | MWSPL-F-APQP-02 | Quality planning checklist and release | 00 | — | [03_Formats/MWSPL-F-APQP-02_Quality_Planning_Checklist.md](03_Formats/MWSPL-F-APQP-02_Quality_Planning_Checklist.md) |\n| P | MWSPL-F-APQP-03 | Part family register | 00 | — | [03_Formats/MWSPL-F-APQP-03_Part_Family_Register.md](03_Formats/MWSPL-F-APQP-03_Part_Family_Register.md) |\n| — | — | Module description (application) | — | — | [04_Application/mwspl-apqp-module.md](04_Application/mwspl-apqp-module.md) |\n\n### Where each requirement is met\n\n| Requirement (HTSA 1.2) | Met by | Evidence in the application |\n|---|---|---|\n| A documented advanced quality planning procedure | QP-APQP-01 | Procedure approval recorded (number, revision, approved by, date); periodic review |\n| A feasibility study for each part | QP-APQP-01 §6.2; WI-APQP-01; F-APQP-01 | Parts coverage: every part with a specification in force has a study |\n| Internally approved | WI-APQP-01 §4 | Approval gate: questions answered, conclusion, team, approved by an authorized person |\n| Part families as defined by the heat treater | WI-APQP-02; F-APQP-03 | Family studies with a definition and the parts covered |\n| Customer requirements incorporated | WI-APQP-01 §2 | Customer-specific requirements reviewed (reference, by, date) in every study |\n| Planning completed before production | QP-APQP-01 §6.4; F-APQP-02 | Planning outputs (flow, PFMEA, control plan, specification, load build, trial, PPAP) and release |\n\n### First-cycle implementation checklist\n\n- [ ] Approve QP-APQP-01, the two WIs and the formats; record the approval in the application (Procedure & part families).\n- [ ] Set who may approve a feasibility study (Settings, or the HT organization module) and the processes run on each furnace.\n- [ ] Define the part families (WI-APQP-02) for the parts already in production.\n- [ ] Record a feasibility study for every part or family with a process specification in force (Parts coverage → Start study).\n- [ ] Complete the planning outputs and release each part; check that HTSA 1.2 reads Satisfactory; file the evidence.\n", "APQP/01_Procedure/MWSPL-QP-APQP-01_Advanced_Quality_Planning.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## ADVANCED QUALITY PLANNING\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Reviewed | Approved | Copy status |\n|---|---|---|---|---|---|---|---|\n| MWSPL-QP-APQP-01 | 00 | — | Quality Manager | | | | Uncontrolled until approved |\n\n### 1. Purpose\n\nTo plan every part before it is heat treated in production: review the customer's requirements, study and internally approve the feasibility of each part (alone or as part of a defined part family), and complete the planning outputs before the part is released (CQI-9 HTSA 1.2).\n\n### 2. Scope\n\nAll parts heat treated on furnaces F-01 to F-04 (hardening & tempering, isothermal annealing, normalizing): new parts, changes of drawing, material or customer requirement, a change of process or furnace, and parts transferred from another heat treater.\n\n### 3. References\n\n- AIAG CQI-9 4th Edition, HTSA 1.2 (controlled copy); HTSA 1.3 (PFMEA), 1.4 (control plan), 1.6 (process specifications).\n- IATF 16949:2016 §8.2.3, §8.3; AIAG APQP manual (context).\n- MWSPL-WI-APQP-01, -02; MWSPL-F-APQP-01, -02, -03; MWSPL-QP-SPEC-01; MWSPL-QP-ORG-01.\n\n### 4. Terms and definitions\n\n| Term | Meaning |\n|---|---|\n| Feasibility study | The team's review of whether the part can be heat treated to all requirements on the proposed furnace(s), recorded on F-APQP-01 with a conclusion: feasible as specified, feasible with the changes listed, or not feasible. |\n| Part family | Parts the heat treater groups because they share the process route and furnace, material group, section and weight range and requirements, so one feasibility study covers them all (WI-APQP-02). |\n| Planning outputs | Process flow, PFMEA, control plan, process specification, loading standard, trial lot with results, PPAP / customer approval (F-APQP-02). |\n| Release | The Quality Manager's decision that the planning is complete and the part may be run in production. |\n\n### 5. Responsibility and authority\n\n| Role | Responsibility | Authority |\n|---|---|---|\n| Quality Manager | Owns this procedure; reviews the customer requirements; leads the planning; releases parts | Release for production |\n| HT Manager (heat treat person) | Leads the technical feasibility; approves feasibility studies and process specifications | Approve feasibility |\n| Production Manager | Capacity, loading, furnace availability | — |\n| Maintenance Head | Furnace capability (TUS range, quench, controlled cooling) | — |\n| Marketing / customer contact | Brings the enquiry, drawing, customer requirements and volume | — |\n\n### 6. Procedure\n\n#### 6.1 Trigger\n\nA planning record is started for every new part, every change of drawing, material, customer requirement, process or furnace, and every transferred part. Production does not run a part without an approved feasibility study.\n\n#### 6.2 Feasibility study (WI-APQP-01)\n\n1. The team (at least two functions) reviews the drawing, material and every heat treat requirement and the customer-specific requirements.\n2. It answers the feasibility questions of F-APQP-01: part definition, customer requirements, material, furnace and process, qualified temperature range, load build and tray load, quench or controlled cooling, testing, capacity, special characteristics, shot blasting / handling / traceability.\n3. It concludes: feasible as specified, feasible with the changes listed, or not feasible (with the reason).\n4. The study is internally approved by a person authorized in the HT organization (the heat treat person, the deputy, or a position marked authorized). Approved = locked; a change is a new revision.\n\n#### 6.3 Part families (WI-APQP-02)\n\nSimilar parts may share one study. The family is defined in writing; a part added to an approved family needs a new revision of the family study.\n\n#### 6.4 Planning outputs and release\n\nAfter the approval the outputs of F-APQP-02 are completed: process flow, PFMEA (HTSA 1.3), control plan (HTSA 1.4), process specification (HTSA 1.6), loading standard, trial lot and results, PPAP / customer approval. Where the study was feasible only with changes, the changes are confirmed. The Quality Manager then releases the part. An output that does not apply is marked so with the reason.\n\n#### 6.5 Not feasible\n\nThe customer is informed; the part is not run until a new study (other process / furnace / agreed deviation) concludes feasible. A cancelled planning stays on record.\n\n### 7. Records\n\n| Record | Kept as | Retention |\n|---|---|---|\n| Team feasibility commitment | F-APQP-01 (application, printed and signed) | Life of the part + 1 year |\n| Quality planning checklist and release | F-APQP-02 | Life of the part + 1 year |\n| Part family register | F-APQP-03 | Current + superseded revisions |\n| Approval and review of this procedure | Application (Procedure & part families) | Permanent |\n\n### 8. Review\n\nThis procedure is reviewed every 365 days and after a customer complaint traced to planning; a review is recorded as a new revision.\n", "APQP/02_Work_Instructions/MWSPL-WI-APQP-01_Feasibility_Study.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## FEASIBILITY STUDY OF A PART\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-APQP-01 | 00 | — | Quality Manager | | |\n\n### 1. Start the study\n\n| Step | Action | Who |\n|---|---|---|\n| 1.1 | Application → Quality planning → \"New study (part)\", or Parts coverage → \"Start study\" for a part with a specification in force. One study per part; a change is a new revision of it. | Quality Manager |\n| 1.2 | Enter part number and name, drawing and revision, customer, material grade, process, the furnace(s) proposed, the reason for planning and the target date. | Quality Manager |\n\n### 2. Customer requirements\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | Review the customer-specific requirements and the customer's heat treat specification; record the document and revision, who reviewed and the date. | Quality Manager |\n| 2.2 | Note the requirements that drive the planning: special characteristics, testing and sampling, packaging, PPAP level. | Quality Manager |\n\n### 3. Feasibility questions (F-APQP-01)\n\n| Step | Action | Who |\n|---|---|---|\n| 3.1 | Enter volume, pieces per tray, part weight and push time: the application shows the furnace hours a month and the net load per tray. | Production Manager |\n| 3.2 | Answer every question Yes, No or Not applicable; a No or Not applicable needs a note. The application shows hints: furnaces that do not run the process, the quench tank of each furnace, tray load, capacity. | Team |\n| 3.3 | Conclude: feasible as specified; feasible with the changes listed (list them); or not feasible (give the reason). \"Feasible as specified\" is not possible with a question answered No. | Team |\n\n### 4. Approval\n\n| Step | Action | Who |\n|---|---|---|\n| 4.1 | Enter the team (at least two, name and function), prepared by and approved by. Only an authorized person may approve (HT organization: heat treat person, deputy, authorized positions; or the names in Settings). | Quality Manager |\n| 4.2 | \"Approve feasibility\": the application refuses while anything is missing and lists it. Approved = locked. Print F-APQP-01 and sign it. | HT Manager |\n| 4.3 | A later change (drawing, material, requirement, furnace, family member): \"New revision\"; the approved revision stays in force until the new one is approved. | Quality Manager |\n\n### 5. Planning outputs and release (F-APQP-02)\n\n| Step | Action | Who |\n|---|---|---|\n| 5.1 | For each output (process flow, PFMEA, control plan, process specification, loading standard, trial lot, PPAP) record Done with its reference and date, or Not applicable with the reason. The process specification in force is shown from the Specifications module. | Quality Manager |\n| 5.2 | When feasible only with changes, tick that the changes are made. | HT Manager |\n| 5.3 | Enter released by and the date and press \"Release\". Production may run the part from then on. | Quality Manager |\n", "APQP/02_Work_Instructions/MWSPL-WI-APQP-02_Part_Families.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PART FAMILIES\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-APQP-02 | 00 | — | HT Manager | | |\n\n### 1. When a family may be used\n\nParts may share one feasibility study when all of the following are the same or within a stated range:\n\n| Criterion | Example |\n|---|---|\n| Process route and furnace | Isothermal annealing on F-03 |\n| Material group | 20MnCr5 / 16MnCr5 |\n| Section and weight range | 30–60 mm, 2–5 kg |\n| Requirements | Hardness 140–180 HB, no other test |\n| Loading | Same tray type and load build principle |\n\nA part with its own special characteristic, a different quench or a requirement outside the family's range gets its own study.\n\n### 2. Define the family\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | Application → Quality planning → \"New study (part family)\": family name, definition (the criteria of §1 with their ranges) and the parts, one per line. | HT Manager |\n| 2.2 | Complete the study as WI-APQP-01, answering the questions for the most difficult part of the family (largest section, heaviest load). | Team |\n| 2.3 | Approve it. Every part named is then covered (Parts coverage). The register F-APQP-03 is printed from the HTSA 1.2 evidence. | HT Manager |\n\n### 3. Adding a part\n\nCheck the part against the definition. If it fits, start a new revision of the family study, add the part, give the reason and approve it again. If it does not fit, give it its own study.\n", "APQP/03_Formats/MWSPL-F-APQP-01_Team_Feasibility_Commitment.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## TEAM FEASIBILITY COMMITMENT\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-APQP-01 | 00 | Application → Quality planning (\"Print F-APQP-01\" per study), signed |\n\n| Field | Entry |\n|---|---|\n| Study no. / revision | |\n| Part no. and name (or family name, definition and parts) | |\n| Drawing / customer specification and revision | |\n| Customer · material grade · process · furnace(s) | |\n| Customer requirements reviewed (document, revision, by, date) | |\n| Volume, pieces per tray, push time → furnace hours a month | |\n\n| # | Question | Yes / No / N.A. | Note |\n|---|---|---|---|\n| 1 | Part adequately defined (drawing, material, every heat treat requirement) | | |\n| 2 | Customer-specific requirements and heat treat specification reviewed and understood | | |\n| 3 | Material grade and section suitable for the process | | |\n| 4 | The process runs on the furnace(s) proposed | | |\n| 5 | Set values within the qualified range (TUS); tolerance achievable | | |\n| 6 | Part fits the tray and a defined load build; net load within the tray maximum | | |\n| 7 | Quench medium and severity sui
