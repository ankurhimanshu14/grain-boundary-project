table; distortion / cracking assessed (hardening) | | |\n| 8 | Controlled cooling cycle fits within the push time (isothermal annealing) | | |\n| 9 | Testing capability available | | |\n| 10 | Capacity available for the volume | | |\n| 11 | Special characteristics identified and can be met with the required capability | | |\n| 12 | Shot blasting, handling, packaging and traceability can be met | | |\n\n| Conclusion | ☐ Feasible as specified ☐ Feasible with the changes listed ☐ Not feasible |\n|---|---|\n| Changes needed / reason | |\n| Risks and special characteristics for the PFMEA / control plan | |\n| Team (name, function, signature) | |\n| Prepared by | |\n| Approved by (authorized) / date | |\n", "APQP/03_Formats/MWSPL-F-APQP-02_Quality_Planning_Checklist.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## QUALITY PLANNING CHECKLIST AND RELEASE\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-APQP-02 | 00 | Application → Quality planning (\"Print F-APQP-02\" per study) |\n\n| Field | Entry |\n|---|---|\n| Study no. · part / family | |\n| Feasibility revision, approved by / date, conclusion | |\n| Target date | |\n\n| Output | Done / N.A. | Reference | Date | Note (reason when N.A.) |\n|---|---|---|---|---|\n| Process flow diagram | | | | |\n| PFMEA (HTSA 1.3) | | | | |\n| Control plan (HTSA 1.4) | | | | |\n| Process specification (HTSA 1.6) | | | | |\n| Loading standard / load build | | | | |\n| Trial lot and its test results | | | | |\n| PPAP / customer approval | | | | |\n\n| Changes listed in the feasibility made (when applicable) | ☐ Yes |\n|---|---|\n| Released for production by / date | |\n| PPAP / release reference | |\n", "APQP/03_Formats/MWSPL-F-APQP-03_Part_Family_Register.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PART FAMILY REGISTER\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-APQP-03 | 00 | Application → Quality planning → Procedure & part families (printed with the HTSA 1.2 evidence) |\n\n| Family | Study no. / rev | Definition (process, furnace, material group, section / weight range, requirements) | Parts | Approved by / date |\n|---|---|---|---|---|\n| | | | | |\n", "APQP/04_Application/mwspl-apqp-module.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## APQP MODULE: APPLICATION DESCRIPTION\n\nThe module runs in the CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`, \"Quality planning\"). Source: `QMS/APQP/04_Application/mwspl-apqp-module.js`. CALOR itself has no page for HTSA 1.2; this module is new.\n\n| Item | Value in the code |\n|---|---|\n| HTSA question | **1.2** (documented advanced quality planning procedure; feasibility study performed and internally approved for each part; part families as defined by the heat treater; wording to confirm against the controlled copy); uses 1.1 (who may approve, `MWS.org.authorized()`) and 1.6 (specifications in force, `MWS.spec.inForce()`) |\n| Procedure | `config/proc` {no, rev, prep, appr, apprDate, change, log}; review every `reviewDays` (365) |\n| Study `studies` (`AQ-nnnn`) | scope part / family (`famName`, `famDef`, `parts`), part, name, drawing, drawRev, customer, grade, proc HT / IA / NORM, furnaces, source, started, target, vol, pcs, wt, push, `csr{ref, by, date, notes}`, `ans{key: {a yes/no/na, note}}` (12 questions `FEAS`, quench only HT, controlled cooling only IA), conc feasible / changes / not, changes, risks, team, prep, appr, apprDate, rev, status draft / approved, revs, change, `del{flow, pfmea, cp, spec, lb, trial, ppap: {st open/done/na, ref, date, note}}`, chgDone, `rel{by, date, ref}`, `cancel{date, why}`, log |\n| Hints `autoHints` | furnaces that do not run the process (Settings `runs`), quench tank per furnace (F-01 water, F-02 oil), net load per tray vs `trayKg` (200), furnace hours a month vs `hrsMonth` (600) and `capPct` (85 %) |\n| Gate `feasMissing` | identification, customer requirements, every question answered (note on No / N.A.), conclusion with changes / reason, \"feasible as specified\" not with a No, team ≥ 2, prepared, approved by an approver (`approvers()` = Settings + HT organization), reason for a revision |\n| Release `relMissing` | approved feasible study, changes confirmed, every output done (reference) or N.A. (note), a specification in force for each part (when the Specifications module has data), released by and date |\n| Coverage `coverage` | parts with a specification in force + parts in studies (a family covers its parts; cancelled-only parts without a specification drop out; N/A never a part) |\n| HTSA 1.2 `assess12` | procedure, a study for each part, internally approved, approver allowed, part families, feasible before production, customer requirements, planning completed; score nia / ns / s |\n| Records | `studies`, `config/settings`, `config/proc`; shared store prefix `apqp-`, else `localStorage` `mws-apqp-local-v1` |\n| API | `MWS.apqp.stats()`, `summary()`, `feasible()`, `refresh()`, `closeModal()` |\n", "SCADA/00_SCADA_Master_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SCADA MODULE: SCADA TEMPERATURE REVIEW — MASTER LIST\n\n**Basis:** AIAG CQI-9 4th Edition, HTSA question **1.9** (\"Is the heat treat monitoring system reviewed by Qualified Personnel?\"): a second-level review, on top of the operators' review, by qualified personnel of the temperature charts, computer data logs and furnace / operator logs; at intervals not exceeding 24 hours; the review process documented, including for computerized data; out-of-control conditions and alarms detected, with a documented reaction. The review data also feed HTSA 1.8 (collect and analyse data over time). The tolerance comes from the process specifications (HTSA 1.6) and the pyrometry status from the thermocouples (HTSA 3.3). PDCA: **Check**.\n\n**Why 1.9:** the SCADA log of the zone thermocouples is the computer data log of the heat treat monitoring system. Reviewing it once a day per chamber, by a qualified person, with every out-of-control condition answered, is exactly what 1.9 asks. Temperature control within the specification itself is a process-table requirement (Process Tables A and E); the review is the evidence that it was checked.\n\n**Application:** CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`) → SCADA review.\n\n### Documents\n\n| PDCA | Doc. No. | Title | Rev. | Date | File link |\n|---|---|---|---|---|---|\n| C | MWSPL-QP-SCADA-01 | Second-level review of SCADA temperature data | 00 | — | [01_Procedure/MWSPL-QP-SCADA-01_Second-Level_Review_of_SCADA_Temperature_Data.md](01_Procedure/MWSPL-QP-SCADA-01_Second-Level_Review_of_SCADA_Temperature_Data.md) |\n| D | MWSPL-WI-SCADA-01 | Export and load a SCADA record | 00 | — | [02_Work_Instructions/MWSPL-WI-SCADA-01_Export_and_Load_a_SCADA_Record.md](02_Work_Instructions/MWSPL-WI-SCADA-01_Export_and_Load_a_SCADA_Record.md) |\n| C / A | MWSPL-WI-SCADA-02 | Review and react | 00 | — | [02_Work_Instructions/MWSPL-WI-SCADA-02_Review_and_React.md](02_Work_Instructions/MWSPL-WI-SCADA-02_Review_and_React.md) |\n| C | MWSPL-F-SCADA-01 | SCADA review record | 00 | — | [03_Formats/MWSPL-F-SCADA-01_SCADA_Review_Record.md](03_Formats/MWSPL-F-SCADA-01_SCADA_Review_Record.md) |\n| — | — | Module description (application) | — | — | [04_Application/mwspl-scada-module.md](04_Application/mwspl-scada-module.md) |\n\n### Where each requirement is met\n\n| Requirement (HTSA 1.9) | Met by | Evidence in the application |\n|---|---|---|\n| Reviewed by qualified personnel | QP-SCADA-01 §5; Settings | List of qualified reviewers (Settings, and people meeting the HTSA 1.1 minimum in the HT organization module); a review by anyone else is not complete |\n| Second-level review of computer data logs, charts, furnace and operator logs | QP-SCADA-01 §6.2; WI-SCADA-02 | Analysis of every zone thermocouple against its set value; notes field for the furnace / operator log and alarms checked |\n| At intervals not exceeding 24 hours | QP-SCADA-01 §6.1 | Due 24 h after the last review per chamber; gaps over 30 days; \"not running\" records |\n| Review process documented, also for computerized data | QP-SCADA-01; WI-SCADA-01 / 02 | Procedure named in Settings; rules of the analysis in the module |\n| Detection of out-of-control conditions and alarms | WI-SCADA-02 §2 | Conditions found by the analysis (excursions, tolerance, offline / stuck thermocouples, gaps, settling, specification, SAT) |\n| Documented reaction | WI-SCADA-02 §3; F-SCADA-01 | Each condition answered (reaction with owner and product disposition, or the record that handles it); closed with verification |\n\n### First-cycle implementation checklist\n\n- [ ] Name the qualified reviewers (Settings) or record their qualification in the HT organization module.\n- [ ] Set the chambers in scope; confirm the tolerance, settling and interval settings.\n- [ ] Approve the process specifications so the set values have their tolerances.\n- [ ] From the next day on, export and review every chamber once a day (WI-SCADA-01 / 02); record \"not running\" for stopped furnaces.\n- [ ] Check that the HTSA 1.9 panel reads Satisfactory after 30 days; file the evidence print.\n", "SCADA/01_Procedure/MWSPL-QP-SCADA-01_Second-Level_Review_of_SCADA_Temperature_Data.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SECOND-LEVEL REVIEW OF SCADA TEMPERATURE DATA\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Reviewed | Approved | Copy status |\n|---|---|---|---|---|---|---|---|\n| MWSPL-QP-SCADA-01 | 00 | — | HT Manager | | | | Uncontrolled until approved |\n\n### 1. Purpose\n\nTo review the heat treat monitoring data of every furnace chamber at least every 24 hours, by qualified personnel, on top of the operators' checks, and to detect and react to every out-of-control condition (CQI-9 HTSA 1.9).\n\n### 2. Scope\n\nThe SCADA zone temperature logs of the hardening and tempering chambers of F-01 to F-04 (six thermocouples per chamber, TC-01 … TC-06; odd numbers on the right wall, even numbers on the left), with the furnace / operator log and the alarm history of the same period.\n\n### 3. References\n\n- AIAG CQI-9 4th Edition, HTSA 1.9, 1.8, 1.6, 3.3; Process Tables A and E (controlled copy).\n- MWSPL-WI-SCADA-01, -02; MWSPL-F-SCADA-01; MWSPL-QP-SPEC-01; MWSPL-QP-TC-01; MWSPL-QP-ORG-01.\n\n### 4. Terms\n\n| Term | Meaning |\n|---|---|\n| Record | One SCADA export of one chamber (normally one production day). |\n| Deviation | Thermocouple reading − the set value in force at that reading. |\n| Settling | The time after a set value change until the thermocouple is back within tolerance; not judged. |\n| Incident | Readings of a zone outside tolerance; \"product affected\" when the zone counts for the process (hardening chamber zones 2–3 above 800 °C; every tempering chamber zone). |\n| Condition | An out-of-control finding the reviewer must answer. |\n\n### 5. Responsibility\n\n| Role | Responsibility |\n|---|---|\n| Shift supervisor | Exports the record (WI-SCADA-01); operators' first-level checks during the shift |\n| Qualified reviewer (HT Manager, HT Engineer or as listed) | Second-level review within 24 h (WI-SCADA-02); decides the reaction and the product disposition |\n| HT Manager | Owns this procedure and the reviewer list; releases held product |\n| Quality Manager | Verifies closed reactions; audits HTSA 1.9 |\n\n### 6. Procedure\n\n#### 6.1 Interval\n\nEvery chamber in scope is reviewed at intervals not exceeding 24 hours. A chamber that was not running is recorded as \"not running\" with the reason.\n\n#### 6.2 Review\n\n1. The record is loaded and analysed in the application against the set values (tolerance from the specification in force, else ±10 °C).\n2. The reviewer checks the findings, the zone charts, the furnace / operator log and the alarm history of the period.\n3. Every condition is answered: a reaction (action, owner, product disposition when product is affected) or the record that already handles it (alarm record, 8D, SAT, maintenance order).\n4. The reviewer signs with the time of review.\n\n#### 6.3 Reaction\n\nProduct affected: hold the trays of the window until assessed (hardness / metallurgy), then release, re-heat-treat per the rework procedure, scrap or inform the customer. A reaction is closed only with its verification and a final disposition.\n\n### 7. Records\n\n| Record | Kept in | Retention |\n|---|---|---|\n| Review record (F-SCADA-01) with summary and 10-minute trend | Application → Reviews | 3 years minimum |\n| SCADA export files | SCADA archive (server) | 3 years minimum |\n\n### 8. Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue | |\n", "SCADA/02_Work_Instructions/MWSPL-WI-SCADA-01_Export_and_Load_a_SCADA_Record.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## EXPORT AND LOAD A SCADA RECORD\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SCADA-01 | 00 | — | Shift supervisor, reviewer | | |\n\n| Step | Action | Who |\n|---|---|---|\n| 1 | At 08:00 (start of the production day), open the SCADA report \"ALL TEMP\" of each chamber for the previous 24 hours. | Shift supervisor |\n| 2 | Export it to Excel (Date, Time, SET-1 / PV-1 … SET-6 / PV-6). Keep the heading, e.g. \"FURNACE-2 TEMPRING FURNACE ALL TEMP\": it tells the application the furnace and chamber. | Shift supervisor |\n| 3 | Save it in the SCADA archive as <furnace>_<chamber>_<date>.xlsx. | Shift supervisor |\n| 4 | Application → SCADA review → Load & analyse → choose the file. Check the furnace and chamber shown; correct them if the heading was not recognised. | Reviewer |\n| 5 | Read the findings and the zone charts; then \"Record the second-level review\" (WI-SCADA-02). | Reviewer |\n", "SCADA/02_Work_Instructions/MWSPL-WI-SCADA-02_Review_and_React.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## REVIEW AND REACT\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SCADA-02 | 00 | — | Qualified reviewer | | |\n\n### 1. Before the review\n\nHave the furnace / operator log and the alarm history of the same period at hand.\n\n### 2. Conditions to answer\n\n| Condition | Typical reaction |\n|---|---|\n| Incident, product affected | Hold the trays of the window (positions shown), hardness / metallurgy check, disposition; find the cause (burner, thermocouple, set value) |\n| Thermocouple below 100 % in tolerance | Check the thermocouple and the zone control; maintenance order |\n| Offline / stuck thermocouple, readings out of range | Check wiring and element; SAT after repair (Thermocouples module) |\n| Data gap | Find why the SCADA did not log; check the paper chart / operator log for the gap |\n| Not back within tolerance after a set value change | Check the burner capacity / tuning |\n| Set value without a specification in force | Correct the set value or approve the specification |\n| SAT failed / overdue, element past life | Handled in the Thermocouples module: give its record number |\n\n### 3. Record\n\n| Step | Action |\n|---|---|\n| 3.1 | For each condition choose \"Reaction recorded here\" (action, owner, product disposition) or \"Handled in another record\" (its number). |\n| 3.2 | Enter the review time and your name (you must be in the list of qualified reviewers). Note the logs and alarms you checked. Save. |\n| 3.3 | When the action is done and checked, enter the closing date and the verification; a reaction with product still on hold cannot be closed. |\n| 3.4 | A problem seen on two or more days: open an 8D / CAPA and give its number. |\n", "SCADA/03_Formats/MWSPL-F-SCADA-01_SCADA_Review_Record.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SCADA REVIEW RECORD\n\n| Doc No. | Rev | Kept as |\n|---|---|---|\n| MWSPL-F-SCADA-01 | 00 | Application → Reviews (\"Print record\") |\n\n| Field | Entry |\n|---|---|\n| Review no. / furnace / chamber | |\n| Data period / file | |\n| Result (in control / with findings / product affected / not running) | |\n| Per thermocouple: % in tolerance, mean deviation, min / max | |\n| Zone charts (10-minute trend) | |\n| Conditions and their answers (reaction, owner, product disposition, closed, verification — or the record that handles it) | |\n| Logs and alarms checked (notes) | |\n| Reviewed on / by (qualified reviewer) / signature | |\n", "SCADA/04_Application/mwspl-scada-module.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SCADA MODULE: APPLICATION DESCRIPTION\n\nThe module runs in the CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`, \"SCADA review\"). Source: `QMS/SCADA/04_Application/mwspl-scada-module.js`, sample record `sample.json` (F-02 tempering chamber, 22-Oct-2026, embedded by the build). The analysis follows the CALOR SCADA review (`SCADA_Review_2.html`); the review record and the HTSA 1.9 rules follow the CALOR Data review page (`Monitoring_Review.html`).\n\n| Item | Value in the code |\n|---|---|\n| HTSA question | **1.9** (second-level review of the monitoring system by qualified personnel, ≤ 24 h, documented, detection and reaction); feeds 1.8 (History view); uses 1.6 (tolerances from specifications in force) and 3.3 (SAT / element life from the Thermocouples module) |\n| Reading | .xlsx read in the browser without libraries (zip + `DecompressionStream`), or .csv; header row with SET-1 / PV-1; date \"Oct-22-2026\", \"22-10-2026\", \"2026-10-22\" or an Excel serial; time as a day fraction or hh:mm:ss; heading \"FURNACE-n TEMPRING / HARDENING\" → furnace and chamber |\n| Analysis `analyze` | valid 500–1000 °C; offline = 0 all record; deviation = PV − the row's set value; tolerance = specification in force matching the zone set value, else ±10; settling after a set value change (back within tolerance 3 readings, at most 120 min) not judged; excursions ≥ 1 reading, joined within 10 min, per zone incidents; product affected: hardening chamber zones 2–3 above 800 °C, every tempering zone; spikes > 15 °C, stuck ≥ 30 min, gaps > 2.5 × step; wall difference left − right |\n| Conditions `findings` | incidents, TC below 100 %, offline, out of range, stuck, gaps, late settling, set value without specification, SAT failed / overdue / none, element past life |\n| Review record | collection `reviews` (`DR-nnnn`): chamber, data period, file, verdict, per-TC summary, incidents, findings, 10-minute trend, `lines{condition: {how react / ref, ref, action, owner, disp, closed, verify}}`, `at`, `by`, notes; `idle` for \"not running\"; the file itself is not stored |\n| Gate `revMissing` | furnace and chamber, review time after the data and not in the future, qualified reviewer, every condition answered (reaction: action, owner, disposition for product; closing: verification, not \"on hold\") |\n| Interval `cstat` / `gaps19` | due `maxHrs` (24) after the last review per chamber in scope; gaps in `covDays` (30) |\n| HTSA 1.9 `assess19` | qualified reviewers, procedure named, intervals, reviews complete, conditions answered, reactions closed; score nia / ns / s |\n| Load & analyse (report) | layout of the CALOR SCADA report: verdict, six KPI tiles, furnace layout with TC status, zone cards (left / right wall, Ppk), zone trends on one scale with out-of-tolerance readings marked, response to set value changes, hourly deviation heatmap, spread per TC (p5–p95), excursion log, product affected time windows, findings, data-integrity checks; \"Record the review (C)\" opens the HTSA 1.9 review |\n| Records | `reviews`, `config/settings`; shared store prefix `scada-`, else `localStorage` `mws-scada-local-v1` |\n| API | `MWS.scada.stats()`, `summary()`, `closeModal()`; uses `MWS.spec.inForce()`, `MWS.tc.chamber()`, `MWS.org.qualified()` |\n| Not here | 8D problem solving and the record-level PDCA of the CALOR SCADA review |\n", "SPEC/00_SPEC_Master_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPEC MODULE: PROCESS SPECIFICATIONS — MASTER LIST\n\n**Basis:** AIAG CQI-9 4th Edition, HTSA question 1.6 (\"a documented system to create process specifications for all active processes\") and the Process Tables (Table A hardening & tempering, Table E annealing / normalizing; table letters to be confirmed against the controlled copy). IATF 16949 §8.5.1 (control plan, work instructions at the line) and §8.5.6 (control of changes) as context. PDCA: **Plan** (the specification is the plan for every heat treatment).\n\n**Application:** CALOR → PROCESS → Specifications (`Process_Specifications.html`). The register, approvals, revisions, job cards and the HTSA 1.6 self-assessment are held there. Pilot of the integrated application: the same module in `QMS/00_Integrated_Application/calor-quality-system.html` (see the module description).\n\n### Documents\n\n| PDCA | Doc. No. | Title | Rev. | Date | File link |\n|---|---|---|---|---|---|\n| P | MWSPL-QP-SPEC-01 | Process specifications | 00 | — | [01_Procedure/MWSPL-QP-SPEC-01_Process_Specifications.md](01_Procedure/MWSPL-QP-SPEC-01_Process_Specifications.md) |\n| P / D | MWSPL-WI-SPEC-01 | Write and approve a process specification | 00 | — | [02_Work_Instructions/MWSPL-WI-SPEC-01_Write_and_Approve_a_Specification.md](02_Work_Instructions/MWSPL-WI-SPEC-01_Write_and_Approve_a_Specification.md) |\n| A | MWSPL-WI-SPEC-02 | Change a specification: new revision, implementation, obsolete | 00 | — | [02_Work_Instructions/MWSPL-WI-SPEC-02_Change_a_Specification.md](02_Work_Instructions/MWSPL-WI-SPEC-02_Change_a_Specification.md) |\n| C | MWSPL-WI-SPEC-03 | Periodic review and HTSA 1.6 self-assessment | 00 | — | [02_Work_Instructions/MWSPL-WI-SPEC-03_Periodic_Review_and_Self-Assessment.md](02_Work_Instructions/MWSPL-WI-SPEC-03_Periodic_Review_and_Self-Assessment.md) |\n| P | MWSPL-F-SPEC-01 | Process specification (content and layout) | 00 | — | [03_Formats/MWSPL-F-SPEC-01_Process_Specification.md](03_Formats/MWSPL-F-SPEC-01_Process_Specification.md) |\n| A | MWSPL-F-SPEC-02 | Specification change review | 00 | — | [03_Formats/MWSPL-F-SPEC-02_Change_Review.md](03_Formats/MWSPL-F-SPEC-02_Change_Review.md) |\n| P | MWSPL-F-SPEC-03 | Authorization to approve process specifications | 00 | — | [03_Formats/MWSPL-F-SPEC-03_Authorization_List.md](03_Formats/MWSPL-F-SPEC-03_Authorization_List.md) |\n| C | MWSPL-F-SPEC-04 | Specification register and periodic review record | 00 | — | [03_Formats/MWSPL-F-SPEC-04_Register_and_Review.md](03_Formats/MWSPL-F-SPEC-04_Register_and_Review.md) |\n| C / A | MWSPL-F-SPEC-05 | SPEC KPIs | 00 | — | [03_Formats/MWSPL-F-SPEC-05_KPI.md](03_Formats/MWSPL-F-SPEC-05_KPI.md) |\n| — | — | Module description (application) | — | — | [04_Application/mwspl-spec-module.md](04_Application/mwspl-spec-module.md) |\n\n### Where each requirement is met\n\n| Requirement (HTSA 1.6, as checked by CALOR `assess16`) | Met by | Evidence in CALOR |\n|---|---|---|\n| Authorization to establish process specifications is defined | QP-SPEC-01 §5, §6.1; F-SPEC-03 | HT organization page: HT position and positions marked \"authorized to approve process specifications\" |\n| The responsible heat treat person (HTSA 1.1) is authorized | QP-SPEC-01 §5 | HTSA 1.6 panel item (warning if not) |\n| Specifications approved by an authorized person | WI-SPEC-01 step 4.3; F-SPEC-01 §9 | Approval gate refuses a non-authorized approver |\n| Written process specifications for all active processes | QP-SPEC-01 §6.1, §6.3; WI-SPEC-03 §2 | Parts produced on the Daily production page in the last 90 days checked per furnace |\n| All steps with their parameters and operating tolerances | F-SPEC-01 §4–§7; WI-SPEC-01 §3 | Steps table of each specification; approval gate |\n| Available as work instruction, job card or recipe | QP-SPEC-01 §6.2; WI-SPEC-01 §5 | \"Form at the line\" field; job card printed from the register |\n| Changes reviewed for continued conformity with customer requirements | WI-SPEC-02 §2; F-SPEC-02 | Change review fields, required for every revision after rev 0 |\n| Changes documented with the date implemented and the approver | WI-SPEC-02 §3 | \"Record implementation\"; not recorded within 7 days of approval = not met |\n| Periodic review | WI-SPEC-03 §1; F-SPEC-04 | Review due 365 days after the approval of the revision in force |\n\n### First-cycle implementation checklist\n\n- [ ] Mark the authorized positions on the HT organization page (holder and deputy of the HT position count automatically); print F-SPEC-03.\n- [ ] Confirm Settings → Processes per furnace (F-01: IA, HT · F-02: IA, NORM, HT · F-03 / F-04: IA, NORM) and the defaults (tolerances, quench delay 30 s, dip 8.5 ± 0.5 min, transfer 18 min).\n- [ ] Clear the example data; write a specification for every part produced in the last 90 days, per furnace (WI-SPEC-01).\n- [ ] Approve them; record the implementation date within 7 days; print the job cards for the control panels.\n- [ ] Check the HTSA 1.6 panel reads Satisfactory; file the HTSA 1.6 evidence PDF.\n- [ ] Approve QP-SPEC-01, the three WIs and the formats; train the HT Engineer, HT Manager and shift supervisors (Procedures & WIs page).\n- [ ] Start the KPI format F-SPEC-05 for the financial year.\n", "SPEC/01_Procedure/MWSPL-QP-SPEC-01_Process_Specifications.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PROCESS SPECIFICATIONS\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Reviewed | Approved | Copy status |\n|---|---|---|---|---|---|---|---|\n| MWSPL-QP-SPEC-01 | 00 | — | HT Manager | | | | Uncontrolled until approved |\n\n### 1. Purpose\n\nTo establish, approve, make available, change and review a written process specification for every part and process heat treated, so that every tray is processed to defined parameters with operating tolerances (CQI-9 HTSA 1.6).\n\n### 2. Scope\n\n- **Site:** Bhiwadi, heat treatment shop (the only site in scope).\n- **Equipment:** continuous gas-fired pusher furnaces F-01 to F-04 (hardening chamber 3 zones / 13 tray positions; controlled cooling chamber; tempering chamber 3 zones / 12 tray positions).\n- **Processes:** hardening & tempering (HT: F-01 water quench, F-02 oil quench), isothermal annealing (IA: all furnaces), normalizing (NORM: F-02, F-03, F-04). Full annealing is not yet covered by a specification.\n- **Not in scope:** the steel supplier's and the customer's own specifications (they are inputs).\n\n### 3. References\n\n- AIAG CQI-9 4th Edition, HTSA 1.6 and Process Tables A / E (controlled copy).\n- IATF 16949:2016 §8.5.1, §8.5.6; customer-specific requirements.\n- MWSPL-WI-SPEC-01, -02, -03; MWSPL-F-SPEC-01 to -05.\n- WI-HT-01 General operating procedure; Control plans and PFMEAs (CALOR → CP & PFMEA); SOP-QA-12 Rework.\n\n### 4. Terms and definitions\n\n| Term | Meaning |\n|---|---|\n| Process specification (spec) | The controlled record of how one part is heat treated by one process: part data, approved furnaces, loading, zone set values with tolerances, push time, quench / controlled cooling / transfer, after-exit cooling and the product requirements and testing. Number PS-nnnn, revision 0, 1, 2 … |\n| Revision in force | The last approved revision. A new revision in draft does not replace it until approved. |\n| Job card | The one-page print of the revision in force for the line (part, set values, push, quench / cooling, requirements). |\n| Active process | A part produced on a furnace in the last 90 days (Daily production page). |\n| Authorized person | A person allowed to approve specifications: the holder and deputy of the heat treat position (HTSA 1.1) and of the positions marked as authorized on the HT organization page. |\n| Operating tolerance | ± value, maximum or range within which a parameter must be held at the line. |\n\n### 5. Responsibility and authority\n\n| Role | Responsibility | Authority |\n|---|---|---|\n| HT Engineer | Prepares specifications and revisions; gathers customer requirements; validation trial | Prepare, propose changes |\n| HT Manager (heat treat person, HTSA 1.1) and deputy | Reviews and approves; decides on changes; owns this procedure | Approve, make obsolete |\n| Other authorized positions (marked on the HT organization page) | Approve within their authorization | Approve |\n| Quality Manager | Reviews product requirements, sampling and customer notification; control plan / PFMEA alignment | Customer notification |\n| Shift supervisor | Uses only the job card of the revision in force; records the implementation | Stop the line if no valid job card |\n| Director | Provides the authorization structure (HT organization) | — |\n\n### 6. Procedure\n\n```\n        +-------------------------------+\n        |  PLAN  6.1                    |\n        |  authorization, processes per |\n        |  furnace, write the spec      |\n        +---------------+---------------+\n                        |\n                        v\n+-------------------+   approve    +-------------------------------+\n|  ACT  6.4         |<-------------|  DO  6.2                      |\n|  new revision,    |              |  job card at the line,        |\n|  change review,   |              |  implementation recorded      |\n|  obsolete         |              +---------------+---------------+\n+---------+---------+                              |\n          ^                                        v\n          |                        +-------------------------------+\n          +------------------------|  CHECK  6.3                   |\n                                   |  periodic review, active parts|\n                                   |  vs specs, HTSA 1.6 score     |\n                                   +-------------------------------+\n```\n\n#### 6.1 PLAN\n\n1. The authorized persons are defined on the HT organization page (F-SPEC-03 is its printout). The heat treat person (HTSA 1.1) must be among them.\n2. The processes each furnace runs are kept in the Specifications page settings (\"Processes per furnace\"). A specification cannot be approved for a furnace that does not run its process.\n3. The HT Engineer writes the specification (MWSPL-WI-SPEC-01) with every step and its operating tolerance (F-SPEC-01): loading (pieces per tray, loading pattern), push time ± tolerance, the set value ± tolerance of each zone of both chambers, quench (medium, temperature range, delay maximum, dip time ±, agitation, transfer maximum) or controlled cooling (time ±, method, target ±) or transfer, after-exit cooling, and the product requirements (hardness range and scale, core, microstructure, decarburization limit, grain size, sampling, method).\n4. The page calculates the time per zone, the time between the chambers and the time through the line from the line layout (5 / 4 / 4 and 4 / 4 / 4 positions; transfer 18 min measured; controlled cooling cycle for isothermal annealing, which must end before the next push) and gives line-practice advice; any critical advice blocks the approval.\n\n#### 6.2 DO\n\n1. An authorized person approves the specification after the approval gate shows nothing missing (part data, furnaces, all steps with tolerances, hardness scale, decarburization limit, where it is available at the line, prepared / reviewed / approved by, approval date; for a revision also the reason and the change review). Approved = locked.\n2. The specification is made available at the line as a work instruction, a job card (printed from the register) or a computer-based recipe (SCADA / PLC), as stated in the specification.\n3. The date it was implemented at the line and by whom are recorded (\"Record implementation\") within 7 days of the approval.\n4. Production, hardness testing, load build and control plans use only the revision in force (they read it from the register).\n\n#### 6.3 CHECK\n\n1. **Periodic review:** every specification is reviewed 365 days after the approval of its revision in force (due shown 30 days before) — MWSPL-WI-SPEC-03.\n2. **Active processes:** the parts produced on each furnace in the last 90 days must each have a specification in force approved for that furnace; a part without one is a critical finding.\n3. **HTSA 1.6 self-assessment:** the panel on the Specifications page scores the system Satisfactory / Not satisfactory / Needs immediate action (no specification in force, or an active part without one); it is reviewed monthly with the KPIs (F-SPEC-05).\n\n#### 6.4 ACT\n\n1. Any change (set value, tolerance, push time, quench / cooling, furnace, loading, requirement) is made only by a new revision (MWSPL-WI-SPEC-02). The revision in force stays in use until the new one is approved.\n2. Every revision after rev 0 needs a change review (F-SPEC-02): customer requirements checked, customer notification decision (not required / notified / approved, with the reference), control plan and PFMEA reviewed, validation (trial or first-off result).\n3. A specification no longer used is made obsolete with a reason; only never-approved drafts may be deleted.\n4. Findings of the review and the self-assessment are acted on by the HT Manager; actions are tracked in the KPI format.\n\n### 7. Records\n\n| Record | Format | Retention | Owner |\n|---|---|---|---|\n| Process specification with all revisions | F-SPEC-01 (CALOR register; PDF / Excel per specification) | Life of the part + 1 year (to confirm with the record retention rule) | HT Manager |\n| Change review | F-SPEC-02 (in the revision) | As the specification | HT Manager |\n| Authorization list | F-SPEC-03 (HT organization page) | Current + superseded 3 years | HT Manager |\n| Register and periodic review | F-SPEC-04 (register Excel) | 3 years | HT Engineer |\n| HTSA 1.6 evidence | PDF from the panel | 3 years | Quality Manager |\n| KPIs | F-SPEC-05 | 3 years | HT Manager |\n\n**Application:** CALOR holds the specifications, their revisions (a snapshot of every earlier revision), the approval, change review and implementation data and a dated log of every action in its register (`psr-reg`). The register is kept in the browser and, when linked, as `psr-reg.json` in the Google Drive folder with daily backups. PDF and Excel outputs are made from the page (specification, job card, register, HTSA 1.6 evidence). Paper job cards are uncontrolled copies of the revision in force.\n\n### 8. Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/02_Work_Instructions/MWSPL-WI-SPEC-01_Write_and_Approve_a_Specification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## WRITE AND APPROVE A PROCESS SPECIFICATION\n\n| Doc No. | Rev | Issue date | Parent procedure sections | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SPEC-01 | 00 | — | MWSPL-QP-SPEC-01 §6.1, §6.2 | | |\n\n**Records:** process specification F-SPEC-01 in the CALOR register (PS-nnnn), its log, the job card.\n\n### 1. Before you start\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 1.1 | Collect the inputs: customer drawing and specification (hardness, core, microstructure, decarburization, grain size, sampling), steel grade, part weight, the customer-specific requirements. | HT Engineer |\n| 1.2 | Check that a specification for this part and process does not already exist: CALOR → PROCESS → Specifications, search the register by part no. (a duplicate part + process is flagged). | HT Engineer |\n| 1.3 | Check which furnaces run the process (Settings → Processes per furnace): HT on F-01 (water) / F-02 (oil); IA on all; NORM on F-02, F-03, F-04. | HT Engineer |\n\n### 2. Part data\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 2.1 | Click **New specification**. Enter part no., part name, customer, drawing no., steel grade and process (HT / IA / NORM). | HT Engineer |\n| 2.2 | Tick the approved furnaces. A furnace marked \"(does not run this process)\" cannot be approved. | HT Engineer |\n| 2.3 | Enter the pieces per tray, the part weight (kg) and the tray / fixture. Check the load per tray against the tray maximum (HK trays 200 kg). | HT Engineer |\n\n### 3. Thermal cycle with operating tolerances\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 3.1 | Hardening chamber: set value and ± tolerance of zones 1, 2, 3 (zone 1 preheats; zones 2–3 austenitize above 800 °C for HT / IA; 700–750 °C preheat for NORM). | HT Engineer |\n| 3.2 | Tempering chamber: set value and ± tolerance of zones 1, 2, 3 (tempering / isothermal hold; austenitizing for NORM). | HT Engineer |\n| 3.3 | Push time (min) and its ± tolerance. Read the calculated time per zone, time between the chambers and time through the line shown by the page. | HT Engineer |\n| 3.4 | HT: quench medium (must match the furnace's tank: F-01 water, F-02 oil), quenchant temperature range (both limits), quench delay maximum (default 30 s), dip time and ± tolerance (default 8.5 ± 0.5 min), agitation, transfer maximum. | HT Engineer |\n| 3.5 | IA: controlled cooling time ± tolerance, method, target temperature ± tolerance. The page shows whether the cooling cycle (cooling + transfers) fits in the push time; a cycle that does not fit blocks the approval. | HT Engineer |\n| 3.6 | NORM: transfer time and fan cooling after exit (required / not, time ± tolerance). | HT Engineer |\n| 3.7 | Read the **Steps and parameters** box: every step must show its value with a tolerance, maximum or range. Fill anything listed as missing. | HT Engineer |\n\n### 4. Requirements, review and approval\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 4.1 | Product requirements: hardness min / max and scale, core, microstructure, decarburization limit (required), grain size, other, sampling (quantity and frequency, required), test method. | HT Engineer / Quality Manager |\n| 4.2 | Enter \"prepared by\" and \"reviewed by\"; click **Save draft**. Read the advice (TUS range, quench tank, line practice) and correct where needed. | HT Engineer |\n| 4.3 | The approver opens the draft, checks it against the inputs of step 1.1, enters \"approved by\" (only an authorized person is accepted) and the approval date, and clicks **Approve**. The page lists anything still missing; approval is refused until the list is empty and no critical advice remains. | HT Manager (authorized person) |\n\n### 5. Make it available at the line\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 5.1 | \"Form at the line\": state where it is available (work instruction / job card / SCADA-PLC recipe / other) and its reference. | HT Engineer |\n| 5.2 | Print the **Job card** of the revision in force; put it at the control panel of each approved furnace; remove any older card. For a recipe, load the values into SCADA / PLC and check them against the job card. | Shift supervisor |\n| 5.3 | Click **Record implementation**: date implemented (not before the approval, not in the future) and by whom. Do this within 7 days of the approval. | Shift supervisor / HT Engineer |\n\n### Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/02_Work_Instructions/MWSPL-WI-SPEC-02_Change_a_Specification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## CHANGE A SPECIFICATION: NEW REVISION, IMPLEMENTATION, OBSOLETE\n\n| Doc No. | Rev | Issue date | Parent procedure sections | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SPEC-02 | 00 | — | MWSPL-QP-SPEC-01 §6.2, §6.4 | | |\n\n**Records:** the new revision with its reason and change review (F-SPEC-02), the snapshot of the earlier revision, the implementation date, the log.\n\n### 1. Start a new revision\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 1.1 | Any change to a set value, tolerance, push time, quench / cooling parameter, furnace, loading or requirement needs a new revision. A temporary change at the line is a parameter change on the Daily production page, not a revision; a permanent change is a revision. | HT Manager |\n| 1.2 | Open the approved specification and click **New revision**. The page keeps the approved revision in force and starts a draft rev + 1; the change review and implementation fields are cleared. | HT Engineer |\n| 1.3 | Make the change; enter the **reason for the change**. | HT Engineer |\n| 1.4 | To abandon the change, click **Discard revision**: the revision in force is restored unchanged. | HT Engineer |\n\n### 2. Change review (F-SPEC-02)\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 2.1 | Customer requirements checked: state what was checked (drawing, customer specification, PPAP values) and the result. | HT Engineer |\n| 2.2 | Customer notification decision: not required / customer notified / customer approval obtained (e.g. PPAP); give the reference when notified or approved. | Quality Manager |\n| 2.3 | Tick \"control plan and PFMEA reviewed\" after checking the CP & PFMEA page (regenerate the control plan rows from the new revision if needed). | Quality Manager |\n| 2.4 | Validation: record the trial or first-off result that shows the change works (e.g. trial batch no., hardness range, microstructure). | HT Engineer |\n\n### 3. Approve and implement\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 3.1 | Approve the revision as WI-SPEC-01 step 4.3; the gate also requires the reason and the complete change review. | HT Manager (authorized person) |\n| 3.2 | Replace the job card / recipe at every approved furnace; withdraw the old card. | Shift supervisor |\n| 3.3 | **Record implementation** within 7 days of the approval. After 7 days without it the HTSA 1.6 item \"Changes documented with the date implemented and the approver\" is not met. | Shift supervisor / HT Engineer |\n\n### 4. Make obsolete\n\n| Step | Activity | Responsibility |\n|---|---|---|\n| 4.1 | When a part is no longer heat treated (or is replaced by another specification), click **Make obsolete** and give the reason. | HT Manager |\n| 4.2 | Remove its job cards and recipes from the line. | Shift supervisor |\n| 4.3 | Only a draft that was never approved can be deleted (**Delete**); approved and obsolete specifications stay in the register. | HT Engineer |\n\n### Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/02_Work_Instructions/MWSPL-WI-SPEC-03_Periodic_Review_and_Self-Assessment.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PERIODIC REVIEW AND HTSA 1.6 SELF-ASSESSMENT\n\n| Doc No. | Rev | Issue date | Parent procedure sections | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-SPEC-03 | 00 | — | MWSPL-QP-SPEC-01 §6.3, §6.4 | | |\n\n**Records:** register Excel with the review dates (F-SPEC-04), HTSA 1.6 evidence PDF, KPI format F-SPEC-05.\n\n### 1. Periodic review of each specification (yearly)\n\n| Step | Activity | Responsibility | Time |\n|---|---|---|---|\n| 1.1 | Open CALOR → PROCESS → Specifications. The tiles show the reviews due (within 30 days) and overdue (365 days after the approval of the revision in force). | HT Engineer | First working day of the month |\n| 1.2 | For each specification due: compare it with the current customer drawing / specification, the hardness and SCADA results of the last year (Hardness, Trend analysis, SCADA review pages) and any customer complaint. | HT Engineer | Before the due date |\n| 1.3 | No change needed: the HT Manager confirms it; record the review on F-SPEC-04 (date, by, result). Change needed: start a new revision (WI-SPEC-02); its approval resets the review date. Note: CALOR has no \"reviewed, no change\" entry for specifications — the register keeps showing the review as overdue until a new revision is approved, so F-SPEC-04 is the record of a review without change (application change requested in the handover note). In the integrated application (pilot) use **Review & HTSA 1.6 → Record review**; it restarts the review date. | HT Manager | Before the due date |\n\n### 2. Active parts without a specification\n\n| Step | Activity | Responsibility | Time |\n|---|---|---|---|\n| 2.1 | Read the HTSA 1.6 panel item \"Written process specifications for all active processes\": it lists every part produced on a furnace in the last 90 days without a specification in force for that furnace. | HT Engineer | Weekly |\n| 2.2 | For each one: write and approve the specification (WI-SPEC-01), or add the furnace to the existing one by a new revision (WI-SPEC-02). Until then the part runs only on the HT Manager's written instruction. | HT Manager | Within 7 days |\n\n### 3. HTSA 1.6 self-assessment\n\n| Step | Activity | Responsibility | Time |\n|---|---|---|---|\n| 3.1 | Read the HTSA 1.6 panel score: Satisfactory / Not satisfactory / Needs immediate action, and each item (authorization, approval by an authorized person, all active processes, steps with tolerances, available at the line, change review, implementation recorded, periodic review). | HT Manager | Monthly |\n| 3.2 | For each item not met, agree the action, owner and date; enter it on F-SPEC-05 (quarterly review). | HT Manager | Monthly |\n| 3.3 | Download **HTSA 1.6 evidence (PDF)** and file it with the month's KPIs; it is the evidence for an internal or customer assessment. | Quality Manager | Monthly |\n\n### Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue (draft) | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-01_Process_Specification.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PROCESS SPECIFICATION\n\n| Format No. | Rev. | Specification no. | Revision | Status |\n|---|---|---|---|---|\n| MWSPL-F-SPEC-01 | 00 | PS-____ | ___ | Draft / Approved / Obsolete |\n\nThis format is the content of a specification as held in CALOR (Specifications page); the page prints it as the specification PDF and the job card. Use the paper form only when CALOR is not available, then enter it in CALOR.\n\n**Legend:** ± = operating tolerance · max = maximum · range = lower–upper limit · **bold** fields are required for approval.\n\n### 1. Part\n\n| Field | Entry |\n|---|---|\n| **Part no.** / **part name** | |\n| Customer / drawing no. | |\n| **Steel grade** | |\n| **Process** | HT hardening & tempering (CQI-9 Table A) / IA isothermal annealing (Table E) / NORM normalizing (Table E) |\n| **Approved furnaces** | F-01 ☐ F-02 ☐ F-03 ☐ F-04 ☐ (only furnaces that run the process) |\n| **Part weight (kg)** / pieces per tray (max) / tray or fixture | |\n\n### 2. Loading and push\n\n| Step | Parameter | Value | Tolerance |\n|---|---|---|---|\n| Loading | **Pieces per tray** | | max |\n| Loading | Loading pattern / fixture | | set text |\n| Pusher | **Push time (min)** | | ± |\n\n### 3. Hardening chamber (positions 5 / 4 / 4)\n\n| Zone | **Set value (°C)** | **Tolerance (± °C)** |\n|---|---|---|\n| 1 | | |\n| 2 | | |\n| 3 | | |\n\n### 4. Between the chambers (one of)\n\n| Process | Parameter | Value | Tolerance |\n|---|---|---|---|\n| HT | **Quench medium** (F-01 water, F-02 oil) | | set text |\n| HT | **Quenchant temperature (°C)** | | range (both limits) |\n| HT | **Quench delay (s)** | | max |\n| HT | **Dip time (min)** | | ± |\n| HT | Agitation | | set text |\n| HT | **Transfer to the tempering chamber (min)** | | max |\n| IA | **Cooling (air blowing) time (min)** | | ± (cooling + transfers must end before the next push) |\n| IA | Method | | set text |\n| IA | **Target temperature before the tempering chamber (°C)** | | ± |\n| NORM | **Transfer between the chambers (min)** | | max |\n\n### 5. Tempering chamber (positions 4 / 4 / 4)\n\n| Zone | **Set value (°C)** | **Tolerance (± °C)** |\n|---|---|---|\n| 1 | | |\n| 2 | | |\n| 3 | | |\n\n### 6. After exit\n\n| Parameter | Value | Tolerance |\n|---|---|---|\n| Cooling (still air / fan) | | set text |\n| Fan cooling time (min), if required | | ± |\n\n### 7. Product requirements and testing\n\n| Field | Entry |\n|---|---|\n| **Hardness** min – max, **scale** | |\n| Core hardness / microstructure / grain size | |\n| **Decarburization limit** | |\n| **Sampling (quantity and frequency)** / test method | |\n\n### 8. At the line and change control\n\n| Field | Entry |\n|---|---|\n| **Available at the line as** | Work instruction ☐ Job card ☐ SCADA / PLC recipe ☐ Other ☐ · reference: |\n| **Reason for the change** (rev > 0) | |\n| Change review (rev > 0) | F-SPEC-02 |\n| Implemented on / by | |\n\n### 9. Sign-off\n\n| Prepared by | Reviewed by | Approved by (authorized, F-SPEC-03) | Approval date |\n|---|---|---|---|\n| | | | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-02_Change_Review.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPECIFICATION CHANGE REVIEW\n\n| Format No. | Rev. | Specification no. / new revision |\n|---|---|---|\n| MWSPL-F-SPEC-02 | 00 | PS-____ rev ___ |\n\nRequired for every revision after rev 0 before it can be approved (CALOR checks each line). **Legend:** ☐ tick · all lines required.\n\n| No. | Review item | Entry |\n|---|---|---|\n| 1 | Reason for the change | |\n| 2 | What changed (parameter: old → new) | |\n| 3 | Customer requirements checked (drawing, customer specification, PPAP values) and result | |\n| 4 | Customer notification | ☐ Not required: customer requirements not affected ☐ Customer notified ☐ Customer approval obtained (e.g. PPAP) |\n| 5 | Notification / approval reference (when notified or approved) | |\n| 6 | Control plan and PFMEA reviewed (regenerated if needed) | ☐ Yes — control plan no.: ______ PFMEA no.: ______ |\n| 7 | Validation (trial or first-off result) | Batch: ______ Result: ______ |\n\n| Prepared by (HT Engineer) | Notification decision (Quality Manager) | Approved by (authorized) | Date |\n|---|---|---|---|\n| | | | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-03_Authorization_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## AUTHORIZATION TO APPROVE PROCESS SPECIFICATIONS\n\n| Format No. | Rev. | List date |\n|---|---|---|\n| MWSPL-F-SPEC-03 | 00 | |\n\nCopied from the HT organization page (the same names are shown under \"Approved by\" on the Specifications page; there is no separate printout): the holder and deputy of the heat treat position (HTSA 1.1) and of every position marked \"authorized to approve process specifications\". CALOR accepts only these names as \"approved by\". **Legend:** HT = heat treat position · A = marked authorized position.\n\n| No. | Name | Position | Basis (HT / A) | Holder / deputy | Authorized from |\n|---|---|---|---|---|---|\n| 1 | | | HT | Holder | |\n| 2 | | | HT | Deputy | |\n| 3 | | | A | | |\n| 4 | | | A | | |\n| 5 | | | | | |\n\n| Issued by (Director / HT Manager) | Date | Next review |\n|---|---|---|\n| | | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-04_Register_and_Review.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPECIFICATION REGISTER AND PERIODIC REVIEW RECORD\n\n| Format No. | Rev. | Period |\n|---|---|---|\n| MWSPL-F-SPEC-04 | 00 | FY ______ |\n\nThe register itself is the CALOR Specifications register (Excel download: \"Download register (Excel)\"). This sheet records the yearly review of each specification in force, including reviews without a change (MWSPL-WI-SPEC-03 §1). **Legend:** Result NC = no change needed · RV = new revision started (number) · OB = made obsolete.\n\n| PS no. | Rev in force | Part no. | Process | Furnaces | Approved on | Review due | Reviewed on | By | Result (NC / RV / OB) | Remarks |\n|---|---|---|---|---|---|---|---|---|---|---|\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n| | | | | | | | | | | |\n\n| Reviewed by (HT Manager) | Date |\n|---|---|\n| | |\n", "SPEC/03_Formats/MWSPL-F-SPEC-05_KPI.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPEC KPIs\n\n| Format No. | Rev. | Financial year |\n|---|---|---|\n| MWSPL-F-SPEC-05 | 00 | FY ______ (April–March assumed, to confirm) |\n\n**Source:** CALOR → Specifications (tiles and HTSA 1.6 panel), read on the first working day of each month. **Targets are provisional** (Section 3 of the handover note) until the HT Manager sets them.\n\n### 1. Monthly grid\n\n| Code | KPI | Target | Apr | May | Jun | Jul | Aug | Sep | Oct | Nov | Dec | Jan | Feb | Mar | YTD |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| SPEC-1 | Active part / furnace combinations without a specification in force | 0 | | | | | | | | | | | | | |\n| SPEC-2 | Specifications with the periodic review overdue | 0 | | | | | | | | | | | | | |\n| SPEC-3 | Revisions approved in the month | — (record) | | | | | | | | | | | | | |\n| SPEC-4 | Revisions without the implementation recorded within 7 days | 0 | | | | | | | | | | | | | |\n| SPEC-5 | Revisions in force with an incomplete change review | 0 | | | | | | | | | | | | | |\n| SPEC-6 | Drafts waiting for approval longer than 30 days | 0 | | | | | | | | | | | | | |\n| SPEC-7 | HTSA 1.6 score (S / NS / NIA) | S | | | | | | | | | | | | | |\n\nYTD: SPEC-3 = sum; the others = the last month's value.\n\n### 2. Current position (at the date of the review)\n\n| Specifications in force | Parts covered | Drafts | Reviews due within 30 days | Reviews overdue | HTSA 1.6 items not met |\n|---|---|---|---|---|---|\n| | | | | | |\n\n### 3. Quarterly review\n\n| Quarter | Findings (items not met, trends) | Action | Owner | Due | Closed |\n|---|---|---|---|---|---|\n| Q1 (Apr–Jun) | | | | | |\n| Q2 (Jul–Sep) | | | | | |\n| Q3 (Oct–Dec) | | | | | |\n| Q4 (Jan–Mar) | | | | | |\n\n### 4. Management review input summary\n\n| Input | Status | Comment |\n|---|---|---|\n| HTSA 1.6 self-assessment score and items not met | | |\n| Coverage of active processes by specifications in force | | |\n| Changes made in the period and their validation | | |\n| Overdue reviews and implementations | | |\n| Resources / authorization changes needed | | |\n\n| Prepared by (HT Engineer) | Reviewed by (HT Manager) | Date |\n|---|---|---|\n| | | |\n", "SPEC/04_Application/mwspl-spec-module.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SPEC MODULE: APPLICATION DESCRIPTION\n\nThe application of this module is the CALOR page **`Process_Specifications.html`** in the repository root (tab PROCESS → Specifications in `CALOR.html`). It is not copied here: the build (`python suite/build.py`) reads it from the root, and a copy would drift. This file is the specification of the module for the QMS documents: the rules below are taken from the page's code, and the documents of this module must match them.\n\n| Item | Value in the code |\n|---|---|\n| Storage key | `psr-reg` (data), `psr-view` (filter, local only); Google Drive file `psr-reg.json` when linked |\n| Record | Specification `PS-nnnn`, `rev` 0…n, `status` draft / approved / obsolete, `revs[]` (snapshots of earlier revisions), `log[]` |\n| Processes | `PROC`: HT hardening & tempering (Table A), IA isothermal annealing (Table E), NORM normalizing (Table E) |\n| Processes per furnace | Setting `runs`: F-01: IA, HT · F-02: IA, NORM, HT · F-03: IA, NORM · F-04: IA, NORM; a furnace that does not run the process blocks the approval |\n| Line layout | `posH` 5,4,4 · `posT` 4,4,4 · `xfer` 18 min (measured) · `ccXfer` 2 min (IA transfers) |\n| Defaults for new specifications | tolerance ±10 °C, push ±0.5 min, quench delay 30 s, dip 8.5 ± 0.5 min, controlled cooling ±1 min, fan ±5 min |\n| Forms at the line | `FORMS`: work instruction, job card, computer-based recipe (SCADA / PLC), other |\n| Customer notification | `NOTIFY`: not required, notified, approval obtained (e.g. PPAP) |\n| Approval gate (`missing`) | part no., name, steel grade, approved furnaces, part weight, every step with its tolerance (`paramMiss`), hardness scale, decarburization limit, form at the line, prepared / reviewed / approved by, approver authorized (`isAuth`), approval date; rev > 0: reason + change review (`chgMissing`); plus no critical advice |\n| Authorization (`authList`) | In CALOR: HT organization API `authorized()` (holder and deputy of the HT position and of positions marked `specAuth`); standalone: Settings `auth` |\n| Implementation | `implDate`, `implBy` (not before the approval, not in the future); HTSA 1.6 \"not met\" when missing more than `implDays` (7) days after the approval |\n| Periodic review | `reviewDays` 365 after the approval of the revision in force; \"due\" `reviewSoon` 30 days before |\n| Active processes | parts produced on the Daily production page in the last `activeDays` (90) per furnace |\n| HTSA 1.6 score | `nia` no specification in force or an active part without one · `ns` any critical item · `s` otherwise |\n| Outputs | specification PDF / Excel, job card, register Excel (incl. sheet \"HTSA 1.6\"), HTSA 1.6 evidence PDF |\n| Used by | Hardness (requirements), Daily production (spec of each batch), Load build, CP & PFMEA (control plan rows), Equipment (class required), SCADA review (set values vs spec), Home |\n\n**Not in the CALOR page (handled by the documents):** a \"reviewed, no change\" entry for the periodic review (F-SPEC-04); a printout of the authorization list (F-SPEC-03); the rule that an active part without a specification runs only on the HT Manager's written instruction (WI-SPEC-03 §2.2).\n\n## Native module in the integrated application (pilot, 22-Oct-2026)\n\nThe same module is also built natively in the form of the MWSPL Integrated Application (the IATF 16949 application's UI/UX): **`QMS/00_Integrated_Application/calor-quality-system.html`**, one self-contained file with an Overview and the module \"Process specifications\". It is the pilot for moving CALOR into that form; until the user decides, the CALOR page above stays the application in use.\n\n| Item | Native module |\n|---|---|\n| Source | `QMS/SPEC/04_Application/mwspl-spec-module.js` (module), `QMS/00_Integrated_Application/src/` (shell head, CSS, Overview); build `python QMS/00_Integrated_Application/build.py` (never edit the built file) |\n| Views (PDCA) | Dashboard · **P** Register, Authorization & settings · **D** At the line (job cards, implementation) · **C** Review & HTSA 1.6, KPIs (financial year) · **A** Revisions · Rules, Documentation (this module's documents, embedded), Data |\n| Records | collections `specs` (one document per specification `PS-nnnn`, same fields as `psr-reg`) and `config/settings`; shared record store when published with the `db` capability (collection prefix `spec-`), else this browser only (`localStorage` `mws-spec-local-v1`, banner \"Local mode\") |\n| Rules | the same approval gate, change review, authorization, implementation and HTSA 1.6 rules as the CALOR page (copied from its code) |\n| Added | **Record review (no change)** on the Review view: date, reviewer, note; it restarts the periodic review of the revision in force (the gap of WI-SPEC-03 §1.3 / F-SPEC-04 is closed in this module) |\n| Job card | the revision in force with a **temperature–time sketch** below the specification (`profileSvg`): set value per zone with its tolerance band over the time in each zone (positions × push), the quench (dip) / controlled cooling / transfer between the chambers, and the cooling after exit; time axis from loading, total = time through the line. Ramps and cooling curves are schematic, not measured |\n| Delete | armed button (second click confirms), never a browser dialog; only never-approved drafts |\n| Data | export / import JSON (merge or replace), CSV of the register, **Import from CALOR** (the CALOR Drive folder, files picked or downloaded from Google Drive, or CALOR in this browser: `MWS.calor`; reads `psr-reg` in the same browser), starter set-up (three example specifications), clear all (type CLEAR ALL) |\n| Links | reads CALOR's `org-reg` (authorized names) and `prod-reg` (active parts) in the same browser when present |\n| API | `MWS.spec.stats()`, `summary()`, `inForce()`, `closeModal()` (used by the Overview) |\n| Test hook | `window.__SPECM` (`S`, `eff`, `calc`, `missing`, `assess16`, `review`, `kp`) |\n", "TC/00_TC_Master_List.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## TC MODULE: THERMOCOUPLES AND PROTECTION TUBES — MASTER LIST\n\n**Basis:** AIAG CQI-9 4th Edition, HTSA question 3.3 (\"Are thermocouples and protection tubes checked or replaced per Process Tables?\"), Section P3.1 (thermocouples, accuracy tables, P3.1.3.3 reuse of type K / E test thermocouples), Section P3.3 (system accuracy test, P3.3.5 SAT records) and the Process Tables A and E (SAT interval). Section and table numbers and the figures used in the application are to be confirmed against the controlled copy. PDCA: **Do / Check** (the measuring system behind every furnace temperature).\n\n**Application:** CALOR Quality System (`QMS/00_Integrated_Application/calor-quality-system.html`) → Thermocouples. The register of thermocouples, test equipment, SAT records, protection tube checks, the PM schedule and the HTSA 3.3 self-assessment are held there. CALOR's SAT page (`Thermocouple_SAT_PDCA.html`) can be imported into it.\n\n### Documents\n\n| PDCA | Doc. No. | Title | Rev. | Date | File link |\n|---|---|---|---|---|---|\n| P | MWSPL-QP-TC-01 | Thermocouples and protection tubes | 00 | — | [01_Procedure/MWSPL-QP-TC-01_Thermocouples_and_Protection_Tubes.md](01_Procedure/MWSPL-QP-TC-01_Thermocouples_and_Protection_Tubes.md) |\n| P / D | MWSPL-WI-TC-01 | Receive, calibrate and install a thermocouple | 00 | — | [02_Work_Instructions/MWSPL-WI-TC-01_Receive_Calibrate_and_Install_a_Thermocouple.md](02_Work_Instructions/MWSPL-WI-TC-01_Receive_Calibrate_and_Install_a_Thermocouple.md) |\n| D / C | MWSPL-WI-TC-02 | System accuracy test (SAT) | 00 | — | [02_Work_Instructions/MWSPL-WI-TC-02_System_Accuracy_Test.md](02_Work_Instructions/MWSPL-WI-TC-02_System_Accuracy_Test.md) |\n| D / A | MWSPL-WI-TC-03 | Protection tube check and replacement | 00 | — | [02_Work_Instructions/MWSPL-WI-TC-03_Protection_Tube_Check_and_Replacement.md](02_Work_Instructions/MWSPL-WI-TC-03_Protection_Tube_Check_and_Replacement.md) |\n| P | MWSPL-F-TC-01 | Thermocouple register | 00 | — | [03_Formats/MWSPL-F-TC-01_Thermocouple_Register.md](03_Formats/MWSPL-F-TC-01_Thermocouple_Register.md) |\n| C | MWSPL-F-TC-02 | SAT record | 00 | — | [03_Formats/MWSPL-F-TC-02_SAT_Record.md](03_Formats/MWSPL-F-TC-02_SAT_Record.md) |\n| P / D | MWSPL-F-TC-03 | Protection tube PM schedule and check record | 00 | — | [03_Formats/MWSPL-F-TC-03_Protection_Tube_PM_Schedule_and_Check.md](03_Formats/MWSPL-F-TC-03_Protection_Tube_PM_Schedule_and_Check.md) |\n| P | MWSPL-F-TC-04 | Test equipment calibration record | 00 | — | [03_Formats/MWSPL-F-TC-04_Test_Equipment_Calibration_Record.md](03_Formats/MWSPL-F-TC-04_Test_Equipment_Calibration_Record.md) |\n| — | — | Module description (application) | — | — | [04_Application/mwspl-tc-module.md](04_Application/mwspl-tc-module.md) |\n\n### Where each requirement is met\n\n| Requirement (HTSA 3.3) | Met by | Evidence in the application |\n|---|---|---|\n| Thermocouples calibrated before first use, within the range of use, meeting the P3.1 accuracy | QP-TC-01 §6.1; WI-TC-01 §2–§3; F-TC-01 | Calibration fields of each thermocouple; issue shown when the certificate is missing, dated after installation, does not cover the range of use or exceeds the accuracy |\n| Control, monitoring and recording thermocouples SAT checked per the Process Table and P3.3 | QP-TC-01 §6.2; WI-TC-02 | SAT state per thermocouple (none / ok / due soon / overdue / failed); due list |\n| Insertion depth of reused type K / E test thermocouples documented (P3.1.3.3) | WI-TC-02 §2.4; F-TC-02 | Depth required on the SAT record for a type K / E test TC; a reuse shallower than before is flagged |\n| SAT records meet P3.3.5 | WI-TC-02 §3; F-TC-02; F-TC-04 | Record completeness gate, validity (test equipment in calibration), approval |\n| Protection tubes checked or replaced to a documented PM schedule | QP-TC-01 §6.3; WI-TC-03; F-TC-03 | Approved PM schedule (rev, date, approver), tube interval per thermocouple, check rounds, worn tubes open until replaced |\n\n### First-cycle implementation checklist\n\n- [ ] Confirm the settings against the controlled CQI-9 copy: SAT interval and tolerance, accuracy tables (field and test thermocouples, base and noble metal), test TC reuse rule, element life.\n- [ ] Register every thermocouple of F-01 … F-04 (TC-01 … TC-06 per chamber, odd = right wall, even = left wall) with its certificate (WI-TC-01); import the CALOR SAT register where it exists.\n- [ ] Register the test thermocouples and test instruments with their calibration record (make / model, range, least count, certificate observations with error and uncertainty, F-TC-04) and due dates.\n- [ ] Enter the protection tube material and intervals; approve the PM schedule (F-TC-03).\n- [ ] Bring every SAT and tube check up to date; close the reactions to failed SATs.\n- [ ] Check that the HTSA 3.3 panel reads Satisfactory; file the evidence print.\n- [ ] Approve QP-TC-01, the three WIs and the formats; train the maintenance technicians and the HT Engineer.\n", "TC/01_Procedure/MWSPL-QP-TC-01_Thermocouples_and_Protection_Tubes.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## THERMOCOUPLES AND PROTECTION TUBES\n\n| Doc No. | Rev | Issue date | Process Owner | Prepared | Reviewed | Approved | Copy status |\n|---|---|---|---|---|---|---|---|\n| MWSPL-QP-TC-01 | 00 | — | Maintenance Head | | | | Uncontrolled until approved |\n\n### 1. Purpose\n\nTo make sure every furnace temperature is measured by a thermocouple that was calibrated before use, is checked by a system accuracy test (SAT) at the interval of the Process Table, and sits in a protection tube that is checked or replaced to a documented preventive maintenance schedule (CQI-9 HTSA 3.3).\n\n### 2. Scope\n\n- **Equipment:** furnaces F-01 to F-04, hardening and tempering chambers, three zones each; two thermocouples per zone (TC-01 / TC-02 = zone 1 …; odd numbers on the right wall, even on the left), type K, used for control and recording through the SCADA.\n- **Also covered:** test thermocouples and test instruments used for SATs; protection tubes of every thermocouple in use.\n- **Not covered:** TUS (temperature uniformity survey) and instrument calibration of controllers and recorders (CALOR TUS and Equipment pages).\n\n### 3. References\n\n- AIAG CQI-9 4th Edition: HTSA 3.3; Section P3.1 (thermocouples and their accuracy tables, P3.1.3.3 reuse of type K / E thermocouples); Section P3.3 (SAT, P3.3.5 records); Process Tables A and E (controlled copy).\n- MWSPL-WI-TC-01, -02, -03; MWSPL-F-TC-01, -02, -03, -04.\n- CALOR → PYROMETRY → SAT, TUS, Equipment.\n\n### 4. Terms and definitions\n\n| Term | Meaning |\n|---|---|\n| Sensing element | The thermocouple wire in the furnace, identified by serial / batch no. and calibration certificate. A replacement is a new element in the same position. |\n| Range of use | The temperatures the element works at: hardening chamber 700–960 °C, tempering chamber 500–900 °C unless set otherwise. |\n| SAT | Comparison of the furnace reading (thermocouple + instrument) with a calibrated test thermocouple and test instrument placed next to its tip. SAT difference = furnace − (test + instrument correction + test TC correction). |\n| Test thermocouple | A calibrated thermocouple used only for SATs, with its own certificate, correction and number of uses. |\n| Protection tube | The sheath (metal or ceramic) around the element in the furnace. |\n| PM schedule | Tube material, check interval and replacement interval of every thermocouple in use, approved and reviewed. |\n\n### 5. Responsibility and authority\n\n| Role | Responsibility | Authority |\n|---|---|---|\n| Maintenance Head | Owns this procedure, the register and the PM schedule; approves the PM schedule | Remove a thermocouple from use |\n| Maintenance technician | Installs elements (WI-TC-01), runs SATs (WI-TC-02), checks tubes (WI-TC-03) | Stop a SAT when the furnace is not stable |\n| HT Engineer | Reviews and approves SAT records; decides product impact of a failed SAT | Hold product |\n| HT Manager | Approves the reaction to a failed SAT; reviews the HTSA 3.3 status monthly | Release held product |\n| Quality Manager | Verifies the test equipment calibration system; audits HTSA 3.3 | — |\n\n### 6. Procedure\n\n```\n   PLAN  register every element with its certificate, PM intervals, test equipment\n     |\n     v\n   DO    install (calibrated before use) --> SAT every Process Table interval --> tube checks\n     |\n     v\n   CHECK due list, SAT record completeness, insertion depth, HTSA 3.3 score\n     |\n     v\n   ACT   failed SAT: cause, action, product impact, re-SAT; replace worn tubes and old elements\n```\n\n#### 6.0 Default thermocouple specification\n\nThe HT Manager and the Maintenance Head keep a default specification per chamber (Application → Default TC specifications): type, use, make / supplier, tolerance class, sheath material and diameter, length, insertion depth, hot junction, calibration laboratory and calibrated range, range of use, protection tube material, tube check interval and tube life. Every new thermocouple is ordered and registered to it; a replacement keeps the specification of the thermocouple it replaces. A thermocouple that differs is listed on that page (information for the review, not a CQI-9 finding).\n\n#### 6.1 Calibration before first use (P3.1)\n\n1. Every element is bought with a calibration certificate covering at least its range of use, giving the largest error. The error must be within the accuracy of the P3.1 table for its type and use (application setting, confirm against the copy).\n2. The element is registered before it is installed (WI-TC-01); the certificate date must be on or before the installation date.\n3. An element without a valid certificate is not installed.\n\n#### 6.2 System accuracy test (P3.3, Process Tables)\n\n1. Control, monitoring and recording thermocouples get a SAT after installation and then at the Process Table interval (setting, default 90 days).\n2. The test thermocouple and the test instrument must be in calibration on the test day; a reused type K / E test thermocouple has its insertion depth recorded and is not used shallower than before (P3.1.3.3, site rule).\n3. Fail beyond the SAT tolerance (setting, default ±5.5 °C): the reaction plan of WI-TC-02 §4 applies.\n4. Every SAT record holds the P3.3.5 content and is approved (F-TC-02).\n\n#### 6.3 Protection tubes (PM schedule)\n\n1. Each thermocouple in use has a tube material, a check interval and, where set, a replacement interval (F-TC-03). The Maintenance Head approves the schedule and reviews it yearly; a change after approval needs re-approval.\n2. Tubes are checked on the interval (WI-TC-03). The element and its protection tube are one assembly: they are installed and replaced together, so the tube's installation date is the element's. A worn or cracked tube, or a tube past its replacement interval, is dealt with by replacing the thermocouple (element and tube, §6.4) before the next check.\n\n#### 6.4 Replacement of elements\n\nElements are replaced at the end of their service life (setting, default 365 days), after a failed SAT when adjustment is not enough, on damage or protection tube failure (the tube is always replaced with the element). The old element is kept in the register as removed with its reason; the new one needs its certificate and a SAT before use.\n\n### 7. Records\n\n| Record | Kept in | Retention |\n|---|---|---|\n| Thermocouple register with certificates (F-TC-01) | Application → Thermocouples | Life of the furnace + 1 year |\n| SAT records (F-TC-02) | Application → SAT records | 3 years minimum, or as the customer requires |\n| PM schedule and tube checks (F-TC-03) | Application → PM schedule, Tube checks | 3 years |\n| Test equipment calibration records (F-TC-04) | Application → Test equipment | Life of the equipment + 3 years |\n| HTSA 3.3 evidence | Printed from the application, filed with the self-assessment | Until the next assessment |\n\n### 8. Revision history\n\n| Rev | Date | Change | Approved |\n|---|---|---|---|\n| 00 | — | First issue | |\n", "TC/02_Work_Instructions/MWSPL-WI-TC-01_Receive_Calibrate_and_Install_a_Thermocouple.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## RECEIVE, CALIBRATE AND INSTALL A THERMOCOUPLE\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-TC-01 | 00 | — | Maintenance technician | | |\n\n### 1. Receiving\n\n| Step | Action | Who |\n|---|---|---|\n| 1.1 | Check the type, tolerance class, sheath, diameter, length and hot junction against the order and the default thermocouple specification of the chamber (Application → Default TC specifications). | Store / maintenance |\n| 1.2 | Check the calibration certificate: serial or batch no., calibrated range covering the range of use (the chamber's default in Default TC specifications, e.g. hardening 700–960 °C, tempering 500–900 °C), largest error within the accuracy shown in the application. | Maintenance technician |\n| 1.3 | No certificate, or a certificate that does not meet 1.2: do not issue the element; return it or have it calibrated. | Maintenance Head |\n\n### 2. Registering\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | Application → Thermocouples → open the position (furnace, chamber, TC-01 … TC-06) → \"Replace thermocouple…\", or Thermocouple replacements → \"Record replacement\" from the due list (or \"Register a thermocouple\" for a new position). | Maintenance technician |\n| 2.1a | Choose the reason: SAT failure (select the failed SAT that found it), service life reached, drift, physical damage, open circuit / erratic, used beyond its limit or atmosphere, TUS failure, protection tube failure, wrong type / not traceable, relocation or immersion-depth change, other. | Maintenance technician |\n| 2.1b | Record whether the controller offset was reset for the new element (a \"No\" needs the reason in the notes). For a relocation or immersion-depth change record the TUS decision (TUS planned, or assessed as not required with the reason). Enter who replaced it. | Maintenance technician |\n| 2.2 | Enter the serial, certificate no., calibration date, calibrated range and largest error. The calibration date must not be after the installation date. | Maintenance technician |\n| 2.3 | Element and protection tube are replaced together: enter the material of the tube fitted with the new element (default the scheduled material). | Maintenance technician |\n\n### 3. Installing\n\n| Step | Action | Who |\n|---|---|---|\n| 3.1 | Isolate per the furnace safety rules; remove the old element together with its protection tube (they are replaced as one assembly). | Maintenance technician |\n| 3.2 | Fit the new element in its new protection tube to the marked insertion depth; keep the polarity; tighten the head. | Maintenance technician |\n| 3.3 | Check the reading on the SCADA against the other thermocouple of the zone. | Maintenance technician |\n| 3.4 | Run the SAT (WI-TC-02) before the zone is used for product. Until then the application shows \"SAT due after replacement\" and Thermocouple replacements shows \"SAT required\" on the replacement record (TR-nnnn). | Maintenance technician |\n", "TC/02_Work_Instructions/MWSPL-WI-TC-02_System_Accuracy_Test.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## SYSTEM ACCURACY TEST (SAT)\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-TC-02 | 00 | — | Maintenance technician, HT Engineer | | |\n\n### 1. When\n\n- After every installation of an element, before product.\n- At the Process Table interval (application setting, default 90 days): see Application → Due list.\n- After a repair of the measuring loop (wiring, compensating cable, instrument).\n\n### 2. Preparation\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | Take a test instrument and a test thermocouple whose calibration is in date (Application → Test equipment). Their corrections at the test temperature come from the calibration observations on their certificates (correction = − error, interpolated between the calibration points; F-TC-04): the application fills them in when the equipment is chosen and flags a typed correction that differs by more than 0.1 °C. | Technician |\n| 2.2 | The furnace runs at a normal set point and is stable (no set value change in the last 30 minutes). | Technician |\n| 2.3 | Insert the test thermocouple next to the tip of the thermocouple under test (CQI-9 P3.3; distance to confirm against the copy). | Technician |\n| 2.4 | **Type K or E test thermocouple:** measure and record the insertion depth in mm. When the test thermocouple was used before, insert it at least as deep as its deepest earlier use (P3.1.3.3, site rule); the application shows the earlier depth. | Technician |\n\n### 3. Test and record (F-TC-02, P3.3.5)\n\n| Step | Action | Who |\n|---|---|---|\n| 3.1 | Note the start time. For **30 minutes**, read the furnace instrument (SCADA) and the test instrument at the same moment **every minute** (30 pairs; minutes and interval are settings of the application). Do not change the set value during the test. | Technician |\n| 3.2 | Application → SAT records → \"Record a SAT\": thermocouple, date, time, technician, set point, instrument, test TC, depth, the 30 furnace / test reading pairs, both corrections (0 if none). A record with fewer pairs is incomplete. | Technician |\n| 3.2a | **Furnace readings from the SCADA:** export the SCADA log of the test day and load it (SCADA review → Load & analyse, or \"Load the SCADA export of the test day\" in the SAT dialog), then press \"Fill furnace readings from SCADA\": the application takes the PV of the thermocouple's column (TC-3 → PV-3) of that furnace and chamber at each reading time. Readings not in the log stay empty and are typed. The test readings are typed or pasted from the test instrument. | Technician |\n| 3.3 | The application calculates the SAT difference = mean over the readings of furnace − (test + instrument correction + test TC correction) and the result; a single reading outside the tolerance makes a pass a warning, and a furnace range above the stability limit (5 °C) is flagged. A record with test equipment out of calibration is invalid: repeat the test. | Application |\n| 3.4 | The HT Engineer reviews and approves the record (name and date). | HT Engineer |\n\n### 4. Failed SAT (beyond the tolerance)\n\n| Step | Action | Who |\n|---|---|---|\n| 4.1 | Inform the HT Engineer at once; hold the product of the zone back to the last passing SAT until assessed. | Technician |\n| 4.2 | Find the cause (element drift, wiring, instrument); correct (adjust offset, replace the thermocouple per WI-TC-01). | Technician / Maintenance Head |\n| 4.3 | Record cause, action, product impact, owner and date on the SAT record. | HT Engineer |\n| 4.4 | Run a re-SAT; the failure stays open until a passing SAT (or the replacement's SAT) is recorded. | Technician |\n", "TC/02_Work_Instructions/MWSPL-WI-TC-03_Protection_Tube_Check_and_Replacement.md": "# MASS WIRE AND STEELS PVT. LTD., BHIWADI\n\n## PROTECTION TUBE CHECK AND REPLACEMENT\n\n| Doc No. | Rev | Issue date | Used by | Prepared | Approved |\n|---|---|---|---|---|---|\n| MWSPL-WI-TC-03 | 00 | — | Maintenance technician | | |\n\n**Plant rule:** the element and its protection tube form one assembly; they are installed and replaced together. A tube is never replaced on its own: replacing the tube means replacing the thermocouple (element and tube, WI-TC-01 §2) and running a SAT before product.\n\n### 1. When\n\nAt the check interval of each thermocouple in the approved PM schedule (Application → PM schedule; default every 30 days), at every element replacement and at every furnace shutdown that opens the chamber.\n\n### 2. Check\n\n| Step | Action | Who |\n|---|---|---|\n| 2.1 | Application → Tube checks → \"Tube check round\"; enter the date and your name. | T
