<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pusher Furnace SCADA Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#eceff1;--surface:#fbfcfc;--surface2:#f2f4f5;--ink:#131d24;--ink2:#4a5761;--muted:#76838c;
  --line:#d5dbdf;--grid:#e3e7ea;--accent:#0e5566;--accent-ink:#ffffff;
  --s1:#2a78d6;--s2:#eb6834;--band:rgba(12,163,12,.10);
  --good:#0ca30c;--good-ink:#0a6b0a;--warn:#fab219;--warn-ink:#8a5a00;--crit:#d03b3b;--crit-ink:#b02a2a;--info-ink:#4a5761;
  --div-lo:#256abf;--div-hi:#d03b3b;--div-mid:#f0efec;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1316;--surface:#161e23;--surface2:#1c262c;--ink:#eaf0f3;--ink2:#aebbc3;--muted:#84929b;
    --line:#2b373e;--grid:#243037;--accent:#5fb3c7;--accent-ink:#06232b;
    --s1:#3987e5;--s2:#d95926;--band:rgba(12,163,12,.17);
    --good-ink:#3fcf3f;--warn-ink:#fab219;--crit-ink:#ff7d7d;--info-ink:#aebbc3;
    --div-lo:#3987e5;--div-hi:#e66767;--div-mid:#383835;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1316;--surface:#161e23;--surface2:#1c262c;--ink:#eaf0f3;--ink2:#aebbc3;--muted:#84929b;
  --line:#2b373e;--grid:#243037;--accent:#5fb3c7;--accent-ink:#06232b;
  --s1:#3987e5;--s2:#d95926;--band:rgba(12,163,12,.17);
  --good-ink:#3fcf3f;--warn-ink:#fab219;--crit-ink:#ff7d7d;--info-ink:#aebbc3;
  --div-lo:#3987e5;--div-hi:#e66767;--div-mid:#383835;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:24px;line-height:1.2}
h2{font-size:16px}
h3{font-size:14px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.sec-head p{margin:0;color:var(--ink2);font-size:13px;max-width:70ch}

/* header */
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink2);font-size:13px;margin-top:6px}
.meta b{font-weight:500;color:var(--ink)}
.btn{font:inherit;font-weight:500;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* settings */
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:var(--ink2)}
.field input{font:inherit;font-family:var(--mono);width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface2);color:var(--ink)}
details.more summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500}
details.more .controls{margin-top:10px}
.drop-hint{font-size:12px;color:var(--muted);margin-left:auto;align-self:center}
.dragging::after{content:"Drop the SCADA .xlsx file to analyse it";position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:10px;background:color-mix(in srgb,var(--bg) 85%,transparent);display:grid;place-items:center;font-size:18px;font-weight:600;color:var(--accent);z-index:50}
.error{border-color:var(--crit);color:var(--crit-ink)}

/* verdict */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;border-left-width:6px}
.verdict.crit{border-left-color:var(--crit)}.verdict.warn{border-left-color:var(--warn)}.verdict.good{border-left-color:var(--good)}
.verdict .big{font-size:20px;font-weight:600;line-height:1.25}
.verdict p{margin:2px 0 0;color:var(--ink2);max-width:90ch}
.vicon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px;grid-row:span 2}
.crit .vicon{background:var(--crit)}.warn .vicon{background:var(--warn);color:#2b1e00}.good .vicon{background:var(--good)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;font-weight:600;line-height:1.2}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink2)}
.kpi .s{font-size:12px;color:var(--ink2)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:999px;padding:1px 9px 1px 3px;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.chip i{font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.chip.good{color:var(--good-ink)}.chip.good i{background:var(--good)}
.chip.warn{color:var(--warn-ink)}.chip.warn i{background:var(--warn);color:#2b1e00}
.chip.crit{color:var(--crit-ink)}.chip.crit i{background:var(--crit)}
.chip.info{color:var(--info-ink)}.chip.info i{background:var(--muted)}

/* zones */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.zone-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.zone table{width:100%;border-collapse:collapse;font-size:13px}
.zone th{font-weight:500;text-align:right;color:var(--ink2);padding:3px 0 5px;border-bottom:1px solid var(--line)}
.zone th:first-child,.zone td:first-child{text-align:left;color:var(--ink2);font-family:var(--sans)}
.zone td{text-align:right;padding:3px 0;font-family:var(--mono);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--grid)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.zone .foot{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bad{color:var(--crit-ink)!important;font-weight:500}.caution{color:var(--warn-ink)!important;font-weight:500}.ok{color:var(--good-ink)!important}

/* charts */
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{width:18px;height:2px;border-radius:1px;display:inline-block}
.lg-dash{width:18px;border-top:1.5px dashed var(--muted);display:inline-block}
.lg-band{width:18px;height:10px;background:var(--band);border:1px solid color-mix(in srgb,var(--good) 45%,transparent);display:inline-block}
.lg-dot{width:8px;height:8px;border-radius:50%;background:var(--crit);display:inline-block}
.trend{display:flex;flex-direction:column;gap:14px}
.trend-row h3{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.trend-row h3 .muted{font-weight:400;font-size:12.5px}
.cbox{position:relative;height:220px}

/* heatmap + range */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px}
.scroll{overflow-x:auto}
.heat{border-collapse:separate;border-spacing:2px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px}
.heat th{font-weight:400;color:var(--muted);padding:0 4px;white-space:nowrap}
.heat th.rl{text-align:left;color:var(--ink2);font-family:var(--sans);font-size:12px}
.heat td{height:26px;text-align:center;border-radius:3px;cursor:default;overflow:hidden}
table.heat{width:100%;table-layout:fixed}
.heat th.rl{width:92px}
.heat th{padding:0 1px;overflow:hidden;text-overflow:clip}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.scale .bar{width:180px;height:10px;border-radius:2px}
svg text{font-family:var(--mono);font-size:11px}

/* tables */
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th{text-align:left;font-weight:500;color:var(--ink2);padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:bottom}
table.log td{padding:6px 10px 6px 0;border-bottom:1px solid var(--grid);vertical-align:top}
table.log td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.log td{overflow-wrap:anywhere}
.stack{display:flex;flex-direction:column;gap:18px}
.empty{padding:14px;background:var(--surface2);border-radius:4px;color:var(--ink2)}

/* observations */
.obs{display:flex;flex-direction:column;gap:0}
.ob{display:grid;grid-template-columns:120px 1fr;gap:4px 16px;padding:12px 0;border-top:1px solid var(--grid)}
.ob:first-child{border-top:0;padding-top:0}
.ob h3{font-size:14px}
.ob p{margin:3px 0 0;color:var(--ink2);max-width:95ch}
.ob p.act{color:var(--ink)}
.ob p.act b{font-weight:600}
.checks .ob{grid-template-columns:120px 200px 1fr}
@media (max-width:640px){.ob,.checks .ob{grid-template-columns:1fr}.drop-hint{margin-left:0}}
footer{font-size:12.5px;color:var(--ink2)}
footer ul{margin:6px 0 0;padding-left:18px;max-width:100ch}
footer li{margin:2px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.note{border-color:var(--accent);color:var(--ink2);font-size:13px}
.settings-line{font-size:12.5px;color:var(--ink2)}
.layout svg text{font-family:var(--sans)}
.landing{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px 24px;border-style:dashed;border-width:2px}
.landing h2{font-size:18px}
.landing p{margin:0;color:var(--ink2);max-width:70ch}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.print-only{display:none}
.stat-grid{display:grid;grid-template-columns:1fr;gap:18px}
.stat-grid h3{margin-bottom:6px}
table.stat td:first-child{color:var(--ink2);width:28%}
table.stat td.n{text-align:right}
table.stat th{text-align:right}
table.stat th:first-child{text-align:left}
.small{font-size:12px;margin:6px 0 0}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}
.mini-grid svg{display:block}
.stats .ob{grid-template-columns:120px 1fr;padding:8px 0}
.corr th.rl{width:64px}
@media (max-width:760px){.mini-grid{grid-template-columns:1fr}}
.signoff{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.signoff div{border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;color:var(--ink2)}
.signoff b{color:var(--ink);font-weight:600}
.mgmt{border-top:4px solid var(--accent)}
.mg-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.mg-h{font-size:20px}
.mg-status{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:130px;padding:8px 14px;border-radius:6px;font-weight:600;font-size:13px;color:#fff}
.mg-status span{font-size:20px;letter-spacing:.08em}
.mg-status.crit{background:var(--crit)}.mg-status.warn{background:var(--warn);color:#2b1e00}.mg-status.good{background:var(--good)}
.mg-bottom{font-size:15.5px;line-height:1.45;margin:12px 0 14px;max-width:95ch;font-weight:500}
.mg-kpis{margin-bottom:6px}
.mg-sub{font-size:14px;margin:16px 0 8px}
.mg-dec{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:100ch}
.mg-sign{grid-template-columns:repeat(5,1fr)}
@media (max-width:760px){.mg-sign{grid-template-columns:1fr 1fr}}
/* narrow screens: tables become stacked cards so nothing scrolls sideways */
@media screen and (max-width:760px){
  table.log.cards,table.log.cards tbody,table.log.cards tr,table.log.cards td{display:block;width:100%!important}
  table.log.cards thead,table.log.cards tr.hdr{display:none}
  table.log.cards tr{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;background:var(--surface)}
  table.log.cards td{border:0!important;padding:3px 0;display:grid;grid-template-columns:42% 1fr;gap:8px;text-align:left!important}
  table.log.cards td::before{content:attr(data-label);color:var(--ink2);font-family:var(--sans);font-size:12px}
  table.log.cards td.lead{display:block;font-weight:600;color:var(--ink)!important;padding-bottom:6px}
  table.log.cards td.lead::before{content:none}
  table.heat td{font-size:0}
  table.heat th{font-size:9px}
  .heat th.rl{width:64px}
  .heat th.rl .muted{display:none}
}
.printing .wrap{width:1047px;max-width:1047px;padding-inline:0}
.printing .cbox{height:165px}
@page{size:A4 landscape;margin:10mm}
@media print{
  body{background:#fff;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .noprint{display:none!important}
  .print-only{display:block!important}
  .signoff.print-only{display:grid!important}
  .wrap{max-width:none;width:auto;padding:0;gap:10px}
  .panel{padding:10px 12px}
  .kpis{grid-template-columns:repeat(6,1fr);gap:8px}
  .kpi .v{font-size:19px}
  .zones{grid-template-columns:repeat(3,1fr)}
  .two{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr}
  .mini-grid{grid-template-columns:repeat(3,1fr)}
  table.stat{font-size:10.5px}
  .scroll{overflow:visible}
  .cbox{height:165px}
  .verdict,.kpi,.zone,.trend-row,.ob,tr,.layout,.signoff,.two>section{break-inside:avoid}
  h2,.sec-head{break-after:avoid}
  .pb{break-before:page}
  table.log{font-size:11px}
  svg{min-width:0!important}
}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="eyebrow">CQI-9 process monitoring · continuous gas-fired pusher furnace</div>
      <h1 id="furnace">Furnace temperature review</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="actions noprint">
      <button class="btn ghost" id="copyBtn" type="button">Copy excursion log</button>
      <button class="btn ghost" id="loadBtn" type="button">Upload SCADA Excel…</button>
      <button class="btn" id="pdfBtn" type="button">Download PDF</button>
      <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv" hidden>
    </div>
  </header>
  <div class="panel note noprint" id="pdfNote" hidden></div>

  <section class="panel noprint" aria-label="Analysis settings">
    <div class="controls">
      <div class="field"><label for="tol">Tolerance ± °C</label><input id="tol" type="number" min="1" step="1"></div>
      <div class="field"><label for="merge">Merge dips less than, min apart</label><input id="merge" type="number" min="0" step="1"></div>
      <div class="field"><label for="push">Push interval, min</label><input id="push" type="number" min="1" step="1"></div>
      <div class="field"><label for="trays1">Tray positions, Zone 1</label><input id="trays1" type="number" min="1" step="1"></div>
      <div class="field"><label for="trays2">Tray positions, Zone 2</label><input id="trays2" type="number" min="1" step="1"></div>
      <div class="field"><label for="trays3">Tray positions, Zone 3</label><input id="trays3" type="number" min="1" step="1"></div>
      <div class="field"><label for="persist">Min. readings for an event</label><input id="persist" type="number" min="1" step="1"></div>
      <div class="field"><label for="settle" title="After a set value change the furnace needs time to reach the new value. Readings are not judged until the thermocouple is back within the tolerance, or until this time has passed, whichever comes first. 0 = judge every reading.">Max. settling after set change, min</label><input id="settle" type="number" min="0" step="5"></div>
      <span class="drop-hint">Drop a new SCADA export anywhere on the page. Everything is recalculated in your browser; nothing is uploaded.</span>
    </div>
    <details class="more">
      <summary>Data-integrity thresholds</summary>
      <div class="controls">
        <div class="field"><label for="spike">Spike: jump ≥ °C per reading</label><input id="spike" type="number" min="1" step="1"></div>
        <div class="field"><label for="stuck">Stuck TC: identical readings ≥</label><input id="stuck" type="number" min="3" step="1"></div>
        <div class="field"><label for="gap">Gap: interval ≥ × normal</label><input id="gap" type="number" min="1.5" step="0.5"></div>
        <div class="field"><label for="hold" title="Number of consecutive readings inside the tolerance that mark the new set value as reached.">Settled = in band for, readings</label><input id="hold" type="number" min="1" step="1"></div>
      </div>
    </details>
  </section>

  <div id="out"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

/* ---------- settings ---------- */
const MINSTAT = 10; /* min readings at one set value before it is analysed or listed */
/* Valid measuring range: readings outside 500-1000 °C are treated as invalid, excluded from every statistic and never plotted. */
const TMIN = 500, TMAX = 1000;
const inRange = v => v!=null && v>=TMIN && v<=TMAX;
const DEF = {tol:10, merge:10, push:30, trays1:5, trays2:4, trays3:4, persist:1, settle:120, hold:3, spike:15, stuck:30, gap:2.5};
const S = {...DEF};
try{ Object.assign(S, JSON.parse(localStorage.getItem("pfsr-settings")||"{}")); }catch(e){}
const IDS = Object.keys(DEF);
IDS.forEach(k=>{
  const el=document.getElementById(k); el.value=S[k];
  el.addEventListener("change",()=>{
    const v=parseFloat(el.value); if(!(v>0)&&!((k==="merge"||k==="settle")&&v===0)){ el.value=S[k]; return; }
    S[k]=v; try{localStorage.setItem("pfsr-settings",JSON.stringify(S));}catch(e){}
    if(DATA) run();
  });
});

/* ---------- helpers ---------- */
const traysIn=z=>Math.max(1,Math.round(S["trays"+(z+1)]??S.trays3??4));
let NZ=3;
const posStart=z=>{ let s=1; for(let i=0;i<z;i++) s+=traysIn(i); return s; };
const totalPos=()=>{ let s=0; for(let i=0;i<NZ;i++) s+=traysIn(i); return s; };
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtT=ms=>{const d=new Date(ms);return pad(d.getUTCHours())+":"+pad(d.getUTCMinutes());};
const fmtD=ms=>{const d=new Date(ms);return pad(d.getUTCDate())+" "+MONS[d.getUTCMonth()]+" "+d.getUTCFullYear();};
let MULTI=false, T0DAY=0;
const fmtDT=ms=>MULTI?fmtD(ms).slice(0,6)+" "+fmtT(ms):fmtT(ms);
const f1=x=>x==null||!isFinite(x)?"–":(Math.round(x*10)/10).toFixed(1);
const f0=x=>x==null||!isFinite(x)?"–":String(Math.round(x));
const sgn=(x,d=1)=>x==null||!isFinite(x)?"–":Math.abs(x)<0.5*10**-d?(0).toFixed(d):(x>0?"+":"−")+Math.abs(x).toFixed(d);
const dur=min=>{min=Math.round(min);return min<60?min+" min":Math.floor(min/60)+" h "+pad(min%60)+" min";};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const spTxt=levels=>levels.map(o=>f0(o.sp)).join(" → ")+" °C"; /* e.g. 735 → 940 °C */

/* ---------- parsing ---------- */
const MON={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
const yr=s=>s.length===2?2000+ +s:+s;
function parseDate(v){
  if(v==null||v==="") return null;
  if(v instanceof Date) return Date.UTC(v.getFullYear(),v.getMonth(),v.getDate());
  if(typeof v==="number") return v>=1?Math.round((Math.floor(v)-25569)*864e5):null;
  const s=String(v).trim(); let m,r=null;
  if((m=s.match(/^([A-Za-z]{3})[A-Za-z]*[-\s\/.]+(\d{1,2})[-\s\/.,]+(\d{2,4})/))) r=Date.UTC(yr(m[3]),MON[m[1].toUpperCase()],+m[2]);
  else if((m=s.match(/^(\d{1,2})[-\s\/.]+([A-Za-z]{3})[A-Za-z]*[-\s\/.,]+(\d{2,4})/))) r=Date.UTC(yr(m[3]),MON[m[2].toUpperCase()],+m[1]);
  else if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) r=Date.UTC(+m[1],m[2]-1,+m[3]);
  else if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) r=Date.UTC(yr(m[3]),m[2]-1,+m[1]); /* day-first, as SCADA in India */
  else { const p=Date.parse(s); r=isNaN(p)?null:p; }
  return isFinite(r)?r:null;
}
function parseTime(v){
  if(v==null||v==="") return null;
  if(v instanceof Date) return ((v.getHours()*60+v.getMinutes())*60+v.getSeconds())*1000;
  if(typeof v==="number") return Math.round((v%1)*86400)*1000;

function histSVG(s,A){
  const W=340,H=180,l=34,r=10,t0=26,b=26, S_=s.sc, lo=S_.yLo, hi=S_.yHi;
  const bw=Math.max(1,Math.round((hi-lo)/36)), nb=Math.ceil((hi-lo)/bw), cnt=new Array(nb).fill(0);
  s.y.forEach(v=>{ const i=Math.min(nb-1,Math.max(0,Math.floor((v-lo)/bw))); cnt[i]++; });
  const pdf=x=>s.sd>0?s.N*bw*Math.exp(-0.5*((x-s.mean)/s.sd)**2)/(s.sd*Math.sqrt(2*Math.PI)):0;
  const ymax=Math.max(...cnt,pdf(s.mean))*1.08||1;

  const col=s.k%2?"var(--s2)":"var(--s1)";
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${tcName(s.k)} histogram">`;
  g+=`<text x="${l}" y="14" font-family="var(--sans)" font-size="12.5" font-weight="600" fill="var(--ink)">${tcName(s.k)} · ${tcLoc(s.k)}${A.multiSet?` · set ${f0(s.sp)}`:""}</text>`;
  g+=`<rect x="${X(s.LSL)}" y="${t0}" width="${X(s.USL)-X(s.LSL)}" height="${H-b-t0}" fill="var(--band)"/>`;
  cnt.forEach((c,i)=>{ if(!c) return; const x=X(lo+i*bw); g+=`<rect x="${x+0.5}" y="${Y(c)}" width="${Math.max(1,X(lo+(i+1)*bw)-x-1)}" height="${H-b-Y(c)}" fill="${col}" opacity=".75"><title>${lo+i*bw}–${lo+(i+1)*bw} °C: ${c} readings</title></rect>`; });
  let path=""; for(let x=lo;x<=hi;x+=(hi-lo)/120) path+=(path?"L":"M")+X(x).toFixed(1)+" "+Y(pdf(x)).toFixed(1);
  g+=`<path d="${path}" fill="none" stroke="var(--ink2)" stroke-width="1.25"/>`;
  [[s.LSL,"LSL"],[s.USL,"USL"]].forEach(([v,lab])=>{ g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${t0}" y2="${H-b}" stroke="var(--good-ink)" stroke-dasharray="3 3"/><text x="${X(v)}" y="${t0-3}" text-anchor="middle" font-size="9.5" fill="var(--good-ink)">${lab}</text>`; });
  g+=`<line x1="${X(s.mean)}" x2="${X(s.mean)}" y1="${t0}" y2="${H-b}" stroke="var(--ink)" stroke-width="1.5"/>`;
  g+=`<line x1="${l}" x2="${W-r}" y1="${H-b}" y2="${H-b}" stroke="var(--line)"/>`;
  for(let v=lo;v<=hi;v+=S_.yStep) g+=`<text x="${X(v)}" y="${H-b+13}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${v}</text>`;
  g+=`<text x="${W-r}" y="14" text-anchor="end" font-size="10" fill="var(--ink2)">x̄ ${f1(s.mean)} · σ ${f1(s.sd)} · Ppk ${s.ppk==null?"–":s.ppk.toFixed(2)}</text>`;
  return g+`</svg>`;
}

  let d=""; s.y.forEach((v,i)=>{ d+=(i&&s.t[i]-s.t[i-1]<=2*A.step?"L":"M")+X(s.t[i]).toFixed(1)+" "+Y(v).toFixed(1); });

  return g+`</svg>`;

function observations(D,A){

      action:`Start the reaction plan. Use the “Suspect production” table to find the trays by charge or discharge time, place them on hold as suspect product, and release only after hardness/microstructure verification. Record cause, disposition and corrective action on the nonconformance record.`});
  }

    const b=t.devMean;

      O.push({lvl:Math.abs(b)>tol?"crit":"warn",tag:"Bias",title:`${tcName(t.k)} (${tcLoc(t.k)}) averages ${f1(Math.abs(b))} °C ${b<0?"below":"above"} setpoint`,
        detail:`${f1(t.inTolPct)} % of its readings are within ±${tol} °C; standard deviation ${f1(t.sdDev)} °C about the set value. A steady offset of this size points to a systematic cause (sensor drift, placement, burner balance) rather than normal cycling.`,
        action:`Check this TC against the last SAT result and the control thermocouple; confirm it is within its use-life and correctly placed. Inspect the ${t.k%2===0?"left":"right"}-wall burner (air/gas ratio, flame, blockage) and review the zone's last TUS.`});
    }
    if(t.cpk!=null&&t.cpk<1&&Math.abs(b)<=tol/2) O.push({lvl:"warn",tag:"Variation",title:`${tcName(t.k)} varies too much for the ±${tol} °C window (Ppk ${t.cpk.toFixed(2)})`,

  });

  }
  if(A.gaps.length){
    const m=A.gaps.reduce((a,g)=>a+g.min,0);
    O.push({lvl:"warn",tag:"Records",title:`${A.gaps.length} gap${A.gaps.length>1?"s":""} in the recording (${dur(m)} missing)`,
      detail:A.gaps.slice(0,4).map(g=>`${fmtDT(g.from)} → ${fmtDT(g.to)}`).join("; ")+(A.gaps.length>4?" …":""),
      action:`Continuous temperature records are required for the heat treat process. Document the cause (logger, network, power) and confirm product in the furnace during the gap was verified another way.`});
  }
  const stuck=A.tcs.filter(t=>t.stuck.length), spikes=A.tcs.filter(t=>t.spikes.length), bad=A.tcs.filter(t=>t.bad||t.missing);
  if(stuck.length) O.push({lvl:"warn",tag:"Sensor",title:`Flat-line readings on ${stuck.map(t=>tcName(t.k)).join(", ")}`,detail:`The same value repeated for ${S.stuck}+ consecutive readings, which a live thermocouple rarely does.`,action:`Check the TC, compensating cable and SCADA tag for a frozen signal.`});
  if(spikes.length) O.push({lvl:"warn",tag:"Sensor",title:`Sudden jumps of ${S.spike}+ °C between readings on ${spikes.map(t=>tcName(t.k)+" ("+t.spikes.length+")").join(", ")}`,detail:`Furnace wall temperature cannot physically change this fast in one reading interval (${f0(A.step/60000)} min).`,action:`Check thermocouple junction, terminal connections and compensating cable for intermittent contact.`});
  if(bad.length) O.push({lvl:"warn",tag:"Records",title:`Missing or implausible values on ${bad.map(t=>tcName(t.k)).join(", ")}`,detail:bad.map(t=>`${tcName(t.k)}: ${t.missing} blank, ${t.bad} outside 500–1000 °C (excluded from statistics and charts)`).join("; "),action:`Treat blank or out-of-range values as loss of monitoring for that period.`});
  const spc=A.tcs.filter(t=>t.spChanges.length);
  if(spc.length) O.push({lvl:"info",tag:"Setpoint",title:`Set value changed during the record: ${A.multiSet?spTxt(A.setLevels):spc.map(t=>tcName(t.k)).join(", ")}`,detail:(A.setSegs.length>1?`Set values in time order: ${A.setSegs.map(g=>`${f0(g.sp)} °C (${hmr(g.from,g.to)})`).join(" → ")}. `:"")+spc.map(t=>t.spChanges.slice(0,3).map(c=>`${tcName(t.k)} ${f0(c.from)}→${f0(c.to)} °C at ${fmtDT(c.t)}`).join("; ")).join("; "),action:`Confirm each change matches an approved process specification and was authorised.`});
  A.trans.filter(x=>x.reachedAt==null&&!x.ended&&!x.superseded).forEach(x=>O.push({lvl:"warn",tag:"Set change",title:`${tcName(x.k)} did not reach the new set value ${f0(x.to)} °C within ${S.settle} min`,
    detail:`Set value changed ${f0(x.from)} → ${f0(x.to)} °C at ${fmtDT(x.t)}; the thermocouple was not within ±${tol} °C of it ${S.settle} min later, so readings after that are judged and count as out of tolerance.`,
    action:`Check burner capacity, gas supply and control loop response on the ${x.k%2?"right":"left"} wall of Zone ${Math.floor(x.k/2)+1}; confirm the change is achievable in the time allowed. Lengthen the settling time only with the process owner's approval.`}));
  const slow=A.trans.filter(x=>x.reachedAt!=null); if(slow.length) O.push({lvl:"info",tag:"Set change",title:`Response to set value changes: ${slow.map(x=>`${tcName(x.k)} ${f0(x.from)}→${f0(x.to)} °C in ${dur(x.mins)}`).join("; ")}`,detail:`Readings during these periods are not judged (${fmtN(A.settlingTotal)} readings in total).`,action:`Compare the response time with previous days; a growing time points to weakening burners or a fouled thermocouple.`});
  const hrs=(A.t1-A.t0)/36e5;
  if(!MULTI&&hrs<23.5) O.push({lvl:"info",tag:"Records",title:`Record covers ${fmtT(A.t0)} to ${fmtT(A.t1)} only (${f1(hrs)} h)`,detail:`A full production day would run to about 23:59.`,action:`Confirm whether this export is partial or the furnace was stopped after ${fmtT(A.t1)}.`});
  const title=D.meta.join(" ");
  const spMax=Math.max(...A.tcs.map(t=>t.sp||0));
  if(/temp[e]?ring/i.test(title)&&spMax>=780) O.push({lvl:"info",tag:"Report label",title:`The file header says “tempering” but setpoints are ${f0(spMax)} °C`,detail:`That temperature is in the hardening (austenitising) range, not tempering.`,action:`Correct the SCADA report template so the record names the right furnace and process.`});
  if(!O.some(o=>o.lvl==="crit"||o.lvl==="warn")) O.unshift({lvl:"good",tag:"Conforming",title:`All thermocouples held within ±${tol} °C for the whole record`,detail:`No excursions, gaps or sensor anomalies were detected with the current thresholds.`,action:`File this report with the day's production records.`});
  const rank={crit:0,warn:1,info:2,good:3}; O.sort((a,b)=>rank[a.lvl]-rank[b.lvl]);
  return O;
}

/* ---------- render ---------- */

}

    <b>How the numbers are worked out</b>
    <ul>
      <li>Thermocouple layout: TC-1/TC-2 = Zone 1 left/right wall, TC-3/TC-4 = Zone 2, TC-5/TC-6 = Zone 3. Deviation = present value (PV) − set value (SET) of the same row.</li>
      <li>The furnace is one continuous chamber of ${totalPos()} tray positions (Zone 1: positions 1–${traysIn(0)}${A.zones.slice(1).map(z=>`, Zone ${z.z+1}: ${posStart(z.z)}–${posStart(z.z)+traysIn(z.z)-1}`).join("")}). A tray charged at time T is in position p from T + (p−1)×push to T + p×push and is discharged at T + ${totalPos()}×push. Because there is no partition, a disturbance in one zone also affects its neighbours; the zone split is for control and traceability.</li>
      <li>A zone excursion starts when either wall of a zone reads outside setpoint ±${tol} °C and ends when both walls have stayed inside for more than ${S.merge} min. “Span” is start to end; “Time out” counts only the minutes actually outside the window.</li>
      <li>Capability: USL/LSL = set value ±${tol} °C. When the set value changes during the record, every statistic, histogram and control chart is calculated separately for each set value (readings with fewer than ${MINSTAT} points at a set value are not analysed). Cp = (USL − LSL) / 6σ<sub>within</sub>, Cpk = min(USL − mean, mean − LSL) / 3σ<sub>within</sub>, with σ<sub>within</sub> = average moving range / 1.128. Pp and Ppk use the overall standard deviation instead. Wall difference = |left − right| for simultaneous readings.</li>
      <li>After a set value change a thermocouple is not judged until it is back within ±${tol} °C of the new set value for ${S.hold} readings in a row, or ${S.settle} min have passed. The furnace needs this time to follow; the response time is reported separately under “Response to set value changes”.</li>

    </ul>

/* label every table cell with its column header, so narrow screens can show rows as cards */
function cardify(){
  document.querySelectorAll("#out table.log").forEach(tb=>{
    const rows=[...tb.rows]; if(!rows.length) return;
    const hr=tb.tHead?tb.tHead.rows[0]:rows[0];
    if(!tb.tHead) hr.classList.add("hdr");
    const labels=[...hr.cells].map(c=>c.textContent.trim());
    rows.forEach(r=>{ if(r===hr||r.parentElement===tb.tHead) return; [...r.cells].forEach((c,i)=>{ c.dataset.label=labels[i]||""; if(i===0&&!labels[0]) c.classList.add("lead"); }); });
    tb.classList.add("cards");
  });
}

/* ---------- Pareto prioritisation ---------- */
// exposure = degrees beyond the tolerance window × minutes, summed per cause
function pareto(D,A){
  const tol=A.tol, sm=A.step/60000, dips=chamberDips(D,A);
  const inDip=t=>dips.some(d=>t>=d.from&&t<=d.to);
  const acc={};
  D.rows.forEach(r=>{ const dip=inDip(r.t); for(let k=0;k<D.n;k++){ const v=r.ev[k], sp=r.sp[k]??A.tcs[k].sp; if(v==null||sp==null) continue; const d=v-sp, ex=Math.abs(d)-tol; if(ex<=0) continue;
    const key=dip?"chamber":"tc"+k, o=acc[key]||(acc[key]={dm:0,min:0,lo:0,hi:0}); o.dm+=ex*sm; o.min+=sm; if(d<0)o.lo++; else o.hi++; } });
  const items=Object.entries(acc).map(([key,o])=>{
    if(key==="chamber") return {...o,key,short:"Chamber-wide",label:"Chamber-wide dips: most thermocouples out together",
      cause:"Common cause across the chamber: gas supply, door opening or heavy load",action:`Check gas pressure log, door operations and loading at ${dips.slice(0,3).map(d=>fmtT(d.from)+"–"+fmtT(d.to)).join(", ")}`,owner:"HT Manager, with Maintenance Head"};
    const k=+key.slice(2), t=A.tcs[k], dir=o.lo>=o.hi?"low":"high", z=Math.floor(k/2)+1;
    let cause,action,owner;
    if(Math.abs(t.devMean)>tol/2){ cause=`Steady offset of ${sgn(t.devMean)} °C: burner balance or thermocouple error`; action="Check the TC against the control TC and its last SAT; inspect and tune that wall's burner (air/gas ratio, flame)"; owner="HT Manager, with Maintenance Head"; }
    else if(t.spikes.length>=5){ cause=`Erratic signal (${t.spikes.length} sudden jumps) around a centred mean`; action="Inspect TC junction, terminals and compensating cable; replace if needed"; owner="Maintenance Head"; }
    else if(z===1){ cause="Dips when cold trays are pushed into the charge zone"; action="Compare dips with push times; review Zone 1 heat input and recovery"; owner="HT Manager"; }
    else { cause="Short excursions around a centred mean"; action="Review PID tuning and burner turndown for the zone"; owner="HT Manager"; }
    return {...o,key,k,short:`${tcName(k)} Z${z} ${k%2?"R":"L"} ${dir}`,label:`${tcName(k)} (${tcLoc(k)}) running ${dir}`,cause,action,owner};
  });
  const total=items.reduce((a,b)=>a+b.dm,0);
  items.sort((a,b)=>b.dm-a.dm);
  let cum=0;
  items.forEach(it=>{ const before=cum; it.share=total?100*it.dm/total:0; cum+=it.share; it.cum=Math.min(100,cum); it.pr=before<80?"A":it.share>=5?"B":"C"; });
  return {items,total,dips};
}
const PR={P0:{lvl:"crit",when:"Today, before dispatch"},A:{lvl:"crit",when:"Start today"},B:{lvl:"warn",when:"This week"},C:{lvl:"info",when:"Next planned stop / monitor"}};
const prChip=p=>chip(PR[p].lvl,p==="P0"?"P0 contain":p);
function priorityList(D,A,PA){
  const tol=A.tol, rows=[], trays=A.batches.reduce((a,b)=>a+b.trays,0), hrs=(A.t1-A.t0)/36e5;
  if(A.batches.length){
    rows.push({pr:"P0",issue:`≈ ${trays} trays exposed to out-of-tolerance temperature (charged ${A.batches.map(b=>fmtW(b.from)+" → "+fmtW(b.to)).join("; ")})`,impact:"Risk of hardness / microstructure outside specification reaching the customer",
      cause:"Consequence of the excursions below",action:"Hold the batch, verify samples, decide release / re-heat-treat / scrap, raise the nonconformance record",owner:"Quality Manager, with HT Manager",when:PR.P0.when});
    rows.push({pr:"P0",issue:"Parts in the suspect batch are unavailable until released",impact:"Possible delay to downstream supply and customer deliveries",cause:"Containment",
      action:"Identify production lots in the suspect charge window; plan buffer stock or re-heat-treat capacity",owner:"Production Manager",when:"Today's production meeting"});
  }
  PA.items.forEach(it=>rows.push({pr:it.pr,issue:it.label,impact:`${f1(it.share)} % of exposure (cumulative ${f0(it.cum)} %) · ${f0(it.dm)} °C·min · ${dur(it.min)} out`,cause:it.cause,action:it.action,owner:it.owner,when:PR[it.pr].when,share:it.share,cum:it.cum,dm:it.dm,min:it.min}));
  const ranked=new Set(PA.items.filter(i=>i.k!=null).map(i=>i.k));
  A.tcs.filter(t=>!ranked.has(t.k)&&Math.abs(t.devMean)>tol/2).forEach(t=>rows.push({pr:"B",issue:`${tcName(t.k)} (${tcLoc(t.k)}) runs ${f1(Math.abs(t.devMean))} °C ${t.devMean<0?"low":"high"} without leaving the window`,impact:"Uses up half the tolerance; small disturbances become excursions",cause:"Offset",action:"Burner balance and TC check",owner:"Maintenance Head",when:PR.B.when}));
  const noisy=A.tcs.filter(t=>(t.spikes.length>=5||t.stuck.length)&&!PA.items.some(i=>i.k===t.k&&/Erratic/.test(i.cause)));
  if(noisy.length) rows.push({pr:"C",issue:`Erratic or frozen signal on ${noisy.map(t=>tcName(t.k)).join(", ")}`,impact:"False alarms or missed excursions; weaker CQI-9 evidence",cause:"Sensor / wiring",action:"Inspect TC junction, terminals and compensating cable at the next opportunity",owner:"Maintenance Head",when:PR.C.when});
  const label=/temp[e]?ring/i.test(D.meta.join(" "))&&Math.max(...A.tcs.map(t=>t.sp||0))>=780;
  if((!MULTI&&hrs<23.5)||A.gaps.length||label) rows.push({pr:"C",issue:`Record quality: ${[!MULTI&&hrs<23.5?`export ends at ${fmtT(A.t1)}`:"",A.gaps.length?`${A.gaps.length} recording gap(s)`:"",label?"report header mislabelled \"tempering\"":""].filter(Boolean).join("; ")}`,
    impact:"Incomplete or mislabelled records weaken audit evidence",cause:"SCADA export / template",action:"Fix the SCADA export range and report template",owner:"Maintenance Head",when:PR.C.when});

  });

}

      if(!c){ h+=`<td title="No judged data (offline or settling)"></td>`; return; }
      const t=Math.min(1,Math.abs(c.m)/lim), bg=mix(mid,c.m<0?lo:hi,t), fg=t>0.55?"#fff":ink;
      const out=Math.abs(c.m)>A.tol;
      const st=A.hourStart+b*A.bucketH*36e5;
      h+=`<td style="background:${bg};color:${fg};${out?"box-shadow:inset 0 0 0 2px "+ink:""}" title="${tcName(k)} ${fmtDT(st)}–${fmtT(st+A.bucketH*36e5)}: mean ${sgn(c.m)} °C (${c.n} readings)">${(c.m>0?"+":"")+Math.round(c.m)}</td>`;
    });
    h+=`</tr>`;
  });
  return h+`</tbody></table>`;
}

function rangeChart(A){
  const tol=A.tol, W=560, lp=92, rp=16, rh=34, top=10, n=A.tcs.length, H=top+n*rh+30;
  let mn=Math.min(-tol*1.5,...A.tcs.map(t=>t.dmin??0)), mx=Math.max(tol*1.5,...A.tcs.map(t=>t.dmax??0));
  const st=(mx-mn)>240?40:(mx-mn)>60?20:(mx-mn)>30?10:5; mn=Math.floor(mn/st)*st; mx=Math.ceil(mx/st)*st;
  const x=v=>lp+(v-mn)/(mx-mn)*(W-lp-rp);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:760px" role="img" aria-label="Deviation range per thermocouple">`;
  s+=`<rect x="${x(-tol)}" y="${top}" width="${x(tol)-x(-tol)}" height="${n*rh}" fill="var(--band)"/>`;
  for(let v=mn;v<=mx;v+=st){ s+=`<line x1="${x(v)}" x2="${x(v)}" y1="${top}" y2="${top+n*rh}" stroke="${v===0?"var(--muted)":"var(--grid)"}" stroke-width="1" ${v===0?'stroke-dasharray="3 3"':""}/><text x="${x(v)}" y="${top+n*rh+16}" text-anchor="middle" fill="var(--muted)">${v>0?"+":""}${v}</text>`; }

  A.tcs.forEach((t,i)=>{
    const y=top+i*rh+rh/2, col=t.k%2?"var(--s2)":"var(--s1)";
    if(!t.cnt){ s+=`<text x="0" y="${y+4}" fill="var(--ink)" font-family="var(--sans)" font-size="12">${tcName(t.k)}</text><text x="40" y="${y+4}" fill="var(--muted)" font-size="11">${t.nvalid?"only settling readings, none judged":"no valid reading in 500–1000 °C"}</text>`; return; }
    s+=`<g><title>${tcName(t.k)} ${tcLoc(t.k)}: min ${sgn(t.dmin)}, P5 ${sgn(t.p5)}, mean ${sgn(t.devMean)}, P95 ${sgn(t.p95)}, max ${sgn(t.dmax)} °C</title>`;
    s+=`<text x="0" y="${y+4}" fill="var(--ink)" font-family="var(--sans)" font-size="12">${tcName(t.k)}</text><text x="40" y="${y+4}" fill="var(--muted)" font-size="11">Z${Math.floor(t.k/2)+1} ${t.k%2?"R":"L"}</text>`;

    s+=`<rect x="${x(t.p5)}" y="${y-6}" width="${Math.max(2,x(t.p95)-x(t.p5))}" height="12" rx="3" fill="${col}" opacity=".55"/>`;

    s+=`<rect x="0" y="${y-rh/2}" width="${W}" height="${rh}" fill="transparent"/></g>`;
  });

  return s+`</svg>`;
}

const fmtN=x=>Number(x).toLocaleString();

    return `<tr><td><b>${tcName(x.k)}</b> <span class="muted">${tcLoc(x.k)}</span></td><td class="n">${f0(x.from)} → ${f0(x.to)} °C ${x.dir==="up"?"↑":"↓"}</td><td class="n">${fmtDT(x.t)}</td><td class="n">${x.reachedAt!=null?fmtDT(x.reachedAt):"–"}</td><td class="n">${x.mins==null?"–":dur(x.mins)}</td><td>${res}</td></tr>`;

  </section>`;
}
function excursionTable(A){

}
function traceTable(A){

  return `<div class="scroll"><table class="log"><thead><tr><th>Batch</th><th>Charged from</th><th>Charged to</th><th>Discharged from</th><th>Discharged to</th><th>Trays ≈</th><th>Zones</th><th>Incidents</th><th>Disposition</th></tr></thead><tbody>${
    A.batches.map((b,i)=>`<tr><td class="n"><b>S${i+1}</b></td><td class="n">${fmtW(b.from)}</td><td class="n">${fmtW(b.to)}</td><td class="n">${fmtW(b.dsFrom)}</td><td class="n">${fmtW(b.dsTo)}</td><td class="n">${b.trays}</td><td>${[...b.zones].sort().map(z=>"Z"+(z+1)).join(", ")}</td><td class="n">${b.inc.length>6?b.inc.slice(0,6).join(", ")+" … ("+b.inc.length+")":b.inc.join(", ")}</td><td style="border-bottom:1px solid var(--line)"></td></tr>`).join("")
  }</tbody></table></div>`;
}
function fmtW(ms){ return (Math.floor(ms/864e5)!==T0DAY?fmtD(ms).slice(0,6)+" ":"")+fmtT(ms); }
function nowStamp(){ const d=new Date(); return pad(d.getDate())+" "+MONS[d.getMonth()]+" "+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function layoutSVG(A){

  for(let p=0;p<P;p++) s+=`<rect x="${x0+p*sw+4}" y="${top+22}" width="${sw-8}" height="${bot-top-44}" rx="3" fill="var(--surface)" stroke="var(--line)"/><text x="${x0+p*sw+sw/2}" y="${(top+bot)/2+4}" text-anchor="middle" font-size="11" fill="var(--muted)">${p+1}</text>`;

    s+=`<text x="${xm}" y="14" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">Zone ${z.z+1}</text><text x="${xm}" y="31" text-anchor="middle" font-size="11" fill="var(--muted)">positions ${a+1}–${a+n} · ${dur(n*S.push)}</text>`;
    [[z.L,top,-1],[z.R,bot,1]].forEach(([k,y,dir])=>{

function integrity(A){
  const C=[];
  C.push(A.gaps.length?{lvl:"warn",name:"Continuous recording",txt:`${A.gaps.length} gap(s), ${dur(A.gaps.reduce((a,g)=>a+g.min,0))} missing. ${A.gaps.slice(0,3).map(g=>fmtDT(g.from)+"→"+fmtDT(g.to)).join(", ")}`}
    :{lvl:"good",name:"Continuous recording",txt:`No gaps. ${A.N} readings at a ${f0(A.step/1000)} s interval.`});
  const miss=A.tcs.filter(t=>t.missing||t.bad);
  C.push(miss.length?{lvl:"warn",name:"Values present and plausible",txt:miss.map(t=>`${tcName(t.k)}: ${t.missing} blank, ${t.bad} outside 500–1000 °C (excluded)`).join("; ")}:{lvl:"good",name:"Values present and plausible",txt:"Every reading is a value between 500 and 1000 °C."});
  const st=A.tcs.filter(t=>t.stuck.length);
  C.push(st.length?{lvl:"warn",name:"No frozen signal",txt:st.map(t=>`${tcName(t.k)} held ${f0(t.stuck[0].val)} °C for ${t.stuck[0].len} readings from ${fmtDT(t.stuck[0].from)}`).join("; ")}:{lvl:"good",name:"No frozen signal",txt:`No thermocouple repeated the same value ${S.stuck}+ times in a row.`});
  const sp=A.tcs.filter(t=>t.spikes.length);
  C.push(sp.length?{lvl:"warn",name:"No sudden jumps",txt:sp.map(t=>`${tcName(t.k)}: ${t.spikes.length} (first ${f0(t.spikes[0].from)}→${f0(t.spikes[0].to)} °C at ${fmtDT(t.spikes[0].t)})`).join("; ")}:{lvl:"good",name:"No sudden jumps",txt:`No change of ${S.spike} °C or more between consecutive readings.`});
  const spc=A.tcs.filter(t=>t.spChanges.length);
  C.push(A.trans.length?{lvl:A.trans.some(x=>x.reachedAt==null&&!x.ended&&!x.superseded)?"warn":"info",name:"Settling after set value change",txt:`${fmtN(A.settlingTotal)} readings not judged while the furnace followed a new set value (until within ±${A.tol} °C for ${S.hold} readings, at most ${S.settle} min).`}:{lvl:"good",name:"Settling after set value change",txt:"No set value change larger than the tolerance in this record."});
  C.push(spc.length?{lvl:"info",name:"Set value changed",txt:(A.setSegs.length>1?`${A.setSegs.map(g=>`${f0(g.sp)} °C ${hmr(g.from,g.to)}`).join(" → ")}. `:"")+spc.map(t=>`${tcName(t.k)}: ${t.spChanges.length} change(s)`).join("; ")+". Deviations and statistics use the set value in force at each reading."}:{lvl:"good",name:"Setpoint stable",txt:`Setpoints unchanged: ${[...new Set(A.tcs.map(t=>f0(t.sp)))].join(" / ")} °C.`});
  return C;
}

/* ---------- charts ---------- */
const crosshair={id:"xh",afterDraw(c){ const a=c.tooltip&&c.tooltip.getActiveElements(); if(!a||!a.length) return; const x=a[0].element.x, ya=c.scales.y; const g=c.ctx; g.save(); g.strokeStyle=cssv("--muted"); g.lineWidth=1; g.setLineDash([2,3]); g.beginPath(); g.moveTo(x,ya.top); g.lineTo(x,ya.bottom); g.stroke(); g.restore(); }};
function drawCharts(D,A){
  charts.forEach(c=>c.destroy()); charts=[];
  if(!window.Chart) return;
  const c1=cssv("--s1"),c2=cssv("--s2"),muted=cssv("--muted"),grid=cssv("--grid"),band=cssv("--band"),crit=cssv("--crit"),surf=cssv("--surface"),ink2=cssv("--ink2");
  const t0=A.t0, span=(A.t1-t0)/60000, steps=[15,30,60,120,180,240,360,720,1440,2880];
  const stepMin=steps.find(s=>span/s<=12)||4320;
  const xs=D.rows.map(r=>(r.t-t0)/60000);
  // one shared y-scale for every zone so the charts compare like for like
  let yLo=Infinity,yHi=-Infinity;
  D.rows.forEach(r=>{ r.pv.forEach(v=>{ if(v!=null){ if(v<yLo)yLo=v; if(v>yHi)yHi=v; } }); });
  A.setLevels.forEach(o=>{ yLo=Math.min(yLo,o.sp-A.tol*2); yHi=Math.max(yHi,o.sp+A.tol*2); });
  const yStep=(yHi-yLo)>160?40:(yHi-yLo)>80?20:(yHi-yLo)>40?10:5;
  yLo=Math.floor((yLo-1)/yStep)*yStep; yHi=Math.ceil((yHi+1)/yStep)*yStep;
  yLo=Math.max(TMIN,isFinite(yLo)?yLo:TMIN); yHi=Math.min(TMAX,isFinite(yHi)?yHi:TMAX); if(yHi<=yLo){ yLo=TMIN; yHi=TMAX; } /* never draw outside 500-1000 °C */
  A.yScale={lo:yLo,hi:yHi,step:yStep};
  A.zones.forEach(z=>{
    const el=document.getElementById("c"+z.z); if(!el) return;
    const L=z.L,R=z.R, RK=refTC(z,A).k, spOf=(r,k)=>r.sp[k]??A.tcs[k].sp??A.tcs[RK].sp;
    const pts=k=>D.rows.map((r,i)=>({x:xs[i],y:r.pv[k]}));
    const rad=k=>D.rows.map(r=>{ const v=r.ev[k],s=spOf(r,k); return v!=null&&s!=null&&Math.abs(v-s)>A.tol?2.6:0; });
    const ds=[
      {label:"upper",data:D.rows.map((r,i)=>({x:xs[i],y:Math.min(TMAX,spOf(r,RK)+A.tol)})),borderWidth:0,pointRadius:0,pointHoverRadius:0,fill:false},
      {label:"lower",data:D.rows.map((r,i)=>({x:xs[i],y:Math.max(TMIN,spOf(r,RK)-A.tol)})),borderWidth:0,pointRadius:0,pointHoverRadius:0,fill:"-1",backgroundColor:band},
      {label:"Setpoint",data:D.rows.map((r,i)=>({x:xs[i],y:spOf(r,RK)})),borderColor:muted,borderDash:[4,4],borderWidth:1,pointRadius:0,pointHoverRadius:0},
      {label:`${tcName(L)} left`,data:pts(L),borderColor:c1,backgroundColor:c1,borderWidth:1.5,pointRadius:rad(L),pointBackgroundColor:crit,pointBorderColor:surf,pointBorderWidth:1,pointHoverRadius:4,pointHoverBackgroundColor:c1,spanGaps:false}
    ];
    if(R!=null) ds.push({label:`${tcName(R)} right`,data:pts(R),borderColor:c2,backgroundColor:c2,borderWidth:1.5,pointRadius:rad(R),pointBackgroundColor:crit,pointBorderColor:surf,pointBorderWidth:1,pointHoverRadius:4,pointHoverBackgroundColor:c2,spanGaps:false});
    const spans=A.trans.filter(x=>x.k===L||x.k===R).map(x=>({from:x.t,to:x.end}));
    const settleBand={id:"sb",beforeDatasetsDraw(c){ if(!spans.length) return; const a=c.chartArea, xs_=c.scales.x, g=c.ctx; g.save(); g.fillStyle=grid; g.globalAlpha=.75; spans.forEach(sp=>{ const x0=Math.max(a.left,xs_.getPixelForValue((sp.from-t0)/60000)), x1=Math.min(a.right,xs_.getPixelForValue((sp.to-t0)/60000)); if(x1>x0) g.fillRect(x0,a.top,x1-x0,a.bottom-a.top); }); g.restore(); }};
    charts.push(new Chart(el,{type:"line",data:{datasets:ds},plugins:[settleBand,crosshair],options:{
      animation:false,parsing:false,normalized:true,responsive:true,maintainAspectRatio:false,devicePixelRatio:PRINTING?3:undefined,
      interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:false},tooltip:{filter:i=>i.datasetIndex>=2,backgroundColor:surf,titleColor:cssv("--ink"),bodyColor:ink2,borderColor:cssv("--line"),borderWidth:1,
        titleFont:{family:"IBM Plex Mono"},bodyFont:{family:"IBM Plex Mono"},usePointStyle:true,
        callbacks:{title:it=>fmtDT(t0+it[0].parsed.x*60000),label:i=>{ const y=i.parsed.y; if(y==null) return `${i.dataset.label}: no data`; if(i.datasetIndex===2) return `Setpoint: ${f0(y)} °C`; const d=y-(i.chart.data.datasets[2].data[i.dataIndex].y); return `${i.dataset.label}: ${f0(y)} °C (${sgn(d)})`; },
          labelColor:i=>({borderColor:i.dataset.borderColor,backgroundColor:i.dataset.borderColor})}}},
      scales:{
        x:{type:"linear",min:0,max:span,ticks:{stepSize:stepMin,color:muted,maxRotation:0,autoSkip:true,font:{family:"IBM Plex Mono",size:11},callback:v=>fmtDT(t0+v*60000)},grid:{color:grid},border:{color:grid}},
        y:{min:yLo,max:yHi,afterFit:s=>{s.width=64;},ticks:{stepSize:yStep,color:muted,font:{family:"IBM Plex Mono",size:11},callback:v=>v+" °C"},grid:{color:grid},border:{display:false}}
      }}}));
  });
}

/* ---------- PDF (browser print to A4 landscape) ---------- */
let PRINTING=false, savedTheme=null;
const savedTitle=document.title;
const IN_FRAME=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
function reportFileName(){
  const A=window.__A; if(!A||!DATA) return savedTitle;
  const furn=(DATA.meta.find(m=>/furnace/i.test(m))||"Furnace").match(/furnace[-\s]*\d+/i);
  const d=new Date(A.t0), ymd=d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
  return (furn?furn[0].replace(/\s+/g,"-").toUpperCase():"FURNACE")+" SCADA report "+ymd;
}
function enterPrint(){
  if(PRINTING||!DATA) return; PRINTING=true;
  const root=document.documentElement; savedTheme=root.getAttribute("data-theme");
  root.setAttribute("data-theme","light"); document.body.classList.add("printing");
  document.title=reportFileName(); run();
}
function exitPrint(){
  if(!PRINTING) return;
  const root=document.documentElement;
  document.body.classList.remove("printing");
  if(savedTheme==null) root.removeAttribute("data-theme"); else root.setAttribute("data-theme",savedTheme);
  document.title=savedTitle;
  setTimeout(()=>{ PRINTING=false; run(); },0);

addEventListener("beforeprint",enterPrint);
addEventListener("afterprint",()=>setTimeout(exitPrint,0));
$("#pdfBtn").addEventListener("click",()=>{

/* ---------- file loading ---------- */
function loadBuffer(buf,name){
  try{
    if(!window.XLSX) throw new Error("The spreadsheet reader didn't load. Check the internet connection and reload the page.");
    const wb=XLSX.read(buf,{type:"array",cellDates:false});
    let D=null,firstErr=null;
    for(const sn of wb.SheetNames){
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
      try{ D=parseAOA(aoa); break; }catch(e){ firstErr=firstErr||e; }
    }
    if(!D) throw firstErr||new Error("No usable sheet found.");
    DATA=D; FILE=name; run();
  }catch(err){ $("#out").innerHTML=`<div class="panel error"><b>${esc(name)} couldn't be analysed.</b> ${esc(err.message)}</div>`; }
}
$("#loadBtn").addEventListener("click",()=>$("#file").click());
$("#file").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; f.arrayBuffer().then(b=>loadBuffer(b,f.name)); e.target.value=""; });
let dragN=0;
addEventListener("dragenter",e=>{ e.preventDefault(); dragN++; document.body.classList.add("dragging"); });
addEventListener("dragleave",()=>{ if(--dragN<=0){dragN=0;document.body.classList.remove("dragging");} });
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",e=>{ e.preventDefault(); dragN=0; document.body.classList.remove("dragging"); const f=e.dataTransfer.files[0]; if(f) f.arrayBuffer().then(b=>loadBuffer(b,f.name)); });

$("#copyBtn").addEventListener("click",()=>{
  const A=window.__A; if(!A) return;
  const head=["#","Zone","Walls out","TCs","Direction","Start","End","Span (min)","Time out (min)","Extreme °C","Deviation °C","Extreme on","Trays exposed","Suspect from"];
  const lines=[head.join("\t")].concat(A.events.map((e,i)=>[i+1,"Zone "+(e.z+1),e.scope,[...e.walls].sort().map(tcName).join(" "),e.low&&e.high?"Low & high":e.low?"Low":"High",fmtDT(e.tStart),fmtDT(e.tEnd),Math.round(e.min),Math.round(e.outMin),f0(e.worstV),f1(e.worst),tcName(e.worstK),e.trays,fmtDT(e.winFrom)].join("\t")));
  const txt=lines.join("\n"), b=$("#copyBtn");
  const done=m=>{ b.textContent=m; setTimeout(()=>b.textContent="Copy excursion log",1800); };
  try{ navigator.clipboard.writeText(txt).then(()=>done(A.events.length?"Copied – paste into Excel":"Copied (no events)"),()=>done("Copy blocked by browser")); }catch(e){ done("Copy blocked by browser"); }
});

/* ---------- start ---------- */
function loadSample(){ try{ DATA=parseAOA(SAMPLE); FILE=SAMPLE_NAME+" (example)"; run(); }catch(e){ $("#out").innerHTML=`<div class="panel error">${esc(e.message)}</div>`; } }
function landing(){
  $("#out").innerHTML=`<section class="panel landing">
    <div class="eyebrow">Daily report</div>
    <h2>Upload today’s SCADA Excel export</h2>
    <p>Choose the .xlsx file exported from SCADA, or drag it onto this page. The report is built in this browser and the file is not sent anywhere. Then click <b>Download PDF</b> and pick <b>Save as PDF</b> in the print dialog.</p>
    <div class="actions"><button class="btn" type="button" id="landUp">Upload SCADA Excel…</button>${SAMPLE?`<button class="linkbtn" type="button" id="landEx">or open the example (25 Sep 2026)</button>`:""}</div>
  </section>`;
  $("#landUp").addEventListener("click",()=>$("#file").click());
  if(SAMPLE) $("#landEx").addEventListener("click",loadSample);
}
if(IN_FRAME&&SAMPLE) loadSample(); else landing();
