<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heat Treat Quality Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!-- Built by suite/build.py from Pusher_Furnace_SCADA_Review.html and Thermocouple_SAT_PDCA.html. Edit those files and the shell, then rebuild; do not edit this file. -->
<style>
:root{
  color-scheme:light;
  --bg:#eceff1;--surface:#fbfcfc;--surface2:#f2f4f5;--ink:#131d24;--ink2:#4a5761;--muted:#76838c;--line:#d5dbdf;--accent:#0e5566;--accent-ink:#ffffff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:52px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1316;--surface:#161e23;--surface2:#1c262c;--ink:#eaf0f3;--ink2:#aebbc3;--muted:#84929b;--line:#2b373e;--accent:#5fb3c7;--accent-ink:#06232b}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1316;--surface:#161e23;--surface2:#1c262c;--ink:#eaf0f3;--ink2:#aebbc3;--muted:#84929b;--line:#2b373e;--accent:#5fb3c7;--accent-ink:#06232b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
nav.top{height:var(--nav-h);display:flex;align-items:center;gap:6px 16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:5px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:6px 5px;border:2px solid var(--accent-ink);border-top:0;border-radius:0 0 4px 4px}
.tabs{display:flex;gap:4px;height:100%;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.tab{font:inherit;font-weight:500;color:var(--ink2);background:none;border:0;border-bottom:3px solid transparent;padding:0 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .badge{font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.tab .badge.alert{background:#d03b3b;border-color:#d03b3b;color:#fff}
.tab .short{display:none}
.spacer{flex:1}
.ghost{font:inherit;font-weight:500;border-radius:4px;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:5px 12px;cursor:pointer;white-space:nowrap}
.tab:focus-visible,.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.frames{position:relative;height:calc(100vh - var(--nav-h));height:calc(100dvh - var(--nav-h))}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frames iframe[data-off]{visibility:hidden;pointer-events:none}
@media (max-width:640px){
  .brand span{display:none}
  .tab .long{display:none}.tab .short{display:inline}
  nav.top{gap:6px;padding:0 10px}
}
</style></head>
<body>
<nav class="top" aria-label="Applications">
  <div class="brand"><i aria-hidden="true"></i><span>Heat Treat Quality Suite</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-scada" data-page="scada" aria-controls="page-scada"><span class="long">SCADA temperature review</span><span class="short">SCADA</span></button>
    <button class="tab" role="tab" id="tab-sat" data-page="sat" aria-controls="page-sat"><span class="long">Thermocouple SAT (PDCA)</span><span class="short">SAT</span><span class="badge" id="badge-sat" hidden></span></button>
  </div>
  <div class="spacer"></div>
  <button class="ghost" id="theme" aria-label="Toggle colour theme">Theme</button>
</nav>
<main class="frames">
  <iframe id="page-scada" role="tabpanel" aria-labelledby="tab-scada" title="SCADA temperature review"></iframe>
  <iframe id="page-sat" role="tabpanel" aria-labelledby="tab-sat" title="Thermocouple SAT PDCA"></iframe>
</main>

<script type="application/json" id="src-scada">/*@SCADA@*/</script>
<script type="application/json" id="src-sat">/*@SAT@*/</script>
<script>
"use strict";
/* ---------- bridge shared by both pages (they run as same-origin frames of this page) ---------- */
const SUBS={}, APIS={};
window.HTQ={
  /* a page offers functions to the other page: HTQ.provide("sat",{…}) → HTQ.api("sat") */
  provide(name,api){ APIS[name]=api; this.emit(name+":ready"); },
  api(name){ return APIS[name]||null; },
  on(ev,fn){ (SUBS[ev]=SUBS[ev]||[]).push(fn); },
  emit(ev,data){ (SUBS[ev]||[]).slice().forEach(fn=>{ try{ fn(data); }catch(e){ console.error(ev,e); } }); },
  /* open a page, optionally passing what to show there (e.g. {view:{f:"F-04",ch:"Tempering"}}) */
  go(page,opts){ show(page); if(opts) this.emit("nav:"+page,opts); }
};
const PAGES=["scada","sat"];
const $=s=>document.querySelector(s);
function show(page){
  if(!PAGES.includes(page)) page="scada";
  PAGES.forEach(p=>{ const on=p===page; $("#tab-"+p).setAttribute("aria-selected",on); $("#tab-"+p).tabIndex=on?0:-1;
    const f=$("#page-"+p); if(on) f.removeAttribute("data-off"); else f.setAttribute("data-off",""); });
  if(location.hash!=="#"+page) history.replaceState(null,"","#"+page);
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.page)));
$(".tabs").addEventListener("keydown",e=>{ if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft") return;
  const i=PAGES.indexOf(document.activeElement.dataset.page), j=(i+(e.key==="ArrowRight"?1:-1)+PAGES.length)%PAGES.length;
  show(PAGES[j]); $("#tab-"+PAGES[j]).focus(); });
addEventListener("hashchange",()=>show(location.hash.slice(1)));

/* ---------- theme for the bar and both pages ---------- */
let THEME=null; try{ THEME=localStorage.getItem("htq-theme"); }catch(e){}
function applyTheme(){
  const docs=[document,...PAGES.map(p=>{ try{ return $("#page-"+p).contentDocument; }catch(e){ return null; } })];
  docs.forEach(d=>{ if(!d||!d.documentElement) return; if(THEME) d.documentElement.setAttribute("data-theme",THEME); else d.documentElement.removeAttribute("data-theme"); });
}
$("#theme").addEventListener("click",()=>{
  const dark=THEME?THEME==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  THEME=dark?"light":"dark"; try{ localStorage.setItem("htq-theme",THEME); localStorage.setItem("tsat-theme",THEME); }catch(e){}
  applyTheme();
});

/* ---------- load the two applications ---------- */
PAGES.forEach(p=>{
  const f=$("#page-"+p);
  f.addEventListener("load",()=>{
    applyTheme();
    /* printing happens inside the page; give the saved PDF the page's own title */
    const w=f.contentWindow; let saved=null;
    w.addEventListener("beforeprint",()=>{ saved=document.title; document.title=w.document.title; });
    w.addEventListener("afterprint",()=>{ if(saved!=null) document.title=saved; });
  });
  f.srcdoc=JSON.parse($("#src-"+p).textContent);
});
show(location.hash.slice(1)||"scada");

/* SAT badge: thermocouples needing attention (SAT due now or element replacement overdue) */
function badge(){
  const b=$("#badge-sat"); let n=0;
  try{ const w=$("#page-sat").contentWindow, S=w.__SAT; if(S){ S.DB.sensors.filter(x=>x.active!==false).forEach(x=>{ const st=S.schedule(x).status, L=S.lifeOf(x); if(["fail","overdue","repl"].includes(st)||L.st==="over") n++; }); } }catch(e){}
  b.hidden=!n; b.textContent=n; b.className="badge"+(n?" alert":""); b.title=n?n+" thermocouple"+(n>1?"s need":" needs")+" attention (SAT due or element replacement overdue)":"";
}
HTQ.on("sat:ready",badge); HTQ.on("sat:changed",badge);
</script>
</body></html>
